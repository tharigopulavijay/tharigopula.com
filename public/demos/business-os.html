/* ============================================================
   === SECTION: v1.2 SEED ===
   Suppliers had no GSTIN, so no purchase could carry tax and no input credit
   could be computed. This gives every supplier a state-consistent GSTIN
   derived from the address already on their record, prices every historic
   purchase, and seeds a small number of returns so the new registers open
   with something real in them rather than an empty screen.
   ============================================================ */

// State code inferred from the address we already hold. A supplier in
// Patancheru is in Telangana (36); one in Pune is Maharashtra (27). Getting
// this right is what makes the CGST/SGST vs IGST split on purchases correct.
const STATE_BY_PLACE = [
  [/telangana|hyderabad|secunderabad|balanagar|nacharam|patancheru|cherlapally|medak|ramagundam/i, '36'],
  [/andhra|vijayawada|visakhapatnam|kakinada|tanuku|kurnool|rajahmundry|kovvur|anantapur|guntur/i, '37'],
  [/karnataka|bengaluru|bangalore|mysore|hubli|bhadravathi/i, '29'],
  [/tamil nadu|chennai|coimbatore|ambattur|hosur|madurai/i, '33'],
  [/maharashtra|mumbai|pune|nashik|chakan|nagpur|aurangabad/i, '27'],
  [/kerala|kochi|cochin|ernakulam|calicut/i, '32'],
  [/gujarat|ahmedabad|surat|vadodara|rajkot/i, '24'],
  [/delhi|new delhi/i, '07'],
];
function stateCodeFromPlace(place){
  const s = String(place || '');
  for(const [re, code] of STATE_BY_PLACE){ if(re.test(s)) return code; }
  return '36';   // default to home state
}
// A structurally plausible GSTIN: 2-digit state + 10-char PAN-like block +
// entity digit + 'Z' + checksum char. Fictional by design — this is demo data
// and must never look like a real registration.
function makeGstin(stateCode, seedText){
  const h = hashCode(seedText);
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const L = n => letters[n % 26];
  const pan = L(h) + L(h>>3) + L(h>>6) + L(h>>9) + L(h>>12) +
              String((h % 9000) + 1000) + L(h>>15);
  return stateCode + pan + String((h % 9) + 1) + 'Z' + L(h>>18);
}

function seedSupplierGstins(db){
  db.suppliers.forEach((s,i)=>{
    if(s.gst) return;
    // Two small suppliers are deliberately left unregistered — composition or
    // below-threshold dealers are a real feature of this market, and the GST
    // screen needs to show that their tax is a cost, not a claim.
    if(i % 7 === 3){ s.gst = ''; s.gstStatus = 'Unregistered / composition'; return; }
    const code = stateCodeFromPlace(s.address);
    s.gst = makeGstin(code, s.id + s.name);
    s.gstStatus = 'Registered';
  });
}

// HSN codes so purchase and sales documents can both cite one. Broad-brush
// but correct family-level codes for what this business actually buys.
const MATERIAL_HSN = [
  [/coil|winding|magnet|yoke|core|lamination/i, '8505'],
  [/cable|wire|switch|relay|contactor|transformer|panel|meter/i, '8536'],
  [/steel|plate|rod|bar|sheet|angle|channel/i, '7228'],
  [/powder|ink|penetrant|developer|cleaner|emulsif|chemical|bath|carrier/i, '3824'],
  [/lamp|uv|bulb|light|led/i, '8539'],
  [/paint|enamel|primer/i, '3208'],
  [/bolt|nut|screw|fastener|washer/i, '7318'],
];
function seedMaterialTaxFields(db){
  db.materials.forEach(m=>{
    if(!m.hsn){
      const found = MATERIAL_HSN.find(([re])=>re.test(m.name + ' ' + (m.category||'')));
      m.hsn = found ? found[1] : '8505';
    }
    if(!m.gstRate) m.gstRate = 18;
  });
  db.products.forEach(p=>{
    if(!p.hsn) p.hsn = '9031';      // measuring & checking instruments
    if(!p.gstRate) p.gstRate = 18;
  });
}

function seedPurchaseGst(db){
  // Deliberately re-prices every purchase rather than skipping ones already
  // priced. makePurchase() runs during seedTransactions, before suppliers have
  // GSTINs, so those purchases were all stamped "no input credit claimable".
  // Re-running here, after the GSTINs exist, is what makes the ITC correct.
  // applyGstToPurchase computes from qty x rate every time, so it is safe to
  // run repeatedly — the second pass produces the same numbers as the first.
  db.purchases.forEach(p=>{
    applyGstToPurchase(db, p);
    p._gstApplied = true;
  });
}

/* ---- a little history in the returns registers ---- */
function seedReturns(db){
  db.creditNotes = db.creditNotes || [];
  db.debitNotes = db.debitNotes || [];
  if(db.creditNotes.length || db.debitNotes.length) return;

  // One sales return: a consumable line short-supplied on an older invoice.
  const inv = db.salesInvoices
    .filter(i=>i.lines.some(l=>l.type === 'consumable' && l.qty > 1))
    .sort((a,b)=>a.date < b.date ? 1 : -1)[3];
  if(inv){
    const idx = inv.lines.findIndex(l=>l.type === 'consumable' && l.qty > 1);
    const line = inv.lines[idx];
    const c = byId(db.customers, inv.customerId);
    const qty = Math.max(1, Math.floor(line.qty / 3));
    const doc = priceDocument([{ type:'consumable', materialId: line.materialId,
      label:(byId(db.materials,line.materialId)||{}).name || 'Consumable', qty: qty, rate: line.rate }], c, db);
    const date = addDays(inv.date, 9);
    db.creditNotes.push({
      id: uid('CRN'), noteNo: 'SIMS/CN/' + todayISO().slice(2,4) + '-0001',
      invoiceId: inv.id, invoiceNo: inv.invoiceNo, customerId: inv.customerId,
      date: date, reason: 'Quantity short-supplied', note: 'Two cans short on delivery, credited.',
      lines: doc.lines.map(l=>Object.assign({}, l, { idx: idx })),
      subTotal: doc.subTotal, cgst: doc.cgst, sgst: doc.sgst, igst: doc.igst,
      taxTotal: doc.taxTotal, total: doc.total, intraState: doc.intraState,
      placeOfSupply: doc.placeOfSupply, createdBy: 'EMP-1',
    });
    const m = byId(db.materials, line.materialId);
    if(m) m.qty = (m.qty || 0) + qty;
  }

  // One purchase return: material rejected at incoming inspection.
  const pur = db.purchases.filter(p=>p.lines.length && p.lines[0].qty > 2)
    .sort((a,b)=>a.date < b.date ? 1 : -1)[2];
  if(pur){
    const line = pur.lines[0];
    const sup = byId(db.suppliers, pur.supplierId);
    const qty = Math.max(1, Math.floor(line.qty / 4));
    const doc = priceePurchase([{ type:'material', materialId: line.materialId,
      label:(byId(db.materials,line.materialId)||{}).name || 'Material', qty: qty, rate: line.rate }], sup, db);
    db.debitNotes.push({
      id: uid('DBN'), noteNo: 'SIMS/DN/' + todayISO().slice(2,4) + '-0001',
      purchaseId: pur.id, purchaseNo: pur.invoiceNo, supplierId: pur.supplierId,
      date: addDays(pur.date, 5), reason: 'Goods returned — not as specified',
      note: 'Rejected at incoming inspection — outside drawing tolerance.',
      lines: doc.lines.map(l=>Object.assign({}, l, { idx: 0 })),
      subTotal: doc.subTotal, cgst: doc.cgst, sgst: doc.sgst, igst: doc.igst,
      taxTotal: doc.taxTotal, total: doc.total, intraState: doc.intraState,
      placeOfSupply: doc.placeOfSupply,
      itcReversed: pur.itcEligible ? doc.taxTotal : 0, createdBy: 'EMP-5',
    });
    const m = byId(db.materials, line.materialId);
    if(m) m.qty = Math.max(0, (m.qty || 0) - qty);
  }
}

/* ---- e-way bills: some prepared, some deliberately not ---- */
function seedEwayBills(db){
  db.ewayBills = db.ewayBills || [];
  if(db.ewayBills.length) return;
  const TRANSPORTERS = [
    { name:'VRL Logistics', id:'29AABCV1234K1Z9' },
    { name:'Gati Ltd', id:'36AAACG5678M1Z4' },
    { name:'Safexpress', id:'07AAACS9012P1Z2' },
  ];
  const need = db.salesInvoices.filter(needsEwayBill).sort((a,b)=>a.date < b.date ? 1 : -1);
  // The older half is fully filed; the two most recent are left unprepared,
  // because that is exactly the state the compliance screen exists to catch.
  need.slice(2).forEach((inv,i)=>{
    const t = TRANSPORTERS[hashCode(inv.invoiceNo) % TRANSPORTERS.length];
    const h = hashCode(inv.invoiceNo);
    db.ewayBills.push({
      id: uid('EWB'), invoiceId: inv.id, invoiceNo: inv.invoiceNo,
      subType:'1', mode:'1', distance: 40 + (h % 900),
      transporter: t.name, transporterId: t.id,
      vehicle: 'TS' + String(7 + (h % 30)).padStart(2,'0') + 'AB' + String(1000 + (h % 8999)),
      docNo: 'LR' + (100000 + (h % 899999)),
      dispatchDate: addDays(inv.date, 1),
      ewbNo: String(1010 + (h % 8900)) + String(100000000 + (h % 899999999)).slice(0,8),
      value: inv.total, createdAt: addDays(inv.date, 1), createdBy: 'EMP-5',
    });
  });
}

function seedV12(db){
  seedSupplierGstins(db);
  seedMaterialTaxFields(db);
  seedPurchaseGst(db);
  seedReturns(db);
  seedEwayBills(db);
  return db;
}


/* Tests that the website is reachable and the token is accepted, so a wrong
   value is caught here rather than showing up as an empty enquiry list. */
async function testWebConnection(){
  const el = document.getElementById('webTestResult');
  const base = val('set_weburl').trim().replace(/\/$/,'');
  const token = val('set_webtoken').trim();
  if(!base || !token){ if(el){ el.style.color='var(--red)'; el.textContent='Fill in both the address and the token first.'; } return; }
  if(el){ el.style.color='var(--ink-500)'; el.textContent='Checking…'; }
  try{
    const res = await fetch(base + '/api/enquiries?status=new', { headers:{ 'Authorization':'Bearer ' + token } });
    const data = await res.json().catch(()=>({}));
    if(res.status === 401){ throw new Error('the token was rejected'); }
    if(res.status === 503){ throw new Error('the website has no token configured yet'); }
    if(!res.ok){ throw new Error('the website replied ' + res.status); }
    if(el){ el.style.color='var(--green)'; el.textContent='Connected — ' + (data.count||0) + ' enquiry(s) waiting.'; }
  }catch(e){
    if(el){ el.style.color='var(--red)'; el.textContent='Could not connect: ' + e.message; }
  }
}

/* ============================================================
   === SECTION: RENDER - MONEY ===
   Four questions an owner asks, each on its own tab:
     Did I earn anything?      → Profit & Loss
     Which products earn?      → Product economics
     Where does it go?         → Expenses
     What is asleep?           → Money on the shelf

let _moneyView = 'pl';        // pl | products | expenses | dead
let _plMonth = null;
function setMoneyView(v){ _moneyView = v; rerender(); }

function renderMoney(){

}

/* ---------- PROFIT & LOSS ---------------------------------------------- */

    (opts.negate ? '(' + fmtMoney(Math.abs(value)) + ')' : fmtMoney(value)) + '</td>' +

/* ---------- PRODUCT ECONOMICS ------------------------------------------ */
function renderProductEconomics(){
  const ohRate = overheadRatePerHour();
  const rows = DB.products.map(p=>{
    const c = costCard(p);
    const T = todayISO(), yr = addDays(T,-365);
    let soldQty = 0, soldValue = 0;
    DB.salesInvoices.filter(i=>i.date >= yr).forEach(i=>(i.lines||[]).forEach(l=>{
      if(l.type==='equipment' && l.productId === p.id){ soldQty += l.qty; soldValue += (l.taxable != null ? l.taxable : l.qty*l.rate); }
    }));
    return Object.assign({ product:p, soldQty, soldValue, totalContribution: c.contribution * soldQty }, c);
  });
  const priced = rows.filter(r=>r.hasBom || r.product.buyCost);
  const missing = rows.filter(r=>!r.hasBom && !r.product.buyCost);

  let h = '<div class="infobox">' + icon('layers',16) + '<div><b>Two different numbers, and the difference matters.</b> <b>Contribution</b> is price less materials and labour — a fact, and the right basis for deciding a discount. <b>Loaded profit</b> shares out factory rent, power and supervision on top; useful as a guide, but it is an estimate, because overhead has to be split somehow and every method is an opinion.</div></div>';

  if(missing.length){
    h += '<div class="warnbox" style="margin-top:14px;">' + icon('alerttri',16) + '<div><b>' + missing.length + ' product(s) still have no costing sheet.</b> ' + esc(missing.map(m=>m.product.name).join(', ')) + '</div></div>';
  }

  h += '<div class="grid g4" style="margin-top:16px;">' + [
    {label:'Overhead rate', val:fmtMoney(ohRate) + '/hr', sub:'factory cost per labour hour', ic:'clock', color:'var(--ink-700)', bg:'var(--ink-100)'},
    {label:'Best contribution', val:priced.length?priced.slice().sort((a,b)=>b.contributionPct-a.contributionPct)[0].contributionPct.toFixed(0)+'%':'—', sub:priced.length?priced.slice().sort((a,b)=>b.contributionPct-a.contributionPct)[0].product.name:'', ic:'trendup', color:'var(--green)', bg:'var(--green-100)'},
    {label:'Worst contribution', val:priced.length?priced.slice().sort((a,b)=>a.contributionPct-b.contributionPct)[0].contributionPct.toFixed(0)+'%':'—', sub:priced.length?priced.slice().sort((a,b)=>a.contributionPct-b.contributionPct)[0].product.name:'', ic:'alerttri', color:'var(--red)', bg:'var(--red-100)'},
    {label:'Earned this year', val:fmtMoney(rows.reduce((s,r)=>s+r.totalContribution,0)), sub:'contribution from all products', ic:'bag', color:'var(--primary-600)', bg:'var(--primary-100)'},
  ].map(k=>'<div class="kpi"><div class="kpitop">' + iconChip(k.ic,k.color,k.bg) + '</div><div class="label" style="margin-top:10px;">' + esc(k.label) + '</div><div class="val">' + k.val + '</div><div class="sub">' + esc(k.sub) + '</div></div>').join('') + '</div>';

  h += '<div class="tablewrap" style="margin-top:18px;">' + renderTable('prodecon', [
    {key:'name', label:'Product', sortVal:r=>r.product.name, exportVal:r=>r.product.name,
      render:r=>'<a class="link" ' + act('openCostCard', r.product.id) + '>' + esc(r.product.name) + '</a>' + (r.hasBom?'':' <span class="tag">no BOM</span>')},
    {key:'price', label:'Price', kind:'num', render:r=>fmtMoney(r.price)},
    {key:'materials', label:'Materials', kind:'num', render:r=>fmtMoney(r.materials)},
    {key:'labour', label:'Labour', kind:'num', render:r=>fmtMoney(r.labour)},
    {key:'contribution', label:'Contribution', kind:'num', render:r=>'<b>' + fmtMoney(r.contribution) + '</b>'},
    {key:'contributionPct', label:'%', kind:'num', render:r=>{
      const v=r.contributionPct; return pill(v.toFixed(0)+'%', v>=45?'green':v>=30?'amber':'red'); }},
    {key:'loadedProfit', label:'Loaded profit', kind:'num', render:r=>'<span class="' + (r.loadedProfit<0?'':'') + '" style="color:' + (r.loadedProfit<0?'var(--red)':'var(--ink-700)') + ';">' + fmtMoney(r.loadedProfit) + '</span>'},
    {key:'soldQty', label:'Sold (12m)', kind:'num'},
    {key:'totalContribution', label:'Earned (12m)', kind:'num', render:r=>fmtMoney(r.totalContribution)},
  ], rows, {defaultSort:'totalContribution', defaultDir:-1, title:'Product economics'}) + '</div>';
  window._lastTableRenderFn['prodecon'] = rerender;
  return h;
}

        '<td class="small">' + (cheaper ? '<span style="color:var(--green);">' + fmtMoney(b.rate) + ' — ' + esc(b.supplier.name) + '</span>' : '<span class="muted">best already</span>') + '</td></tr>'; }).join('') +

  openModal('Cost card — ' + p.name, h, '<button class="btn" ' + act('closeModal') + '>Close</button>', 'xl');

/* ---------- EXPENSES --------------------------------------------------- */
let _expMonth = null;
function setExpMonth(m){ _expMonth = m; rerender(); }
function renderExpenses(){
  const months = availableGstMonths();
  const month = _expMonth || defaultGstMonth();
  const rows = expensesIn(month);
  const label = new Date(month + '-01T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  const total = sumBy(rows, e=>e.amount);
  const byBucket = {};

function onExpenseCatChange(){

    '<div class="trow"><span>Cost</span><b>' + fmtMoney(amt) + '</b></div>' +

function saveExpense(){
  const c = expCat(val('ex_cat'));
  const amt = num('ex_amt');
  if(amt <= 0){ toast('Enter an amount'); return; }
  const rate = num('ex_gst');
  const e = { id: uid('EXP'), date: val('ex_date') || todayISO(), category: c.id,
    description: val('ex_desc') || c.name, amount: amt, gstRate: rate,
    gstAmount: Math.round(amt * rate) / 100, itcEligible: c.itc, bucket: c.bucket,
    recurring: false, paidOn: val('ex_date') || todayISO(), paymentMode: val('ex_mode') };
  if(!DB.expenses) DB.expenses = [];
  DB.expenses.push(e);
  audit('Created', 'Expense', e.id, c.name + ' — ' + fmtMoney(amt) + ' — ' + e.description);
  save(); closeModal(); toast('Cost recorded'); rerender();
}

/* ---------- EXPORTS ---------------------------------------------------- */
function exportPL(month){
  const from = month + '-01', to = addDays(addMonths(from,1), -1);
  const p = profitAndLoss(from, to);
  const rows = [
    ['PROFIT & LOSS', month], ['',''],
    ['Sales (taxable value)', p.revenue],
    ['Less: materials consumed', -p.materials],
    ['Less: factory costs', -p.factory],
    ['GROSS PROFIT', p.grossProfit],
    ['Gross margin %', p.margins.gross.toFixed(1)], ['',''],
  ];
  ['selling','service','admin'].forEach(b=>{
    rows.push([BUCKET_LABEL[b].toUpperCase(), '']);
    Object.entries(p.byBucket[b].lines).sort((a,c)=>c[1]-a[1]).forEach(([n,v])=>rows.push(['   ' + n, -v]));
    rows.push(['   Total', -p.byBucket[b].total]); rows.push(['','']);
  });
  rows.push(['OPERATING PROFIT', p.operatingProfit]);
  rows.push(['Operating margin %', p.margins.operating.toFixed(1)]);
  Object.entries(p.byBucket.finance.lines).forEach(([n,v])=>rows.push(['   ' + n, -v]));
  rows.push(['NET PROFIT BEFORE TAX', p.netProfit]);
  rows.push(['Net margin %', p.margins.net.toFixed(1)]);
  rows.push(['','']); rows.push(['Break-even sales', Math.round(p.breakEven)]);
  downloadFile('SIMS_ProfitLoss_' + month.replace('-','') + '.xls', 'application/vnd.ms-excel',
    toExcelHTML('Profit & Loss — ' + month, ['Line','Amount'], rows));
  audit('Export','Report','','Profit & loss for ' + month); save();
  toast('Profit & loss exported');
}
/**
 * The pack the accountant asks for and the banker wants to see — everything
 * about a month in one file, so nobody has to chase five reports.
 */
function exportMonthlyPack(month){
  const from = month + '-01', to = addDays(addMonths(from,1), -1);
  const p = profitAndLoss(from, to);
  const g = gstPositionFor(month);
  const invs = DB.salesInvoices.filter(i=>i.date >= from && i.date <= to);
  const purch = DB.purchases.filter(x=>x.date >= from && x.date <= to);
  const exp = expensesBetween(from, to);
  const open = openInvoices();
  const money = n => Math.round(n);
  const s = settings();
  const sec = (title, headers, rows) =>
    '<h3 style="font-family:Calibri;margin:18px 0 6px;">' + title + '</h3>' +
    '<table><thead><tr>' + headers.map(x=>'<th>' + esc(x) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r=>'<tr>' + r.map(c=>'<td>' + esc(String(c==null?'':c)) + '</td>').join('') + '</tr>').join('') +
    '</tbody></table>';
  const html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"/>' +
    '<style>table{border-collapse:collapse;font-family:Calibri;font-size:11pt;}th{background:#0f2340;color:#fff;padding:5px 8px;border:1px solid #999;text-align:left;}td{border:1px solid #ccc;padding:4px 8px;mso-number-format:"\\@";}h2,h3{font-family:Calibri;}</style></head><body>' +
    '<h2>' + esc(s.company.name) + ' — monthly pack for ' + esc(new Date(from + 'T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'})) + '</h2>' +
    '<p style="font-family:Calibri;font-size:10pt;">GSTIN ' + esc(s.company.gstin) + ' · prepared ' + fmtDate(todayISO()) + '</p>' +
    sec('1. Profit &amp; loss', ['Line','Amount'], [
      ['Sales (taxable value)', money(p.revenue)],
      ['Materials consumed', money(-p.materials)],
      ['Factory costs', money(-p.factory)],
      ['Gross profit', money(p.grossProfit)],
      ['Selling costs', money(-p.selling)],
      ['Service costs', money(-p.service)],
      ['Admin costs', money(-p.admin)],
      ['Operating profit', money(p.operatingProfit)],
      ['Interest & depreciation', money(-p.finance)],
      ['Net profit before tax', money(p.netProfit)],
    ]) +
    sec('2. GST position', ['Line','Amount'], [
      ['Output tax on sales', money(g.outputTax)],
      ['Input credit on purchases', money(g.inputTax)],
      ['Net GST ' + (g.net>0?'payable':'credit'), money(Math.abs(g.net))],
      ['Credit blocked (unregistered suppliers)', money(g.blockedItc)],
    ]) +
    sec('3. Sales register', ['Invoice','Date','Customer','GSTIN','Taxable','CGST','SGST','IGST','Total'],
      invs.map(i=>{const c=byId(DB.customers,i.customerId);
        return [i.invoiceNo,i.date,c?c.name:'',c?c.gst:'',money(i.subTotal),money(i.cgst),money(i.sgst),money(i.igst),money(i.total)];})) +
    sec('4. Purchases', ['Bill','Date','Supplier','GSTIN','Taxable','GST','ITC claimable','Total'],
      purch.map(x=>{const su=byId(DB.suppliers,x.supplierId);
        return [x.invoiceNo||x.id,x.date,su?su.name:'',su?su.gst:'',money(x.subTotal),money(x.taxTotal),money(x.itcAmount||0),money(x.total)];})) +
    sec('5. Expenses', ['Date','Category','Where it lands','Detail','Amount','GST'],
      exp.map(e=>[e.date,expCat(e.category).name,expCat(e.category).bucket,e.description,money(e.amount),money(e.gstAmount)])) +
    sec('6. Money owed to us', ['Invoice','Customer','Due','Balance','Days overdue','Bucket'],
      open.map(i=>{const c=byId(DB.customers,i.customerId);
        const b=AGEING_BUCKETS.find(x=>x.key===invAgeingBucket(i));
        return [i.invoiceNo,c?c.name:'',invDueDate(i),money(invBalance(i)),invDaysOverdue(i),b?b.label:''];})) +
    sec('7. Stock value', ['Line','Amount'], [
      ['Raw material at last purchase rate', money(DB.materials.reduce((a,m)=>a+(m.qty||0)*(m.lastRate||0),0))],
      ['Finished goods at cost', money(DB.productionStock.reduce((a,ps)=>{const pr=byId(DB.products,ps.productId);
        return a + (pr ? (Array.isArray(pr.bom)&&pr.bom.length ? directCost(pr) : (pr.buyCost || pr.price*0.55)) * (ps.finishedQty||0) : 0);},0))],
      ['Money asleep over a year', money(deadStockReport().total)],
    ]) +
    '</body></html>';
  downloadFile('SIMS_MonthlyPack_' + month.replace('-','') + '.xls', 'application/vnd.ms-excel', html);
  audit('Export','Report','','Monthly pack for ' + month); save();
  toast('Monthly pack exported — everything for ' + month + ' in one file');
}

   ============================================================ */
function renderCustomerValue(){
  const T = todayISO(), yr = addDays(T,-365);
  const rows = DB.customers.map(c=>{
    const cc = customerContribution(c.id, yr);
    const serials = DB.equipmentSerials.filter(s=>s.customerId===c.id).length;
    const lastBuy = DB.salesInvoices.filter(i=>i.customerId===c.id).map(i=>i.date).sort().pop();
    const openBal = DB.salesInvoices.filter(i=>i.customerId===c.id).reduce((s,i)=>s+invBalance(i),0);
    return { c, revenue:cc.revenue, contribution:cc.contribution, pct:cc.pct, invoices:cc.invoices,
             machines:serials, lastBuy, openBal,
             daysSince: lastBuy ? daysBetween(lastBuy, T) : null };
  }).filter(r=>r.revenue > 0).sort((a,b)=>b.revenue-a.revenue);
  const total = sumBy(rows, r=>r.revenue);
  let cum = 0;
  rows.forEach(r=>{ r.share = total ? r.revenue/total*100 : 0; cum += r.share; r.cumulative = cum; });
  const top3 = rows.slice(0,3).reduce((s,r)=>s+r.share,0);
  const eighty = rows.findIndex(r=>r.cumulative >= 80) + 1;
  const sleeping = rows.filter(r=>r.daysSince != null && r.daysSince > 180);

  let h = '<div class="infobox">' + icon('users',16) + '<div><b>Who is carrying the business, and who could carry more.</b> Concentration is worth watching, but the useful move is not to fear the big customer — it is to look at what they buy and take the same offer to the ones just behind them.</div></div>';

  h += '<div class="grid g4" style="margin-top:16px;">' + [
    {label:'Top 3 customers', val:top3.toFixed(0) + '%', sub:'of sales in 12 months', ic:'users', color: top3>50?'var(--amber)':'var(--green)', bg: top3>50?'var(--amber-100)':'var(--green-100)'},
    {label:'Customers making 80%', val:eighty || '—', sub:'of ' + rows.length + ' who bought this year', ic:'target', color:'var(--primary-600)', bg:'var(--primary-100)'},
    {label:'Gone quiet', val:sleeping.length, sub:'no order in 6 months', ic:'clock', color: sleeping.length?'var(--amber)':'var(--green)', bg: sleeping.length?'var(--amber-100)':'var(--green-100)'},
    {label:'Earned from customers', val:fmtMoney(sumBy(rows,r=>r.contribution)), sub:'contribution after materials & labour', ic:'bag', color:'var(--teal)', bg:'var(--teal-100)'},
  ].map(k=>'<div class="kpi"><div class="kpitop">' + iconChip(k.ic,k.color,k.bg) + '</div><div class="label" style="margin-top:10px;">' + esc(k.label) + '</div><div class="val">' + k.val + '</div><div class="sub">' + esc(k.sub) + '</div></div>').join('') + '</div>';

  if(top3 > 40){
    h += '<div class="warnbox" style="margin-top:16px;">' + icon('alerttri',16) + '<div><b>' + rows[0].c.name + ' alone is ' + rows[0].share.toFixed(0) + '% of sales.</b> Losing them would take ' + fmtMoney(rows[0].contribution) + ' of contribution with it — roughly ' + Math.round(rows[0].contribution/ (sumBy(rows,r=>r.contribution)/12)) + ' months of the company\'s earnings. Worth knowing what they buy and offering the same to the next ten names on this list.</div></div>';
  }

  h += '<div class="tablewrap" style="margin-top:18px;">' + renderTable('custval', [
    {key:'name', label:'Customer', sortVal:r=>r.c.name, exportVal:r=>r.c.name,
      render:r=>'<a class="link" ' + act('navTo','__customer:'+r.c.id) + '>' + esc(r.c.name) + '</a>'},
    {key:'industry', label:'Industry', sortVal:r=>r.c.industry, exportVal:r=>r.c.industry, render:r=>'<span class="small">' + esc(r.c.industry||'') + '</span>'},
    {key:'revenue', label:'Bought (12m)', kind:'num', render:r=>fmtMoney(r.revenue)},
    {key:'share', label:'Share', kind:'num', render:r=>{
      return '<div class="sharebar"><span style="width:' + Math.min(100,r.share*3) + '%;"></span></div><span class="small">' + r.share.toFixed(1) + '%</span>'; }},
    {key:'contribution', label:'Earned from them', kind:'num', render:r=>'<b>' + fmtMoney(r.contribution) + '</b>'},
    {key:'pct', label:'Margin', kind:'num', render:r=>pill(r.pct.toFixed(0)+'%', r.pct>=45?'green':r.pct>=30?'amber':'red')},
    {key:'machines', label:'Machines', kind:'num'},
    {key:'daysSince', label:'Last order', kind:'num', sortVal:r=>r.daysSince==null?9999:r.daysSince,
      render:r=>r.daysSince==null?'—':(r.daysSince>180?pill(r.daysSince+'d ago','amber'):r.daysSince+'d ago')},
    {key:'act', label:'', sort:false, exportVal:false, render:r=>'<button class="btn sm" ' + act('quoteForCustomer', r.c.id) + '>Quote</button>'},
  ], rows, {defaultSort:'revenue', defaultDir:-1, title:'Customer value'}) + '</div>';
  window._lastTableRenderFn['custval'] = rerender;

function openRateCard(materialId){
  const m = byId(DB.materials, materialId); if(!m) return;
  const rates = ratesFor(materialId);
  const best = rates[0];
  let h = '<div class="detailgrid">' +
    '<div><div class="dl">Material</div><div class="dv">' + esc(m.name) + '</div></div>' +
    '<div><div class="dl">In stock</div><div class="dv">' + m.qty + ' ' + esc(m.unit) + '</div></div>' +
    '<div><div class="dl">Last paid</div><div class="dv">' + fmtMoney(m.lastRate) + '</div></div>' +
    '<div><div class="dl">Best available</div><div class="dv" style="color:var(--green);">' + (best?fmtMoney(best.rate):'—') + '</div></div>' +
  '</div>';
  if(best && m.lastRate > best.rate){
    const saving = (m.lastRate - best.rate) * ((m.avgConsumption||0) * 365);
    h += '<div class="warnbox" style="margin-top:12px;">' + icon('alerttri',16) + '<div>You last paid <b>' + fmtMoney(m.lastRate) + '</b>. <b>' + esc(best.supplier.name) + '</b> quotes <b>' + fmtMoney(best.rate) + '</b>. At current usage that is about <b>' + fmtMoney(saving) + '</b> a year.</div></div>';
  }
  h += '<div class="hr"></div><b class="small">Who can supply this</b>';
  h += '<table style="margin-top:6px;"><thead><tr><th class="nosort">Supplier</th><th class="nosort">Rate</th><th class="nosort">vs best</th><th class="nosort">Lead time</th><th class="nosort">Min order</th><th class="nosort">Quoted</th></tr></thead><tbody>' +
    rates.map((r,i)=>'<tr><td>' + esc(r.supplier.name) + (r.preferred?' <span class="tag">preferred</span>':'') + '</td>' +
      '<td><b>' + fmtMoney(r.rate) + '</b></td>' +
      '<td>' + (i===0?pill('cheapest','green'):'<span class="small" style="color:var(--red);">+' + fmtMoney(r.rate-rates[0].rate) + '</span>') + '</td>' +
      '<td>' + r.leadTimeDays + ' days</td><td>' + r.moq + ' ' + esc(m.unit) + '</td>' +
      '<td class="small muted">' + fmtDate(r.lastQuoted) + '</td></tr>').join('') +
    '</tbody></table>';
  if(!rates.length) h += '<div class="empty">No supplier rates on record for this item yet.</div>';
  openModal('Rate card — ' + m.name, h,
    '<button class="btn" ' + act('closeModal') + '>Close</button>' +
    '<button class="btn primary" ' + act('closeThen','openRequestQuote', m.id) + '>Request a quote</button>', 'xl');
}

/* ============================================================
   === SECTION: v1.5 SEED — MAKING THE NUMBERS REAL ===
   The old figures did not describe a business anybody could run: ₹45L sold
   against ₹48L of purchases, no costing, no salaries, no electricity bill, and
   three customers holding 63% of revenue. That is not a company, it is a
   sample.

   This builds the shape of a real small NDT manufacturer in Hyderabad —
   roughly ₹1.2 crore turnover, forty-odd customers, materials at about 40% of
   sales, a wage bill, a landlord, an IndiaMART subscription and a bank that
   charges interest. Everything is deterministic, so the demo is the same
   every time it is opened.
   ============================================================ */

function seedBoms(db){
  db.products.forEach(p=>{
    const spec = PRODUCT_BOMS[p.id];
    if(spec){
      p.bom = spec.bom.map(([materialId, qty, scrapPct])=>({ materialId, qty, scrapPct: scrapPct || 0 }));
      p.labourMinutes = spec.labour;
    }
    if(PRODUCT_BUY_COST[p.id] !== undefined){
      p.buyCost = PRODUCT_BUY_COST[p.id];
      p.labourMinutes = p.labourMinutes || 10;   // goods-in check and repack
    }
  });
}

/* ---------- SUPPLIER RATE CARDS ----------------------------------------
   The supplier↔material link existed but carried no price, so nothing could
   answer "who is cheapest for this". Each supplier who can supply an item now
   quotes a rate around the last paid price, with their own lead time. */
function seedSupplierRates(db){
  db.supplierRates = [];
  db.materials.forEach(m=>{
    const able = db.suppliers.filter(s=>(s.materials || []).includes(m.id));
    able.forEach((s, idx)=>{
      const h = hashCode(s.id + m.id);
      // Spread of roughly -6% to +11% around the last rate paid. Somebody is
      // always cheaper; the point is that nobody could see who.
      const factor = 0.94 + ((h % 170) / 1000);
      const rate = Math.round((m.lastRate || 100) * factor * 100) / 100;
      db.supplierRates.push({
        id: uid('SRT'), supplierId: s.id, materialId: m.id, rate: rate,
        leadTimeDays: (s.leadTimeDays || 7) + (h % 4),
        moq: [1, 5, 10, 25, 50][h % 5],
        lastQuoted: addDays(todayISO(), -(10 + (h % 120))),
        preferred: m.preferredSupplierId === s.id || idx === 0,
      });
    });
  });
}

/* ---------- A YEAR OF TRADING ------------------------------------------
   Enough invoices, spread across enough customers, for the numbers to behave
   like a real order book: lots of small yoke and kit sales, a handful of big
   machines, and consumables coming back around. */
function seedMoreSales(db){
  const T = todayISO();
  // Weighted so volume comes from yokes and kits and value from machines —
  // which is how this industry actually earns.
  const MIX = [
    ['PRD-1',14],['PRD-2',16],['PRD-3',10],['PRD-5',9],['PRD-12',18],
    ['PRD-6',6],['PRD-7',3],['PRD-8',2],['PRD-13',8],['PRD-14',5],
    ['PRD-19',3],['PRD-17',4],['PRD-18',6],['PRD-15',2],['PRD-9',2],
    ['PRD-10',1],['PRD-11',1],['PRD-16',1],['PRD-4',3],
  ];
  const pool = [];
  MIX.forEach(([pid,n])=>{ for(let i=0;i<n;i++) pool.push(pid); });
  const custs = db.customers.map(c=>c.id);
  const cons = db.materials.filter(m=>m.category === 'Consumable').map(m=>m.id);

  let n = 0;
  for(let d = 356; d > 3; d -= 3){
    const h = hashCode('SALE' + d);
    const date = addDays(T, -d);
    const customerId = custs[h % custs.length];
    const lines = [];
    const pid = pool[h % pool.length];
    const prod = byId(db.products, pid);
    if(!prod) continue;
    const qty = prod.price > 200000 ? 1 : prod.price > 50000 ? 1 + (h % 2) : 1 + (h % 3);
    // Discount within a believable band — nobody sells at list every time.
    const rate = Math.round(prod.price * (0.93 + ((h % 80) / 1000)));
    lines.push({ type:'equipment', productId: pid, qty, rate });
    // Roughly half of equipment orders carry consumables with them.
    if(h % 2 === 0 && cons.length){
      const mid = cons[h % cons.length];
      const m = byId(db.materials, mid);
      if(m) lines.push({ type:'consumable', materialId: mid, qty: 2 + (h % 8),
        rate: Math.round((m.lastRate || 100) * 1.42) });
    }
    // Installation and training on the larger machines.
    if(prod.price > 100000) lines.push({ type:'service',
      description:'Installation, commissioning & operator training', qty:1,
      rate: Math.round(prod.price * 0.035 / 100) * 100 });
    makeSaleInvoice(db, { customerId, date, lines,
      paymentStatus: undefined, creditDays: 30 });
    n++;
  }
  return n;
}

function seedExpenses(db){
  db.expenses = [];
  const T = todayISO();
  for(let back = 12; back >= 0; back--){
    const monthStart = monthKey(T, -back) + '-01';
    MONTHLY_EXPENSES.forEach(([cat, base, note], idx)=>{
      const c = expCat(cat);
      const h = hashCode(cat + monthStart);
      // Fixed costs barely move; variable ones swing with the month's activity.
      const swing = c.behaviour === 'variable' ? 0.82 + ((h % 400) / 1000)
                  : c.behaviour === 'semi-fixed' ? 0.95 + ((h % 130) / 1000) : 1;
      const amount = Math.round(base * swing);
      const day = 1 + ((idx * 3 + (h % 5)) % 26);
      const date = addDays(monthStart, day - 1);
      if(date > T) return;
      const gstRate = c.itc ? 18 : 0;
      db.expenses.push({
        id: uid('EXP'), date, category: cat, description: note,
        amount, gstRate, gstAmount: Math.round(amount * gstRate) / 100,
        itcEligible: c.itc, bucket: c.bucket, recurring: true,
        paidOn: date, paymentMode: c.bucket === 'finance' ? 'Bank Transfer' : 'NEFT / RTGS',
      });
    });
  }
  ONE_OFF_EXPENSES.forEach(([daysAgo, cat, amount, note])=>{
    const c = expCat(cat);
    const date = addDays(T, daysAgo);
    db.expenses.push({
      id: uid('EXP'), date, category: cat, description: note, amount,
      gstRate: c.itc ? 18 : 0, gstAmount: c.itc ? Math.round(amount * 18) / 100 : 0,
      itcEligible: c.itc, bucket: c.bucket, recurring: false,
      paidOn: date, paymentMode:'NEFT / RTGS',
    });
  });
  db.expenses.sort((a,b)=>a.date < b.date ? -1 : 1);
}

/* Declared here rather than with the other date helpers because v1.0 defines
   its own monthKey inside the dashboard section, further down the file. Function
   declarations hoist, so the last one wins — this has to come after it. */
function monthKey(iso, offset){
  const y = Number(String(iso).slice(0,4));
  const m = Number(String(iso).slice(5,7)) + (offset || 0);
  return (y + Math.floor((m - 1) / 12)) + '-' + String(((m - 1) % 12 + 12) % 12 + 1).padStart(2,'0');
}

/* Twelve months of attendance, as the biometric machine would have produced
   it — most people present most days, the odd absence, overtime when a big
   machine is being finished, and night shifts for whoever is on that rota. */
function seedAttendance(db){
  db.attendance = [];
  const T = todayISO();
  for(let back = 12; back >= 0; back--){
    const m = monthKey(T, -back);
    if(m > T.slice(0,7)) continue;
    db.employees.filter(e=>e.salaryMonthly > 0).forEach(e=>{
      const h = hashCode(e.employeeCode + m);
      const payable = payableDaysIn(m);
      const absent = (h % 11 === 0) ? 2 + (h % 3) : (h % 5 === 0 ? 1 : 0);
      const leave = (h % 7 === 0) ? 1 : 0;
      db.attendance.push({
        id: uid('ATT'), employeeId: e.id, month: m,
        daysWorked: Math.max(0, payable - absent - leave),
        daysPaidLeave: leave, daysAbsent: absent,
        otHours: e.payBucket === 'factory' ? (h % 18) : 0,
        nightShifts: e.shift === 'Night' ? 8 + (h % 6) : (e.shift === 'Rotating' ? (h % 5) : 0),
        bonus: 0, deduction: 0, source:'imported', importedOn: m + '-01',
      });
    });
  }
}

/* === SECTION: INIT === */
function init(){
  loadDB();
  bindDelegation();                 // one listener for every data-act in the app
  // Catch up anything that should have posted itself while nobody was looking.
  const _caught = postAllStandingCosts(DB) + postAllPayRuns(DB);
  if(_caught) save();
  initSync();                       // shared workspace, if this device is connected
  renderNav();
  renderDemoFlag();
  if(!location.hash) location.hash='#dashboard';
  route();
}
// A frozen clock is fine for a demo and dangerous in production, so it is
// stated in the topbar rather than hidden in the code.
function renderDemoFlag(){
  const el=document.getElementById('demoFlag'); if(!el) return;
  const s=settings();
  const name=WORKSPACE_MODE==='trial'?'My test data':'SIMS examples';
  el.innerHTML = '<span class="demoflag" data-act="gotoSettings" title="Change the business date and settings. Choose data at the bottom of the sidebar.">' +
    name + ' · ' + (s.demoMode ? 'Demo date: '+fmtDate(s.demoDate) : 'Real date: '+fmtDate(realTodayISO())) + '</span>';
}
function gotoSettings(){ _dataView='settings'; navTo('datahub'); rerender(); }
document.addEventListener('DOMContentLoaded', init);
