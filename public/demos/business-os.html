function saveDebitNote(purId){
  const pur = byId(DB.purchases, purId); if(!pur) return;
  const active = _returnLines.filter(r=>r.qty > 0);
  if(!active.length){ toast('Enter a quantity against at least one line'); return; }
  const sup = byId(DB.suppliers, pur.supplierId);
  const short = active.filter(r=>{
    const m = byId(DB.materials, r.materialId);
    return m && (m.qty || 0) < r.qty;
  });
  if(short.length && !confirm('Returning more than is currently in stock for: ' + short.map(r=>r.label).join(', ') + '.\n\nRecord it anyway?')) return;

  const doc = priceePurchase(active, sup);
  const note = {
    id: uid('DBN'), noteNo: nextNoteNo('debit'), purchaseId: pur.id, purchaseNo: pur.invoiceNo,
    supplierId: pur.supplierId, date: val('dn_date') || todayISO(),
    reason: val('dn_reason'), note: val('dn_note'),
    lines: doc.lines.map((l,i)=>Object.assign({}, l, { idx: active[i].idx })),
    subTotal: doc.subTotal, cgst: doc.cgst, sgst: doc.sgst, igst: doc.igst,
    taxTotal: doc.taxTotal, total: doc.total, intraState: doc.intraState,
    placeOfSupply: doc.placeOfSupply, itcReversed: pur.itcEligible ? doc.taxTotal : 0,
    createdBy: CURRENT_EMP,
  };
  if(!DB.debitNotes) DB.debitNotes = [];
  DB.debitNotes.push(note);
  active.forEach(r=>{
    const m = byId(DB.materials, r.materialId);
    if(m) m.qty = Math.max(0, (m.qty || 0) - r.qty);
  });
  DB.communications.push({ id: uid('COM'), entityType:'supplier', entityId: pur.supplierId, type:'Debit note',
    date: note.date, channel:'System', summary: note.noteNo + ' — ' + fmtMoney(note.total) + ' against ' + (pur.invoiceNo||'') + ' (' + note.reason + ')' });
  audit('Created', 'Debit Note', note.id, note.noteNo + ' — ' + (sup ? sup.name : '') + ' — ' + fmtMoney(note.total));
  recomputeAlertsAndTasks(DB); save(); closeModal();
  toast('Debit note ' + note.noteNo + ' issued — ' + fmtMoney(note.total) + ', ITC of ' + fmtMoney(note.itcReversed) + ' reversed');
  rerender();
}

/* ---------- 4. GST POSITION -------------------------------------------
   The number an owner actually wants: output tax collected on sales, minus
   input tax credit on purchases, minus adjustments from notes, equals what
   has to be paid this month. */
function gstPositionFor(monthKeyStr){
  const inMonth = d => String(d || '').slice(0,7) === monthKeyStr;
  const sales = DB.salesInvoices.filter(i=>inMonth(i.date));
  const purch = DB.purchases.filter(p=>inMonth(p.date));
  const cns = (DB.creditNotes || []).filter(n=>inMonth(n.date));
  const dns = (DB.debitNotes || []).filter(n=>inMonth(n.date));
  const sum = (arr, f) => arr.reduce((s,x)=>s + (Number(f(x)) || 0), 0);

  const outputTax = sum(sales, i=>i.taxTotal) - sum(cns, n=>n.taxTotal);
  const inputTax  = sum(purch, p=>p.itcAmount) - sum(dns, n=>n.itcReversed);
  const net = outputTax - inputTax;
  return {
    month: monthKeyStr,
    taxableSales: sum(sales, i=>i.subTotal) - sum(cns, n=>n.subTotal),
    outputCgst: sum(sales, i=>i.cgst) - sum(cns, n=>n.cgst),
    outputSgst: sum(sales, i=>i.sgst) - sum(cns, n=>n.sgst),
    outputIgst: sum(sales, i=>i.igst) - sum(cns, n=>n.igst),
    outputTax: outputTax,
    taxablePurchases: sum(purch, p=>p.subTotal) - sum(dns, n=>n.subTotal),
    inputCgst: sum(purch, p=>p.itcEligible ? p.cgst : 0) - sum(dns, n=>n.cgst),
    inputSgst: sum(purch, p=>p.itcEligible ? p.sgst : 0) - sum(dns, n=>n.sgst),
    inputIgst: sum(purch, p=>p.itcEligible ? p.igst : 0) - sum(dns, n=>n.igst),
    inputTax: inputTax,
    net: net,
    salesCount: sales.length, purchaseCount: purch.length,
    creditNoteCount: cns.length, debitNoteCount: dns.length,
    // Buying from an unregistered supplier means the tax paid is a sunk cost,
    // not a claim. Worth surfacing, because it is invisible money leaking.
    blockedItc: sum(purch.filter(p=>!p.itcEligible), p=>p.taxTotal),
    blockedCount: purch.filter(p=>!p.itcEligible).length,
  };
}

/* ---------- 5. E-WAY BILL ---------------------------------------------
   Mandatory for any consignment above Rs 50,000, inter-state or intra-state,
   whatever the turnover. We cannot file it without portal credentials, but we
   can produce the exact JSON the portal accepts for bulk upload — which
   removes the re-keying and the invoice/bill mismatch that comes with it. */
const EWAY_THRESHOLD = 50000;
const TRANSPORT_MODES = [{v:'1',t:'Road'},{v:'2',t:'Rail'},{v:'3',t:'Air'},{v:'4',t:'Ship'}];
const SUPPLY_SUBTYPES = [{v:'1',t:'Supply'},{v:'3',t:'Export'},{v:'4',t:'Job Work'},{v:'8',t:'Others'}];
function needsEwayBill(inv){ return (Number(inv.total)||0) > EWAY_THRESHOLD; }
function ewayFor(invId){ return (DB.ewayBills || []).find(e=>e.invoiceId === invId); }

function openEwayForm(invId){
  const inv = byId(DB.salesInvoices, invId); if(!inv) return;
  const c = byId(DB.customers, inv.customerId);
  const s = settings();
  const existing = ewayFor(invId);
  openModal('E-way bill — ' + inv.invoiceNo,
    (needsEwayBill(inv)
      ? '<div class="warnbox">' + icon('alerttri',16) + '<div>This consignment is <b>' + fmtMoney(inv.total) + '</b>, above the <b>₹50,000</b> threshold, so an e-way bill is <b>mandatory</b> before the goods move.</div></div>'
      : '<div class="infobox">' + icon('checkcircle',16) + '<div>This consignment is ' + fmtMoney(inv.total) + ', below the ₹50,000 threshold. An e-way bill is not required — you can still raise one if the transporter asks.</div></div>') +
    (existing ? '<div class="small muted" style="margin-top:10px;">Already prepared on ' + fmtDate(existing.createdAt) + (existing.ewbNo ? ' &middot; EWB ' + esc(existing.ewbNo) : ' &middot; not yet filed on the portal') + '</div>' : '') +
    '<div class="detailgrid" style="margin-top:12px;">' +
      '<div><div class="dl">From</div><div class="dv">' + esc(s.company.name) + '<div class="small muted">' + esc(s.company.gstin) + '</div></div></div>' +

function collectEway(inv){

function saveEway(invId){

// The government's bulk-upload shape. Field names are the portal's, not ours —
// they look odd on purpose, because they have to match exactly.
function ewayPortalJson(inv, rec){
  const s = settings(), c = byId(DB.customers, inv.customerId);
  const supStateCode = Number(s.company.stateCode) || 36;
  const cusStateCode = Number(stateCodeOf(c && c.gst)) || supStateCode;
  return [{
    userGstin: s.company.gstin,
    supplyType: 'O',                       // Outward
    subSupplyType: rec.subType || '1',
    docType: 'INV',
    docNo: inv.invoiceNo,
    docDate: fmtDateDMY(inv.date),
    fromGstin: s.company.gstin,
    fromTrdName: s.company.name,
    fromAddr1: s.company.address,
    fromPlace: 'Hyderabad',
    fromPincode: 500037,
    fromStateCode: supStateCode,
    actFromStateCode: supStateCode,
    toGstin: (c && c.gst) || 'URP',        // URP = unregistered person
    toTrdName: c ? c.name : '',
    toAddr1: c ? (c.location || '') : '',
    toPlace: c ? (c.location || '') : '',
    toPincode: 500001,
    toStateCode: cusStateCode,
    actToStateCode: cusStateCode,
    transactionType: 1,
    totalValue: inv.subTotal,
    cgstValue: inv.cgst, sgstValue: inv.sgst, igstValue: inv.igst, cessValue: 0,
    totInvValue: inv.total,
    transporterId: rec.transporterId || '',
    transporterName: rec.transporter || '',
    transDocNo: rec.docNo || '',
    transMode: rec.mode || '1',
    transDistance: String(rec.distance || 0),
    transDocDate: fmtDateDMY(rec.dispatchDate),
    vehicleNo: rec.vehicle || '',
    vehicleType: 'R',
    itemList: (inv.lines || []).map((l,i)=>({
      itemNo: i + 1,
      productName: invLineLabel(l),
      productDesc: invLineLabel(l),
      hsnCode: Number(l.hsn) || 9031,
      quantity: l.qty,
      qtyUnit: l.type === 'equipment' ? 'NOS' : 'NOS',
      taxableAmount: l.taxable,
      sgstRate: inv.intraState ? (l.gstRate / 2) : 0,
      cgstRate: inv.intraState ? (l.gstRate / 2) : 0,
      igstRate: inv.intraState ? 0 : l.gstRate,
      cessRate: 0,
    })),
  }];
}
function fmtDateDMY(iso){
  if(!iso) return '';
  const p = String(iso).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
}
function downloadEwayJson(invId){
  const inv = byId(DB.salesInvoices, invId); if(!inv) return;
  saveEway(invId);
  const rec = ewayFor(invId);
  const payload = ewayPortalJson(inv, rec);
  downloadFile('EWB_' + inv.invoiceNo.replace(/[^A-Za-z0-9]+/g,'_') + '.json', 'application/json', JSON.stringify(payload, null, 2));
  audit('Export', 'E-way Bill', rec.id, inv.invoiceNo + ' — portal JSON downloaded');
  save();
  toast('Portal JSON downloaded — upload it on ewaybillgst.gov.in');
}

/* ---------- 6. EXPLAINABLE SCORING ------------------------------------
   Predictive scoring without a black box. Every point is attributable to a
   stated rule, so a salesperson can argue with it — which is the only way
   scoring ever gets trusted or used. */
function scoreLead(l){
  const T = todayISO();
  const reasons = [];
  let score = 50;
  const add = (n, why) => { score += n; reasons.push({ n: n, why: why }); };

  const v = Number(l.expectedValue) || 0;
  if(v >= 500000) add(18, 'Large order — ' + fmtMoney(v));
  else if(v >= 100000) add(10, 'Substantial order — ' + fmtMoney(v));
  else if(v >= 25000) add(4, 'Mid-size order — ' + fmtMoney(v));
  else add(-3, 'Small order — ' + fmtMoney(v));

  const warm = { 'Referral':16, 'Existing Customer':20, 'Website':6, 'Tender Portal':8, 'Dealer':10, 'IndiaMART':2, 'TradeIndia':2, 'Justdial':-2 };
  if(warm[l.source] !== undefined) add(warm[l.source], 'Source: ' + l.source);

  const stageLift = { 'Enquiry':0, 'Qualified':6, 'Quotation Sent':12, 'Negotiation':20 };
  if(stageLift[l.stage] !== undefined && stageLift[l.stage]) add(stageLift[l.stage], 'Reached ' + l.stage);

  const age = daysBetween(l.createdAt || T, T);
  if(age > 90) add(-16, 'Open ' + age + ' days — going cold');
  else if(age > 45) add(-8, 'Open ' + age + ' days');
  else if(age <= 14) add(6, 'Fresh — ' + age + ' days old');

  const acts = (l.activities || []).length;
  if(acts >= 4) add(10, acts + ' recorded touchpoints');
  else if(acts <= 1) add(-6, 'Barely worked — ' + acts + ' touchpoint' + (acts===1?'':'s'));

  if(l.followUpDate && daysBetween(l.followUpDate, T) > 7) add(-12, 'Follow-up overdue by ' + daysBetween(l.followUpDate, T) + ' days');
  if(l.onHold) add(-20, 'Marked on hold by the customer');
  if((DB.quotations||[]).some(q=>q.leadId === l.id && quoteStatus(q) === 'Sent')) add(8, 'Live quotation outstanding');

  score = Math.max(1, Math.min(99, Math.round(score)));
  reasons.sort((a,b)=>Math.abs(b.n) - Math.abs(a.n));
  return { score: score, band: score >= 70 ? 'Hot' : score >= 45 ? 'Warm' : 'Cold', reasons: reasons };
}
function leadScorePill(l){
  const s = scoreLead(l);
  return '<span class="pill pill-' + (s.band==='Hot'?'red':s.band==='Warm'?'amber':'gray') + '" title="' + esc(s.reasons.slice(0,4).map(r=>(r.n>0?'+':'')+r.n+' '+r.why).join(' · ')) + '">' + s.score + ' ' + s.band + '</span>';
}
function openLeadScore(leadId){
  const l = byId(DB.leads, leadId); if(!l) return;
  const s = scoreLead(l);
  openModal('Why this lead scores ' + s.score,
    '<div class="infobox">' + icon('target',16) + '<div>Scored by stated rules, not a model — every point below is traceable, and you can disagree with any of them. A score is a prompt to act, never a decision.</div></div>' +
    '<div class="detailgrid" style="margin-top:12px;">' +
      '<div><div class="dl">Lead</div><div class="dv">' + esc(l.company) + '</div></div>' +
      '<div><div class="dl">Score</div><div class="dv">' + s.score + ' / 99 — ' + s.band + '</div></div>' +
    '</div><div class="hr"></div>' +
    '<table><thead><tr><th class="nosort">Effect</th><th class="nosort">Reason</th></tr></thead><tbody>' +
      '<tr><td class="small muted">base 50</td><td class="small muted">Every lead starts level</td></tr>' +
      s.reasons.map(r=>'<tr><td><b style="color:' + (r.n>0?'var(--green)':'var(--red)') + ';">' + (r.n>0?'+':'') + r.n + '</b></td><td>' + esc(r.why) + '</td></tr>').join('') +
    '</tbody></table>',
    '<button class="btn" ' + act('closeModal') + '>Close</button>' +
    '<button class="btn primary" ' + act('closeThen','openLeadDetail', l.id) + '>Open lead</button>', true);
}
// Collection risk. Same idea pointed at money: which invoices are least
// likely to be paid without a phone call.
function scoreCollectionRisk(inv){
  const reasons = [];
  let risk = 10;
  const add = (n, why) => { risk += n; reasons.push({ n: n, why: why }); };
  const late = invDaysOverdue(inv);
  if(late > 90) add(45, 'Overdue ' + late + ' days');
  else if(late > 60) add(32, 'Overdue ' + late + ' days');
  else if(late > 30) add(20, 'Overdue ' + late + ' days');
  else if(late > 0) add(9, 'Overdue ' + late + ' days');
  const bal = invBalance(inv);
  if(bal > 300000) add(14, 'Large exposure — ' + fmtMoney(bal));
  else if(bal > 100000) add(8, 'Sizeable balance — ' + fmtMoney(bal));
  if(invPaid(inv) === 0 && late > 0) add(12, 'Nothing received at all');
  if(invPaid(inv) > 0) add(-10, 'Part payment already received');
  const c = byId(DB.customers, inv.customerId);
  if(c){
    const others = DB.salesInvoices.filter(i=>i.customerId === c.id && i.id !== inv.id);
    const lateHistory = others.filter(i=>invDaysOverdue(i) > 15).length;
    if(lateHistory >= 2) add(14, 'This customer has ' + lateHistory + ' other late invoices');
    else if(others.length >= 3 && lateHistory === 0) add(-12, 'Reliable payer — ' + others.length + ' invoices, none late');
  }
  risk = Math.max(1, Math.min(99, Math.round(risk)));
  reasons.sort((a,b)=>Math.abs(b.n) - Math.abs(a.n));
  return { risk: risk, band: risk >= 60 ? 'High' : risk >= 30 ? 'Medium' : 'Low', reasons: reasons };
}
function openCollectionRisk(invId){
  const inv = byId(DB.salesInvoices, invId); if(!inv) return;
  const r = scoreCollectionRisk(inv);
  const c = byId(DB.customers, inv.customerId);
  openModal('Collection risk — ' + inv.invoiceNo,
    '<div class="detailgrid">' +
      '<div><div class="dl">Customer</div><div class="dv">' + esc(c ? c.name : '—') + '</div></div>' +
      '<div><div class="dl">Balance</div><div class="dv">' + fmtMoney(invBalance(inv)) + '</div></div>' +
      '<div><div class="dl">Risk</div><div class="dv">' + r.risk + ' / 99 — ' + r.band + '</div></div>' +
    '</div><div class="hr"></div>' +
    '<table><thead><tr><th class="nosort">Effect</th><th class="nosort">Reason</th></tr></thead><tbody>' +
      '<tr><td class="small muted">base 10</td><td class="small muted">Every invoice starts low-risk</td></tr>' +
      r.reasons.map(x=>'<tr><td><b style="color:' + (x.n>0?'var(--red)':'var(--green)') + ';">' + (x.n>0?'+':'') + x.n + '</b></td><td>' + esc(x.why) + '</td></tr>').join('') +
    '</tbody></table>',

   link opens straight into GPay/PhonePe/Paytm with the amount pre-filled. */
function upiLink(amount, note){
  const s = settings();
  if(!s.company.upiId) return '';
  return 'upi://pay?pa=' + encodeURIComponent(s.company.upiId) +
    '&pn=' + encodeURIComponent(s.company.name) +
    '&am=' + (Math.round(Number(amount)||0)) +
    '&cu=INR&tn=' + encodeURIComponent(String(note||'').slice(0,40));
}

/* ---------- THE MISSING JOB CARD --------------------------------------
   openServiceJobForm() needs a customer who owns equipment, and nothing in
   the app ever called it. This is the front door: pick the machine first,
   because that is how an engineer thinks — he is standing in front of one. */
function startJobCard(serialId){
  if(serialId){
    const s = byId(DB.equipmentSerials, serialId);
    if(s){ closeModal(); setTimeout(()=>openServiceJobForm({ customerId: s.customerId, serialId: s.id }), 60); return; }
  }
  // No machine chosen yet — offer the ones that plausibly need attention
  // first, then everything else, searchable.
  _jobPickQuery = '';
  openModal('Which machine needs service?',
    '<input id="jobPickQ" class="searchbox" style="width:100%;" placeholder="Serial number, customer or product…" oninput="setJobPickQuery(this.value)" autocomplete="off"/>' +
    '<div id="jobPickList" style="margin-top:12px;max-height:52vh;overflow:auto;">' + jobPickListHtml() + '</div>',
    '<button class="btn" ' + act('closeModal') + '>Cancel</button>', true);
  setTimeout(()=>{ const e = document.getElementById('jobPickQ'); if(e) e.focus(); }, 60);
}
let _jobPickQuery = '';
function setJobPickQuery(v){
  _jobPickQuery = v;
  const el = document.getElementById('jobPickList');
  if(el) el.innerHTML = jobPickListHtml();
}
function jobPickListHtml(){
  const q = _jobPickQuery.trim().toLowerCase();
  const hit = x => String(x||'').toLowerCase().indexOf(q) >= 0;
  let rows = DB.equipmentSerials.filter(s=>s.status !== 'Returned');
  if(q.length >= 2){
    rows = rows.filter(s=>{
      const c = byId(DB.customers, s.customerId), p = byId(DB.products, s.productId);
      return hit(s.serial) || hit(c && c.name) || hit(p && p.name);
    });
  } else {
    // Default view: machines with an overdue visit or an open job, because
    // those are the ones somebody is most likely about to raise a card for.
    const flagged = rows.filter(s=>{
      const sch = DB.serviceSchedules.find(x=>x.serialId === s.id);
      const overdue = sch && (sch.visits||[]).some(v=>v.status !== 'Done' && v.dueDate <= todayISO());
      const openJob = DB.serviceJobs.some(j=>j.serialId === s.id && j.status === 'Open');
      return overdue || openJob;
    });
    rows = (flagged.length ? flagged : rows).slice(0, 25);
  }
  rows = rows.slice(0, 40);
  if(!rows.length) return '<div class="empty">No machine matches “' + esc(_jobPickQuery) + '”.</div>';
  return (q.length < 2 ? '<div class="small muted" style="margin-bottom:8px;">Machines with a visit due or a job open — or search for any serial.</div>' : '') +
    rows.map(s=>{
      const c = byId(DB.customers, s.customerId), p = byId(DB.products, s.productId);
      const w = DB.warrantyRecords.find(w=>w.serialId === s.id);

/* ============================================================
   === SECTION: SHARED WORKSPACE (v1.4) ===
   Until now everything lived in one browser's localStorage, which meant two
   people could not use the system at the same time. Anitha could not enter a
   lead while Lakshmi received a purchase.

   What this does NOT do is push the whole database as one blob. That would be
   worse than localStorage: the second person to save would silently wipe the
   first person's work. Instead the unit of exchange is a single record, so two
   people working at once touch different rows and both survive.

   Local storage does not go away — it becomes the offline cache. The server is
   the source of truth when reachable; the app keeps working when it is not,
   and catches up afterwards.
   ============================================================ */

/* ---------- IDENTIFIERS THAT SURVIVE MORE THAN ONE DEVICE --------------
   v1.0's uid() was a counter starting at 1000 that reset on every page load.
   On one machine that was fine. The moment two people run the app, both
   counters start at 1000 and hand out the same ids — and once those records
   meet in the shared workspace, one silently overwrites the other.

   Every device now stamps its own short token into the ids it creates, so two
   people generating records at the same instant cannot collide. The counter is
   also lifted above anything already present, which keeps ids readable and
   roughly ordered. */
function deviceToken(){
  let t = null;
  try{ t = localStorage.getItem('sims_os_public_device_v16'); }catch(e){}
  if(!t){
    t = Math.random().toString(36).slice(2,7);
    try{ localStorage.setItem('sims_os_public_device_v16', t); }catch(e){}
  }
  return t;
}
const DEVICE_TOKEN = deviceToken();
// Overrides the v1.0 helper. Same call sites, same shape, now unique per device.
function uid(p){ return (p||'ID') + '-' + (_uidc++) + '-' + DEVICE_TOKEN; }

/** Lifts the counter above every id already in the database, so a device that
 *  has just joined does not start numbering from 1000 again. */
function reseedUidCounter(){
  let max = _uidc;
  SYNC_COLLECTIONS.forEach(coll=>{
    const rows = DB[coll];
    if(!Array.isArray(rows)) return;
    rows.forEach(r=>{
      if(!r || typeof r.id !== 'string') return;
      const m = r.id.match(/-(\d+)(?:-|$)/);
      if(m){ const n = Number(m[1]); if(n >= max) max = n + 1; }
    });
  });
  _uidc = max;
}

/** Belt and braces: if colliding ids ever do reach a collection, keep the last
 *  one rather than letting byId() silently return the wrong record forever. */
function dedupeCollections(){
  let removed = 0;
  SYNC_COLLECTIONS.forEach(coll=>{
    const rows = DB[coll];
    if(!Array.isArray(rows)) return;
    const seen = {};
    for(let i = rows.length - 1; i >= 0; i--){
      const id = rows[i] && rows[i].id;
      if(!id) continue;
      if(seen[id]){ rows.splice(i,1); removed++; } else seen[id] = 1;
    }
  });
  if(removed) console.warn('Removed ' + removed + ' duplicate record id(s)');
  return removed;
}

/* Every collection that is shared. Anything holding records with an `id`. */
const SYNC_COLLECTIONS = [
  'employees','leads','customers','suppliers','materials','rfqs','purchases',
  'consumptionLogs','products','productionStock','salesInvoices','equipmentSerials',
  'warrantyRecords','calibrationRecords','serviceSchedules','serviceJobs',
  'repeatOpportunities','engagementMessages','productUpdates','communications',
  'alerts','tasks','quotations','creditNotes','debitNotes','ewayBills','auditLog',
  'expenses','supplierRates','standingCosts','attendance',
];

const SYNC = {
  enabled: false,
  cursor: 0,
  status: 'off',          // off | idle | syncing | offline | error | conflict
  message: '',
  pending: 0,
  lastSyncAt: '',
  lastError: '',
  hashes: {},             // collection -> { id: hash } as of the last successful push
  timer: null,
  pollTimer: null,
  busy: false,
  recentEditors: {},      // name -> last seen time, so you can see who else is working
};

function syncCfg(){
  const s = settings();
  s.web = s.web || { apiBase:'', apiToken:'' };
  return s.web;
}
function syncReady(){ const c = syncCfg(); return !PUBLIC_DEMO && WORKSPACE_MODE==='sample' && !!(c.apiBase && c.apiToken); }
function syncUrl(path){ return syncCfg().apiBase.replace(/\/$/,'') + path; }
function syncHeaders(){
  return {
    'Authorization': 'Bearer ' + syncCfg().apiToken,
    'Content-Type': 'application/json',
    // Attribution, not authentication. The bearer token guards the endpoint;
    // this only says whose name goes on the change.
    'X-OS-User': (currentEmployee() || {}).name || 'Unknown',
  };
}

/* ---------- change detection ------------------------------------------
   The app mutates DB directly all over the place and then calls save(), so
   there is no list of what changed. Rather than rewrite every screen, we keep
   a cheap fingerprint of each record and compare. For this dataset that is a
   few milliseconds — small enough to run on every save. */
function recordHash(str){
  let h = 5381;
  for(let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return h;
}
function collectChanges(){
  const out = [];
  SYNC_COLLECTIONS.forEach(coll=>{
    const rows = DB[coll];
    if(!Array.isArray(rows)) return;
    const prev = SYNC.hashes[coll] || {};
    const now = {};
    rows.forEach(r=>{
      if(!r || !r.id) return;
      const json = JSON.stringify(r);
      const h = recordHash(json);
      now[r.id] = h;
      if(prev[r.id] !== h) out.push({ c: coll, i: r.id, d: json });
    });
    // Anything we held before and no longer have has been deleted here.
    Object.keys(prev).forEach(id=>{
      if(now[id] === undefined) out.push({ c: coll, i: id, d: '{}', del: 1 });
    });
    SYNC._next = SYNC._next || {};
    SYNC._next[coll] = now;
  });
  // Settings travel as a single shared record, minus this device's own token.
  const s = JSON.parse(JSON.stringify(settings()));
  if(s.web) s.web = { apiBase:'', apiToken:'' };
  const sJson = JSON.stringify(s);
  const sHash = recordHash(sJson);
  if((SYNC.hashes.__settings || {}).singleton !== sHash){
    out.push({ c:'settings', i:'singleton', d: sJson });
  }
  SYNC._next = SYNC._next || {};
  SYNC._next.__settings = { singleton: sHash };
  return out;
}
function commitHashes(){
  if(SYNC._next){ SYNC.hashes = SYNC._next; SYNC._next = null; }
}
/** Rebuilds the fingerprint map from whatever is in memory right now. */
function rebaselineHashes(){
  SYNC._next = null;
  collectChanges();
  commitHashes();
}

/* ---------- merging what other people did ------------------------------ */
/**
 * @param records   what the server sent
 * @param protect   keys ("collection|id") this device has edited but not yet
 *                  shared. Those must NOT be overwritten: the person made that
 *                  change seconds ago and is looking at it. Their edit wins and
 *                  gets pushed immediately after, becoming the newest write.
 */
function applyIncoming(records, protect){
  let applied = 0, skipped = 0, held = [];
  const editors = {};
  records.forEach(rec=>{
    if(rec.by && rec.by !== ((currentEmployee()||{}).name)) editors[rec.by] = todayISO();
    if(protect && protect.has(rec.c + '|' + rec.i)){
      // Someone else changed this too. We keep ours, but say so rather than
      // letting one of the two edits disappear without a word.
      held.push({ c: rec.c, i: rec.i, by: rec.by });
      return;
    }
    if(rec.c === 'settings'){
      try{
        const incoming = JSON.parse(rec.d);
        const keep = settings().web;                    // never take another device's connection details
        DB.settings = Object.assign({}, incoming, { web: keep });
        applied++;
      }catch(e){ skipped++; }
      return;
    }
    const rows = DB[rec.c];
    if(!Array.isArray(rows)){ skipped++; return; }
    const idx = rows.findIndex(r=>r && r.id === rec.i);
    if(rec.del){
      if(idx >= 0){ rows.splice(idx,1); applied++; }
      markSynced(rec.c, rec.i, null);
      return;
    }
    let obj;
    try{ obj = JSON.parse(rec.d); }catch(e){ skipped++; return; }
    if(idx >= 0) rows[idx] = obj; else rows.push(obj);
    // Accept this as already-shared. Without it the next collectChanges() sees
    // a colleague's record as *our* edit and pushes it straight back — which
    // re-stamps their work with our name and starts an echo between devices.
    markSynced(rec.c, rec.i, obj);
    applied++;
  });
  Object.assign(SYNC.recentEditors, editors);
  return { applied, skipped, held };
}
/** Records a fingerprint for something that came from the server, so it is
 *  never mistaken for a local change. Pass null when the record was deleted.
 *  Written into both the live map and the pending one, so it survives whichever
 *  order collectChanges() and the pull happen to run in. */
function markSynced(coll, id, obj){
  const h = obj === null ? null : recordHash(JSON.stringify(obj));
  [SYNC.hashes, SYNC._next].forEach(map=>{
    if(!map) return;
    map[coll] = map[coll] || {};
    if(h === null) delete map[coll][id]; else map[coll][id] = h;
  });
}

/* ---------- the loop --------------------------------------------------- */
async function syncPull(protect){
  const res = await fetch(syncUrl('/api/os/sync?since=' + SYNC.cursor), { headers: syncHeaders() });
  if(!res.ok){
    const b = await res.json().catch(()=>({}));
    throw new Error(b.error || ('server replied ' + res.status));
  }
  const data = await res.json();
  const result = applyIncoming(data.records || [], protect);
  if(data.cursor) SYNC.cursor = data.cursor;
  return { ...result, count: (data.records||[]).length, more: data.more };
}
async function syncPush(changes){
  if(!changes.length) return { applied: 0 };
  const res = await fetch(syncUrl('/api/os/sync'), {
    method: 'POST', headers: syncHeaders(),
    body: JSON.stringify({ records: changes, baseCursor: SYNC.cursor }),
  });
  if(!res.ok){
    const b = await res.json().catch(()=>({}));
    throw new Error(b.error || ('server replied ' + res.status));
  }
  const data = await res.json();
  if(data.cursor) SYNC.cursor = Math.max(SYNC.cursor, data.cursor);
  if((data.rejected||[]).length){
    console.warn('Sync rejected records:', data.rejected);
    toast(data.rejected.length + ' record(s) were rejected by the server — see the console');
  }
  return data;
}
/**
 * Pull before push, always. Taking other people's changes first means our push
 * is the newest write, which is what makes last-write-wins predictable rather
 * than a race.
 */
async function syncNow(silent){
  if(!SYNC.enabled || !syncReady() || SYNC.busy) return;
  SYNC.busy = true;
  SYNC.status = 'syncing'; renderSyncBadge();
  try{
    // Work out what is ours *first*, so the pull knows which records not to
    // overwrite. Someone editing a lead this second must not have it replaced
    // mid-keystroke by a colleague's older copy — their edit wins and is then
    // pushed, making it the newest write. Records that arrive and are not ours
    // get fingerprinted as already-shared, so they are never bounced back.
    const changes = collectChanges();
    const mine = new Set(changes.map(c=>c.c + '|' + c.i));
    const pulled = await syncPull(mine);
    await syncPush(changes);
    commitHashes();
    if(pulled.held && pulled.held.length){
      const names = [...new Set(pulled.held.map(x=>x.by).filter(Boolean))];
      toast('Your version was kept for ' + pulled.held.length + ' record(s) also changed by ' +
        (names.join(' and ') || 'someone else') + '.');
    }
    saveLocal();
    SYNC.status = 'idle'; SYNC.pending = 0; SYNC.lastError = '';
    SYNC.lastSyncAt = new Date().toISOString();
    if(!silent && changes.length) toast(changes.length + ' change(s) shared with the team');
    renderSyncBadge();
    // Other people's work may have changed what is on screen.
    if(!document.querySelector('.modal-overlay')) rerender();
  }catch(e){
    SYNC.status = navigator.onLine ? 'error' : 'offline';
    SYNC.lastError = e.message;
    SYNC._next = null;                    // keep the old baseline so nothing is lost
    renderSyncBadge();
    if(!silent) toast('Could not sync: ' + e.message);
  }
  SYNC.busy = false;
}

/* save() is called after every change in the app. It keeps writing locally
   straight away — that must never depend on the network — and schedules a
   push shortly after, so a burst of edits becomes one request. */
let _syncDebounce = null;
function scheduleSync(){
  if(!SYNC.enabled) return;
  SYNC.pending++;
  SYNC.status = 'pending'; renderSyncBadge();
  clearTimeout(_syncDebounce);
  _syncDebounce = setTimeout(()=>syncNow(true), 1500);
}
function startSyncPolling(){
  clearInterval(SYNC.pollTimer);
  // Often enough that a colleague's work appears while you are still looking
  // at the screen; rarely enough to be invisible on a phone connection.
  SYNC.pollTimer = setInterval(()=>{ if(!SYNC.busy && SYNC.enabled) syncNow(true); }, 20000);
}
function stopSync(){
  SYNC.enabled = false; SYNC.status = 'off';
  clearInterval(SYNC.pollTimer); clearTimeout(_syncDebounce);
  renderSyncBadge();
}

/* ---------- first connection ------------------------------------------
   The one genuinely dangerous moment. Either this device seeds the shared
   database, or the shared database replaces this device. Both are
   irreversible-ish, so the user is told exactly which, with counts, and
   a backup is taken first. */
async function connectWorkspace(){
  if(PUBLIC_DEMO){ toast('This public demo does not connect to a shared workspace.'); return; }
  if(WORKSPACE_MODE!=='sample'){
    toast('Your trial data stays separate on this device until secure staff sharing is ready.');
    return;
  }
  if(!syncReady()){ toast('Set the website address and access token first'); gotoSettings(); return; }
  toast('Checking the shared workspace…');
  let serverCount = 0;
  try{
    const res = await fetch(syncUrl('/api/os/sync?since=0'), { headers: syncHeaders() });
    if(!res.ok){ const b = await res.json().catch(()=>({})); throw new Error(b.error || ('server replied ' + res.status)); }
    const data = await res.json();
    serverCount = data.count || 0;
  }catch(e){
    openModal('Could not reach the shared workspace',
      '<div class="warnbox">' + icon('alerttri',16) + '<div>' + esc(e.message) + '</div></div>' +
      '<p class="small muted" style="margin-top:12px;">Check the website address and access token under Settings. The app keeps working on this device in the meantime.</p>',
      '<button class="btn" ' + act('closeModal') + '>Close</button><button class="btn primary" ' + act('gotoSettings') + '>Open settings</button>');
    return;
  }
  const localCount = SYNC_COLLECTIONS.reduce((n,c)=>n + (Array.isArray(DB[c]) ? DB[c].length : 0), 0);

  if(serverCount === 0){
    openModal('Start the shared workspace',
      '<div class="infobox">' + icon('users',16) + '<div>The shared workspace is empty. This device\'s data will become the starting point, and everyone who connects after this will see it.</div></div>' +
      '<div class="detailgrid" style="margin-top:12px;">' +
        '<div><div class="dl">On this device</div><div class="dv">' + localCount + ' records</div></div>' +
        '<div><div class="dl">In the shared workspace</div><div class="dv">empty</div></div>' +
      '</div>' +
      '<p class="small muted" style="margin-top:12px;">A backup file is downloaded first, automatically. After this, every change you make is shared with anyone else signed in, and theirs with you.</p>',
      '<button class="btn" ' + act('closeModal') + '>Cancel</button>' +
      '<button class="btn primary" ' + act('confirmConnect','upload') + '>Upload and start sharing</button>', true);
  } else {
    openModal('Join the shared workspace',
      '<div class="warnbox">' + icon('alerttri',16) + '<div>The shared workspace already holds data. Joining <b>replaces what is on this device</b> with the shared copy — anything entered here and never shared will be lost.</div></div>' +
      '<div class="detailgrid" style="margin-top:12px;">' +
        '<div><div class="dl">On this device</div><div class="dv">' + localCount + ' records</div></div>' +
        '<div><div class="dl">In the shared workspace</div><div class="dv">' + serverCount + ' records</div></div>' +
      '</div>' +
      '<p class="small muted" style="margin-top:12px;">A backup of this device is downloaded first, automatically, so nothing is unrecoverable.</p>',
      '<button class="btn" ' + act('closeModal') + '>Cancel</button>' +
      '<button class="btn danger" ' + act('confirmConnect','join') + '>Replace this device and join</button>', true);
  }
}
async function confirmConnect(mode){
  closeModal();
  exportFullBackup();                                   // safety net, always
  SYNC.enabled = true;
  SYNC.cursor = 0;
  try{
    if(mode === 'upload'){
      rebaselineHashes();
      SYNC.hashes = {};                                 // force everything to count as changed
      const all = collectChanges();
      // The first upload can be thousands of records; send it in pieces so no
      // single request is too large for the Worker.
      const CHUNK = 400;
      for(let i = 0; i < all.length; i += CHUNK){
        await syncPush(all.slice(i, i + CHUNK));
        toast('Uploading… ' + Math.min(i + CHUNK, all.length) + ' of ' + all.length);
      }
      commitHashes();
      audit('Connected', 'System', '', 'Shared workspace started from this device — ' + all.length + ' records uploaded');
    } else {
      // Replace local with shared.
      SYNC_COLLECTIONS.forEach(c=>{ if(Array.isArray(DB[c])) DB[c] = []; });
      let guard = 0;
      while(guard++ < 30){
        const r = await syncPull();
        if(!r.more) break;
      }
      // Take the shared workspace's numbering into account before creating
      // anything here, or this device starts handing out ids that already exist.
      dedupeCollections();
      reseedUidCounter();
      rebaselineHashes();
      audit('Connected', 'System', '', 'Joined the shared workspace on this device');
    }
    SYNC.status = 'idle'; SYNC.lastSyncAt = new Date().toISOString();
    saveLocal();
    startSyncPolling();
    toast('Connected — this device is now sharing with the team');
    rerender();
  }catch(e){
    SYNC.enabled = false; SYNC.status = 'error'; SYNC.lastError = e.message;
    toast('Could not connect: ' + e.message);
    rerender();
  }
}
function disconnectWorkspace(){
  if(!confirm('Stop sharing from this device?\n\nYour data stays here and the shared workspace keeps its copy, but changes will no longer travel between them.')) return;
  stopSync();
  audit('Disconnected', 'System', '', 'Device stopped sharing');
  saveLocal();
  toast('This device is no longer sharing');
  rerender();
}

function saveLocal(){
  try{
    localStorage.setItem(workspaceDbKey(), JSON.stringify(DB));

      enabled: SYNC.enabled, cursor: SYNC.cursor, hashes: SYNC.hashes,
    }));

}
function loadSyncState(){
  try{
    const raw = localStorage.getItem(workspaceSyncKey());
    if(!raw) return;
    const st = JSON.parse(raw);
    SYNC.enabled = WORKSPACE_MODE==='sample' && !!st.enabled;
    SYNC.cursor = st.cursor || 0;

}
function initSync(){
  loadSyncState();
  // The counter resets to 1000 on every page load, so lift it clear of what is
  // already stored before anything new is created this session.
  reseedUidCounter();
  dedupeCollections();
  renderSyncBadge();
  if(SYNC.enabled && syncReady()){
    startSyncPolling();
    syncNow(true);
  }
  window.addEventListener('online',  ()=>{ if(SYNC.enabled){ SYNC.status='idle'; renderSyncBadge(); syncNow(true);} });
  window.addEventListener('offline', ()=>{ if(SYNC.enabled){ SYNC.status='offline'; renderSyncBadge(); } });
  // Leaving with unsent work is the one moment worth interrupting.
  window.addEventListener('beforeunload', ev=>{
    if(SYNC.enabled && SYNC.pending > 0){ ev.preventDefault(); ev.returnValue = ''; }
  });
}

/* ============================================================
   === SECTION: WHAT THINGS COST, AND WHAT WE ACTUALLY EARN (v1.5) ===

   The earlier version of this idea was wrong, and the owner said so: profit is
   not sale price minus material cost. Salaries, factory power, rent, IndiaMART
   and TradeIndia subscriptions, SEO, travel, freight, bank charges — all of it
   sits between a sale and money in the bank.

   So this is built in three honest layers, and the app never blurs them:

     1  CONTRIBUTION  — price minus materials minus direct labour.
                        A fact. No judgement, no allocation, always defensible.

     2  LOADED COST   — contribution less a share of factory overhead.
                        An ESTIMATE. Overhead has to be spread somehow, and
                        every method is an opinion. Labelled as such, always.

     3  PROFIT & LOSS — revenue less everything, for the whole business.
                        The only place the word "profit" is used without
                        qualification, because it is the only place it is
                        certain.

   The rule the app follows: decisions about one product use layer 1. Questions
   about the business use layer 3. Layer 2 is a guide, never a verdict.
   ============================================================ */

/* ---------- 1. WHAT WE SPEND MONEY ON ---------------------------------
   Categories written the way this business actually spends, not the way an
   accounting textbook groups things. "IndiaMART" is a line, because that is
   what the owner recognises on his bank statement.

   `bucket` decides where a cost lands in the P&L:
     factory → part of cost of goods sold
     selling → cost of winning the order
     service → cost of keeping the promise after the sale
     admin   → cost of the company existing
     finance → interest and depreciation, below operating profit           */
const EXPENSE_CATEGORIES = [
  // --- factory: these become part of what a machine costs to make ---
  { id:'EXP-WAGES',    name:'Production wages',            bucket:'factory', behaviour:'semi-fixed', itc:false },
  { id:'EXP-PRODMGR',  name:'Production supervision',      bucket:'factory', behaviour:'fixed',      itc:false },
  { id:'EXP-FRENT',    name:'Factory rent',                bucket:'factory', behaviour:'fixed',      itc:true  },
  { id:'EXP-POWER',    name:'Factory electricity & power', bucket:'factory', behaviour:'variable',   itc:false },
  { id:'EXP-MAINT',    name:'Machine maintenance',         bucket:'factory', behaviour:'variable',   itc:true  },
  { id:'EXP-FCONS',    name:'Factory consumables',         bucket:'factory', behaviour:'variable',   itc:true  },
  { id:'EXP-CALIB',    name:'Calibration & test charges',  bucket:'factory', behaviour:'variable',   itc:true  },
  // --- selling: the cost of getting an order ---
  { id:'EXP-SALSAL',   name:'Sales salaries',              bucket:'selling', behaviour:'fixed',      itc:false },
  { id:'EXP-INDIAMART',name:'IndiaMART subscription',      bucket:'selling', behaviour:'fixed',      itc:true  },
  { id:'EXP-TRADEINDIA',name:'TradeIndia subscription',    bucket:'selling', behaviour:'fixed',      itc:true  },
  { id:'EXP-JUSTDIAL', name:'JustDial listing',            bucket:'selling', behaviour:'fixed',      itc:true  },
  { id:'EXP-SEO',      name:'Website & SEO',               bucket:'selling', behaviour:'fixed',      itc:true  },
  { id:'EXP-ADS',      name:'Google Ads',                  bucket:'selling', behaviour:'variable',   itc:true  },
  { id:'EXP-EXPO',     name:'Exhibitions & trade shows',   bucket:'selling', behaviour:'variable',   itc:true  },
  { id:'EXP-STRAVEL',  name:'Sales travel',                bucket:'selling', behaviour:'variable',   itc:false },
  { id:'EXP-FREIGHT',  name:'Freight outward',             bucket:'selling', behaviour:'variable',   itc:true  },
  // --- service: the cost of the promise made at every sale ---
  { id:'EXP-SVCSAL',   name:'Service salaries',            bucket:'service', behaviour:'fixed',      itc:false },
  { id:'EXP-SVCTRAVEL',name:'Service travel',              bucket:'service', behaviour:'variable',   itc:false },
  { id:'EXP-SVCPARTS', name:'Warranty parts & rework',     bucket:'service', behaviour:'variable',   itc:true  },
  // --- admin: the cost of the company existing ---
  { id:'EXP-OWNER',    name:"Owner's remuneration",        bucket:'admin',   behaviour:'fixed',      itc:false },
  { id:'EXP-ADMSAL',   name:'Stores & admin salaries',     bucket:'admin',   behaviour:'fixed',      itc:false },
  { id:'EXP-ORENT',    name:'Office rent',                 bucket:'admin',   behaviour:'fixed',      itc:true  },
  { id:'EXP-OUTIL',    name:'Office power, internet, phone',bucket:'admin',  behaviour:'fixed',      itc:true  },
  { id:'EXP-PROF',     name:'Professional & audit fees',   bucket:'admin',   behaviour:'fixed',      itc:true  },
  { id:'EXP-SOFT',     name:'Software subscriptions',      bucket:'admin',   behaviour:'fixed',      itc:true  },
  { id:'EXP-INS',      name:'Insurance',                   bucket:'admin',   behaviour:'fixed',      itc:true  },
  { id:'EXP-BANK',     name:'Bank charges',                bucket:'admin',   behaviour:'variable',   itc:false },
  { id:'EXP-STAT',     name:'Printing & stationery',       bucket:'admin',   behaviour:'variable',   itc:true  },
  { id:'EXP-MISC',     name:'Miscellaneous',               bucket:'admin',   behaviour:'variable',   itc:false },
  // --- below operating profit ---
  { id:'EXP-INT',      name:'Loan interest',               bucket:'finance', behaviour:'fixed',      itc:false },
  { id:'EXP-DEP',      name:'Depreciation',                bucket:'finance', behaviour:'fixed',      itc:false },
];
const BUCKET_LABEL = {
  factory:'Factory — cost of making',
  selling:'Selling — cost of winning the order',
  service:'Service — cost of keeping the promise',
  admin:'Admin — cost of the company existing',
  finance:'Interest & depreciation',
};
const BUCKET_ORDER = ['factory','selling','service','admin','finance'];
function expCat(id){ return EXPENSE_CATEGORIES.find(c=>c.id === id) || { id:id, name:id, bucket:'admin', behaviour:'variable', itc:false }; }

function expensesIn(monthKeyStr){
  return (DB.expenses || []).filter(e=>String(e.date).slice(0,7) === monthKeyStr);
}
function expensesBetween(fromISO, toISO){
  return (DB.expenses || []).filter(e=>e.date >= fromISO && e.date <= toISO);
}
function sumBy(rows, fn){ return rows.reduce((s,r)=>s + (Number(fn(r)) || 0), 0); }

/* ---------- 2. WHAT A PRODUCT COSTS ------------------------------------
   Materials come from the bill of materials, priced at the last rate paid —
   not a standard cost typed in once and left to rot. Labour is minutes on the
   bench times the workshop rate. Both are facts.                          */
function bomCost(product){
  // A distributed item is bought finished: it has a landed cost, not a recipe.
  if(product && product.buyCost) return product.buyCost;
  if(!product || !Array.isArray(product.bom)) return 0;
  return product.bom.reduce((s,line)=>{
    const m = byId(DB.materials, line.materialId);
    if(!m) return s;
    // Scrap is real: some of every sheet and every metre of wire is wasted.
    const qty = line.qty * (1 + (line.scrapPct || 0) / 100);
    return s + qty * (m.lastRate || 0);
  }, 0);
}
function labourCost(product){
  const rate = settings().costing.labourRatePerHour;
  return ((product && product.labourMinutes) || 0) / 60 * rate;
}
function directCost(product){ return bomCost(product) + labourCost(product); }

/**
 * Factory overhead per labour hour.
 *
 * The honest way to spread rent, power and supervision: total factory cost for
 * the period divided by the labour hours actually worked in it. It is still an
 * allocation — a quiet month makes every machine look more expensive — which is
 * exactly why anything using it is labelled an estimate.
 */
/**
 * Hours the workshop actually has, counted from the people on it rather than a
 * number typed into settings. Payroll and capacity were reading two different
 * figures, which meant they could quietly disagree about the same month.
 */
function factoryHoursAvailable(months){
  const c = settings().costing || {};
  const heads = (DB.employees || []).filter(e=>
    e.active !== false && e.salaryMonthly > 0 && e.payBucket === 'factory').length
    || c.productionHeadcount || 2;
  return heads * (c.hoursPerMonthPerHead || 200) * (months || 12);
}
function overheadRatePerHour(monthsBack){
  const months = monthsBack || 12;
  const T = todayISO();
  const from = addMonths(T, -months);
  const factory = expensesBetween(from, T).filter(e=>expCat(e.category).bucket === 'factory');
  const overhead = sumBy(factory, e=>e.amount);
  // Spread over the hours the workshop actually HAS, not the hours that happened
  // to be sold. Dividing by sold hours makes a quiet month look as though every
  // machine suddenly costs a fortune to build, which is an artefact of the
  // arithmetic rather than anything real.
  const hours = factoryHoursAvailable(months);
  if(hours < 1) return 0;
  return overhead / hours;
}
/** How much of the workshop's available time the sold work actually used. */
function capacityUsed(monthsBack){
  const months = monthsBack || 12;
  const T = todayISO(), from = addMonths(T, -months);
  let used = 0;
  DB.salesInvoices.filter(i=>i.date >= from).forEach(inv=>(inv.lines || []).forEach(l=>{
    if(l.type !== 'equipment') return;
    const p = byId(DB.products, l.productId);
    if(p && p.labourMinutes) used += (p.labourMinutes / 60) * l.qty;
  }));
  const available = factoryHoursAvailable(months);
  return { used, available, pct: available ? (used / available) * 100 : 0 };
}
function loadedCost(product, ohRate){
  const rate = ohRate === undefined ? overheadRatePerHour() : ohRate;
  const hours = ((product && product.labourMinutes) || 0) / 60;
  return directCost(product) + hours * rate;
}
/** Everything about one product's economics, in one object. */
function costCard(product){
  const mat = bomCost(product), lab = labourCost(product);
  const ohRate = overheadRatePerHour();
  const oh = ((product.labourMinutes || 0) / 60) * ohRate;
  const price = product.price || 0;
  const contribution = price - mat - lab;
  const loaded = mat + lab + oh;
  return {
    materials: mat, labour: lab, overhead: oh, ohRate: ohRate,
    directCost: mat + lab, loadedCost: loaded, price: price,
    contribution: contribution,
    contributionPct: price ? (contribution / price) * 100 : 0,
    loadedProfit: price - loaded,
    loadedProfitPct: price ? ((price - loaded) / price) * 100 : 0,
    hasBom: (Array.isArray(product.bom) && product.bom.length > 0) || !!product.buyCost,
  };
}

/* ---------- 3. WHAT ONE SALE EARNED ------------------------------------ */
function invoiceContribution(inv){
  let revenue = 0, cost = 0, unknown = 0;
  (inv.lines || []).forEach(l=>{
    const line = (l.taxable != null) ? l.taxable : (l.qty * l.rate);
    revenue += line;
    if(l.type === 'equipment'){
      const p = byId(DB.products, l.productId);
      if(p && ((Array.isArray(p.bom) && p.bom.length) || p.buyCost)) cost += directCost(p) * l.qty;
      else unknown += line;                      // no costing sheet — say so, do not guess
    } else if(l.type === 'consumable'){
      const m = byId(DB.materials, l.materialId);
      // A traded consumable costs what we paid for it.
      if(m) cost += (m.lastRate || 0) * l.qty; else unknown += line;
    }
    // Service lines carry no material cost; the engineer's time is in the
    // service bucket of the P&L, not here.
  });
  return { revenue, cost, contribution: revenue - cost, unknownRevenue: unknown,
           pct: revenue ? ((revenue - cost) / revenue) * 100 : 0 };
}
function customerContribution(customerId, fromISO){
  const invs = DB.salesInvoices.filter(i=>i.customerId === customerId && (!fromISO || i.date >= fromISO));
  let rev = 0, con = 0;
  invs.forEach(i=>{ const c = invoiceContribution(i); rev += c.revenue; con += c.contribution; });
  return { invoices: invs.length, revenue: rev, contribution: con, pct: rev ? (con/rev)*100 : 0 };
}

/* ---------- 4. THE PROFIT AND LOSS -------------------------------------
   The only place the word profit is used plainly, because it is the only place
   nothing has been allocated or assumed. */
function profitAndLoss(fromISO, toISO){
  const invs = DB.salesInvoices.filter(i=>i.date >= fromISO && i.date <= toISO);
  const cns  = (DB.creditNotes || []).filter(n=>n.date >= fromISO && n.date <= toISO);
  const revenue = sumBy(invs, i=>i.subTotal || 0) - sumBy(cns, n=>n.subTotal || 0);

  // Materials actually consumed by what was sold, not what was bought. Buying
  // stock is not a cost until it leaves as a product — getting this wrong is
  // what made the old figures nonsense.
  let materials = 0, uncosted = 0;
  invs.forEach(inv=>(inv.lines || []).forEach(l=>{
    if(l.type === 'equipment'){
      const p = byId(DB.products, l.productId);
      if(p && ((Array.isArray(p.bom) && p.bom.length) || p.buyCost)) materials += bomCost(p) * l.qty;
      else uncosted += (l.taxable != null ? l.taxable : l.qty * l.rate);
    } else if(l.type === 'consumable'){
      const m = byId(DB.materials, l.materialId);
      if(m) materials += (m.lastRate || 0) * l.qty;
    }
  }));

  const exp = expensesBetween(fromISO, toISO);
  const byBucket = {};
  BUCKET_ORDER.forEach(b=>{ byBucket[b] = { total: 0, lines: {} }; });
  exp.forEach(e=>{
    const c = expCat(e.category);
    const b = byBucket[c.bucket] || byBucket.admin;
    b.total += Number(e.amount) || 0;
    b.lines[c.name] = (b.lines[c.name] || 0) + (Number(e.amount) || 0);
  });

  const factory = byBucket.factory.total;
  const cogs = materials + factory;
  const grossProfit = revenue - cogs;
  const selling = byBucket.selling.total;
  const service = byBucket.service.total;
  const admin = byBucket.admin.total;
  const operatingProfit = grossProfit - selling - service - admin;
  const finance = byBucket.finance.total;
  const netProfit = operatingProfit - finance;

  const pct = n => revenue ? (n / revenue) * 100 : 0;
  return {
    from: fromISO, to: toISO, invoiceCount: invs.length,
    revenue, materials, factory, cogs, grossProfit,
    selling, service, admin, operatingProfit, finance, netProfit,
    byBucket, uncostedRevenue: uncosted,
    margins: { gross: pct(grossProfit), operating: pct(operatingProfit), net: pct(netProfit) },
    // Revenue at which the business exactly covers its costs.
    breakEven: (()=>{
      const contributionRate = revenue ? (revenue - materials) / revenue : 0;
      const fixedish = factory + selling + service + admin + finance;
      return contributionRate > 0 ? fixedish / contributionRate : 0;
    })(),
  };
}
function plMonths(n){
  const T = todayISO(); const out = [];
  for(let i = n - 1; i >= 0; i--){
    const k = monthKey(T, -i);
    const from = k + '-01';
    const to = addDays(addMonths(from, 1), -1);
    out.push(Object.assign({ key: k, label: monthLabel(k) }, profitAndLoss(from, to)));
  }
  return out;
}

/* ---------- 5. MONEY ASLEEP ON THE SHELF ------------------------------- */
function deadStockReport(){
  const T = todayISO(), yr = addDays(T, -365);
  const soldQty = {};
  DB.salesInvoices.filter(i=>i.date >= yr).forEach(i=>(i.lines || []).forEach(l=>{
    if(l.type === 'equipment') soldQty[l.productId] = (soldQty[l.productId] || 0) + l.qty;
    if(l.type === 'consumable') soldQty[l.materialId] = (soldQty[l.materialId] || 0) + l.qty;
  }));
  const rows = [];
  DB.productionStock.forEach(ps=>{
    const p = byId(DB.products, ps.productId);
    if(!p || !(ps.finishedQty > 0)) return;
    const sold = soldQty[p.id] || 0;
    const cost = ((Array.isArray(p.bom) && p.bom.length) || p.buyCost) ? directCost(p) : p.price * 0.55;
    rows.push({ kind:'Finished goods', id:p.id, name:p.name, qty:ps.finishedQty, unit:'units',
      soldYear: sold, value: cost * ps.finishedQty, sellValue: p.price * ps.finishedQty,
      years: sold ? ps.finishedQty / sold : null, costEstimated: !((Array.isArray(p.bom) && p.bom.length) || p.buyCost) });
  });
  DB.materials.forEach(m=>{
    if(!(m.qty > 0)) return;
    const used = (m.avgConsumption || 0) * 365 + (soldQty[m.id] || 0);
    if(used > 0 && m.qty / used < 1) return;               // less than a year's cover is healthy
    rows.push({ kind:'Material', id:m.id, name:m.name, qty:m.qty, unit:m.unit,
      soldYear: Math.round(used), value: (m.lastRate || 0) * m.qty, sellValue: 0,
      years: used ? m.qty / used : null, costEstimated:false });
  });
  rows.sort((a,b)=>b.value - a.value);
  const never = rows.filter(r=>!r.soldYear);
  return { rows, total: sumBy(rows, r=>r.value),
           neverSold: never, neverSoldValue: sumBy(never, r=>r.value) };
}

/* ---------- 6. WHO WE BUY FROM, AND AT WHAT PRICE ----------------------
   The link between supplier and material already existed; the price did not,
   so there was no way to tell whether we were buying well. */
function ratesFor(materialId){
  return (DB.supplierRates || []).filter(r=>r.materialId === materialId)
    .map(r=>Object.assign({}, r, { supplier: byId(DB.suppliers, r.supplierId) }))
    .filter(r=>r.supplier)
    .sort((a,b)=>a.rate - b.rate);
}
function bestRate(materialId){ const r = ratesFor(materialId); return r.length ? r[0] : null; }
/** What we paid against the best price available at the time. */
function purchaseSavingsAnalysis(months){
  const T = todayISO(), from = addMonths(T, -(months || 12));
  const rows = [];
  DB.materials.forEach(m=>{
    const hist = (m.priceHistory || []).filter(h=>h.date >= from);
    if(hist.length < 2) return;
    const rates = hist.map(h=>h.rate);
    const low = Math.min(...rates), high = Math.max(...rates);
    const overpaid = hist.reduce((s,h)=>s + (h.rate - low) * h.qty, 0);
    if(overpaid < 1) return;
    rows.push({ materialId:m.id, material:m.name, buys:hist.length, low, high,
      swingPct: low ? ((high - low) / low) * 100 : 0, overpaid,
      bestSupplier: (bestRate(m.id) || {}).supplier });
  });
  rows.sort((a,b)=>b.overpaid - a.overpaid);
  return { rows, total: sumBy(rows, r=>r.overpaid) };
}
function supplierScorecard(){
  const T = todayISO(), yr = addDays(T, -365);
  return DB.suppliers.map(s=>{
    const purch = DB.purchases.filter(p=>p.supplierId === s.id && p.date >= yr);
    const spend = sumBy(purch, p=>p.subTotal || 0);
    const rates = (DB.supplierRates || []).filter(r=>r.supplierId === s.id);
    // How often is this supplier the cheapest of those who can supply the item?
    let bestCount = 0;
    rates.forEach(r=>{ const b = bestRate(r.materialId); if(b && b.supplierId === s.id) bestCount++; });
    const dn = (DB.debitNotes || []).filter(n=>n.supplierId === s.id);
    return { id:s.id, name:s.name, gst:s.gst, spend, orders:purch.length,
      materialsQuoted: rates.length, cheapestOn: bestCount,
      cheapestPct: rates.length ? (bestCount / rates.length) * 100 : 0,
      returns: dn.length, returnValue: sumBy(dn, n=>n.total),
      leadTimeDays: s.leadTimeDays || 0, terms: s.paymentTerms || '' };
  }).filter(s=>s.spend > 0 || s.materialsQuoted > 0)
    .sort((a,b)=>b.spend - a.spend);
}

/* ============================================================
   === SECTION: THINGS THAT RUN THEMSELVES (v1.6) ===

   v1.5 asked a human to type 31 costs a month — 370 a year — and 87% of that
   money was the same figure every single time. That is not book-keeping, it is
   punishment. Worse, salary is 54% of everything this company spends and it
   was an anonymous row with nobody's name on it.

   Two ideas fix almost all of it:

     STANDING COSTS  Rent, subscriptions, EMI, insurance. Entered once, with a
                     rule for when they step up ("+10% every April"). They post
                     themselves every month and are editable the moment the
                     landlord does something different.

     PEOPLE          Salary belongs to a person, not a category. Import the
                     attendance file the biometric machine already produces,
                     and the month works itself out — days present, overtime,
                     night shifts, increments falling due.

   What this deliberately does NOT do is calculate PF, ESI, professional tax or
   TDS. Those are regulated, they change every year, and getting them wrong is a
   legal problem for the business rather than a bug in an app. Half a payroll is
   worse than none. This records what is actually paid; the CA keeps the filing.
   ============================================================ */

/* ---------- 0. DATES THAT ARE ACTUALLY CORRECT -------------------------
   A real defect, present since v1.0, found while building the month-by-month
   posting loop.

   The original helpers did this:

       new Date(iso + 'T00:00:00')   // <- LOCAL midnight
       ...
       .toISOString().slice(0,10)    // <- read back as UTC

   In India (UTC+5:30) local midnight is 18:30 the *previous* day in UTC, so
   the value came back one day early. The damage:

       addDays('2026-08-07', 1)   ->  '2026-08-07'   (adding a day did nothing)
       addDays('2026-08-01', -1)  ->  '2026-07-30'   (went back two)
       addMonths('2026-08-07',-12)->  '2025-08-06'
       monthKey('2025-06-01', 1)  ->  '2025-06'      (never advanced)

   Which means every due date, warranty expiry, calibration deadline, ageing
   bucket and month range in the application has been drifting by a day or
   two. It was invisible in London and wrong in Hyderabad.

   These replacements do plain arithmetic in UTC and never round-trip through
   local time, so they give the same answer wherever the laptop is. */
function addDays(iso, n){
  const p = String(iso).split('-').map(Number);
  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2]) + (n || 0) * 86400000);
  return d.getUTCFullYear() + '-' +
         String(d.getUTCMonth() + 1).padStart(2,'0') + '-' +
         String(d.getUTCDate()).padStart(2,'0');
}
function addMonths(iso, n){
  const p = String(iso).split('-').map(Number);
  let y = p[0], m = p[1] + (n || 0);
  y += Math.floor((m - 1) / 12);
  m = ((m - 1) % 12 + 12) % 12 + 1;
  // The 31st of January plus one month is the 28th of February, not the 3rd of March.
  const lastDay = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return y + '-' + String(m).padStart(2,'0') + '-' + String(Math.min(p[2], lastDay)).padStart(2,'0');
}
// monthKey lives in the pages module instead — v1.0 declares its own copy
// further down the file, and the last declaration is the one that runs.
function daysBetween(a, b){
  const p = s => { const x = String(s).split('-').map(Number); return Date.UTC(x[0], x[1] - 1, x[2]); };
  return Math.round((p(b) - p(a)) / 86400000);
}
/** Steps to the next month without touching Date at all. */
function nextMonthKey(k){
  const y = Number(k.slice(0,4)), m = Number(k.slice(5,7));
  return m === 12 ? (y + 1) + '-01' : y + '-' + String(m + 1).padStart(2,'0');
}

/* ---------- 2. COSTS THAT REPEAT --------------------------------------
   87% of the money. Set once, stepped up by a rule, editable whenever
   reality disagrees with the rule. */
const ESCALATE_MONTHS = [
  {v:0,t:'never — I will change it myself'},
  {v:1,t:'every January'},{v:4,t:'every April'},{v:7,t:'every July'},{v:10,t:'every October'},
];
function monthNum(iso){ return Number(String(iso).slice(5,7)); }

/**
 * What a standing cost is worth in a given month, after every escalation that
 * has fallen due since it started. Calculated rather than stored, so changing
 * the rule corrects history instead of leaving it inconsistent.
 */
function standingAmountFor(sc, monthKeyStr){
  let amount = Number(sc.amount) || 0;
  if(!sc.escalatePct || !sc.escalateMonth) return amount;
  const startY = Number(String(sc.startFrom).slice(0,4));
  const startM = monthNum(sc.startFrom);
  const y = Number(monthKeyStr.slice(0,4)), m = Number(monthKeyStr.slice(5,7));
  let steps = 0;
  // Count each anniversary of the escalation month between start and this month.
  for(let yy = startY; yy <= y; yy++){
    const anniversaryPassed = (yy > startY || sc.escalateMonth >= startM) &&
                              (yy < y || sc.escalateMonth <= m);
    if(yy === startY && sc.escalateMonth < startM) continue;
    if(anniversaryPassed) steps++;
  }
  // The month it starts in is not an increase.
  if(sc.escalateMonth === startM) steps = Math.max(0, steps - 1);
  for(let i = 0; i < steps; i++) amount = amount * (1 + sc.escalatePct / 100);
  return Math.round(amount);
}
function standingActiveIn(sc, monthKeyStr){
  if(sc.active === false) return false;
  if(sc.startFrom && monthKeyStr < String(sc.startFrom).slice(0,7)) return false;
  if(sc.endOn && monthKeyStr > String(sc.endOn).slice(0,7)) return false;
  return true;
}
/** Turns the standing list into real expense records for a month. Idempotent —
 *  running it twice does not double-charge anything. */
function postStandingCosts(monthKeyStr, db){
  const d = db || DB;
  d.expenses = d.expenses || [];
  let posted = 0;
  (d.standingCosts || []).forEach(sc=>{
    if(!standingActiveIn(sc, monthKeyStr)) return;
    const already = d.expenses.some(e=>e.standingId === sc.id && String(e.date).slice(0,7) === monthKeyStr);
    if(already) return;
    const c = expCat(sc.category);
    const amount = standingAmountFor(sc, monthKeyStr);
    const day = Math.min(sc.dayOfMonth || 1, 28);
    const date = monthKeyStr + '-' + String(day).padStart(2,'0');
    d.expenses.push({
      id: uid('EXP'), date, category: sc.category, description: sc.name,
      amount, gstRate: sc.gstRate || 0, gstAmount: Math.round(amount * (sc.gstRate||0)) / 100,
      itcEligible: !!c.itc && !!sc.gstRate, bucket: c.bucket,
      recurring: true, standingId: sc.id,
      paidOn: date, paymentMode: sc.paymentMode || 'NEFT / RTGS',
    });
    posted++;
  });
  return posted;
}
/** Catches up every month from the earliest standing cost to today. */
function postAllStandingCosts(db){
  const d = db || DB;
  if(!(d.standingCosts || []).length) return 0;
  const earliest = d.standingCosts.reduce((a,sc)=>
    (!a || String(sc.startFrom) < a) ? String(sc.startFrom) : a, null);
  const T = todayISO();
  let total = 0, k = String(earliest).slice(0,7);
  let guard = 0;
  while(k <= T.slice(0,7) && guard++ < 400){
    total += postStandingCosts(k, d);
    k = nextMonthKey(k);
  }
  return total;
}

/* ---------- 3. PEOPLE --------------------------------------------------
   Salary is the biggest number in the business. It should have a name on it. */
const SHIFTS = ['General','Night','Rotating'];
const PAY_BUCKETS = [
  {v:'factory', t:'Factory — makes the product'},
  {v:'selling', t:'Selling — wins the order'},
  {v:'service', t:'Service — looks after customers'},
  {v:'admin',   t:'Admin — runs the company'},
];
const BUCKET_TO_SALARY_CAT = {
  factory:'EXP-WAGES', selling:'EXP-SALSAL', service:'EXP-SVCSAL', admin:'EXP-ADMSAL',
};
function activeEmployees(){ return DB.employees.filter(e=>e.active !== false && e.salaryMonthly > 0); }

/** Salary after every increment that has fallen due. Same idea as rent. */
function salaryFor(emp, monthKeyStr){
  let pay = Number(emp.salaryMonthly) || 0;
  if(!emp.incrementPct || !emp.incrementMonth || !emp.salaryFrom) return pay;
  const startY = Number(String(emp.salaryFrom).slice(0,4));
  const startM = monthNum(emp.salaryFrom);
  const y = Number(monthKeyStr.slice(0,4)), m = Number(monthKeyStr.slice(5,7));
  let steps = 0;
  for(let yy = startY; yy <= y; yy++){
    if(yy === startY && emp.incrementMonth < startM) continue;
    if(yy === y && emp.incrementMonth > m) continue;
    steps++;
  }
  if(emp.incrementMonth === startM) steps = Math.max(0, steps - 1);
  for(let i = 0; i < steps; i++) pay = pay * (1 + emp.incrementPct / 100);
  return Math.round(pay);
}
function attendanceFor(employeeId, monthKeyStr){
  return (DB.attendance || []).find(a=>a.employeeId === employeeId && a.month === monthKeyStr) || null;
}
function payableDaysIn(monthKeyStr){
  const s = settings().payroll || {};
  if(s.fixedPayableDays) return s.fixedPayableDays;      // most small units pay on 26
  const d = new Date(Number(monthKeyStr.slice(0,4)), Number(monthKeyStr.slice(5,7)), 0);
  return d.getDate();
}
/**
 * What one person is owed for one month.
 *
 * If no attendance has been imported, everyone is assumed present — because a
 * missing file must never quietly cut somebody's pay. The screen says clearly
 * when that assumption is in force.
 */
function payLineFor(emp, monthKeyStr){
  const s = settings().payroll || {};
  const base = salaryFor(emp, monthKeyStr);
  const payable = payableDaysIn(monthKeyStr);
  const att = attendanceFor(emp.id, monthKeyStr);
  const present = att ? (Number(att.daysWorked) || 0) + (Number(att.daysPaidLeave) || 0) : payable;
  const earned = Math.round(base * Math.min(present, payable) / payable);
  const perHour = base / (payable * (s.hoursPerDay || 8));
  const otHours = att ? (Number(att.otHours) || 0) : 0;
  const ot = Math.round(otHours * perHour * (s.otMultiplier || 1.5));
  const nights = att ? (Number(att.nightShifts) || 0) : 0;
  const night = Math.round(nights * (s.nightShiftAllowance || 0));
  const allowances = (emp.allowances || []).reduce((sum,a)=>sum + (Number(a.amount) || 0), 0);
  const extra = (att && Number(att.bonus)) || 0;
  const deduct = (att && Number(att.deduction)) || 0;
  const net = earned + ot + night + allowances + extra - deduct;
  return {
    employeeId: emp.id, name: emp.name, bucket: emp.payBucket || 'admin',
    base, payableDays: payable, presentDays: present,
    absentDays: Math.max(0, payable - present),
    assumedPresent: !att,
    earned, otHours, ot, nights, night, allowances, extra, deduct,
    net: Math.max(0, net),
  };
}
function payRunFor(monthKeyStr){
  const lines = activeEmployees().map(e=>payLineFor(e, monthKeyStr));
  const byBucket = {};
  lines.forEach(l=>{ byBucket[l.bucket] = (byBucket[l.bucket] || 0) + l.net; });
  return {
    month: monthKeyStr, lines, byBucket,
    total: lines.reduce((s,l)=>s + l.net, 0),
    anyAssumed: lines.some(l=>l.assumedPresent),
    posted: (DB.expenses || []).some(e=>e.payRunMonth === monthKeyStr),
  };
}
/** Writes the month's pay into the cost ledger, one record per bucket so the
 *  P&L shows factory wages inside cost of goods and office salary below it. */
function postPayRun(monthKeyStr, db){
  const d = db || DB;
  d.expenses = d.expenses || [];
  if(d.expenses.some(e=>e.payRunMonth === monthKeyStr)) return 0;
  const run = payRunFor(monthKeyStr);
  if(!run.total) return 0;
  const day = Math.min((settings().payroll || {}).payDay || 7, 28);
  const date = monthKeyStr + '-' + String(day).padStart(2,'0');
  let n = 0;
  Object.entries(run.byBucket).forEach(([bucket, amount])=>{
    if(!amount) return;
    const cat = BUCKET_TO_SALARY_CAT[bucket] || 'EXP-ADMSAL';
    const people = run.lines.filter(l=>l.bucket === bucket).length;
    d.expenses.push({
      id: uid('EXP'), date, category: cat,
      description: 'Salary — ' + people + ' ' + (people === 1 ? 'person' : 'people'),
      amount: Math.round(amount), gstRate: 0, gstAmount: 0, itcEligible: false,
      bucket, recurring: true, payRunMonth: monthKeyStr,
      paidOn: date, paymentMode: 'NEFT / RTGS',
    });
    n++;
  });
  return n;
}
function postAllPayRuns(db){
  const d = db || DB;
  const emps = (d.employees || []).filter(e=>e.salaryMonthly > 0);
  if(!emps.length) return 0;
  const earliest = emps.reduce((a,e)=>(!a || String(e.salaryFrom) < a) ? String(e.salaryFrom) : a, null);
  const T = todayISO();
  let total = 0, k = String(earliest || T).slice(0,7), guard = 0;
  while(k <= T.slice(0,7) && guard++ < 400){
    total += postPayRun(k, d);
    k = nextMonthKey(k);
  }
  return total;
}

/* ---------- 4. THE ATTENDANCE FILE -------------------------------------
   Every biometric machine sold in India — eSSL, ZKTeco, Realtime, Matrix —
   exports a spreadsheet. Reading that file works with all of them, takes ten
   seconds a month, and cannot break when the office router changes. Talking to
   the device directly would need its SDK, a fixed IP and an on-site network,
   and would break constantly. Same answer, a fraction of the fragility.

   Column names differ between machines, so we look for what they mean rather
   than insisting on an exact heading.
*/
const ATT_COLUMN_HINTS = {
  code:    ['employee code','emp code','empcode','code','employee id','emp id','id','staff id'],
  name:    ['employee name','emp name','name','employee'],
  present: ['present','days present','present days','p','working days','days worked','payable days'],
  leave:   ['paid leave','leave','pl','cl','leaves'],
  absent:  ['absent','days absent','a','lop','loss of pay'],
  ot:      ['ot','ot hours','overtime','overtime hours','extra hours'],
  night:   ['night','night shift','night shifts','ns','night duty'],
};
function matchColumn(header){
  const h = String(header || '').trim().toLowerCase();
  for(const [key, hints] of Object.entries(ATT_COLUMN_HINTS)){
    if(hints.some(x=>h === x)) return key;
  }
  for(const [key, hints] of Object.entries(ATT_COLUMN_HINTS)){
    if(hints.some(x=>h.indexOf(x) >= 0)) return key;
  }
  return null;
}
function parseDelimited(text){
  const clean = String(text).replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
  const firstLine = clean.split('\n')[0] || '';
  // Tab, semicolon and comma are all used by different export tools.
  const delim = firstLine.indexOf('\t') >= 0 ? '\t'
              : (firstLine.split(';').length > firstLine.split(',').length ? ';' : ',');
  return clean.split('\n').filter(l=>l.trim()).map(line=>{
    const out = []; let cur = '', inQ = false;
    for(let i = 0; i < line.length; i++){
      const ch = line[i];
      if(ch === '"'){ if(inQ && line[i+1] === '"'){ cur += '"'; i++; } else inQ = !inQ; }
      else if(ch === delim && !inQ){ out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out.map(c=>c.trim());
  });
}
/** Turns whatever the machine exported into rows we can show for confirmation. */
function readAttendanceFile(text, monthKeyStr){
  const rows = parseDelimited(text);
  if(rows.length < 2) return { error:'That file has no rows in it.' };
  // The header is the first row that maps to at least two known columns.
  let headerRow = 0, map = null;
  for(let i = 0; i < Math.min(rows.length, 8); i++){
    const m = rows[i].map(matchColumn);
    if(m.filter(Boolean).length >= 2){ headerRow = i; map = m; break; }
  }
  if(!map) return { error:'Could not recognise the columns. The file needs a header row naming at least the employee and days present.' };

  const out = [], unmatched = [];
  for(let i = headerRow + 1; i < rows.length; i++){
    const r = rows[i];
    if(!r.join('').trim()) continue;
    const rec = {};
    map.forEach((k, idx)=>{ if(k) rec[k] = r[idx]; });
    if(!rec.code && !rec.name) continue;
    // Match on employee code first, then on name, forgivingly.
    const emp = DB.employees.find(e=>
      (rec.code && (e.employeeCode || '').toLowerCase() === String(rec.code).toLowerCase()) ||
      (rec.code && e.id.toLowerCase() === String(rec.code).toLowerCase()) ||
      (rec.name && e.name.toLowerCase().replace(/\s*\(.*\)/,'') === String(rec.name).toLowerCase().trim())
    );
    const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g,'')); return isFinite(n) ? n : 0; };
    const row = {
      code: rec.code || '', name: rec.name || '',
      daysWorked: num(rec.present), daysPaidLeave: num(rec.leave),
      daysAbsent: num(rec.absent), otHours: num(rec.ot), nightShifts: num(rec.night),
      employeeId: emp ? emp.id : null, matchedTo: emp ? emp.name : null,
    };
    if(!emp) unmatched.push(row.name || row.code);
    out.push(row);
  }
  return { rows: out, unmatched, month: monthKeyStr, columns: map.filter(Boolean) };
}
function applyAttendance(rows, monthKeyStr){
  DB.attendance = DB.attendance || [];
  let n = 0;
  rows.forEach(r=>{
    if(!r.employeeId) return;
    const existing = DB.attendance.find(a=>a.employeeId === r.employeeId && a.month === monthKeyStr);
    const rec = {
      id: existing ? existing.id : uid('ATT'),
      employeeId: r.employeeId, month: monthKeyStr,
      daysWorked: r.daysWorked, daysPaidLeave: r.daysPaidLeave, daysAbsent: r.daysAbsent,
      otHours: r.otHours, nightShifts: r.nightShifts,
      bonus: existing ? existing.bonus : 0, deduction: existing ? existing.deduction : 0,
      source: 'imported', importedOn: todayISO(),
    };
    if(existing) Object.assign(existing, rec);
    else DB.attendance.push(rec);
    n++;
  });
  return n;
}

// Reports duplicated, and every alert already surfaces as a task in Action Center (recomputeAlertsAndTasks
// generates both from the same source), so a separate flat Alerts list was a second copy of the same list.

function flatRoutes(){
  const out=[];
  NAV.forEach(n=>{ if(n.sub) n.sub.forEach(s=>out.push({key:n.id+'/'+s.id, render:s.render, top:n.id})); else out.push({key:n.id, render:n.render, top:n.id}); });
  return out;
}
function currentRouteKey(){ return (location.hash||'#dashboard').slice(1); }
function navTo(key){ location.hash='#'+key; }
function setRole(role){
  CURRENT_ROLE=role;
  _salesView = defaultSalesView();
  const m=document.getElementById('quickMenu'); if(m) m.remove();
  renderNav(); route();
}

function renderNav(){
  const root=document.getElementById('navroot');
  const rk=currentRouteKey();
  const activeTop = rk.indexOf('__customer:')===0 ? 'customers' : rk.split('/')[0];
  let h='';
  NAV.forEach(n=>{
    if(!n.roles.includes(CURRENT_ROLE)) return;
    // v1.6 — anything switched off disappears entirely rather than sitting
    // there greyed out, which is just clutter with an explanation attached.
    if(n.module && !moduleOn(n.module)) return;
    if(n.sub){
      h+='<div class="navgroup">'+icon(n.icon,13)+'<span>'+esc(n.label)+'</span></div>';
      n.sub.forEach(s=>{
        const key=n.id+'/'+s.id;
        h+='<div class="navsub'+(rk===key?' active':'')+'" data-act="navTo" data-args="'+esc(JSON.stringify([(key)]))+'">'+icon(s.icon,14)+esc(s.label)+'</div>';
      });
    } else {
      h+='<div class="navitem'+(activeTop===n.id?' active':'')+'" data-act="navTo" data-args="'+esc(JSON.stringify([(n.id)]))+'">'+icon(n.icon,17)+'<span>'+esc(n.label)+'</span></div>';
    }
  });
  root.innerHTML=h;
  const picker=document.getElementById('workspacePicker');
  if(picker) picker.innerHTML=renderWorkspacePicker(false);
  const sel=document.getElementById('roleSelect');
  sel.innerHTML = ['owner','sales','service','stores','production'].map(r=>'<option value="'+r+'"'+(r===CURRENT_ROLE?' selected':'')+'>'+r[0].toUpperCase()+r.slice(1)+' view</option>').join('');
  const avatar=document.querySelector('#topbar .avatar');

    const person=(DB.employees||[]).find(e=>e.role===CURRENT_ROLE);

    avatar.textContent=displayName.charAt(0).toUpperCase();
    avatar.title=displayName+' — '+CURRENT_ROLE[0].toUpperCase()+CURRENT_ROLE.slice(1)+' view';
  }

// Page-level tab buttons (Stores/Purchases/Finished Goods, Invoices/Repeat Sales/Warranty/Service
// Follow-ups) render into the topbar's middle space instead of a row inside the page — same information,
// zero extra vertical space taken from the content area.

  } else if(top==='sales'){
    // Quotations sits first because it is where a sale actually starts, and
