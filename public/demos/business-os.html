/* ---- 7.4 PRODUCTION STOCK ---- */
// One row per product — every product Business OS sells gets exactly one line, with Semi-Finished and Finished counts
// side by side (instead of the same product appearing twice under two different stage rows). Only 2 real states:
// Finished Goods (sellable/dispatch-ready — some may be reserved for a specific order) and Semi-Finished Goods
// (still in the production process). "Available" = Finished minus whatever's already reserved — the number you can
// actually promise to a new customer today.
function prodStockRow(productId){
  return DB.productionStock.find(p=>p.productId===productId) || {id:'', productId, semiQty:0, qcPending:0, finishedQty:0, reservedQty:0, reservedNote:''};
}
function renderProductionStock(){
  const rows = DB.products.map(p=>({p, s:prodStockRow(p.id)}));
  const finishedUnits = rows.reduce((s,r)=>s+(r.s.finishedQty||0),0);
  const semiUnits = rows.reduce((s,r)=>s+(r.s.semiQty||0),0);
  const qcPendingUnits = rows.reduce((s,r)=>s+(r.s.qcPending||0),0);
  const availableUnits = rows.reduce((s,r)=>s+Math.max(0,(r.s.finishedQty||0)-(r.s.reservedQty||0)),0);
  let h='<div class="section-title">Finished Goods <span class="hint">Finished-goods inventory — kept separate from raw-material Stores</span></div>';
  h+='<div class="grid g4" style="margin-bottom:16px;">'+
    '<div class="kpi"><div class="label">Finished Goods</div><div class="val">'+finishedUnits+'</div><div class="sub">units produced, all conditions</div></div>'+
    '<div class="kpi"><div class="label">Semi-Finished Goods</div><div class="val">'+semiUnits+'</div><div class="sub">units still in production</div></div>'+
    '<div class="kpi"><div class="label">QC Pending</div><div class="val" style="color:'+(qcPendingUnits>0?'var(--amber)':'var(--green)')+'">'+qcPendingUnits+'</div><div class="sub">of the semi-finished units, awaiting check</div></div>'+
    '<div class="kpi"><div class="label">Available Now</div><div class="val" style="color:var(--green)">'+availableUnits+'</div><div class="sub">finished, unreserved — sellable today</div></div></div>';
  h+='<div class="tablewrap grid-lines">'+renderTable('pstbl',[
    {key:'product',label:'Product',sort:false,render:r=>{ const cat=r.p.category; return '<b>'+esc(r.p.name)+'</b><div class="small muted">'+esc(cat)+'</div>'; }},
    {key:'semi',label:'Semi-Finished',kind:'num',sortVal:r=>r.s.semiQty||0,render:r=>(r.s.semiQty||0)},
    {key:'qcPending',label:'QC Pending',kind:'num',sortVal:r=>r.s.qcPending||0,render:r=>(r.s.qcPending||0)>0?pill(r.s.qcPending,'amber'):'<span class="small muted">0</span>'},
    {key:'finished',label:'Finished',kind:'num',sortVal:r=>r.s.finishedQty||0,render:r=>(r.s.finishedQty||0)},
    {key:'reserved',label:'Reserved',kind:'num',sortVal:r=>r.s.reservedQty||0,
      render:r=>{ const rq=r.s.reservedQty||0; if(rq<=0) return '—'; const note=r.s.reservedNote?' title="'+esc(r.s.reservedNote)+'"':''; return '<span class="pill pill-amber"'+note+'>'+rq+'</span>'; }},
    {key:'available',label:'Available Now',kind:'num',sortVal:r=>Math.max(0,(r.s.finishedQty||0)-(r.s.reservedQty||0)),
      render:r=>{ const av=Math.max(0,(r.s.finishedQty||0)-(r.s.reservedQty||0)); return av>0?pill(av,'green'):'<span class="small muted">0</span>'; }},
    {key:'action',label:'',sort:false,render:r=>{
      const hasBom=!!BOM_TEMPLATES[r.p.id];
      let btns='';
      if(hasBom) btns+='<button class="btn sm primary" onclick="openBuildProduction(\''+r.p.id+'\')">Build</button> ';
      if((r.s.qcPending||0)>0) btns+='<button class="btn sm" onclick="openQCCheck(\''+r.p.id+'\')">QC</button> ';
      btns+='<button class="btn sm ghost" onclick="openEditProductionStock(\''+r.p.id+'\')">Adjust</button>';
      return btns;
    }},
  ], rows, {defaultSort:'finished'})+'</div>';
  window._lastTableRenderFn['pstbl']=()=>{ document.getElementById('content').innerHTML=renderStoresPurchases(); };
  return h;

// ---- Start Production: consumes real BOM materials from Stores, moves them into Semi-Finished + QC Pending.
// This is what makes the numbers on this page trustworthy instead of a manually-typed guess.
function openBuildProduction(productId){
  const p=byId(DB.products,productId); if(!p) return;
  const bom=BOM_TEMPLATES[productId];
  if(!bom){ toast(p.name+' is a distributed/resale item — no BOM to build from. Use Adjust to correct stock manually.'); return; }
  openModal('Start Production — '+p.name,''+
    '<div class="small muted" style="margin-bottom:12px;">Builds new units from raw materials in Stores. Material required is calculated live from the BOM (incl. waste %) and checked against current stock before you can confirm.</div>'+
    '<div class="formrow"><div><label>Units to build</label><input id="bp_qty" type="number" min="1" value="1" oninput="refreshBuildPreview(\''+productId+'\')"/></div></div>'+
    '<div id="bp_preview" style="margin-top:10px;"></div>',
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="bp_confirm" onclick="confirmBuildProduction(\''+productId+'\')">Start Production</button>');
  refreshBuildPreview(productId);
}
function buildRequirements(productId, qty){
  const bom=BOM_TEMPLATES[productId];
  return bom.map(b=>{
    const m=byId(DB.materials,b.materialId);
    const wastePct=parseFloat(b.waste)||0;
    const required=Math.ceil(b.qty*qty*(1+wastePct/100)*1000)/1000;
    return {b, m, required};
  });
}
function refreshBuildPreview(productId){
  const qty=Math.max(1, num('bp_qty')||1);
  const lines=buildRequirements(productId, qty);
  let short=false;
  let h='<table><thead><tr><th class="nosort">Material</th><th class="nosort">Required</th><th class="nosort">In Stock</th><th class="nosort">Status</th></tr></thead><tbody>';
  lines.forEach(l=>{
    const ok = l.m && l.m.qty>=l.required;
    if(!ok) short=true;
    h+='<tr><td>'+esc(l.m?l.m.name:l.b.materialId)+'</td><td>'+l.required+' '+(l.m?l.m.unit:'')+'</td><td>'+(l.m?l.m.qty:'—')+' '+(l.m?l.m.unit:'')+'</td><td>'+(ok?pill('OK','green'):pill('Short','red'))+'</td></tr>';
  });
  h+='</tbody></table>';
  if(short) h+='<div class="small" style="color:var(--red);margin-top:8px;">Not enough stock for one or more materials — reduce the build quantity or top up Stores first.</div>';
  const pv=document.getElementById('bp_preview'); if(pv) pv.innerHTML=h;
  const btn=document.getElementById('bp_confirm'); if(btn) btn.disabled=short;
}
function confirmBuildProduction(productId){
  const qty=Math.max(1, num('bp_qty')||1);
  const lines=buildRequirements(productId, qty);
  if(lines.some(l=>!l.m || l.m.qty<l.required)){ toast('Not enough material stock to build this quantity'); return; }
  lines.forEach(l=>{
    const before=l.m.qty;
    l.m.qty=Math.max(0, l.m.qty-l.required);
    DB.consumptionLogs.push({id:uid('CLOG'),date:todayISO(),materialId:l.m.id,received:0,used:l.required,damaged:0,openingQty:before,closingQty:l.m.qty});
  });
  let row=DB.productionStock.find(r=>r.productId===productId);
  if(!row){ row={id:'PS-'+productId,productId,semiQty:0,qcPending:0,finishedQty:0,reservedQty:0,reservedNote:''}; DB.productionStock.push(row); }
  row.semiQty=(row.semiQty||0)+qty;
  row.qcPending=(row.qcPending||0)+qty;
  recomputeAlertsAndTasks(DB); save(); closeModal();
  toast(qty+' unit(s) started — materials consumed from Stores, now awaiting QC');
  document.getElementById('content').innerHTML=renderStoresPurchases();
}
// ---- QC Check: the only way units move from Semi-Finished/QC-Pending into sellable Finished stock.
function openQCCheck(productId){
  const p=byId(DB.products,productId); if(!p) return;
  const s=prodStockRow(productId);
  if((s.qcPending||0)<=0){ toast('No units awaiting QC for '+p.name); return; }
  openModal('QC Check — '+p.name,''+
    '<div class="small muted" style="margin-bottom:12px;">'+s.qcPending+' unit(s) awaiting QC. Units that pass move to Finished stock (sellable). Rejected units leave the production pipeline — scrap or manual rework tracked outside this system.</div>'+
    '<div class="formrow"><div><label>Pass QC (moves to Finished)</label><input id="qc_pass" type="number" min="0" max="'+s.qcPending+'" value="0"/></div>'+
    '<div><label>Reject (rework/scrap)</label><input id="qc_reject" type="number" min="0" max="'+s.qcPending+'" value="0"/></div></div>',
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmQCCheck(\''+productId+'\')">Save QC Result</button>');
}
function confirmQCCheck(productId){
  const s=DB.productionStock.find(r=>r.productId===productId); if(!s){ toast('No production record for this product'); return; }
  const pass=Math.max(0,num('qc_pass')), reject=Math.max(0,num('qc_reject'));
  if(pass+reject===0){ toast('Enter at least one Pass or Reject quantity'); return; }
  if(pass+reject>s.qcPending){ toast('Pass + Reject can\'t exceed units awaiting QC ('+s.qcPending+')'); return; }
  s.qcPending -= (pass+reject);
  s.semiQty = Math.max(0, (s.semiQty||0)-(pass+reject));
  s.finishedQty = (s.finishedQty||0)+pass;
  recomputeAlertsAndTasks(DB); save(); closeModal();
  toast(pass+' unit(s) passed QC → Finished'+(reject?', '+reject+' rejected':''));
  document.getElementById('content').innerHTML=renderStoresPurchases();
}
function openEditProductionStock(productId){

function saveProductionStock(productId){
  const semiQty=Math.max(0,num('ps_semi')), finishedQty=Math.max(0,num('ps_finished'));
  const qcPending=Math.max(0,num('ps_qcpending'));
  let reservedQty=Math.max(0,num('ps_reserved'));
  if(qcPending>semiQty){ toast('QC Pending can\'t exceed Semi-Finished Qty ('+semiQty+')'); return; }
  if(reservedQty>finishedQty){ toast('Reserved can\'t exceed Finished Qty'); return; }
  const note=val('ps_note');
  let row=DB.productionStock.find(r=>r.productId===productId);
  if(row){ Object.assign(row,{semiQty,qcPending,finishedQty,reservedQty,reservedNote:note}); }
  else { DB.productionStock.push({id:'PS-'+productId,productId,semiQty,qcPending,finishedQty,reservedQty,reservedNote:note}); }
  save(); closeModal(); toast('Production stock updated');
  document.getElementById('content').innerHTML=renderStoresPurchases();
}

// A supplier's categories aren't a separate field to maintain — they're derived straight from what they actually

let _supplierCatFilter='All';
function supplierCategories(s){
  const cats=new Set();
  (s.materials||[]).forEach(mid=>{ const m=byId(DB.materials,mid); if(m) cats.add(m.category); });
  return [...cats];
}
function renderSuppliers(){
  const cats=['All',...new Set(DB.materials.map(m=>m.category))];

    {key:'pendingRfq',label:'Pending RFQs',kind:'num',sort:false,render:s=>DB.rfqs.filter(r=>r.supplierId===s.id&&['draft','sent','quoted'].includes(r.status)).length},

function rfqActionButtons(r){
  if(r.status==='draft') return '<button class="btn sm primary" onclick="doSendRfq(\''+r.id+'\')">Mark Sent</button>';
  if(r.status==='sent') return '<button class="btn sm" onclick="openRecordQuotation(\''+r.id+'\')">Record Quotation</button>';
  if(r.status==='quoted') return '<button class="btn sm gold" onclick="doConvertRfq(\''+r.id+'\')">Convert to Purchase</button>';
  if(r.status==='converted') return '<span class="small muted">Purchase '+(byId(DB.purchases,r.purchaseId)?byId(DB.purchases,r.purchaseId).invoiceNo:'')+'</span>';

function saveQuotation(rfqId){

function submitMultiRfq(supId){
  const lines=[];
  document.querySelectorAll('.mm-chk:checked').forEach(cb=>{ const idx=cb.dataset.idx; const qty=Number(document.querySelector('.mm-qty[data-idx="'+idx+'"]').value)||0; if(qty<=0) return;
    const rate=Number(document.querySelector('.mm-rate[data-idx="'+idx+'"]').value)||0; lines.push({materialId:_rfqLines[idx].materialId,qty,unit:_rfqLines[idx].unit,estRate:rate}); });
  if(!lines.length){ toast('Select at least one material with quantity'); return; }
  _pendingRfqReturnTo=supId;
  openRfqPreview([{supplierId:supId, lines}]);
}

/* ---- Manufacturing cost & margin: turns the BOM from a parts list into what it actually costs to build one unit,
   live off current material rates — and, using each material's own price history, what it WOULD have cost at any
   point in the past, so cost drift and margin can be tracked over time the same way Cost Trend does for materials. ---- */
function productBomCost(productId){
  const bom=BOM_TEMPLATES[productId];
  if(!bom) return null;
  let total=0;
  const lines=bom.map(b=>{
    const m=byId(DB.materials,b.materialId);
    const cost=m? b.qty*m.lastRate : 0;
    total+=cost;
    return {material:m, qty:b.qty, waste:b.waste, rate:m?m.lastRate:0, cost};
  });
  lines.sort((a,b)=>b.cost-a.cost); // biggest cost contributors first — where the money actually goes
  return {total, lines};
}
function materialRateAsOf(mat, dateISO){
  const hist=(mat.priceHistory||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(!hist.length) return mat.lastRate||0;
  let rate=hist[0].rate; // before any known purchase, treat cost as level with the earliest known price
  for(const h of hist){ if(h.date<=dateISO) rate=h.rate; else break; }
  return rate;
}
function productCostMarginHistory(productId){
  const bom=BOM_TEMPLATES[productId];
  const p=byId(DB.products,productId);
  const T=todayISO();
  const monthKeys=[]; for(let i=5;i>=0;i--) monthKeys.push(monthKey(T,-i));
  const costSeries = bom ? monthKeys.map(k=>{
    const asOf=k+'-28';
    const total=bom.reduce((s,b)=>{ const m=byId(DB.materials,b.materialId); return s+(m? b.qty*materialRateAsOf(m,asOf) : 0); },0);
    return {label:monthLabel(k), value:Math.round(total)};
  }) : null;
  let lastKnown=null;
  const priceSeries=monthKeys.map(k=>{
    const ratesThisMonth=[];
    DB.salesInvoices.forEach(inv=>{ if(inv.date.slice(0,7)===k){ inv.lines.forEach(l=>{ if(l.type==='equipment'&&l.productId===productId) ratesThisMonth.push(l.rate); }); } });
    let val;
    if(ratesThisMonth.length){ val=Math.round(ratesThisMonth.reduce((a,b)=>a+b,0)/ratesThisMonth.length); lastKnown=val; }
    else if(lastKnown!=null){ val=lastKnown; }
    else { val=p.price; }
    return {label:monthLabel(k), value:val};
  });
  return {costSeries, priceSeries};
}

      render:p=>{ const c=productBomCost(p.id); if(!c) return '<span class="small muted">—</span>'; const pct=Math.round(((p.price-c.total)/p.price)*1000)/10; return pill(pct+'%', pct>=35?'green':(pct>=15?'amber':'red')); }},

    h+=svgMultiLineChart([

    ], {fmt:v=>fmtMoney(v)});
    h+='<div class="small muted" style="margin-top:8px;">Manufacturing cost is rebuilt from each material\'s own price history at the time — so this tracks how input costs actually moved, not just today\'s snapshot.</div>';

    h+='<div class="hr"></div><b class="small">Bill of Materials</b><span class="hint" style="font-size:11.5px;color:var(--ink-500);margin-left:8px;">sorted by cost contribution — biggest drivers first</span>';
    h+='<table><thead><tr><th class="nosort">Material</th><th class="nosort">Qty Required</th><th class="nosort">Wastage</th><th class="nosort">Unit Rate</th><th class="nosort">Line Cost</th><th class="nosort">Available Stock</th><th class="nosort">Shortage</th></tr></thead><tbody>';
    costInfo.lines.forEach(b=>{ const m=b.material; if(!m) return; const shortage=Math.max(0,b.qty-m.qty);
      h+='<tr><td>'+esc(m.name)+'</td><td>'+b.qty+' '+m.unit+'</td><td>'+b.waste+'</td><td>'+fmtMoney(b.rate)+'</td><td><b>'+fmtMoney(b.cost)+'</b></td><td>'+m.qty+' '+m.unit+'</td><td>'+(shortage>0?pill(shortage+' '+m.unit,'red'):pill('OK','green'))+'</td></tr>'; });
    h+='</tbody></table>';
  } else {
    h+='<div class="hr"></div><div class="small muted">No BOM configured — this product is distributed / resold rather than manufactured in-house.</div>';
  }
  openModal('Product — '+p.name, h, '<button class="btn" onclick="closeModal()">Close</button>', true);
}

}
function warrantyReminderMessage(customer, product, serial, warr){
  return 'Dear '+customer.name+', your '+(product?product.name:'equipment')+(serial?' (Serial: '+serial.serial+')':'')+' warranty ends on '+fmtDate(warr.expiryDate)+'. Repairs and calibration visits become chargeable after that date. Let us know if you would like a check-up done before it lapses.';
}
function consumablesReorderMessage(customer, material){
  return 'Dear '+customer.name+', based on your usage pattern, your '+(material?material.name:'consumable stock')+' is likely running low. Would you like us to arrange the next batch?';
}
function dueFeedbackList(){
  return DB.serviceJobs.filter(j=>j.status==='Closed' && j.completionDate && daysBetween(j.completionDate,todayISO())>=0 && daysBetween(j.completionDate,todayISO())<=30 && !afterSaleAlreadySent('Feedback Request', j.id))
    .map(j=>{ const s=byId(DB.equipmentSerials,j.serialId); const c=byId(DB.customers,j.customerId); const p=s?byId(DB.products,s.productId):null;
      return {refId:j.id, customer:c, detail:(p?p.name:'Equipment')+' — Job '+j.jobNo, when:'Closed '+daysBetween(j.completionDate,todayISO())+'d ago', build:()=>feedbackMessage(c,j,p)}; })
    .filter(x=>x.customer);
}
function dueInstallationList(){
  return DB.equipmentSerials.filter(s=>daysBetween(s.saleDate,todayISO())>=0 && daysBetween(s.saleDate,todayISO())<=14 && !afterSaleAlreadySent('Installation Follow-up', s.id))
    .map(s=>{ const c=byId(DB.customers,s.customerId); const p=byId(DB.products,s.productId);
      return {refId:s.id, customer:c, detail:(p?p.name:'Equipment')+' ('+s.serial+')', when:'Sold '+daysBetween(s.saleDate,todayISO())+'d ago', build:()=>installationFollowupMessage(c,p,s)}; })
    .filter(x=>x.customer);
}
function dueWarrantyList(){
  return DB.warrantyRecords.filter(w=>w.status==='Active' && daysBetween(todayISO(),w.expiryDate)>=0 && daysBetween(todayISO(),w.expiryDate)<=30 && !afterSaleAlreadySent('Warranty Reminder', w.serialId))
    .map(w=>{ const s=byId(DB.equipmentSerials,w.serialId); const c=s?byId(DB.customers,s.customerId):null; const p=s?byId(DB.products,s.productId):null;
      return {refId:w.serialId, customer:c, detail:(p?p.name:'Equipment')+(s?' ('+s.serial+')':''), when:'Expires in '+daysBetween(todayISO(),w.expiryDate)+'d', build:()=>warrantyReminderMessage(c,p,s,w)}; })
    .filter(x=>x.customer);
}
function dueConsumablesList(){
  return DB.repeatOpportunities.filter(o=>o.status==='Open' && ['Overdue','Due This Week','Due This Month'].includes(repeatOppUrgency(o)) && !afterSaleAlreadySent('Consumables Reorder', o.id))
    .map(o=>{ const c=byId(DB.customers,o.customerId); const m=byId(DB.materials,o.materialId);
      return {refId:o.id, customer:c, detail:(m?m.name:'Consumable'), when:repeatOppUrgency(o), build:()=>consumablesReorderMessage(c,m)}; })
    .filter(x=>x.customer);
}
function asaleDueList(k){
  if(k==='Feedback') return dueFeedbackList();
  if(k==='Installation') return dueInstallationList();
  if(k==='Warranty') return dueWarrantyList();
  if(k==='Consumables') return dueConsumablesList();
  return [];
}
function sendAfterSale(k, refId){
  const meta=asaleTypeMeta(k); const item=asaleDueList(k).find(x=>x.refId===refId); if(!item) return;
  DB.communications.push({id:uid('COM'), entityType:'customer', entityId:item.customer.id, type:meta.commType, refId, date:todayISO(), channel:REMINDER_CHANNELS.join(' + '), summary:item.build()});
  save(); toast('Sent to '+item.customer.name); document.getElementById('content').innerHTML=renderEngagement();
}
function bulkSendAfterSale(k){
  const meta=asaleTypeMeta(k); const items=asaleDueList(k);
  items.forEach(item=>DB.communications.push({id:uid('COM'), entityType:'customer', entityId:item.customer.id, type:meta.commType, refId:item.refId, date:todayISO(), channel:REMINDER_CHANNELS.join(' + '), summary:item.build()}));
  save(); toast('Sent to '+items.length+' customer'+(items.length===1?'':'s')); document.getElementById('content').innerHTML=renderEngagement();
}
function openAfterSaleSentMessage(k, refId){
  const meta=asaleTypeMeta(k);
  const cm=DB.communications.find(c=>c.type===meta.commType && c.refId===refId);
  if(!cm){ toast('No message on record'); return; }
  const c=byId(DB.customers,cm.entityId);
  openModal('Message Sent — '+(c?c.name:''), ''+
    '<div class="small muted" style="margin-bottom:8px;">Sent '+fmtDate(cm.date)+' via '+esc(cm.channel)+'</div>'+
    '<div class="card" style="white-space:pre-wrap;">'+esc(cm.summary)+'</div>',
    '<button class="btn" onclick="closeModal()">Close</button>');
}
// Preview before send, on every After-Sale row — shows exactly what will go out (already customer/product-
// specific, built the same way as the reminder message) before it actually gets sent.
function openAfterSalePreview(k, refId){
  const item=asaleDueList(k).find(x=>x.refId===refId); if(!item) return;
  openModal('Message Preview — '+item.customer.name, ''+
    '<div class="small muted" style="margin-bottom:8px;">This is exactly what will be sent, via WhatsApp + Email, when you click Send.</div>'+
    '<div class="card" style="white-space:pre-wrap;">'+esc(item.build())+'</div>',
    '<button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();sendAfterSale(\''+k+'\',\''+refId+'\')">Send Now</button>');
}
function renderAfterSaleMessages(){
  let h='<div class="section-title">After-Sale Messages <span class="hint">Auto-detected from real activity — closed jobs, new installs, warranty windows, predicted consumable reorders. Nothing here is planned by hand.</span></div>';
  h+='<div class="filterbar" style="margin-top:10px;">'+ASALE_TYPES.map(t=>{
    const cnt = t.key==='Calibration' ? '' : ' ('+asaleDueList(t.key).length+')';
    return '<div class="subtab'+(t.key===_asaleCat?' active':'')+'" onclick="setAsaleCat(\''+t.key+'\')">'+esc(t.label)+cnt+'</div>';
  }).join('')+'</div>';

  if(_asaleCat==='Calibration'){
    h+='<div class="card" style="margin-top:14px;"><div style="font-weight:600;margin-bottom:6px;">Calibration reminders live in Service</div>'+
      '<div class="small muted" style="margin-bottom:12px;">Service 1 / Service 2 due dates, contact status, and outreach are already tracked there in full — not duplicated here.</div>'+
      '<button class="btn primary" onclick="gotoServiceFollowups()">Open Service Follow-ups</button></div>';
    return h;
  }

  const items=asaleDueList(_asaleCat);
  const meta=asaleTypeMeta(_asaleCat);
  h+='<div class="toolbar" style="margin-top:14px;"><div class="small muted" style="font-weight:600;">'+items.length+' pending</div>'+
    '<div class="toolbar-actions"><button class="btn primary" onclick="bulkSendAfterSale(\''+_asaleCat+'\')"'+(items.length?'':' disabled')+'>Message all pending</button></div></div>';
  h+='<div class="tablewrap" style="margin-top:10px;"><table><thead><tr><th class="nosort">Customer</th><th class="nosort">Detail</th><th class="nosort">Trigger</th><th class="nosort">Action</th></tr></thead><tbody>';
  if(!items.length) h+='<tr><td colspan="4"><div class="empty">Nothing pending in this category right now</div></td></tr>';
  items.forEach(x=>{
    h+='<tr><td><a class="link" onclick="navTo(\'__customer:'+x.customer.id+'\')">'+esc(x.customer.name)+'</a></td><td>'+esc(x.detail)+'</td><td>'+esc(x.when)+'</td>'+
      '<td><a class="link small" style="margin-right:10px;" onclick="openAfterSalePreview(\''+_asaleCat+'\',\''+x.refId+'\')">Preview</a><button class="btn sm primary" onclick="sendAfterSale(\''+_asaleCat+'\',\''+x.refId+'\')">Send</button></td></tr>';
  });
  h+='</tbody></table></div>';

  const sentComms=DB.communications.filter(cm=>cm.type===meta.commType).sort((a,b)=>a.date<b.date?1:-1).slice(0,20);
  if(sentComms.length){
    h+='<div class="section-title" style="margin-top:20px;font-size:14px;">Recently Sent</div><div class="tablewrap"><table><thead><tr><th class="nosort">Customer</th><th class="nosort">Sent</th><th class="nosort">Message</th></tr></thead><tbody>';
    sentComms.forEach(cm=>{ const c=byId(DB.customers,cm.entityId);
      h+='<tr><td>'+esc(c?c.name:'')+'</td><td>'+fmtDate(cm.date)+'</td><td><a class="link small" onclick="openAfterSaleSentMessage(\''+_asaleCat+'\',\''+cm.refId+'\')">View Message</a></td></tr>'; });
    h+='</tbody></table></div>';
  }
  return h;
}

// New Product Updates — always a broadcast to the FULL customer list, never a specific-customer pick, and
// always WhatsApp + Email together. There's no audience or channel choice to make (that was the bug — treating
// a company-wide announcement like a one-to-one message). One update = one message = the entire customer list,
// once, tracked and locked the same way Festival Greetings is.
function defaultProductUpdateMessage(title){
  return 'Hi, quick update from Business OS — '+title+'. Reach out if you would like more details.';
}
function productUpdateSentCount(id){ return DB.communications.filter(cm=>cm.type==='New Product Update' && cm.updateId===id).length; }
function openNewProductUpdateForm(){
  openModal('New Product Update', ''+
    '<div class="formrow full"><div><label>Title</label><input id="pu_title" placeholder="e.g. New Fluorescent Magnetic Particles batch in stock"/></div></div>'+
    '<div class="formrow full"><div><label>Message</label><textarea id="pu_msg" placeholder="What should customers know?"></textarea></div></div>'+
    '<div class="small muted">Goes to every customer, via WhatsApp + Email, as soon as you send it — no audience or channel to pick.</div>',
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveNewProductUpdate()">Save</button>');
}
function saveNewProductUpdate(){
  const title=val('pu_title').trim(); if(!title){ toast('Title required'); return; }
  let msg=val('pu_msg').trim(); if(!msg) msg=defaultProductUpdateMessage(title);
  DB.productUpdates.push({id:uid('PUP'), title, message:msg, createdDate:todayISO()});
  save(); closeModal(); toast('Product update saved'); document.getElementById('content').innerHTML=renderEngagement();
}
function openEditProductUpdateMessage(id){
  const u=byId(DB.productUpdates,id); if(!u) return;
  const locked=productUpdateSentCount(id)>0;
  openModal((locked?'Message — ':'Edit Message — ')+u.title, ''+
    (locked
      ? '<div class="small muted" style="margin-bottom:8px;">Already sent — locked so the record matches what actually went out.</div><div class="card" style="white-space:pre-wrap;">'+esc(u.message)+'</div>'
      : '<div class="formrow full"><div><label>Message</label><textarea id="pu_edit_msg">'+esc(u.message)+'</textarea></div></div>'),
    locked ? '<button class="btn" onclick="closeModal()">Close</button>' : '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveEditedProductUpdateMessage(\''+id+'\')">Save</button>');
}
function saveEditedProductUpdateMessage(id){
  const u=byId(DB.productUpdates,id); if(!u) return;
  u.message=val('pu_edit_msg'); save(); closeModal(); toast('Message updated'); document.getElementById('content').innerHTML=renderEngagement();
}
function sendProductUpdate(id){
  const u=byId(DB.productUpdates,id); if(!u) return;
  if(productUpdateSentCount(id)>0){ toast('Already sent'); return; }
  if(!DB.customers.length){ toast('No customers on file'); return; }
  DB.customers.forEach(c=>{
    DB.communications.push({id:uid('COM'), entityType:'customer', entityId:c.id, type:'New Product Update', updateId:id, date:todayISO(), channel:REMINDER_CHANNELS.join(' + '), summary:u.message});
  });
  save(); toast('Sent to '+DB.customers.length+' customers'); document.getElementById('content').innerHTML=renderEngagement();
}
function openProductUpdateDetail(id){
  const u=byId(DB.productUpdates,id); if(!u) return;
  const comms=DB.communications.filter(cm=>cm.type==='New Product Update' && cm.updateId===id).sort((a,b)=>a.date<b.date?-1:1);
  let h='<div class="small muted" style="margin-bottom:8px;">'+comms.length+' customer(s) messaged via '+esc(REMINDER_CHANNELS.join(' + '))+'</div>';
  h+='<div class="tablewrap"><table><thead><tr><th class="nosort">Customer</th><th class="nosort">Sent</th></tr></thead><tbody>';
  if(!comms.length) h+='<tr><td colspan="2"><div class="empty">Nothing sent yet</div></td></tr>';
  comms.forEach(cm=>{ const c=byId(DB.customers,cm.entityId); h+='<tr><td>'+esc(c?c.name:cm.entityId)+'</td><td>'+fmtDate(cm.date)+'</td></tr>'; });
  h+='</tbody></table></div>';
  openModal(u.title+' — sent to customers', h, '<button class="btn" onclick="closeModal()">Close</button>', true);
}
function renderNewProductUpdates(){
  let h='<div class="section-title">New Product Updates <span class="hint">Broadcast to your full customer list — WhatsApp + Email together, every time. No per-customer targeting; if it is worth announcing, everyone gets it.</span></div>';
  h+='<div class="toolbar" style="margin-top:10px;"><div class="small muted" style="font-weight:600;">'+DB.productUpdates.length+' update(s)</div>'+
    '<div class="toolbar-actions"><button class="btn primary" onclick="openNewProductUpdateForm()">'+icon('plus',14)+' New Update</button></div></div>';
  h+='<div class="tablewrap" style="margin-top:10px;"><table><thead><tr><th class="nosort">Update</th><th class="nosort">Created</th><th class="nosort">Message</th><th class="nosort">Customers</th></tr></thead><tbody>';
  const list=[...DB.productUpdates].sort((a,b)=>a.createdDate<b.createdDate?1:-1);
  if(!list.length) h+='<tr><td colspan="4"><div class="empty">No product updates yet</div></td></tr>';
  list.forEach(u=>{
    const sentCount=productUpdateSentCount(u.id);
    h+='<tr><td><b>'+esc(u.title)+'</b></td><td>'+fmtDate(u.createdDate)+'</td>'+
      '<td><a class="link small" onclick="openEditProductUpdateMessage(\''+u.id+'\')">'+(sentCount>0?'View message':'Preview / edit message')+'</a></td>'+
      '<td>'+(sentCount>0?'<a class="link" onclick="openProductUpdateDetail(\''+u.id+'\')">'+pill('Sent · '+sentCount,'green')+'</a>':'<button class="btn sm primary" onclick="sendProductUpdate(\''+u.id+'\')">Send to All Customers</button>')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

function renderEngagement(){
  let h='<div class="filterbar">'+ENG_CATS.map(c=>'<div class="subtab'+(c===_engCat?' active':'')+'" onclick="setEngCat(\''+c+'\')">'+c+'</div>').join('')+'</div>';
  if(_engCat==='Festival Greetings'){ h+=renderFestivalGreetings(); return h; }
  if(_engCat==='After-Sales Messages'){ h+=renderAfterSaleMessages(); return h; }
  if(_engCat==='New Product Updates'){ h+=renderNewProductUpdates(); return h; }
  // After-Purchase Supplier Messages stays ad-hoc/manual — supplier relationship messages (thank-yous,
  // price-list requests, quality feedback) are inherently one-off and per-supplier, unlike a broadcast.
  h+='<div class="toolbar" style="margin-top:10px;"><div class="small muted" style="font-weight:600;">'+DB.engagementMessages.filter(m=>m.category===_engCat).length+' messages in '+esc(_engCat)+'</div>'+
    '<div class="toolbar-actions"><button class="btn primary" onclick="openEngForm()">'+icon('plus',14)+' Plan message</button></div></div>';
  let rows=DB.engagementMessages.filter(m=>m.category===_engCat);
  h+='<div class="tablewrap" style="margin-top:10px;">'+renderTable('engtbl',[
    {key:'purpose',label:'Purpose'},
    {key:'audience',label:'Audience',sort:false,render:m=>{ const a = m.audienceType==='Customer'?byId(DB.customers,m.audienceId):byId(DB.suppliers,m.audienceId); return (a?esc(a.name):'—')+' <span class="tag">'+m.audienceType+'</span>'; }},
    {key:'plannedDate',label:'Planned Date',render:m=>fmtDate(m.plannedDate)},
    {key:'channel',label:'Channel',render:m=>pill(m.channel,'blue')},
    {key:'status',label:'Status',render:m=>pill(m.status,m.status==='Sent'?'green':'amber')},
    {key:'act',label:'Action',sort:false,render:m=>m.status==='Planned'?'<button class="btn sm primary" onclick="sendEngMessage(\''+m.id+'\')">Send / Log Sent</button>':'<span class="small muted">Sent '+fmtDate(m.plannedDate)+'</span>'},
  ], rows, {defaultSort:'plannedDate'})+'</div>';
  window._lastTableRenderFn['engtbl']=()=>{ document.getElementById('content').innerHTML=renderEngagement(); };
  return h;
}
function setEngCat(c){ _engCat=c; document.getElementById('content').innerHTML=renderEngagement(); }
function openEngForm(){
  const audienceIsSupplier = _engCat==='After-Purchase Supplier Messages';
  const audOpts = audienceIsSupplier ? DB.suppliers.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('') : DB.customers.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');
  openModal('Plan Message — '+_engCat,''+
    '<div class="formrow"><div><label>Purpose</label><input id="eg_purpose" placeholder="e.g. Diwali greeting / Service reminder"/></div>'+
    '<div><label>Audience ('+(audienceIsSupplier?'Supplier':'Customer')+')</label><select id="eg_aud">'+audOpts+'</select></div></div>'+
    '<div class="formrow"><div><label>Planned date</label><input id="eg_date" type="date" value="'+todayISO()+'"/></div>'+
    '<div><label>Send via</label><div style="display:flex;gap:14px;align-items:center;height:38px;"><label class="small" style="display:flex;align-items:center;gap:5px;"><input type="checkbox" id="eg_ch_wa" checked/> WhatsApp</label><label class="small" style="display:flex;align-items:center;gap:5px;"><input type="checkbox" id="eg_ch_email"/> Email</label></div></div></div>'+
    '<div class="small muted" style="margin-top:-6px;margin-bottom:10px;">One message, sent to whichever channels you tick — no need to plan the same message twice to avoid the customer getting it on both WhatsApp and email uncoordinated.</div>'+
    '<div class="formrow full"><div><label>Message</label><textarea id="eg_msg" placeholder="Message text..."></textarea></div></div>',
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveEngMessage()">Save Plan</button>');
}
function saveEngMessage(){
  const purpose=val('eg_purpose'); if(!purpose){ toast('Purpose required'); return; }
  const channels=[]; if(document.getElementById('eg_ch_wa').checked) channels.push('WhatsApp'); if(document.getElementById('eg_ch_email').checked) channels.push('Email');
  if(!channels.length){ toast('Pick at least one channel'); return; }
  const audienceIsSupplier = _engCat==='After-Purchase Supplier Messages';
  const dup = DB.engagementMessages.find(m=>m.category===_engCat && m.audienceId===val('eg_aud') && m.purpose===purpose && m.plannedDate===val('eg_date'));
  if(dup){ toast('Duplicate message for this audience/date already planned — edit or send the existing one instead of creating a second (that\'s what causes customers to get the same message twice).'); return; }
  DB.engagementMessages.push({id:uid('ENG'),category:_engCat,audienceType:audienceIsSupplier?'Supplier':'Customer',audienceId:val('eg_aud'),purpose,plannedDate:val('eg_date'),channel:channels.join(' + '),subject:'',message:val('eg_msg'),status:'Planned'});
  save(); closeModal(); toast('Message planned'); document.getElementById('content').innerHTML=renderEngagement();
}
function sendEngMessage(id){
  const m=byId(DB.engagementMessages,id); m.status='Sent';
  const entityType = m.audienceType==='Supplier'?'supplier':'customer';
  // One communications entry covering every channel the message went out on — this IS the fix for "customer
  // gets it on WhatsApp and email both": one compose, one send action, one logged record either way.
  DB.communications.push({id:uid('COM'),entityType,entityId:m.audienceId,type:'Engagement — '+m.category,date:todayISO(),summary:m.purpose+' via '+m.channel});
  completeTasksByRef(DB,'engagement',id,'Message sent');
  recomputeAlertsAndTasks(DB); save(); toast('Message logged as sent'); document.getElementById('content').innerHTML=renderEngagement();
}

// Reports and Alerts pages were removed here (per feedback — Dashboard already covers the revenue/KPI ground
// Reports duplicated, and every alert already surfaces as a task in Action Center via recomputeAlertsAndTasks,
// so a separate flat Alerts list was a second copy of the same list, not new information).

/* === SECTION: INIT === */
function init(){
  loadDB();
  renderNav();
  if(!location.hash) location.hash='#dashboard';
  route();
}
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
