  } else if(top==='customers'){
    const tabs=[{id:'list',label:'All Customers'},{id:'value',label:'Who Earns Us Most'}];
    el.innerHTML = tabs.map(t=>'<div class="subtab'+(_custView===t.id?' active':'')+'" '+act('setCustView',t.id)+'>'+t.label+'</div>').join('');
  } else if(top==='people'){
    const tabs=[{id:'pay',label:'This Month\'s Pay'},{id:'staff',label:'People'},{id:'standing',label:'Standing Costs'}];
    el.innerHTML = tabs.map(t=>'<div class="subtab'+(_peopleView===t.id?' active':'')+'" '+act('setPeopleView',t.id)+'>'+t.label+'</div>').join('');
  } else if(top==='money'){
    const tabs=[{id:'pl',label:'Profit & Loss'},{id:'products',label:'Product Economics'},{id:'expenses',label:'Expenses'},{id:'dead',label:'Money on the Shelf'}];
    el.innerHTML = tabs.map(t=>'<div class="subtab'+(_moneyView===t.id?' active':'')+'" '+act('setMoneyView',t.id)+'>'+t.label+'</div>').join('');
  } else if(top==='compliance'){
    const tabs=[{id:'position',label:'GST Position'},{id:'credit',label:'Credit Notes'},{id:'debit',label:'Debit Notes'},{id:'eway',label:'E-way Bills'}];
    el.innerHTML = tabs.map(t=>'<div class="subtab'+(_gstView===t.id?' active':'')+'" '+act('setGstView',t.id)+'>'+t.label+'</div>').join('');
  } else if(top==='datahub'){
    const tabs=[{id:'audit',label:'Audit Trail'},{id:'export',label:'Export & Backup'},{id:'settings',label:'Settings'}];
    el.innerHTML = tabs.map(t=>'<div class="subtab'+(_dataView===t.id?' active':'')+'" '+act('setDataView',t.id)+'>'+t.label+'</div>').join('');
  } else if(top==='leads'){
    const waiting = _webEnq.loaded ? _webEnq.rows.length : 0;
    const tabs=[{id:'board',label:'Board'},{id:'list',label:'List'},{id:'analytics',label:'Analytics'},
                {id:'web',label:'Web Enquiries'+(waiting?' ('+waiting+')':'')}];
    el.innerHTML = tabs.map(t=>'<div class="subtab'+(_leadView===t.id?' active':'')+'" data-act="setLeadView" data-args="'+esc(JSON.stringify([(t.id)]))+'">'+t.label+'</div>').join('');
  } else if(top==='service'){
    // Follow-ups lives here (not under Sales) because it's a service-operations task — chasing the two
    // scheduled visits — not a selling motion. Kept as its own tab, separate from Job Cards, so the outreach
    // pipeline (who's been contacted, who confirmed) never gets mixed in with repair/breakdown tickets.
    const tabs=[{id:'track',label:'Service Track'},{id:'followups',label:'Follow-ups'},{id:'jobcards',label:'Job Cards'}];
    el.innerHTML = tabs.map(t=>'<div class="subtab'+(_serviceView===t.id?' active':'')+'" data-act="setServiceViewFromTab" data-args="'+esc(JSON.stringify([(t.id)]))+'">'+t.label+'</div>').join('');

function route(){
  const rk=currentRouteKey();
  document.getElementById('content').classList.toggle('lead-board-view',rk==='leads' && _leadView==='board');
  window._tableReg = {};        // exports only ever offer what's on the screen now
  renderDemoFlag();
  // Leaving Stores & Purchases entirely re-arms the low-stock popup, so walking away and coming back later
  // (not just re-filtering within the page) shows it again — "every time the store page is opened."
  if(rk.split('/')[0]!=='storespurchases') _storesAlertShown=false;
  if(rk.indexOf('__customer:')===0){
    const cid=rk.split(':')[1];
    document.getElementById('pagetitle').textContent='Customers — '+(byId(DB.customers,cid)?byId(DB.customers,cid).name:'');
    setTopbarIcon('users');
    renderNav();
    renderTopbarTabs();
    document.getElementById('content').innerHTML=renderCustomerDetailPage(cid);
    return;
  }
  const routes=flatRoutes();
  let match = routes.find(r=>r.key===rk);
  // permission check
  const topId = rk.split('/')[0];
  const topNav = NAV.find(n=>n.id===topId);
  if(!topNav || !topNav.roles.includes(CURRENT_ROLE)){
    location.hash='#dashboard'; return;
  }
  if(topNav.module && !moduleOn(topNav.module)){ location.hash='#dashboard'; return; }
  if(!match) match = routes.find(r=>r.top===topId) || routes[0];
  document.getElementById('pagetitle').textContent = pageTitleFor(rk);
  setTopbarIcon(topNav.icon);
  renderNav();
  renderTopbarTabs();
  try{
    document.getElementById('content').innerHTML = match.render();
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="empty">Error rendering page: '+esc(e.message)+'</div>';
    console.error(e);
  }
}
function pageTitleFor(rk){
  for(const n of NAV){
    if(n.id===rk) return n.label;
    if(n.sub){ const s=n.sub.find(x=>(n.id+'/'+x.id)===rk); if(s) return n.label+' — '+s.label; }
  }
  return 'SIMS';
}
window.addEventListener('hashchange', route);

/* === SECTION: RENDER - DASHBOARD === */
function monthKey(iso,offset){ const d=new Date(iso+'T00:00:00'); d.setMonth(d.getMonth()+(offset||0)); return d.toISOString().slice(0,7); }
function monthLabel(key){ const d=new Date(key+'-01T00:00:00'); return d.toLocaleDateString('en-IN',{month:'short'}); }
function renderDashboard(){
  const T=todayISO();
  const monthStart = T.slice(0,7);
  const prevMonth = monthKey(T,-1);
  // Revenue = taxable value. GST collected is money held for the government, not
  // income, so counting it as revenue would flatter every month by 18%.
  const revenueMonth = DB.salesInvoices.filter(i=>i.date.slice(0,7)===monthStart).reduce((s,i)=>s+(i.subTotal||i.total),0);
  const revenuePrev = DB.salesInvoices.filter(i=>i.date.slice(0,7)===prevMonth).reduce((s,i)=>s+(i.subTotal||i.total),0);
  const receivables = totalReceivables();          // balance still owed, net of every receipt recorded
  const overdueAmt = totalOverdue();
  const purchaseSpendMonth = DB.purchases.filter(p=>p.date.slice(0,7)===monthStart).reduce((s,p)=>s+p.total,0);
  const purchaseSpendPrev = DB.purchases.filter(p=>p.date.slice(0,7)===prevMonth).reduce((s,p)=>s+p.total,0);
  const pipelineValue = DB.leads.filter(l=>!['Won','Lost'].includes(l.stage)).reduce((s,l)=>s+(l.expectedValue||0),0);
  const repeatOppValue = DB.repeatOpportunities.filter(o=>o.status==='Open').reduce((s,o)=>{ const m=byId(DB.materials,o.materialId); return s+(m?m.lastRate*o.expectedQty:0); },0);
  const serviceAttention = DB.serviceJobs.filter(j=>j.status==='Open').length;
  const criticalMaterials = DB.materials.filter(m=>stockHealth(m)==='critical').length;
  const finishedReady = DB.productionStock.reduce((s,p)=>s+Math.max(0,(p.finishedQty||0)-(p.reservedQty||0)),0);

  // v1.5 — the owner opens the app to find out whether the month worked.
  const _plNow = profitAndLoss(addMonths(T,-1), T);
  const kpis = [
    {label:'Profit — last 30 days', val:fmtMoney(_plNow.netProfit), sub:_plNow.margins.net.toFixed(1)+'% after every cost', ic: _plNow.netProfit>=0?'checkcircle':'alerttri', color: _plNow.netProfit>=0?'var(--green)':'var(--red)', bg: _plNow.netProfit>=0?'var(--green-100)':'var(--red-100)'},
    {label:'Revenue this month', val:fmtMoney(revenueMonth), sub:DB.salesInvoices.filter(i=>i.date.slice(0,7)===monthStart).length+' invoices', ic:'trendup', color:'var(--primary-600)', bg:'var(--primary-100)', trend:trendBadge(revenueMonth,revenuePrev)},
    {label:'Receivables', val:fmtMoney(receivables), sub:openInvoices().length+' open · '+fmtMoney(overdueAmt)+' overdue', ic:'clock', color: overdueAmt>0?'var(--red)':'var(--amber)', bg: overdueAmt>0?'var(--red-100)':'var(--amber-100)'},
    {label:'Purchase expenditure (mo.)', val:fmtMoney(purchaseSpendMonth), sub:DB.purchases.filter(p=>p.date.slice(0,7)===monthStart).length+' purchases', ic:'bag', color:'var(--ink-700)', bg:'var(--ink-100)', trend:trendBadge(purchaseSpendMonth,purchaseSpendPrev)},
    {label:'Lead pipeline value', val:fmtMoney(pipelineValue), sub:DB.leads.filter(l=>!['Won','Lost'].includes(l.stage)).length+' open leads', ic:'target', color:'var(--teal)', bg:'var(--teal-100)'},
    {label:'Repeat-sales opportunity', val:fmtMoney(repeatOppValue), sub:DB.repeatOpportunities.filter(o=>o.status==='Open').length+' open opportunities', ic:'refresh', color:'var(--primary-600)', bg:'var(--primary-100)'},
    {label:'Service needing attention', val:serviceAttention, sub:'open job cards', ic:'wrench', color: serviceAttention>0?'var(--red)':'var(--green)', bg: serviceAttention>0?'var(--red-100)':'var(--green-100)'},
    {label:'Critical materials', val:criticalMaterials, sub:'below safety threshold', ic:'alerttri', color: criticalMaterials>0?'var(--red)':'var(--green)', bg: criticalMaterials>0?'var(--red-100)':'var(--green-100)'},
    {label:'Finished stock ready', val:finishedReady, sub:'units dispatch-ready', ic:'checkcircle', color:'var(--green)', bg:'var(--green-100)'},
  ];

  const openTasks = DB.tasks.filter(t=>t.status==='Open' && (CURRENT_ROLE==='owner' || byId(DB.employees,t.assignedTo)&&byId(DB.employees,t.assignedTo).role===CURRENT_ROLE));
  const priorityRank={High:0,Medium:1,Low:2};
  const todays = openTasks.filter(t=>t.dueDate<=T).sort((a,b)=> (priorityRank[a.priority]-priorityRank[b.priority]) || (a.dueDate<b.dueDate?-1:1)).slice(0,8);

  // stock vs demand warning example (Black Ready Bath style) computed generically for top 3 critical/order-soon consumables
  const stockWarnings = DB.materials.filter(m=>m.category==='Consumable' && stockHealth(m)!=='healthy').slice(0,3).map(m=>{
    const demand30 = Math.round((m.avgConsumption||0)*30);
    const incoming = DB.purchases.filter(p=>p.status==='Pending').reduce((s,p)=>{ const l=p.lines.find(x=>x.materialId===m.id); return s+(l?l.qty:0); },0)
      + DB.rfqs.filter(r=>r.status!=='converted'&&r.status!=='draft').reduce((s,r)=>{ const l=r.lines.find(x=>x.materialId===m.id); return s+(l?l.qty:0); },0);
    const shortfall = demand30 - m.qty - incoming;
    return {m,demand30,incoming,shortfall};
  });

  // revenue trend, last 6 months
  const monthKeys=[]; for(let i=5;i>=0;i--) monthKeys.push(monthKey(T,-i));
  const revByMonth = monthKeys.map(k=>({label:monthLabel(k), value:DB.salesInvoices.filter(i=>i.date.slice(0,7)===k).reduce((s,i)=>s+(i.subTotal||i.total),0)}));

  // v1.3 — each role gets the numbers that belong to their job. Everyone
  // used to see the owner's eight tiles; a service engineer opened the app to
  // Revenue, Receivables and Lead Pipeline, none of which are his business.
  const mine = roleKpis();
  let h = renderHomeHeader() + renderQuickActionBar();
  if(mine){
    h += '<div class="grid g4">'+mine.map(k=>
      '<div class="kpi"><div class="kpitop">'+iconChip(k.ic,k.color,k.bg)+'</div>'+
      '<div class="label" style="margin-top:10px;">'+esc(k.label)+'</div><div class="val">'+k.val+'</div><div class="sub">'+esc(k.sub)+'</div></div>'
    ).join('')+'</div>';
    h += renderMyWork(6);
    h += roleExtraPanel();
    return h;
  }
  h += '<div class="grid g4">'+kpis.map(k=>
    '<div class="kpi"><div class="kpitop">'+iconChip(k.ic,k.color,k.bg)+(k.trend||'')+'</div>'+
    '<div class="label" style="margin-top:10px;">'+esc(k.label)+'</div><div class="val">'+k.val+'</div><div class="sub">'+esc(k.sub)+'</div></div>'
  ).join('')+'</div>';

  h += '<div class="grid g3" style="margin-top:20px;grid-template-columns:1.5fr 1fr;">';
  h += '<div class="card"><div class="section-title" style="margin-top:0;"><span class="lft">'+icon('barchart',16)+' Revenue Trend — Last 6 Months</span></div>'+svgLineChart(revByMonth,{fmt:v=>v>=100000?(v/100000).toFixed(1)+'L':fmtMoney(v)})+'</div>';
  h += '<div class="card"><div class="section-title" style="margin-top:0;"><span class="lft">'+icon('target',16)+' Pipeline by Stage</span></div>'+
    svgHBarChart(Object.entries(DB.leads.filter(l=>!['Won','Lost'].includes(l.stage)).reduce((acc,l)=>{acc[l.stage]=(acc[l.stage]||0)+1;return acc;},{})).map(([k,v])=>({label:k,value:v})),{})+
    (DB.leads.filter(l=>!['Won','Lost'].includes(l.stage)).length? '' : '<div class="empty">No open pipeline</div>')+
    '</div>';
  h += '</div>';

  h += renderMyWork(8);

  h += '<div class="section-title"><span class="lft">'+icon('alerttri',16)+' Demand vs. Stock Warnings</span></div>';
  if(!stockWarnings.length){ h += '<div class="card"><div class="empty">'+icon('checkcircle',26)+'<div style="margin-top:6px;">No consumable shortages projected in the next 30 days.</div></div></div>'; }
  else {
    h += '<div class="grid g3">';
    stockWarnings.forEach(w=>{
      const short = w.shortfall>0;
      h += '<div class="card">'+
        '<div style="font-weight:700;color:var(--ink-900);margin-bottom:8px;display:flex;align-items:center;gap:8px;">'+iconChip('archive',short?'var(--red)':'var(--green)',short?'var(--red-100)':'var(--green-100)',15)+esc(w.m.name)+'</div>'+
        '<div class="small muted">Expected demand (30 days): <b style="color:var(--ink-900);">'+w.demand30+' '+esc(w.m.unit)+'</b></div>'+
        '<div class="small muted">Current stock: <b style="color:var(--ink-900);">'+w.m.qty+' '+esc(w.m.unit)+'</b></div>'+
        '<div class="small muted">Confirmed incoming: <b style="color:var(--ink-900);">'+w.incoming+' '+esc(w.m.unit)+'</b></div>'+
        '<div class="small" style="margin-top:8px;">'+(short? pill('Possible shortage: '+w.shortfall+' '+w.m.unit,'red') : pill('Covered','green'))+'</div>'+
        '<button class="btn sm primary" style="margin-top:10px;" onclick="gotoStoresPurchases(\'stores\');setTimeout(()=>openRequestQuote(\''+w.m.id+'\'),50)">Request Quote</button>'+
        '</div>';
    });
    h += '</div>';
  }
  return h;
}
// One panel below the tiles answering the question that role asks next.

  const T = todayISO();
  if(CURRENT_ROLE === 'sales'){
    const chase = (DB.quotations||[]).filter(q=>quoteStatus(q)==='Sent')
      .sort((a,b)=>a.validUntil < b.validUntil ? -1 : 1).slice(0,6);

      '<span class="hint"><a class="link" '+act('gotoSales','quotations')+'>see all</a></span></div>';

      'When you send a quotation it appears here until the customer decides, so nothing goes quiet unnoticed.','New quotation','openQuoteForm');
    h += '<div class="worklist">';
    chase.forEach(q=>{
      const left = daysBetween(T, q.validUntil);
      h += '<div class="workitem '+(left<0?'hi':left<=5?'md':'lo')+'"><div class="wi-main"><b>'+esc(quoteCustomerName(q))+' — '+fmtMoney(q.total)+'</b>'+

  }
  if(CURRENT_ROLE === 'service'){
    const rows=[];
    DB.serviceSchedules.forEach(sc=>(sc.visits||[]).forEach(v=>{
      if(v.status==='Done') return;
      if(v.dueDate > addDays(T,45)) return;
      const ser=byId(DB.equipmentSerials,sc.serialId); if(!ser) return;
      rows.push({v:v, ser:ser, c:byId(DB.customers,ser.customerId), p:byId(DB.products,ser.productId)});
    }));
    rows.sort((a,b)=>a.v.dueDate < b.v.dueDate ? -1 : 1);
    let h = '<div class="section-title"><span class="lft">'+icon('calcheck',16)+' Visits coming up</span>'+
      '<span class="hint"><a class="link" '+act('gotoServiceFollowups')+'>see all</a></span></div>';
    if(!rows.length) return h + emptyState('calcheck','No service visits due in the next 45 days',
      'Every machine sold schedules two visits automatically. They appear here as they come due.','Find a machine','gotoFieldLookup');
    h += '<div class="worklist">';
    rows.slice(0,7).forEach(r=>{
      const late = r.v.dueDate < T;
      h += '<div class="workitem '+(late?'hi':'md')+'"><div class="wi-main"><b>'+esc(r.c?r.c.name:'')+' — Service '+r.v.seq+'</b>'+
        '<div class="wi-why">'+esc(r.p?r.p.name:'')+' &middot; '+esc(r.ser.serial)+' &middot; '+(late?'overdue since ':'due ')+fmtDate(r.v.dueDate)+'</div></div>'+
        '<div class="wi-act"><button class="btn sm" '+act('openSerialCard',r.ser.id)+'>Machine</button>'+
        '<button class="btn sm primary" '+act('startJobCard',r.ser.id)+'>Job card</button></div></div>';
    });
    return h + '</div>';
  }
  if(CURRENT_ROLE === 'stores' || CURRENT_ROLE === 'production'){
    const crit = DB.materials.filter(m=>stockHealth(m)==='critical').slice(0,7);
    let h = '<div class="section-title"><span class="lft">'+icon('alerttri',16)+' Materials below safety level</span>'+
      '<span class="hint"><a class="link" '+act('gotoStoresPurchases','stores')+'>open stores</a></span></div>';
    if(!crit.length) return h + emptyState('checkcircle','Every material is above its safety level',
      'Items drop in here the moment stock falls below the reorder point, so nothing runs out quietly.','',null);

// 8 real pipeline stages instead of the old 14 (half of which no seed lead ever used). 'On Hold' is now a flag
// (l.onHold) on whatever active stage a lead is sitting in, not its own dead-end column — that's how a paused
// deal actually behaves: it stays where it was, it doesn't teleport to a parking lot.
const LEAD_STAGES=['New','Qualified','Technical Discussion','Site Visit / Demo','Quotation Sent','Negotiation','Won','Lost'];
const LEAD_ACTIVE_STAGES=LEAD_STAGES.filter(s=>s!=='Won'&&s!=='Lost');
const LOST_REASON_CATS=['Price / Budget','Delivery Timeline','Chose Competitor','Specification Mismatch','Budget Deferred','Went Silent / No Response','Other'];
// The real channels this business actually gets enquiries through — trimmed down from a longer generic list
// that had grown channels nobody here actually uses (Email/Phone Call/Exhibition/Direct Sales Visit/Government
// Enquiry/Manual Entry). Single source of truth for the lead form dropdown and Source Performance analytics.
const LEAD_SOURCES=['IndiaMART','TradeIndia','Website','Justdial','Existing Customer','Referral','Dealer','Tender Portal'];
let _leadFilter='All';
let _leadView='board'; // 'board' (kanban, default) | 'list' (sortable table)

// Period filter for the Analytics tab only — Board/List always show live pipeline state regardless of this,
// since "follow-ups overdue right now" or "what's sitting in Negotiation today" isn't a historical question.
let _leadAnalyticsPeriod='all'; // 'all' | '30' | '90' | '180' | '365'
const LEAD_ANALYTICS_PERIODS=[['30','Last 30 Days'],['90','Last 90 Days'],['180','Last 6 Months'],['365','Last 12 Months'],['all','All Time']];

function leadsInAnalyticsPeriod(){
  if(_leadAnalyticsPeriod==='all') return DB.leads;
  const cutoff=addDays(todayISO(),-Number(_leadAnalyticsPeriod));
  return DB.leads.filter(l=>(l.createdAt||'')>=cutoff);
}

function leadStageIdx(s){ const i=LEAD_ACTIVE_STAGES.indexOf(s); return i<0?0:i; }
// A lead's furthest-reached point in the pipeline. For Lost leads that's lastActiveStage (captured the moment
// they were marked lost), not the 'Lost' label itself — this is what makes the funnel show a real drop-off
// curve instead of just "how many are in each currently-selected stage".
function leadReachedIdx(l){
  if(l.stage==='Won') return LEAD_ACTIVE_STAGES.length;
  if(l.stage==='Lost') return leadStageIdx(l.lastActiveStage||'New');
  return leadStageIdx(l.stage);
}

function leadKpis(leadsArr){
  const T=todayISO();
  const leads = leadsArr || DB.leads;
  const total = leads.length;
  const won = leads.filter(l=>l.stage==='Won');
  const lost = leads.filter(l=>l.stage==='Lost');
  const openLeads = leads.filter(l=>!['Won','Lost'].includes(l.stage));
  const closedCount = won.length+lost.length;
  const convRate = closedCount? Math.round(won.length/closedCount*100) : 0;
  const pipelineValue = openLeads.reduce((s,l)=>s+(l.expectedValue||0),0);
  const avgDeal = won.length? Math.round(won.reduce((s,l)=>s+(l.expectedValue||0),0)/won.length) : 0;
  const cycles = won.filter(l=>l.closedAt).map(l=>daysBetween(l.createdAt,l.closedAt));
  const avgCycle = cycles.length? Math.round(cycles.reduce((a,b)=>a+b,0)/cycles.length) : 0;
  const overdue = openLeads.filter(l=>l.followUpDate && l.followUpDate<T).length;
  return [
    {label:'Total Leads', val:total, sub:'across all sources', ic:'target', color:'var(--primary-600)', bg:'var(--primary-100)'},
    {label:'Open Pipeline', val:openLeads.length, sub:openLeads.length+' of '+total+' still active · '+fmtMoney(pipelineValue)+' expected', ic:'refresh', color:'var(--teal)', bg:'var(--teal-100)'},
    {label:'Win Rate', val:convRate+'%', sub:won.length+' won · '+lost.length+' lost (of '+closedCount+' closed)', ic:'checkcircle', color:convRate>=25?'var(--green)':'var(--amber)', bg:convRate>=25?'var(--green-100)':'var(--amber-100)'},
    {label:'Avg Deal Size', val:fmtMoney(avgDeal), sub:'won leads only', ic:'bag', color:'var(--ink-700)', bg:'var(--ink-100)'},
    {label:'Avg Sales Cycle', val:avgCycle+' days', sub:'enquiry to Won', ic:'clock', color:'var(--primary-600)', bg:'var(--primary-100)'},
    {label:'Follow-ups Overdue', val:overdue, sub: overdue? 'need attention now':'all on schedule', ic:'alerttri', color:overdue?'var(--red)':'var(--green)', bg:overdue?'var(--red-100)':'var(--green-100)'},
  ];
}

// Quick-move on the board: steps a lead one active stage forward/back without opening the full form. Deliberately
// can't push past the last active stage into Won (that creates a customer record — too consequential for a
// one-click board action) or pull a Won/Lost lead back into the active pipeline; those go through the explicit
// Mark Won / Mark Lost flow in the lead detail modal instead.
function moveLeadStage(id, dir){
  const l=byId(DB.leads,id); if(!l) return;
  if(l.stage==='Won'||l.stage==='Lost') return;
  const idx=leadStageIdx(l.stage);
  const nextIdx=idx+dir;
  if(nextIdx<0 || nextIdx>=LEAD_ACTIVE_STAGES.length) return;
  const newStage=LEAD_ACTIVE_STAGES[nextIdx];
  l.stage=newStage;
  l.activities.push({date:todayISO(),note:'Moved to '+newStage});
  recomputeAlertsAndTasks(DB); save();
  rerender();
  toast('Moved to '+newStage);
}

// Board panning — the board is meant to be worked sideways, not scrolled to via a thin bar that ends up below
// the fold once there's enough content to need a page scroll first. Two ways in: (1) a normal mouse-wheel or
// trackpad scroll over the board pans it horizontally instead of trying to scroll the page, (2) click-and-drag
// on any empty column background pans it Trello-style. Cards/buttons/links are excluded from the drag-start
// check so clicking a card still opens it instead of being swallowed by a pan gesture.
let _kbDrag = {active:false, startX:0, startScroll:0, el:null};
function kanbanWheelPan(e){
  if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; // already a horizontal gesture — let the browser handle it natively
  e.currentTarget.scrollLeft += e.deltaY;
  e.preventDefault();
}
function kanbanDragStart(e){
  if(e.button!==0) return;
  if(e.target.closest('.kanban-card, button, a, input, select, textarea')) return;
  _kbDrag = {active:true, startX:e.clientX, startScroll:e.currentTarget.scrollLeft, el:e.currentTarget};
  e.currentTarget.classList.add('dragging');
}
function kanbanDragMove(e){
  if(!_kbDrag.active) return;
  _kbDrag.el.scrollLeft = _kbDrag.startScroll - (e.clientX - _kbDrag.startX);
}
function kanbanDragEnd(){
  if(_kbDrag.el) _kbDrag.el.classList.remove('dragging');
  _kbDrag = {active:false, startX:0, startScroll:0, el:null};
}
document.addEventListener('mousemove', kanbanDragMove);
document.addEventListener('mouseup', kanbanDragEnd);

// Real revenue per lead source — not just "Won" stage counts. Joins customers that were converted from a lead
// (customer.source, set in markLeadWon) against their full invoice history, so a source that produces fewer but
// bigger/repeat-buying customers shows up correctly instead of looking weaker than a source with more one-off wins.
function revenueBySource(leadsArr){
  const rev={};
  // Optional cohort filter (used by the Analytics period selector): only count customers whose originating lead
  // falls inside the given lead set. With no argument, behaves exactly as before — every customer with a source.
  const leadIds = leadsArr ? new Set(leadsArr.map(l=>l.id)) : null;
  DB.customers.forEach(c=>{
    if(!c.source) return;
    if(leadIds && (!c.leadId || !leadIds.has(c.leadId))) return;
    const total=DB.salesInvoices.filter(i=>i.customerId===c.id).reduce((s,i)=>s+(i.subTotal||i.total),0);
    rev[c.source]=(rev[c.source]||0)+total;
  });
  return rev;
}
// Same idea, grouped by the salesperson the winning lead was assigned to — only counts customers that actually
// trace back to a lead (leadId set), since a walk-in customer with no lead record has no salesperson to credit.
function revenueBySalesperson(leadsArr){
  const rev={};
  const leadIds = leadsArr ? new Set(leadsArr.map(l=>l.id)) : null;
  DB.customers.forEach(c=>{
    if(!c.leadId) return;
    if(leadIds && !leadIds.has(c.leadId)) return;
    const lead=byId(DB.leads,c.leadId); if(!lead||!lead.assignedTo) return;
    const total=DB.salesInvoices.filter(i=>i.customerId===c.id).reduce((s,i)=>s+(i.subTotal||i.total),0);
    rev[lead.assignedTo]=(rev[lead.assignedTo]||0)+total;
  });
  return rev;
}
function leadFunnelStages(leadsArr){
  const leads = leadsArr || DB.leads;
  return LEAD_ACTIVE_STAGES.concat(['Won']).map(stage=>{
    const idx = stage==='Won' ? LEAD_ACTIVE_STAGES.length : leadStageIdx(stage);
    return {label:stage, value: leads.filter(l=>leadReachedIdx(l)>=idx).length};
  });
}
// Analytics used to be a modal — a small scrolling box inside a scrolling page, which is exactly the "losing
// interest" complaint. It's now a full-page dashboard view (third topbar tab, alongside Board/List) laid out as
// a grid of cards like the main Dashboard route, so most of it is visible at a glance instead of one long list
// of sections you have to scroll through end to end.
function renderLeadsAnalyticsPage(){
  const T=todayISO();
  const allLeads = leadsInAnalyticsPeriod();
  const periodLabel = LEAD_ANALYTICS_PERIODS.find(p=>p[0]===_leadAnalyticsPeriod)[1];
  const won = allLeads.filter(l=>l.stage==='Won');
  const lost = allLeads.filter(l=>l.stage==='Lost');
  const avg = arr => arr.length? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length) : 0;

  let h = renderLeadKpiRow() + leadToolbar();

  // Period filter — scoped to everything on this page below the all-time KPI strip above (that strip stays
  // all-time on purpose: "follow-ups overdue" and "what's open right now" aren't questions a date range answers).
  h+='<div class="card" style="margin-top:14px;padding:12px 16px;"><div class="flexbar" style="gap:12px;flex-wrap:wrap;">'+
    '<div class="small" style="font-weight:700;color:var(--ink-700);">'+icon('clock',13)+' Analyzing: <b>'+esc(periodLabel)+'</b> — '+allLeads.length+' lead'+(allLeads.length===1?'':'s')+' in range</div>'+
    '<div class="period-pills">'+LEAD_ANALYTICS_PERIODS.map(([v,label])=>'<div class="period-pill'+(v===_leadAnalyticsPeriod?' active':'')+'" data-act="setLeadAnalyticsPeriod" data-args="'+esc(JSON.stringify([(v)]))+'">'+label+'</div>').join('')+'</div>'+
    '</div></div>';

  if(!allLeads.length){
    h+='<div class="card" style="margin-top:14px;"><div class="empty">No leads were created in this period — try a wider range.</div></div>';
    return h;
  }

  // Row 1: funnel (wide) + sales velocity (narrow)
  const wonCycles = won.filter(l=>l.closedAt).map(l=>daysBetween(l.createdAt,l.closedAt));
  const lostCycles = lost.filter(l=>l.closedAt).map(l=>daysBetween(l.createdAt,l.closedAt));
  const avgWon=avg(wonCycles), avgLost=avg(lostCycles), maxCycle=Math.max(1,avgWon,avgLost);
  h+='<div class="grid" style="grid-template-columns:1.6fr 1fr;margin-top:14px;">';
  h+='<div class="card"><div class="section-title" style="margin-top:0;"><span class="lft">'+icon('target',16)+' Pipeline Funnel</span><span class="hint">by furthest stage reached, widest = New</span></div>'+
    svgFunnelChart(leadFunnelStages(allLeads))+funnelLegend(leadFunnelStages(allLeads))+'</div>';
  h+='<div class="card"><div class="section-title" style="margin-top:0;"><span class="lft">'+icon('clock',16)+' Sales Velocity</span></div>'+
    '<div class="small muted" style="margin-bottom:2px;">How fast deals move, first enquiry to a final decision. Shorter green bar = faster wins; if the red bar is much longer, slow-moving leads tend to die rather than close.</div>'+
    '<div class="velocity-compare">'+
      '<div class="vc-row"><div class="vc-row-head"><span>Won</span><span>'+(wonCycles.length?avgWon+' days avg':'no data')+'</span></div>'+
      '<div class="vc-track"><div class="vc-fill" style="width:'+(wonCycles.length?Math.max(10,Math.round(avgWon/maxCycle*100)):0)+'%;background:linear-gradient(90deg,var(--green),#2fae66);">'+(wonCycles.length?avgWon+'d':'')+'</div></div></div>'+
      '<div class="vc-row"><div class="vc-row-head"><span>Lost</span><span>'+(lostCycles.length?avgLost+' days avg':'no data')+'</span></div>'+
      '<div class="vc-track"><div class="vc-fill" style="width:'+(lostCycles.length?Math.max(10,Math.round(avgLost/maxCycle*100)):0)+'%;background:linear-gradient(90deg,var(--red),#d64545);">'+(lostCycles.length?avgLost+'d':'')+'</div></div></div>'+
    '</div>'+
    '<div class="grid" style="grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;">'+
    '<div class="kpi"><div class="label">Fastest Win</div><div class="val">'+(wonCycles.length?Math.min(...wonCycles):'—')+'</div><div class="sub">days, best on record</div></div>'+
    '<div class="kpi"><div class="label">Slowest Win</div><div class="val">'+(wonCycles.length?Math.max(...wonCycles):'—')+'</div><div class="sub">days, longest close</div></div>'+
    '</div></div>';
  h+='</div>';

  // Row 2: source performance + why leads are lost
  const bySource={};
  allLeads.forEach(l=>{ bySource[l.source]=bySource[l.source]||{count:0,won:0}; bySource[l.source].count++; if(l.stage==='Won') bySource[l.source].won++; });
  const sources=Object.keys(bySource).sort((a,b)=>bySource[b].count-bySource[a].count);
  const revBySrc=revenueBySource(allLeads);
  const reasonCounts={};
  lost.forEach(l=>{ const c=l.lostCategory||'Other'; reasonCounts[c]=(reasonCounts[c]||0)+1; });
  h+='<div class="grid g2" style="margin-top:14px;">';
  h+='<div class="card"><div class="section-title" style="margin-top:0;"><span class="lft">'+icon('barchart',16)+' Source Performance</span></div>'+
    '<div class="small muted" style="margin-bottom:12px;">Revenue, not win-count — fewer wins but bigger/repeat customers can outearn a source with more "Won" stage changes.</div>'+
    svgHBarChart(sources.map(s=>({label:s,value:revBySrc[s]||0})),{fmt:v=>fmtMoney(v)})+
    '<table style="margin-top:14px;"><thead><tr><th class="nosort">Source</th><th class="nosort">Leads</th><th class="nosort">Won</th><th class="nosort">Conv.</th><th class="nosort">Revenue</th></tr></thead><tbody>'+
    sources.map(s=>{ const d=bySource[s]; return '<tr><td>'+esc(s)+'</td><td>'+d.count+'</td><td>'+d.won+'</td><td>'+Math.round(d.won/d.count*100)+'%</td><td><b>'+fmtMoney(revBySrc[s]||0)+'</b></td></tr>'; }).join('')+
    '</tbody></table></div>';
  h+='<div class="card"><div class="section-title" style="margin-top:0;"><span class="lft">'+icon('alerttri',16)+' Why Leads Are Lost</span><span class="hint">'+lost.length+' lost lead'+(lost.length===1?'':'s')+' in range</span></div>'+
    (lost.length? svgHBarChart(Object.entries(reasonCounts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k,value:v})),{}) : '<div class="empty">No lost leads in this period</div>')+
    '</div>';
  h+='</div>';

  // Row 3: monthly trend + salesperson leaderboard
  const monthKeys=[]; for(let i=5;i>=0;i--) monthKeys.push(monthKey(T,-i));
  const createdByMonth = monthKeys.map(k=>({label:monthLabel(k), value:allLeads.filter(l=>(l.createdAt||'').slice(0,7)===k).length}));
  const wonByMonth = monthKeys.map(k=>({label:monthLabel(k), value:won.filter(l=>(l.closedAt||'').slice(0,7)===k).length}));
  const salesEmps = DB.employees.filter(e=>e.role==='sales');
  const revBySales = revenueBySalesperson(allLeads);
  h+='<div class="grid g2" style="margin-top:14px;">';
  h+='<div class="card"><div class="section-title" style="margin-top:0;"><span class="lft">'+icon('trendup',16)+' Lead Trend — Last 6 Months</span></div>'+
    svgMultiLineChart([{name:'Leads Created',color:'var(--primary)',data:createdByMonth},{name:'Leads Won',color:'var(--green)',data:wonByMonth}],{})+
    '</div>';
  h+='<div class="card"><div class="section-title" style="margin-top:0;"><span class="lft">'+icon('users',16)+' Salesperson Leaderboard</span></div>'+
    '<table><thead><tr><th class="nosort">Salesperson</th><th class="nosort">Assigned</th><th class="nosort">Won</th><th class="nosort">Conv.</th><th class="nosort">Revenue Closed</th></tr></thead><tbody>'+
    salesEmps.map(e=>{
      const mine=allLeads.filter(l=>l.assignedTo===e.id);
      const mineWon=mine.filter(l=>l.stage==='Won').length;
      return '<tr><td><b>'+esc(e.name)+'</b></td><td>'+mine.length+'</td><td>'+mineWon+'</td><td>'+(mine.length?Math.round(mineWon/mine.length*100):0)+'%</td><td><b>'+fmtMoney(revBySales[e.id]||0)+'</b></td></tr>';
    }).join('')+
    '</tbody></table></div>';
  h+='</div>';

  // Row 4: industry breakdown, full width
  const openLeadsList = allLeads.filter(l=>!['Won','Lost'].includes(l.stage));
  const byIndustry={};
  openLeadsList.forEach(l=>{ const k=l.industry||'Unspecified'; byIndustry[k]=(byIndustry[k]||0)+(l.expectedValue||0); });
  const industries=Object.keys(byIndustry).sort((a,b)=>byIndustry[b]-byIndustry[a]);
  h+='<div class="card" style="margin-top:14px;"><div class="section-title" style="margin-top:0;"><span class="lft">'+icon('layers',16)+' Open Pipeline by Industry</span><span class="hint">'+openLeadsList.length+' of '+allLeads.length+' leads in range still open</span></div>'+
    (industries.length? svgHBarChart(industries.map(k=>({label:k,value:byIndustry[k]})),{fmt:v=>fmtMoney(v)}) : '<div class="empty">No open pipeline</div>')+
    '</div>';

  return h;
}

function saveLead(id){
  const company=val('ld_company'); if(!company){ toast('Company name required'); return; }
  const prodSel = byId(DB.products,val('ld_product'));
  const onHoldEl = document.getElementById('ld_onhold');
  const data = {company, contact:val('ld_contact'), mobile:val('ld_mobile'), email:val('ld_email'), location:val('ld_location'),
    industry:val('ld_industry'), source:val('ld_source'), product:prodSel?prodSel.name:'', expectedValue:num('ld_value'),
    assignedTo:val('ld_assignee'), stage:val('ld_stage'), followUpDate:val('ld_followup'), onHold: onHoldEl? onHoldEl.checked : false, notes:val('ld_notes')};
  if(id){
    const l=byId(DB.leads,id); Object.assign(l,data);
    l.activities.push({date:todayISO(),note:'Lead details updated, stage: '+data.stage});
    if(data.stage!=='Won' && data.stage!=='Lost') completeTasksByRef(DB,'lead',id,'Lead updated');
  } else {
    const l = Object.assign({id:uid('LD'),activities:[{date:todayISO(),note:'Lead created'}],lostReason:'',lostCategory:'',closedAt:'',lastActiveStage:'',createdAt:todayISO()}, data);
    DB.leads.push(l);
  }
  recomputeAlertsAndTasks(DB); save(); closeModal(); toast('Lead saved');
  rerender();
}
function openLeadDetail(id){
  const l=byId(DB.leads,id); if(!l) return;
  const emp=byId(DB.employees,l.assignedTo);
  let fields=['Company:'+l.company,'Contact:'+l.contact+' / '+l.mobile,'Source:'+l.source,'Industry:'+l.industry,'Location:'+l.location,
     'Expected value:'+fmtMoney(l.expectedValue),'Assigned:'+(emp?emp.name:'—'),'Stage:'+l.stage+(l.onHold?' (Paused)':'')];
  if(l.stage==='Lost' && l.lostCategory) fields.push('Lost reason:'+l.lostCategory);
  if(l.closedAt) fields.push((l.stage==='Won'?'Won on:':'Closed on:')+fmtDate(l.closedAt)+' — '+daysBetween(l.createdAt,l.closedAt)+' day sales cycle');
  let h='<div class="detailgrid">'+fields.map(x=>{const [k,v]=x.split(/:(.+)/); return '<div><div class="dl">'+k+'</div><div class="dv">'+esc(v)+'</div></div>';}).join('')+'</div>';
  if(l.notes) h+='<div class="small muted" style="margin-bottom:10px;">Notes: '+esc(l.notes)+'</div>';
  h+='<div class="hr"></div><b class="small">Activity History</b>';
  h+='<div style="margin-top:6px;">'+l.activities.slice().reverse().map(a=>'<div class="small" style="padding:4px 0;border-bottom:1px solid var(--line);">'+fmtDate(a.date)+' — '+esc(a.note)+'</div>').join('')+'</div>';
  h+='<div class="formrow full" style="margin-top:12px;"><div><label>Add activity note</label><textarea id="ld_actnote" placeholder="Log a call, email, or site visit..."></textarea></div></div>';
  let foot='<button class="btn" data-act="closeModal">Close</button>'+
    '<button class="btn" data-act="addLeadActivity" data-args="'+esc(JSON.stringify([(l.id)]))+'">Add Note</button>'+
    '<button class="btn" onclick="closeModal();openLeadForm(DB.leads.find(x=>x.id===\''+l.id+'\'))">Edit</button>';
  if(l.stage!=='Won' && l.stage!=='Lost'){
    foot+='<button class="btn warn" data-act="markLeadLost" data-args="'+esc(JSON.stringify([(l.id)]))+'">Mark Lost</button>'+
      '<button class="btn gold" data-act="markLeadWon" data-args="'+esc(JSON.stringify([(l.id)]))+'">Mark Won → Create Customer</button>';
  } else if(l.stage==='Won' && l.wonCustomerId){
    foot+='<button class="btn primary" onclick="closeModal();navTo(\'customers\');setTimeout(()=>openCustomerDetail(\''+l.wonCustomerId+'\'),50)">View Customer</button>';
  }
  openModal('Lead — '+l.company, h, foot, true);
}
function addLeadActivity(id){
  const note=val('ld_actnote'); if(!note){ toast('Enter a note'); return; }
  const l=byId(DB.leads,id); l.activities.push({date:todayISO(),note});
  save(); toast('Activity logged'); openLeadDetail(id);
}
// A proper reason-category modal instead of a native prompt() — gives Analytics something structured to tally
// ("Why Leads Are Lost") instead of unparseable free text, while still capturing the human detail underneath.
function markLeadLost(id){
  const l=byId(DB.leads,id); if(!l) return;
  const catOpts = LOST_REASON_CATS.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');
  openModal('Mark Lead Lost — '+l.company, ''+
    '<div class="formrow full"><div><label>Reason category</label><select id="lost_cat">'+catOpts+'</select></div></div>'+
    '<div class="formrow full"><div><label>Details (optional)</label><textarea id="lost_detail" placeholder="e.g. competitor quoted 15% lower, or delivery in 3 days vs our 3 weeks"></textarea></div></div>',
    '<button class="btn" data-act="openLeadDetail" data-args="'+esc(JSON.stringify([(id)]))+'">Cancel</button><button class="btn warn" data-act="confirmMarkLeadLost" data-args="'+esc(JSON.stringify([(id)]))+'">Confirm Lost</button>');
}
function confirmMarkLeadLost(id){
  const l=byId(DB.leads,id); if(!l) return;
  const cat=val('lost_cat')||'Other', detail=val('lost_detail');
  l.lastActiveStage=l.stage; l.stage='Lost'; l.lostCategory=cat; l.lostReason=detail?cat+' — '+detail:cat; l.followUpDate=''; l.closedAt=todayISO();
  l.activities.push({date:todayISO(),note:'Marked Lost — '+l.lostReason});
  completeTasksByRef(DB,'lead',id,'Lead marked lost'); recomputeAlertsAndTasks(DB); save();
  closeModal(); toast('Lead marked lost'); rerender();
}
function markLeadWon(id){
  const l=byId(DB.leads,id); if(!l) return;
  // duplicate detection by mobile/company
  let cust = DB.customers.find(c=>c.mobile===l.mobile || c.name.toLowerCase()===l.company.toLowerCase());
  if(!cust){
    cust = {id:uid('CUS'), name:l.company, contactPerson:l.contact, mobile:l.mobile, email:l.email, location:l.location,
      industry:l.industry, type:'Direct', gst:'', notes:'Converted from lead '+l.id, createdAt:todayISO(), leadId:l.id, source:l.source};
    DB.customers.push(cust);
  } else if(!cust.leadId){
    // existing customer record matched by mobile/name — still worth attributing to this lead's source
    // since it's the first time we can trace how they actually reached us
    cust.leadId=l.id; cust.source=l.source;
  }
  l.stage='Won'; l.wonCustomerId=cust.id; l.followUpDate=''; l.closedAt=todayISO();
  l.activities.push({date:todayISO(),note:'Marked Won — linked to customer '+cust.name});
  completeTasksByRef(DB,'lead',id,'Lead won'); recomputeAlertsAndTasks(DB); save();
  closeModal(); toast('Lead won — customer ready. Create the sales invoice from Sales > Invoices.');
  rerender();
}

let _custSearch='';
let _custView='list';
function setCustView(v){ _custView=v; rerender(); }
function renderCustomers(){
  if(_custView==='value') return renderCustomerValue();
  if(!DB.customers.length) return emptyState('users','No customers yet',
    'Customers appear here once you raise an invoice, or you can add one directly. Everything about them — purchases, machines, warranty, service history — hangs off this record.',
    'Add your first customer','openCustomerForm');
  let h = '<div class="flexbar"><input class="searchbox" placeholder="Search by name, mobile, invoice#, serial#, model..." value="'+esc(_custSearch)+'" oninput="setCustSearch(this.value)"/>'+
    '<button class="btn primary" data-act="openCustomerForm">'+icon('plus',14)+' New customer</button></div>';
  const q=_custSearch.toLowerCase();
  let rows = DB.customers.filter(c=>{
    if(!q) return true;
    if(c.name.toLowerCase().includes(q) || (c.mobile||'').includes(q)) return true;
    const invMatch = DB.salesInvoices.some(i=>i.customerId===c.id && i.invoiceNo.toLowerCase().includes(q));
    const serMatch = DB.equipmentSerials.some(s=>s.customerId===c.id && s.serial.toLowerCase().includes(q));
    const modelMatch = DB.equipmentSerials.some(s=>{ if(s.customerId!==c.id) return false; const p=byId(DB.products,s.productId); return p&&p.name.toLowerCase().includes(q); });
    return invMatch||serMatch||modelMatch;
  });
  h += '<div class="tablewrap">'+renderTable('custtbl',[
    {key:'name',label:'Customer',render:c=>'<a class="link" data-act="openCustomerDetail" data-args="'+esc(JSON.stringify([(c.id)]))+'">'+esc(c.name)+'</a><div class="small muted">'+esc(c.location)+'</div>'},
    {key:'contactPerson',label:'Contact',render:c=>esc(c.contactPerson)+'<div class="small muted">'+esc(c.mobile)+'</div>'},
    {key:'industry',label:'Industry'},
    {key:'type',label:'Type',render:c=>pill(c.type,'blue')},
    {key:'invoices',label:'Invoices',kind:'num',sort:false,render:c=>DB.salesInvoices.filter(i=>i.customerId===c.id).length},
    {key:'open',label:'Open Service',kind:'num',sort:false,render:c=>DB.serviceJobs.filter(j=>j.customerId===c.id&&j.status==='Open').length},
    {key:'last',label:'Last Purchase',sort:false,render:c=>{ const inv=DB.salesInvoices.filter(i=>i.customerId===c.id).sort((a,b)=>a.date<b.date?1:-1)[0]; return inv?fmtDate(inv.date):'—'; }},
  ], rows, {})+'</div>';
  window._lastTableRenderFn['custtbl']=()=>{ rerender(); };
  return h;
}

function saveCustomer(id){
  const name=val('cu_name'); if(!name){ toast('Name required'); return; }
  const dup = DB.customers.find(c=>c.id!==id && (c.mobile===val('cu_mobile') && val('cu_mobile') || c.name.toLowerCase()===name.toLowerCase()));
  if(dup && !id){ toast('Possible duplicate customer: '+dup.name); return; }
  const data={name,contactPerson:val('cu_contact'),mobile:val('cu_mobile'),email:val('cu_email'),location:val('cu_location'),industry:val('cu_industry'),type:val('cu_type'),gst:val('cu_gst'),notes:val('cu_notes')};
  if(id){ Object.assign(byId(DB.customers,id),data); } else { DB.customers.push(Object.assign({id:uid('CUS'),createdAt:todayISO()},data)); }
  save(); closeModal(); toast('Customer saved'); rerender();
}

// Special handling: customer detail is shown as a full-page overlay-like view via router hack
const _origRoute = null;
function renderCustomerDetailPage(id){
  const c=byId(DB.customers,id); if(!c) return '<div class="empty">Customer not found</div>';
  const invoices = DB.salesInvoices.filter(i=>i.customerId===id).sort((a,b)=>a.date<b.date?1:-1);
  const serials = DB.equipmentSerials.filter(s=>s.customerId===id);
  const warranties = serials.map(s=>DB.warrantyRecords.find(w=>w.serialId===s.id)).filter(Boolean);
  const jobs = DB.serviceJobs.filter(j=>j.customerId===id);
  const opps = DB.repeatOpportunities.filter(o=>o.customerId===id && o.status==='Open');
  const comms = DB.communications.filter(x=>x.entityType==='customer'&&x.entityId===id).sort((a,b)=>a.date<b.date?1:-1);
  // Planned (not-yet-sent) Engagement messages for this customer, folded into the same timeline so staff see
  // everything already queued before planning something new — this is what actually prevents the same customer
  // getting a WhatsApp AND an email that nobody realized were both already in flight.
  const plannedEng = DB.engagementMessages.filter(m=>m.audienceType==='Customer' && m.audienceId===id && m.status==='Planned');

  let h='<button class="btn sm" data-act="navTo" data-args="[&quot;customers&quot;]">&larr; Back to Customers</button>';
  h+='<div class="detailgrid" style="margin-top:14px;">'+
    ['Contact:'+c.contactPerson+' / '+c.mobile,'Email:'+(c.email||'—'),'Location:'+c.location,'Industry:'+c.industry,'Type:'+c.type,
     'Lead source:'+(c.source||'Direct / not from a tracked lead'),
     'Total invoices:'+invoices.length,'Equipment owned:'+serials.length,'Open service jobs:'+jobs.filter(j=>j.status==='Open').length].map(x=>{const [k,v]=x.split(/:(.+)/);return '<div><div class="dl">'+k+'</div><div class="dv">'+esc(v)+'</div></div>';}).join('')+
    '<div><button class="btn sm" onclick=\'openCustomerForm(DB.customers.find(x=>x.id==="'+id+'"))\'>Edit</button></div>'+
    '</div>';

  const tabs=[['invoices','Invoices ('+invoices.length+')'],['equipment','Equipment & Serials ('+serials.length+')'],['warranty','Warranty ('+warranties.length+')'],
    ['service','Service History ('+jobs.length+')'],['repeat','Repeat Sales ('+opps.length+')'],['comm','Communication ('+(comms.length+plannedEng.length)+')']];
  h+='<div class="tabs">'+tabs.map(t=>'<div class="tab'+(t[0]===_custDetailTab?' active':'')+'" data-act="setCustTab" data-args="'+esc(JSON.stringify([(id),(t[0])]))+'">'+t[1]+'</div>').join('')+'</div>';

  if(_custDetailTab==='invoices'){
    h+='<div class="tablewrap"><table><thead><tr><th class="nosort">Invoice</th><th class="nosort">Date</th><th class="nosort">Lines</th><th class="nosort">Total</th><th class="nosort">Payment</th></tr></thead><tbody>';
    if(!invoices.length) h+='<tr><td colspan="5"><div class="empty">No invoices yet</div></td></tr>';
    invoices.forEach(i=>{ h+='<tr><td><a class="link" data-act="openInvoiceDetail" data-args="'+esc(JSON.stringify([(i.id)]))+'">'+i.invoiceNo+'</a></td><td>'+fmtDate(i.date)+'</td><td>'+i.lines.length+'</td><td>'+fmtMoney(i.total)+'</td><td>'+pill(i.paymentStatus,i.paymentStatus==='Paid'?'green':'amber')+'</td></tr>'; });
    h+='</tbody></table></div>';
  } else if(_custDetailTab==='equipment'){
    h+='<div class="tablewrap"><table><thead><tr><th class="nosort">Serial</th><th class="nosort">Product</th><th class="nosort">Invoice</th><th class="nosort">Sale Date</th><th class="nosort">Status</th></tr></thead><tbody>';
    if(!serials.length) h+='<tr><td colspan="5"><div class="empty">No equipment on record</div></td></tr>';
    serials.forEach(s=>{ const p=byId(DB.products,s.productId); const inv=byId(DB.salesInvoices,s.invoiceId);
      h+='<tr><td><b>'+s.serial+'</b></td><td>'+esc(p?p.name:'')+'</td><td><a class="link" data-act="openInvoiceDetail" data-args="'+esc(JSON.stringify([(s.invoiceId)]))+'">'+(inv?inv.invoiceNo:'')+'</a></td><td>'+fmtDate(s.saleDate)+'</td><td>'+pill(s.status,'green')+'</td></tr>'; });
    h+='</tbody></table></div>';
  } else if(_custDetailTab==='warranty'){
    h+='<div class="tablewrap"><table><thead><tr><th class="nosort">Serial</th><th class="nosort">Product</th><th class="nosort">Start</th><th class="nosort">Expiry</th><th class="nosort">Status</th><th class="nosort">Action</th></tr></thead><tbody>';
    if(!warranties.length) h+='<tr><td colspan="6"><div class="empty">No warranty records</div></td></tr>';
    warranties.forEach(w=>{ const s=byId(DB.equipmentSerials,w.serialId); const p=s?byId(DB.products,s.productId):null; const dleft=daysBetween(todayISO(),w.expiryDate);
      h+='<tr><td>'+(s?s.serial:'')+'</td><td>'+esc(p?p.name:'')+'</td><td>'+fmtDate(w.startDate)+'</td><td>'+fmtDate(w.expiryDate)+'</td><td>'+(dleft<0?pill('Expired','red'):pill('Active','green'))+'</td><td><button class="btn sm" data-act="gotoSales" data-args="[&quot;warranty&quot;]">Review</button></td></tr>'; });
    h+='</tbody></table></div>';
  } else if(_custDetailTab==='service'){
    h+='<div class="flexbar"><div></div><button class="btn primary sm" onclick="openServiceJobForm({customerId:\''+id+'\'})">+ Create Job Card</button></div>';
    h+='<div class="tablewrap"><table><thead><tr><th class="nosort">Job#</th><th class="nosort">Equipment</th><th class="nosort">Type</th><th class="nosort">Status</th><th class="nosort">Received</th><th class="nosort">Action</th></tr></thead><tbody>';
    if(!jobs.length) h+='<tr><td colspan="6"><div class="empty">No service jobs</div></td></tr>';
    jobs.forEach(j=>{ const s=byId(DB.equipmentSerials,j.serialId);
      h+='<tr><td>'+j.jobNo+'</td><td>'+(s?s.serial:'—')+'</td><td>'+esc(j.serviceType)+'</td><td>'+pill(j.status,j.status==='Open'?'amber':'green')+'</td><td>'+fmtDate(j.receivedDate)+'</td><td><button class="btn sm" data-act="openServiceJobDetail" data-args="'+esc(JSON.stringify([(j.id)]))+'">Open</button></td></tr>'; });
    h+='</tbody></table></div>';
  } else if(_custDetailTab==='repeat'){
    h+='<div class="tablewrap"><table><thead><tr><th class="nosort">Material</th><th class="nosort">Expected Qty</th><th class="nosort">Expected Date</th><th class="nosort">Confidence</th><th class="nosort">Action</th></tr></thead><tbody>';
    if(!opps.length) h+='<tr><td colspan="5"><div class="empty">No open opportunities</div></td></tr>';
    opps.forEach(o=>{ const m=byId(DB.materials,o.materialId); h+='<tr><td>'+esc(m?m.name:'')+'</td><td>'+o.expectedQty+' '+(m?m.unit:'')+'</td><td>'+fmtDate(o.expectedDate)+'</td><td>'+pill(o.confidence,o.confidence==='High'?'green':o.confidence==='Medium'?'amber':'gray')+'</td><td><button class="btn sm" data-act="gotoSales" data-args="[&quot;repeat&quot;]">Open in Repeat Sales</button></td></tr>'; });
    h+='</tbody></table></div>';
  } else if(_custDetailTab==='comm'){
    const timeline = comms.map(cm=>({date:cm.date, type:cm.type, summary:cm.summary, status:'Sent'}))
      .concat(plannedEng.map(m=>({date:m.plannedDate, type:'Engagement — '+m.category, summary:m.purpose+' via '+m.channel, status:'Planned'})))
      .sort((a,b)=>a.date<b.date?1:-1);
    h+='<div class="tablewrap"><table><thead><tr><th class="nosort">Date</th><th class="nosort">Type</th><th class="nosort">Summary</th><th class="nosort">Status</th></tr></thead><tbody>';
    if(!timeline.length) h+='<tr><td colspan="4"><div class="empty">No communication logged</div></td></tr>';
    timeline.forEach(cm=>{ h+='<tr><td>'+fmtDate(cm.date)+'</td><td>'+pill(cm.type,'blue')+'</td><td>'+esc(cm.summary)+'</td><td>'+pill(cm.status,cm.status==='Sent'?'green':'amber')+'</td></tr>'; });
    h+='</tbody></table></div>';
  }
  return h;
}
function setCustTab(id,t){ _custDetailTab=t; rerender(); document.getElementById('pagetitle').textContent='Customers — '+byId(DB.customers,id).name; }

/* === SECTION: RENDER - SALES === */

// Invoices / Repeat Sales / Warranty used to be four separate sidebar routes under a "Sales" group (Service
// Follow-ups has since moved to the Service tab, below — chasing scheduled visits is a service-ops task, not
// a selling motion) — consolidated into one nav item with tab buttons in the topbar, same pattern as
// Stores & Purchases, so the sidebar stays short.
// Sales people start at quotations, because that is where a sale begins.
// Everyone else starts at invoices, which is where the money is recorded.
let _salesView = 'invoices';
function defaultSalesView(){ return CURRENT_ROLE === 'sales' ? 'quotations' : 'invoices'; }
function setSalesView(v){ _salesView=v; rerender(); renderTopbarTabs(); }
function gotoSales(view){
  _salesView=view;
  // If already on the Sales page, changing the hash to the same value won't fire hashchange, so force
  // the re-render directly instead of relying on navigation.
  if(currentRouteKey()==='sales'){ rerender(); renderTopbarTabs(); }
  else navTo('sales');
}
function renderSalesHub(){
  if(_salesView==='quotations') return renderQuotations();
  if(_salesView==='receivables') return renderReceivables();
  if(_salesView==='repeat') return renderRepeatSales();
  if(_salesView==='warranty') return renderWarranty();
  return renderSalesInvoices();
}

/* ---- 12.1 SALES INVOICES ---- */
function renderSalesInvoices(){
  const rows = DB.salesInvoices.slice();
  const taxable = rows.reduce((s,i)=>s+(i.subTotal||0),0);
  const taxColl = rows.reduce((s,i)=>s+(i.taxTotal||0),0);
  let h='<div class="toolbar">'+
    '<div class="small muted" style="font-weight:600;">'+rows.length+' invoices &middot; '+fmtMoney(taxable)+' taxable &middot; '+fmtMoney(taxColl)+' GST collected</div>'+
    '<div style="flex:1;"></div>'+
    '<button class="btn primary" '+act('openInvoiceForm')+'>'+icon('plus',14)+' New sales invoice</button></div>';
  h += '<div class="tablewrap">'+renderTable('invtbl',[
    {key:'invoiceNo',label:'Invoice #',render:i=>'<a class="link" '+act('openInvoiceDetail',i.id)+'>'+esc(i.invoiceNo)+'</a>'},
    {key:'date',label:'Date',render:i=>fmtDate(i.date)},
    {key:'customer',label:'Customer',sort:false,exportVal:i=>{const c=byId(DB.customers,i.customerId);return c?c.name:'';},render:i=>{const c=byId(DB.customers,i.customerId);return c?'<a class="link" '+act('navTo','__customer:'+i.customerId)+'>'+esc(c.name)+'</a>':'—';}},
    {key:'subTotal',label:'Taxable',kind:'num',render:i=>fmtMoney(i.subTotal||0)},
    {key:'tax',label:'GST',kind:'num',sortVal:i=>i.taxTotal||0,render:i=>'<span class="small">'+fmtMoney(i.taxTotal||0)+'<div class="muted">'+(i.intraState?'CGST+SGST':'IGST')+'</div></span>'},
    {key:'total',label:'Invoice total',kind:'num',render:i=>'<b>'+fmtMoney(i.total)+'</b>'},
    {key:'bal',label:'Balance due',kind:'num',sortVal:i=>invBalance(i),render:i=>{const b=invBalance(i);return b>0.5?'<b style="color:var(--red);">'+fmtMoney(b)+'</b>':'<span class="muted small">settled</span>';}},
    {key:'paymentStatus',label:'Payment',sortVal:i=>invStatus(i),render:i=>invStatusPill(i)},
    {key:'act',label:'Action',sort:false,exportVal:()=>'',render:i=>
      (invBalance(i)>0.5?'<button class="btn sm primary" '+act('openPaymentForm',i.id)+'>Record payment</button> ':'')+
      '<button class="btn sm" '+act('printInvoiceDoc',i.id)+'>Print</button>'},
  ], rows, {defaultSort:'date',defaultDir:-1,title:'Sales Invoices',pageSize:30})+'</div>';
  window._lastTableRenderFn['invtbl']=rerender;
  return h;
}

    '<div><label>Credit period (days)</label><input id="iv_credit" type="number" value="'+settings().creditDays+'"/></div>'+
    '<div><label>Payment status</label><select id="iv_paystatus"><option value="Unpaid">Unpaid — bill on credit</option><option value="Part Paid">Advance received (50%)</option><option value="Paid">Paid in full</option></select></div></div>'+

      '<div><label>Type</label><select id="iv_newtype" onchange="renderInvLineFields()"><option value="equipment">Equipment (serialized)</option><option value="consumable">Consumable</option><option value="service">Service Charge</option></select></div>'+

    '<button class="btn sm" data-act="addInvLine">+ Add Line</button>'+
    '<div class="hr"></div><div id="iv_total"></div>',
    '<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveInvoice">Save Invoice</button>', true);

function renderInvLineFields(){
  const t=val('iv_newtype');
  const el=document.getElementById('iv_newitem');
  if(t==='equipment'){
    el.innerHTML='<label>Product</label><select id="iv_newprod" onchange="document.getElementById(\'iv_newrate\').value=DB.products.find(p=>p.id===this.value).price">'+DB.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' ('+fmtMoney(p.price)+')'+'</option>').join('')+'</select>';
    document.getElementById('iv_newrate').value = DB.products[0]?DB.products[0].price:0;
  } else if(t==='consumable'){
    el.innerHTML='<label>Material</label><select id="iv_newmat" onchange="document.getElementById(\'iv_newrate\').value=DB.materials.find(m=>m.id===this.value).lastRate">'+DB.materials.filter(m=>m.category==='Consumable').map(m=>'<option value="'+m.id+'">'+esc(m.name)+' (stock '+m.qty+')</option>').join('')+'</select>';
    const first=DB.materials.filter(m=>m.category==='Consumable')[0]; document.getElementById('iv_newrate').value=first?first.lastRate:0;
  } else {
    el.innerHTML='<label>Description</label><input id="iv_newdesc" placeholder="e.g. Installation & commissioning charge"/>';
    document.getElementById('iv_newrate').value=0;
  }
}
function addInvLine(){
  const t=val('iv_newtype'); const qty=num('iv_newqty')||1; const rate=num('iv_newrate')||0;
  if(t==='equipment'){ const p=byId(DB.products,val('iv_newprod'));
    const ps=prodStockRow(p.id); const avail=Math.max(0,(ps.finishedQty||0)-(ps.reservedQty||0));
    if(qty>avail){ if(!confirm('Quantity ('+qty+') exceeds available finished stock ('+avail+' unit(s) in Production Stock). Add anyway?')) return; }
    _invLines.push({type:'equipment',productId:p.id,label:p.name,qty,rate}); }
  else if(t==='consumable'){ const m=byId(DB.materials,val('iv_newmat'));
    if(qty>m.qty){ if(!confirm('Quantity ('+qty+') exceeds current stock ('+m.qty+' '+m.unit+'). Add anyway?')) return; }
    _invLines.push({type:'consumable',materialId:m.id,label:m.name,qty,rate}); }
  else { _invLines.push({type:'service',description:val('iv_newdesc')||'Service charge',label:val('iv_newdesc')||'Service charge',qty,rate}); }
  renderInvLinesArea();
}
function removeInvLine(idx){ _invLines.splice(idx,1); renderInvLinesArea(); }
function renderInvLinesArea(){
  // Priced live against the selected customer, so switching from a Telangana
  // buyer to an out-of-state one visibly flips CGST+SGST to IGST before saving.
  const doc = priceDocument(_invLines, byId(DB.customers, val('iv_customer')));
  let h='<table><thead><tr><th class="nosort">Item</th><th class="nosort">HSN</th><th class="nosort">Qty</th><th class="nosort">Rate</th><th class="nosort">Taxable</th><th class="nosort">GST</th><th class="nosort">Line total</th><th class="nosort"></th></tr></thead><tbody>';
  doc.lines.forEach((l,idx)=>{ h+='<tr><td>'+esc(l.label)+' <span class="tag">'+l.type+'</span></td><td class="small">'+l.hsn+'</td><td>'+l.qty+'</td><td>'+fmtMoney(l.rate)+'</td><td>'+fmtMoney(l.taxable)+'</td><td class="small">'+fmtMoney(l.tax)+' <span class="muted">@'+l.gstRate+'%</span></td><td><b>'+fmtMoney(l.total)+'</b></td><td><span class="closex" style="font-size:15px;" '+act('removeInvLine',idx)+'>&times;</span></td></tr>'; });
  if(!_invLines.length) h+='<tr><td colspan="8" class="muted small">No lines added yet</td></tr>';
  h+='</tbody></table>';
  document.getElementById('iv_linesArea').innerHTML=h;
  const t=document.getElementById('iv_total'); if(t) t.innerHTML=docTotalsBlock(doc);
}
function saveInvoice(){
  if(!_invLines.length){ toast('Add at least one line item'); return; }
  const inv = makeSaleInvoice(DB,{customerId:val('iv_customer'), date:val('iv_date'), lines:_invLines,
    paymentStatus: val('iv_paystatus')||'Unpaid', creditDays: num('iv_credit')||settings().creditDays});
  const c=byId(DB.customers, inv.customerId);
  audit('Created','Invoice',inv.id, inv.invoiceNo+' — '+(c?c.name:'')+' — '+fmtMoney(inv.total));
  recomputeAlertsAndTasks(DB); save(); closeModal();
  toast('Invoice '+inv.invoiceNo+' created — '+fmtMoney(inv.total)+' incl. GST; serials, warranty and service schedules generated');
  rerender();
}
function openInvoiceDetail(id){
  const i=byId(DB.salesInvoices,id); if(!i) return;
  const c=byId(DB.customers,i.customerId);
  const q=(DB.quotations||[]).find(x=>x.convertedInvoiceId===i.id);
  let h='<div class="detailgrid">'+
    '<div><div class="dl">Customer</div><div class="dv">'+esc(c?c.name:'—')+'</div></div>'+
    '<div><div class="dl">Invoice date</div><div class="dv">'+fmtDate(i.date)+'</div></div>'+
    '<div><div class="dl">Due date</div><div class="dv">'+fmtDate(invDueDate(i))+(invDaysOverdue(i)?' <span class="pill pill-red">'+invDaysOverdue(i)+'d late</span>':'')+'</div></div>'+
    '<div><div class="dl">Status</div><div class="dv">'+invStatus(i)+'</div></div>'+
    '<div><div class="dl">Customer GSTIN</div><div class="dv">'+esc((c&&c.gst)||'not registered')+'</div></div>'+
    '<div><div class="dl">Place of supply</div><div class="dv">'+esc(i.placeOfSupply||'—')+'</div></div>'+
  '</div>';
  if(q) h+='<div class="small muted" style="margin-top:8px;">Raised from quotation <b>'+esc(q.quoteNo)+'</b></div>';
  h+='<div class="hr"></div><table><thead><tr><th class="nosort">Item</th><th class="nosort">HSN</th><th class="nosort">Qty</th><th class="nosort">Rate</th><th class="nosort">Taxable</th><th class="nosort">GST</th><th class="nosort">Total</th><th class="nosort">Serial(s)</th></tr></thead><tbody>';
  i.lines.forEach(l=>{
    let label='', serials='';
    if(l.type==='equipment'){ const p=byId(DB.products,l.productId); label=(p?p.name:'')+' <span class="tag">equipment</span>';
      serials = DB.equipmentSerials.filter(s=>s.invoiceId===i.id && s.productId===l.productId).map(s=>s.serial).join(', '); }
    else if(l.type==='consumable'){ const m=byId(DB.materials,l.materialId); label=(m?m.name:'')+' <span class="tag">consumable</span>'; serials='—'; }
    else { label=(l.description||'Service')+' <span class="tag">service</span>'; serials='—'; }
    h+='<tr><td>'+label+'</td><td class="small">'+(l.hsn||'—')+'</td><td>'+l.qty+'</td><td>'+fmtMoney(l.rate)+'</td><td>'+fmtMoney(l.taxable==null?l.qty*l.rate:l.taxable)+'</td><td class="small">'+fmtMoney(l.tax||0)+' <span class="muted">@'+(l.gstRate||0)+'%</span></td><td><b>'+fmtMoney(l.total)+'</b></td><td class="small">'+serials+'</td></tr>';
  });
  h+='</tbody></table>';
  h+=gstTotalsHtml(i)+docTotalsBlock(i);
  const refund=invRefundDue(i);
  if(refund>0) h+='<div class="warnbox" style="margin-top:12px;">'+icon('alerttri',16)+'<div><b>'+fmtMoney(refund)+' is owed back to this customer.</b> They paid in full and a credit note was raised afterwards, so this is a refund due — not a settled invoice.</div></div>';
  const pays=invPayments(i);
  h+='<div class="hr"></div><b class="small">Receipts</b>';
  if(!pays.length) h+='<div class="empty" style="padding:16px;">Nothing received against this invoice yet.</div>';
  else h+='<table style="margin-top:6px;"><thead><tr><th class="nosort">Date</th><th class="nosort">Amount</th><th class="nosort">Mode</th><th class="nosort">Reference</th><th class="nosort">Recorded by</th></tr></thead><tbody>'+
    pays.map(p=>'<tr><td>'+fmtDate(p.date)+'</td><td><b>'+fmtMoney(p.amount)+'</b></td><td>'+esc(p.mode)+'</td><td class="small">'+esc(p.ref||'—')+'</td><td class="small muted">'+esc(p.byName||'—')+'</td></tr>').join('')+
    '<tr><td colspan="4" style="text-align:right;"><b>Balance due</b></td><td><b style="color:'+(invBalance(i)>0.5?'var(--red)':'var(--green)')+';">'+fmtMoney(invBalance(i))+'</b></td></tr></tbody></table>';
  openModal('Tax Invoice '+i.invoiceNo, h,
    '<button class="btn" '+act('closeModal')+'>Close</button>'+
    '<button class="btn" '+act('printInvoiceDoc',i.id)+'>Print / PDF</button>'+
    (needsEwayBill(i)?'<button class="btn'+(ewayFor(i.id)?'':' danger')+'" '+act('openEwayForm',i.id)+'>'+(ewayFor(i.id)?'E-way bill':'E-way bill needed')+'</button>':'')+
    '<button class="btn" '+act('openCreditNoteForm',i.id)+'>Sales return</button>'+
    (invBalance(i)>0.5?'<button class="btn primary" '+act('openPaymentForm',i.id)+'>Record payment</button>':'')+
    (c?'<button class="btn" '+act('gotoCustomerFromModal',c.id)+'>View customer</button>':''), 'xl');
}

/* ---- 12.2 REPEAT SALES ---- */
let _repeatSearch='';
let _repeatFilter='All';
let _repeatViewMode='customer'; // 'customer' (who to call) or 'product' (which item, who needs it)
// Where the prediction date comes from: the customer's actual last purchase of this material if we have one on
// record. If they've never bought it before (only predicted because they bought equipment that consumes it),
// this is null — shown as a blank dash, not a made-up label.
function lastPurchaseDateFor(customerId, materialId){
  let last=null;
  DB.salesInvoices.forEach(inv=>{
    if(inv.customerId!==customerId) return;
    inv.lines.forEach(l=>{ if(l.type==='consumable' && l.materialId===materialId){ if(!last || inv.date>last) last=inv.date; } });
  });
  return last;
}
function repeatOppUrgency(o){
  const d=daysBetween(todayISO(), o.expectedDate);
  if(d<0) return 'Overdue';
  if(d<=7) return 'Due This Week';
  if(d<=30) return 'Due This Month';
  return 'Upcoming';
}

function equipmentDrivingConsumable(customerId, materialId){
  return DB.equipmentSerials.filter(s=>s.customerId===customerId).map(s=>{
    const p=byId(DB.products,s.productId);

  }).filter(Boolean);
}

/* ---- 12.3 WARRANTY ---- */
/* ---- 12.3 WARRANTY & SERVICE COVERAGE ----
   Redesigned to be a real coverage register, not just an "expiring soon" worklist: every piece of equipment ever
   sold shows up, grouped by customer, with warranty status AND service compliance side by side — because both
   things vary independently (a unit can be well inside warranty but overdue for its Service 1 check, or out of
   warranty but the customer still comes in reliably for service). Status/search let you narrow down when you only
   care about what's expiring, expired, or falling behind on service. ---- */
let _warrCustSearch='';
let _warrStatusFilter='All';
// Deliberately binary by design (per feedback): a warranty is either Active or Expired, full stop — no "Expiring
// Soon" middle tier or day-count framing cluttering the table. serviceOverdue/overdueVisit are kept on the
// object because Service Follow-ups (a separate, action-oriented page) still needs to know what to chase; they
// are just no longer surfaced as "overdue" language on Warranty/Service Track, which are coverage/reference views.
function warrantyItems(){
  const T=todayISO();
  return DB.warrantyRecords.map(w=>{
    const s=byId(DB.equipmentSerials,w.serialId); const p=s?byId(DB.products,s.productId):null; const c=s?byId(DB.customers,s.customerId):null;
    const sched=DB.serviceSchedules.find(sc=>sc.serialId===w.serialId);
    const daysLeft=daysBetween(T,w.expiryDate);
    const status = daysLeft<0 ? 'Expired' : 'Active';
    const overdueVisit = sched ? (sched.visits||[]).find(v=>v.status==='Pending' && v.dueDate<=T) : null;
    return {w,s,p,c,sched,daysLeft,status,serviceOverdue:!!overdueVisit,overdueVisit};
  }).filter(x=>x.s && x.p && x.c);
}
function renderWarranty(){
  const items=warrantyItems();
  const totalEquip=items.length;
  const activeCount=items.filter(x=>x.status==='Active').length;
  const expiredCount=items.filter(x=>x.status==='Expired').length;
  const pendingServiceCount=items.filter(x=>x.serviceOverdue).length;
  const T=todayISO();
  const totalVisitsDue=items.reduce((s,x)=>s+(x.sched?(x.sched.visits||[]).filter(v=>v.dueDate<=T).length:0),0);
  const doneVisits=items.reduce((s,x)=>s+(x.sched?(x.sched.visits||[]).filter(v=>v.status==='Done').length:0),0);
  const complianceRate=totalVisitsDue?Math.round(doneVisits/totalVisitsDue*100):100;
  const custCount=new Set(items.map(x=>x.c.id)).size;
  const rstats=serviceRepairStats();

  const kpis=[
    {label:'Equipment Tracked', val:totalEquip, sub:'across '+custCount+' customers', ic:'shieldcheck', color:'var(--primary-600)', bg:'var(--primary-100)'},
    {label:'Active', val:activeCount, sub:'coverage in force', ic:'checkcircle', color:'var(--green)', bg:'var(--green-100)'},
    {label:'Expired', val:expiredCount, sub:'no active coverage', ic:'alerttri', color:expiredCount>0?'var(--red)':'var(--green)', bg:expiredCount>0?'var(--red-100)':'var(--green-100)'},
    {label:'Service Compliance', val:complianceRate+'%', sub:doneVisits+' of '+totalVisitsDue+' due visits completed', ic:'wrench', color:complianceRate>=60?'var(--green)':'var(--amber)', bg:complianceRate>=60?'var(--green-100)':'var(--amber-100)'},
  ];
  let h='<div class="section-title">Warranty &amp; Service Coverage <span class="hint">Every unit sold, grouped by customer — coverage status for reference; to act on a due visit, see Service Follow-ups</span></div>';
  h+='<div class="grid g4">'+kpis.map(k=>
    '<div class="kpi"><div class="kpitop">'+iconChip(k.ic,k.color,k.bg)+'</div>'+
    '<div class="label" style="margin-top:10px;">'+esc(k.label)+'</div><div class="val">'+k.val+'</div><div class="sub">'+esc(k.sub)+'</div></div>'
  ).join('')+'</div>';

  const rkpis=[
    {label:'Repairs — In Warranty', val:rstats.repairWithin, sub:'free repairs', ic:'shieldcheck', color:'var(--green)', bg:'var(--green-100)'},
    {label:'Repairs — After Warranty', val:rstats.repairAfter, sub:'chargeable repairs', ic:'alerttri', color:'var(--amber)', bg:'var(--amber-100)'},
    {label:'Paid Services/Visits', val:rstats.paidVisits, sub:fmtMoney(rstats.paidRevenue)+' collected', ic:'bag', color:'var(--primary-600)', bg:'var(--primary-100)'},
    {label:'Free Services/Visits', val:rstats.freeVisits, sub:'no charge to customer', ic:'wrench', color:'var(--green)', bg:'var(--green-100)'},
  ];
  h+='<div class="grid g4" style="margin-top:10px;">'+rkpis.map(k=>
    '<div class="kpi"><div class="kpitop">'+iconChip(k.ic,k.color,k.bg)+'</div>'+
    '<div class="label" style="margin-top:10px;">'+esc(k.label)+'</div><div class="val">'+k.val+'</div><div class="sub">'+esc(k.sub)+'</div></div>'
  ).join('')+'</div>';

  h+='<div class="toolbar" style="margin-top:20px;"><input class="searchbox" placeholder="Search by customer, product, or serial..." value="'+esc(_warrCustSearch)+'" oninput="setWarrSearch(this.value)"/><button class="btn" data-act="gotoServiceFollowups">Service Follow-ups &amp; Reminders</button></div>';
  const statusTabs=['All','Active','Expired','Pending Service'];
  h+='<div class="filterbar">'+statusTabs.map(s=>{ const cnt = s==='All'?totalEquip:(s==='Pending Service'?pendingServiceCount:items.filter(x=>x.status===s).length);
    return '<div class="subtab'+(s===_warrStatusFilter?' active':'')+'" data-act="setWarrFilter" data-args="'+esc(JSON.stringify([(s)]))+'">'+esc(s)+' ('+cnt+')</div>'; }).join('')+'</div>';

  h+='<div id="warrGroupsArea">'+renderWarrantyGroups(items)+'</div>';
  h+=renderCalibrationSection();
  return h;

/* ---- SERVICE FOLLOW-UPS (moved here from Sales — chasing the two scheduled visits is service-ops work, not
   a selling motion) ----
   Two separate questions, tracked separately: did we message them (reminderSent — an action we took), and what
   did they actually say back (contactStatus — the thing the office needs to know to plan its week). Our job is
   to intimate the customer that a visit is due; whether they act on it is on them, so "Not Contacted" is the
   only state that's really our fault to fix. Structurally isolated from repairs: this page only ever reads
   DB.serviceSchedules (Service 1/2), never DB.serviceJobs directly, so a breakdown call has no way to land here
   — those live on Job Cards. */
const VISIT_CONTACT_STATUSES=['Not Contacted','Message Sent','Confirmed','Declined','No Response'];
function visitContactStatus(v){ return (v && v.contactStatus) || 'Not Contacted'; }
function contactStatusPill(status){
  const map={'Not Contacted':'red','Message Sent':'amber','Confirmed':'green','Declined':'gray','No Response':'red'};
  return pill(status, map[status]||'gray');
}
// Chargeable is a plain in-warranty/out-of-warranty fact worth showing; the actual amount isn't — it depends on
// what the visit turns up, so a fixed number here would just be wrong. Keep it to the fact, not a figure.
function chargeCell(chargeable){ return chargeable ? pill('Chargeable','amber') : pill('Free','green'); }
// Buckets the office actually plans around — the exact due day rarely matters on a 4-month cadence; the month
// does. "Overdue" = its month has already passed with the visit still not done; "This Month" = the active
// worklist; "Upcoming" = too early to chase yet.
function fuBucket(dueDate){
  const cur=todayISO().slice(0,7), vm=dueDate.slice(0,7);
  if(vm<cur) return 'Overdue';
  if(vm===cur) return 'This Month';
  return 'Upcoming';
}
let _fuBucket='Overdue';
function setFuBucket(b){ _fuBucket=b; rerender(); }
// Second, simpler cut through the same list — every business needs this base split regardless of which month
// bucket it's looking at: have we reached this person at all, or not.
let _fuContactFilter='All'; // 'All' | one of VISIT_CONTACT_STATUSES — differentiated so Declined and No Response
// (which both need a very different next action than a plain Confirmed) don't get lumped together as "Contacted"
function setFuContactFilter(v){ _fuContactFilter=v; rerender(); }
function setVisitContactStatus(schId, seq, status, notes){
  const sc=byId(DB.serviceSchedules,schId); if(!sc) return;
  const v=(sc.visits||[]).find(vv=>vv.seq===seq); if(!v) return;
  const s=byId(DB.equipmentSerials,sc.serialId); const c=s?byId(DB.customers,s.customerId):null; const p=s?byId(DB.products,s.productId):null;
  v.contactStatus=status;
  if(notes!==undefined) v.contactNotes=notes;
  if(status!=='Not Contacted' && !v.reminderSent) v.reminderSent=todayISO();
  if(c) DB.communications.push({id:uid('COM'),entityType:'customer',entityId:c.id,type:'Service Follow-up',date:todayISO(),
    summary:'Follow-up status set to "'+status+'"'+(v.contactNotes?' — '+v.contactNotes:'')+' — '+(p?p.name+' ':'')+'('+(s?s.serial:'')+'), Service '+seq});
  save(); toast('Status updated'); rerender();
}
// A status dropdown alone loses the actual conversation — "hey, what happened when you called them" needs an
// answer, not just a label. This captures that answer alongside the status.
function openLogContact(schId, seq){
  const sc=byId(DB.serviceSchedules,schId); if(!sc) return;
  const v=(sc.visits||[]).find(vv=>vv.seq===seq); if(!v) return;

    '<div class="formrow full"><div><label>Contact status</label><select id="lc_status">'+VISIT_CONTACT_STATUSES.map(st=>'<option'+(st===visitContactStatus(v)?' selected':'')+'>'+st+'</option>').join('')+'</select></div></div>'+
    '<div class="formrow full"><div><label>What did they say?</label><textarea id="lc_notes" placeholder="e.g. will get it serviced by their in-house team, asked us to call back next week...">'+esc(v.contactNotes||'')+'</textarea></div></div>',
    '<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveContactLog" data-args="'+esc(JSON.stringify([(schId),(seq)]))+'">Save</button>');
