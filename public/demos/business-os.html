}
function svgLineChart(data, opts){
  // data: [{label, value}] — a genuine trend line (real <svg> path), for time-series data. Not for categorical comparisons.
  opts=opts||{};
  if(!data || !data.length) return '<div class="empty">No data yet</div>';
  const fmt = opts.fmt || (v=>v);
  const W=640, H=190, padL=46, padR=16, padT=20, padB=28;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const vals=data.map(d=>Number(d.value)||0);
  let min=Math.min(...vals), max=Math.max(...vals);
  if(min===max){ const pad=Math.max(1, Math.abs(min)*0.15||1); min-=pad; max+=pad; }
  const n=data.length;
  const xOf = i => n===1 ? padL+innerW/2 : padL + (innerW*i/(n-1));
  const yOf = v => padT + innerH - ((v-min)/(max-min))*innerH;
  const pts = data.map((d,i)=>({x:xOf(i), y:yOf(Number(d.value)||0), d}));
  const linePath = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const baseY=(padT+innerH).toFixed(1);
  const areaPath = linePath+' L'+pts[pts.length-1].x.toFixed(1)+','+baseY+' L'+pts[0].x.toFixed(1)+','+baseY+' Z';
  let grid='';
  [max, (max+min)/2, min].forEach(gv=>{
    const gy=yOf(gv);
    grid+='<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="var(--ink-100)" stroke-width="1"/>';
    grid+='<text x="'+(padL-8)+'" y="'+(gy+3.5).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="var(--ink-500)">'+esc(String(fmt(Math.round(gv*100)/100)))+'</text>';
  });
  const labelEvery = n<=7?1:Math.ceil(n/7);
  let labels='';
  pts.forEach((p,i)=>{
    if(i%labelEvery===0 || i===n-1){
      labels+='<text x="'+p.x.toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-500)">'+esc(p.d.label)+'</text>';
    }
  });
  let markers='';
  pts.forEach(p=>{
    const tip='<title>'+esc(p.d.label)+': '+esc(String(fmt(p.d.value)))+'</title>';
    // small visible marker (decorative) plus a larger invisible circle on top purely to make hovering easy
    markers+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.5" fill="#fff" stroke="var(--primary)" stroke-width="2.2"/>'+
      '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="9" fill="transparent">'+tip+'</circle>';
  });
  const lastP=pts[pts.length-1];
  const lastAnchor = lastP.x > W-80 ? 'end' : (lastP.x < 80 ? 'start' : 'middle');
  const lastLabelY = lastP.y<padT+16 ? lastP.y+16 : lastP.y-10;
  const lastLabel='<text x="'+lastP.x.toFixed(1)+'" y="'+lastLabelY.toFixed(1)+'" text-anchor="'+lastAnchor+'" font-size="11.5" font-weight="700" fill="var(--ink-900)">'+esc(String(fmt(lastP.d.value)))+'</text>';
  return '<svg class="line-chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+
    grid+
    '<path d="'+areaPath+'" fill="var(--primary-100)" stroke="none"/>'+
    '<path d="'+linePath+'" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    markers+labels+lastLabel+
    '</svg>';
}
function svgMultiLineChart(series, opts){
  // series: [{name, color, data:[{label,value}]}] — every series shares the same x-axis positions (same length/labels).
  // Built for overlays like "manufacturing cost vs selling price" where the gap between lines IS the insight.
  opts=opts||{};
  if(!series || !series.length || !series[0].data || !series[0].data.length) return '<div class="empty">No data yet</div>';
  const fmt = opts.fmt || (v=>v);
  const W=640, H=210, padL=50, padR=16, padT=20, padB=44;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const n=series[0].data.length;
  const allVals=[]; series.forEach(s=>s.data.forEach(d=>allVals.push(Number(d.value)||0)));
  let min=Math.min(...allVals), max=Math.max(...allVals);
  if(min===max){ const pad=Math.max(1,Math.abs(min)*0.15||1); min-=pad; max+=pad; }
  const breathe=(max-min)*0.1; max+=breathe; min=Math.max(0,min-breathe);
  const xOf = i => n===1 ? padL+innerW/2 : padL+(innerW*i/(n-1));
  const yOf = v => padT+innerH-((v-min)/(max-min||1))*innerH;
  let grid='';
  [max,(max+min)/2,min].forEach(gv=>{
    const gy=yOf(gv);
    grid+='<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="var(--ink-100)" stroke-width="1"/>';
    grid+='<text x="'+(padL-8)+'" y="'+(gy+3.5).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="var(--ink-500)">'+esc(String(fmt(Math.round(gv))))+'</text>';
  });
  const labelEvery = n<=7?1:Math.ceil(n/7);
  let labels='';
  series[0].data.forEach((d,i)=>{
    if(i%labelEvery===0 || i===n-1){
      labels+='<text x="'+xOf(i).toFixed(1)+'" y="'+(H-26)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-500)">'+esc(d.label)+'</text>';
    }
  });
  let paths='', markers='';
  series.forEach(s=>{
    const pts=s.data.map((d,i)=>({x:xOf(i),y:yOf(Number(d.value)||0),d}));
    const linePath=pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
    paths+='<path d="'+linePath+'" fill="none" stroke="'+s.color+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach(p=>{
      const tip='<title>'+esc(s.name)+' — '+esc(p.d.label)+': '+esc(String(fmt(p.d.value)))+'</title>';
      markers+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3" fill="#fff" stroke="'+s.color+'" stroke-width="2"/>'+
        '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="8" fill="transparent">'+tip+'</circle>';
    });
  });
  const legend='<div style="display:flex;gap:16px;justify-content:center;margin-top:4px;">'+series.map(s=>
    '<span class="small" style="display:inline-flex;align-items:center;gap:6px;color:var(--ink-700);"><span style="width:9px;height:9px;border-radius:50%;background:'+s.color+';display:inline-block;"></span>'+esc(s.name)+'</span>'
  ).join('')+'</div>';
  return '<svg class="line-chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+grid+paths+markers+labels+'</svg>'+legend;
}
// A genuine sales funnel: each stage drawn as a trapezoid whose width is proportional to how many leads have
// reached at least that far, narrowing left-to-right — not just a bar chart relabelled. Shows the count AND the
// stage-to-stage drop-off %, which is the number that actually tells you where the pipeline is leaking.
// Colour ramp shared by the funnel SVG and its HTML legend below — cool blue at the wide/entry end warming to
// green at Won, so the shape itself reads as "further along = closer to the money" even before you read a number.
function funnelStageColor(i, n){
  const t = n<=1 ? 0 : i/(n-1);
  const hue = 214 - t*62; // 214 = brand blue, ~152 = green
  return 'hsl('+hue.toFixed(0)+',62%,'+(45+t*5).toFixed(0)+'%)';
}
function svgFunnelChart(stages){
  // stages: [{label, value}] in funnel order, value = count of leads that reached this stage or further.
  // Drawn as ONE continuous horizontal cone — wide at the entry stage, narrowing seamlessly stage by stage,
  // tapering to an actual point at the end. A real funnel/triangle, not stacked bars.
  if(!stages || !stages.length) return '<div class="empty">No pipeline data yet</div>';
  const N=stages.length, W=720, padX=8, bodyH=150, topY=10;
  const H = topY+bodyH+20;
  const colW = (W-padX*2)/N;
  const maxV = Math.max(1, ...stages.map(s=>s.value));
  const minH = 14; // px floor so a small-but-real stage count never visually disappears
  const heightFor = v => Math.max(minH, (v/maxV)*bodyH);
  const midY = topY+bodyH/2;
  let shapes='';
  for(let i=0;i<N;i++){
    const leftH = heightFor(stages[i].value);
    const isLast = i===N-1;
    const rightH = isLast ? 0 : heightFor(stages[i+1].value);
    const x0=padX+i*colW, x1=padX+(i+1)*colW;
    const ly0=midY-leftH/2, ly1=midY+leftH/2, ry0=midY-rightH/2, ry1=midY+rightH/2;
    const fill=funnelStageColor(i,N);
    const pts = isLast
      ? [[x0,ly0],[x1,midY],[x0,ly1]]           // final stage tapers to a genuine point — the funnel's tip
      : [[x0,ly0],[x1,ry0],[x1,ry1],[x0,ly1]];
    shapes += '<polygon points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="'+fill+'" stroke="#fff" stroke-width="2.5"><title>'+esc(stages[i].label)+': '+stages[i].value+' lead'+(stages[i].value===1?'':'s')+'</title></polygon>';
    const cx=(x0+x1)/2;
    if(leftH>=22 || !isLast) shapes += '<text x="'+cx.toFixed(1)+'" y="'+(midY+4.5).toFixed(1)+'" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">'+stages[i].value+'</text>';
  }
  return '<svg class="funnel-chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+shapes+'</svg>';
}
// HTML legend under the funnel shape — real stage names read far better as wrapping HTML text than crammed into
// narrow SVG columns, and each chip's top border repeats the segment's colour so the two visually lock together.
function funnelLegend(stages){
  const N=stages.length;
  return '<div class="funnel-legend">'+stages.map((s,i)=>{
    const dropPct = i===0? null : (stages[i-1].value? Math.round((s.value/stages[i-1].value)*100) : 0);
    const dropColor = dropPct==null?'var(--ink-500)':(dropPct>=70?'var(--green)':dropPct>=40?'var(--amber)':'var(--red)');
    return '<div class="funnel-legend-chip" style="border-top-color:'+funnelStageColor(i,N)+';">'+
      '<div class="fl-name">'+esc(s.label)+'</div>'+
      '<div class="fl-drop" style="color:'+dropColor+';">'+(dropPct==null?'start':dropPct+'%')+'</div>'+
      '</div>';
  }).join('')+'</div>';
}

// ---- SALES INVOICE (shared function used by Sales>Invoices AND Repeat Sales) ----
function makeSaleInvoice(db, opts){
  const inv = {id:uid('INV'), invoiceNo:nextInvoiceNo(), customerId:opts.customerId, date:opts.date||todayISO(),
    lines:[], total:0, paymentStatus: opts.paymentStatus || 'Paid'};
  opts.lines.forEach(l=>{
    const line = {type:l.type, qty:l.qty, rate:l.rate, total:l.qty*l.rate};
    if(l.type==='equipment'){
      const p = byId(db.products,l.productId);
      line.productId = l.productId;
      // debit finished-goods stock for the units being sold — this is what makes Production Stock a real
      // ledger instead of a manually-typed number that silently drifts from reality.
      let psRow = db.productionStock.find(r=>r.productId===p.id);
      if(!psRow){ psRow={id:'PS-'+p.id,productId:p.id,semiQty:0,qcPending:0,finishedQty:0,reservedQty:0,reservedNote:''}; db.productionStock.push(psRow); }
      psRow.finishedQty = Math.max(0, (psRow.finishedQty||0) - l.qty);
      for(let i=0;i<l.qty;i++){
        const serial = nextSerial(p.code);
        const serialRec = {id:uid('SER'),serial,productId:p.id,customerId:opts.customerId,invoiceId:inv.id,saleDate:inv.date,status:'Active'};
        db.equipmentSerials.push(serialRec);
        const warrExpiry = addMonths(inv.date, p.warrantyMonths||12);
        db.warrantyRecords.push({id:uid('WAR'),serialId:serialRec.id,startDate:inv.date,expiryDate:warrExpiry,status:'Active',condition:'',lastReview:'',nextAction:'',reviewLog:[]});
        // Two scheduled service visits — Service 1 at 4 months, Service 2 at 8 months — free while still within
        // warranty, chargeable once past it. That's the whole pre-set cadence; anything beyond it is occurrence-
        // based (a job card opened as needed), not a recurring schedule.
        db.serviceSchedules.push({id:uid('SCH'),serialId:serialRec.id,warrantyExpiry:warrExpiry,
          visits: generateInitialVisits(inv.date, warrExpiry)});
        // Calibration certificate — required for measurement-type instruments (e.g. Gauss Meter) so the customer
        // has traceable proof for their own audits/tenders. Issued at time of sale, factory-calibrated.
        if(p.calibration){
          db.calibrationRecords.push({id:uid('CAL'), serialId:serialRec.id, certNo:'CAL-'+serial,
            issueDate:inv.date, calibratedBy:'SIMS Calibration Lab', standard:'Traceable to national reference standard',
            validUntil:addMonths(inv.date, CALIBRATION_INTERVAL_MONTHS)});
        }
        // consumable opportunity for compatible consumables
        (p.compatibleConsumables||[]).forEach(mid=>{
          createRepeatOpportunity(db, opts.customerId, mid, inv.date);
        });
      }
    } else if(l.type==='consumable'){
      const mat = byId(db.materials,l.materialId);
      line.materialId = l.materialId;
      if(mat){ mat.qty = Math.max(0,(mat.qty||0)-l.qty); }
      // complete existing open opportunity for this customer+material, then create the next one
      const openOpp = db.repeatOpportunities.find(o=>o.customerId===opts.customerId && o.materialId===l.materialId && o.status==='Open');
      if(openOpp){ openOpp.status='Fulfilled'; openOpp.fulfilledInvoiceId=inv.id; completeTasksByRef(db,'repeatOpp',openOpp.id,'Consumable sale recorded'); }
      createRepeatOpportunity(db, opts.customerId, l.materialId, inv.date, l.qty);
    } else if(l.type==='service'){
      line.description = l.description||'Service charge';
    }
    inv.total += line.total;
    inv.lines.push(line);
  });
  // v1.1 — price the document with GST and open its payment ledger. Sits here so
  // that every invoice in the system, including the seeded history, has a proper
  // tax breakup and a real receivables balance rather than a Paid/Unpaid flag.
  applyGstToInvoice(db, inv, opts);
  db.salesInvoices.push(inv);
  db.communications.push({id:uid('COM'),entityType:'customer',entityId:opts.customerId,type:'Invoice',date:inv.date,summary:'Sales invoice '+inv.invoiceNo+' — '+fmtMoney(inv.total)});
  return inv;
}

// ---- REPEAT-SALES PREDICTION (shared) ----
const CONSUMPTION_PROFILE = {
  'MAT-C1':{intervalDays:75, qty:12, unit:'Can'}, 'MAT-C2':{intervalDays:90, qty:6, unit:'Can'},
  'MAT-C3':{intervalDays:60, qty:8, unit:'Bottle'}, 'MAT-C4':{intervalDays:100, qty:5, unit:'Kg'},
  'MAT-C5':{intervalDays:120, qty:3, unit:'Kg'}, 'MAT-C6':{intervalDays:110, qty:4, unit:'Bottle'},
  'MAT-C7':{intervalDays:150, qty:1, unit:'Pair'}, 'MAT-C8':{intervalDays:95, qty:2, unit:'Can'},
  'MAT-C9':{intervalDays:100, qty:3, unit:'Bottle'}
};
function createRepeatOpportunity(db, customerId, materialId, fromDate, lastQty){
  const prof = CONSUMPTION_PROFILE[materialId]; if(!prof) return;
  // avoid duplicate open opportunity for same customer+material
  const exists = db.repeatOpportunities.find(o=>o.customerId===customerId && o.materialId===materialId && o.status==='Open');
  if(exists) return;
  const expectedDate = addDays(fromDate, prof.intervalDays);
  const confidence = lastQty ? 'High' : 'Medium';
  db.repeatOpportunities.push({id:uid('OPP'),customerId,materialId,expectedQty:lastQty||prof.qty,
    expectedDate, confidence, status:'Open', createdAt:fromDate});
}

// ---- PURCHASES / RFQ WORKFLOW (shared) ----
function makePurchase(db, opts){
  const pur = {id:uid('PUR'), invoiceNo:opts.invoiceNo||('PO-'+uid('')), supplierId:opts.supplierId, date:opts.date||todayISO(),
    lines:[], total:0, status: opts.received? 'Received':'Pending', attachments:opts.attachments||[], rfqId:opts.rfqId||null, paymentStatus:opts.paymentStatus||'Pending'};
  opts.lines.forEach(l=>{
    const total=l.qty*l.rate;
    pur.lines.push({materialId:l.materialId, qty:l.qty, unit: (byId(db.materials,l.materialId)||{}).unit||'', rate:l.rate, total});
    pur.total += total;
  });
  // v1.2 — price the supplier's bill with GST and work out how much of that
  // tax is actually claimable back as input credit.
  applyGstToPurchase(db, pur);
  pur._gstApplied = true;
  db.purchases.push(pur);
  // The rate is locked in the moment a purchase invoice/PO is placed with the supplier — that's a real
  // committed cost regardless of when the goods physically arrive, so cost tracking (Last Rate, Cost
  // Trend, weighted-avg, BOM costing) has to reflect it immediately, not wait for receipt. Only the
  // physical stock quantity waits for actual receipt.
  recordPurchasePricing(db, pur);
  if(opts.received){ receivePurchase(db, pur); }
  const sup = byId(db.suppliers,opts.supplierId);
  if(sup) db.communications.push({id:uid('COM'),entityType:'supplier',entityId:sup.id,type:'Purchase',date:pur.date,summary:'Purchase '+pur.invoiceNo+' — '+fmtMoney(pur.total)});
  return pur;
}
function recordPurchasePricing(db, pur){
  pur.lines.forEach(l=>{
    const mat = byId(db.materials,l.materialId); if(!mat) return;
    mat.lastRate = l.rate;
    mat.preferredSupplierId = pur.supplierId;
    mat.priceHistory = mat.priceHistory||[];
    mat.priceHistory.push({date:pur.date, invoiceId:pur.id, invoiceNo:pur.invoiceNo, supplierId:pur.supplierId, qty:l.qty, rate:l.rate, total:l.total});
  });
}
function receivePurchase(db, pur){
  // Pricing (lastRate/priceHistory) was already recorded when the purchase was placed — this only
  // adds the physical stock once the goods actually arrive, so it isn't double-counted in Cost Trend.
  pur.status='Received';
  pur.lines.forEach(l=>{
    const mat = byId(db.materials,l.materialId); if(!mat) return;
    mat.qty = (mat.qty||0) + l.qty;
  });
  completeTasksByRef(db,'purchase',pur.id,'Material received');
}
function makeHistoricalPurchase(db, opts){
  // Same shape as makePurchase+receivePurchase (real invoice record + price-history point), except it deliberately
  // does NOT touch mat.qty. Used only to backfill older cost history so Cost Trend has a real multi-point trend —
  // these purchases are old enough that their stock has already been consumed, so current stock (tuned for stock
  // health) must stay untouched.
  const mat = byId(db.materials, opts.materialId);
  const total = opts.qty*opts.rate;
  const pur = {id:uid('PUR'), invoiceNo:opts.invoiceNo, supplierId:opts.supplierId, date:opts.date,
    lines:[{materialId:opts.materialId, qty:opts.qty, unit:mat?mat.unit:'', rate:opts.rate, total}], total,
    status:'Received', attachments:[{name:opts.invoiceNo.replace('/','_')+'_bill.pdf'}], rfqId:null, paymentStatus:'Paid'};
  db.purchases.push(pur);
  if(mat){
    mat.priceHistory = mat.priceHistory||[];
    mat.priceHistory.push({date:opts.date, invoiceId:pur.id, invoiceNo:opts.invoiceNo, supplierId:opts.supplierId, qty:opts.qty, rate:opts.rate, total});
  }
  const sup = byId(db.suppliers, opts.supplierId);
  if(sup) db.communications.push({id:uid('COM'),entityType:'supplier',entityId:sup.id,type:'Purchase',date:pur.date,summary:'Purchase '+pur.invoiceNo+' — '+fmtMoney(pur.total)});
  return pur;
}
function createRFQ(db, supplierId, lines, notes){
  const rfq={id:uid('RFQ'),supplierId,status:'draft',sentDate:'',lines:lines,notes:notes||'',createdAt:todayISO()};
  db.rfqs.push(rfq);
  return rfq;
}
function sendRFQ(db, rfqId){
  const rfq=byId(db.rfqs,rfqId); if(!rfq) return;
  rfq.status='sent'; rfq.sentDate=todayISO();
  const sup=byId(db.suppliers,rfq.supplierId);
  if(sup) db.communications.push({id:uid('COM'),entityType:'supplier',entityId:sup.id,type:'RFQ',date:rfq.sentDate,summary:'RFQ '+rfq.id+' sent for '+rfq.lines.length+' item(s)'});
  completeTasksByRef(db,'rfq',rfqId,'RFQ sent to supplier');
}
function recordQuotation(db, rfqId, rates){ // rates: {materialId: rate}
  const rfq=byId(db.rfqs,rfqId); if(!rfq) return;
  rfq.status='quoted';
  rfq.lines.forEach(l=>{ if(rates[l.materialId]!=null) l.confirmedRate=rates[l.materialId]; });
  completeTasksByRef(db,'rfq',rfqId,'Supplier quotation recorded');
}
function convertRFQToPurchase(db, rfqId, invoiceNo){
  const rfq=byId(db.rfqs,rfqId); if(!rfq) return null;
  const lines = rfq.lines.map(l=>({materialId:l.materialId, qty:l.qty, rate:(l.confirmedRate!=null?l.confirmedRate:l.estRate)}));
  const pur = makePurchase(db,{supplierId:rfq.supplierId, date:todayISO(), invoiceNo:invoiceNo||('PO-'+rfq.id), lines, received:false, rfqId:rfq.id});
  rfq.status='converted'; rfq.purchaseId=pur.id;
  completeTasksByRef(db,'rfq',rfqId,'Converted to purchase');
  return pur;
}

// ---- RECURRING SERVICE VISITS ----
// Industry-standard AMC cadence for industrial NDT equipment is roughly quarterly; we use a flat 4-month step
// (matches the user's own proposed cadence). Visit is free while still inside the warranty window, chargeable
// once the unit is past warranty — coverage never "ends", it just switches from free to paid.
const NOMINAL_OUT_OF_WARRANTY_VISIT_FEE = 600; // WORKING ASSUMPTION — no rupee figure was available from public industry sources; this is a suggested no-fault-found/routine-visit charge, editable per job.
const CALIBRATION_INTERVAL_MONTHS = 12; // WORKING ASSUMPTION — annual recalibration is the common convention for field measurement instruments, but confirm against the specific NABL/lab requirement your customers' auditors expect.
function calibrationStatus(rec){
  const d=daysBetween(todayISO(), rec.validUntil);
  if(d<0) return 'Expired';
  if(d<=45) return 'Due Soon';
  return 'Valid';
}
// Service 1 (4 months) and Service 2 (8 months) are the two scheduled visits that come with the machine — that's
// the whole pre-set cadence. Anything after that is not on a timer; it happens on occurrence (customer calls in,
// AMC visit gets booked, etc.) and shows up as a plain service job against the unit, not a phantom "Visit 3" that
// sits pre-generated and Pending forever. (Per feedback: a table row that's always 0 because nothing is actually
// scheduled there is just noise.)
function generateInitialVisits(startDate, warrExpiry){
  const visits=[];
  for(let seq=1; seq<=2; seq++){
    const due=addMonths(startDate, seq*4);
    visits.push({seq, dueDate:due, status:'Pending', chargeable: due>warrExpiry, doneDate:'', jobId:'', reminderSent:'', contactStatus:'Not Contacted'});
  }
  return visits;
}
// No-op by design now — kept (rather than deleted) because a few call sites still invoke it defensively.
// Previously this kept auto-extending the schedule with speculative future visits every 4 months forever;
// that's exactly the "why is Visit 3 shown, everything on it is 0" complaint, so it no longer generates anything
// beyond the two real scheduled visits.
function ensureUpcomingVisits(sch, asOfDate){ /* intentionally does nothing — see comment above */ }
function nextDueVisit(sch){
  return (sch.visits||[]).filter(v=>v.status!=='Done').sort((a,b)=>a.dueDate<b.dueDate?-1:1)[0];
}

function createServiceJob(db, opts){
  const job = {id:uid('JOB'), jobNo:'JC-'+(_jobSeq++), customerId:opts.customerId, serialId:opts.serialId,
    serviceType:opts.serviceType||'Preventive service', serviceTypes:opts.serviceTypes||[], complaint:opts.complaint||'', status:'Open',
    receivedDate:opts.receivedDate||todayISO(), promisedDate:opts.promisedDate||addDays(todayISO(),3), completionDate:'',
    technician:opts.technician||'EMP-4', findings:'', workPerformed:'', partsReplaced:'', partsUsed:[], classification:opts.classification||'',
    chargeable:false, amount:0, customerApproval:'', notes:'', checklist:[], categoryChecklist:[], accessoryChecklist:[], visitSeq:opts.visitSeq||null,
    // Section 1/3 intake fields — captured once, at job open, matching the Master Service Job Card
    priority:opts.priority||'Medium', mode:opts.mode||'On-site', callSource:opts.callSource||'Complaint', startTime:opts.startTime||'', endTime:'',
    symptoms:opts.symptoms||[], accessoryReceived:opts.accessoryReceived||'No', arrivalCondition:opts.arrivalCondition||'Good', safetyRisk:opts.safetyRisk||'Low',
    // Section 6/7/8 fields — filled at close
    rootCause:'', failedComponent:'', actionsTaken:[], trainingGiven:'', misuseObserved:'', envIssue:'', healthRating:'', outcomes:[],
    downtimeCategory:'', nextServiceDate:'', nextActionOwner:'', recommendation:'', managerReviewed:false, managerName:''};
  db.serviceJobs.push(job);
  if(opts.visitSeq){
    const sch = db.serviceSchedules.find(s=>s.serialId===opts.serialId);
    const v = sch && (sch.visits||[]).find(vv=>vv.seq===opts.visitSeq);
    if(v){ v.status='Job Created'; v.jobId=job.id; }
  }
  if(opts.taskRefType) completeTasksByRef(db,opts.taskRefType,opts.taskRefId,'Job card created: '+job.jobNo);
  db.communications.push({id:uid('COM'),entityType:'customer',entityId:opts.customerId,type:'Service',date:job.receivedDate,summary:'Job card '+job.jobNo+' opened ('+job.serviceType+')'});
  return job;
}
function closeServiceJob(db, jobId, data){
  const job=byId(db.serviceJobs,jobId); if(!job) return;
  Object.assign(job, data, {status:'Closed'});
  if(!job.completionDate) job.completionDate=todayISO();
  if(job.visitSeq){
    const sch = db.serviceSchedules.find(s=>s.serialId===job.serialId);
    const v = sch && (sch.visits||[]).find(vv=>vv.seq===job.visitSeq);
    if(v){ v.status='Done'; v.doneDate=job.completionDate; v.jobId=job.id; }
  }
  completeTasksByRef(db,'serviceJob',jobId,'Job card closed');
}

function reviewWarranty(db, warrantyId, outcome, notes){
  const w=byId(db.warrantyRecords,warrantyId); if(!w) return;
  w.condition=outcome; w.lastReview=todayISO(); w.nextAction=notes||'';

// ---- TASKS ----
// A module that is switched off must not keep generating work for somebody.
const TASK_MODULE = { eway:'eway', quotation:'quotations', serviceJob:'service',
  serviceSchedule:'service', warranty:'service', calibration:'service',
  repeatOpp:'repeat', product:'costing' };
function taskAllowed(t){
  const m = TASK_MODULE[t && t.refType];
  return !m || moduleOn(m);
}
function addTask(db, t){
  if(!taskAllowed(t)) return;
  // avoid duplicate system tasks for same ref+reason
  if(t.source==='system'){
    const dup = db.tasks.find(x=>x.source==='system' && x.refType===t.refType && x.refId===t.refId && x.reason===t.reason && x.status==='Open');
    if(dup) return dup;
  }
  const task = Object.assign({id:uid('TSK'), status:'Open', notes:'', source:'manual'}, t);
  db.tasks.push(task);
  return task;
}
function completeTasksByRef(db, refType, refId, note){
  db.tasks.filter(t=>t.refType===refType && t.refId===refId && t.status==='Open').forEach(t=>{ t.status='Completed'; t.completedNote=note; t.completedDate=todayISO(); });
}
function completeTask(taskId){
  const t=byId(DB.tasks,taskId); if(!t) return;
  t.status='Completed'; t.completedDate=todayISO();
  save(); route(); toast('Task completed');
}
function reopenTask(taskId){
  const t=byId(DB.tasks,taskId); if(!t) return;
  t.status='Open'; save(); route(); toast('Task reopened');
}
function snoozeTask(taskId,days){
  const t=byId(DB.tasks,taskId); if(!t) return;
  t.dueDate=addDays(t.dueDate||todayISO(), days||3);
  save(); route(); toast('Task snoozed');
}

// ---- ALERT + TASK GENERATION (re-run after every mutation) ----
function daysRemaining(mat){
  return mat.avgConsumption>0 ? (mat.qty/mat.avgConsumption) : Infinity;
}
function stockHealth(mat){
  // Combines two signals: stock-vs-reorder-level (snapshot) AND days-of-cover vs how long a reorder actually takes to arrive (run-rate).
  // A material can look fine on qty alone but still be genuinely urgent if it will run out before a fresh order can land.
  const dr = daysRemaining(mat);
  const lead = mat.leadTimeDays||7;
  if(mat.qty<=mat.minLevel*0.6 || dr<=lead) return 'critical';
  if(mat.qty<=mat.minLevel || dr<=(lead+14)) return 'order-soon';
  return 'healthy';
}
function suggestedPurchaseQty(mat){
  const days = mat.leadTimeDays||7;
  const demand = (mat.avgConsumption||0)*(days + 30); // lead time + 30-day buffer
  const need = Math.max(0, mat.targetStock - mat.qty + (mat.safetyStock||0)*0 );
  let qty = Math.max(need, demand - mat.qty);
  qty = Math.max(qty, mat.targetStock - mat.qty);
  if(mat.packSize){ qty = Math.ceil(qty/mat.packSize)*mat.packSize; }
  return Math.max(0,Math.round(qty));
}
function recomputeAlertsAndTasks(db){
  db = db || DB;
  // clear system-generated open alerts/tasks, then regenerate (manual ones untouched)
  db.alerts = db.alerts.filter(a=>a.source!=='system');
  db.tasks = db.tasks.filter(t=>t.source!=='system');
  const T=todayISO();

  // 1. Stock critical / order soon
  db.materials.forEach(m=>{
    const h=stockHealth(m);
    if(h!=='healthy'){
      db.alerts.push({id:uid('ALT'),source:'system',type:'Stock',severity:h==='critical'?'high':'med',
        message:m.name+' stock is '+(h==='critical'?'critical':'low')+' ('+m.qty+' '+m.unit+', min '+m.minLevel+')',
        refType:'material',refId:m.id,status:'Open',createdAt:T});
      if(h==='critical'){
        addTask(db,{source:'system',name:'Request supplier quotation — '+m.name,priority:'High',dueDate:T,
          assignedTo:'EMP-5',refType:'material',refId:m.id,reason:'Material stock critical',
          entityLabel:m.name});
      }
    }
  });

  // 2. Open RFQs awaiting response (sent >3 days ago, still 'sent')
  db.rfqs.forEach(r=>{
    if(r.status==='sent' && r.sentDate && daysBetween(r.sentDate,T)>=3){
      const sup=byId(db.suppliers,r.supplierId);
      db.alerts.push({id:uid('ALT'),source:'system',type:'RFQ',severity:'med',message:'RFQ '+r.id+' to '+(sup?sup.name:'')+' awaiting response ('+daysBetween(r.sentDate,T)+' days)',refType:'rfq',refId:r.id,status:'Open',createdAt:T});
      addTask(db,{source:'system',name:'Follow up RFQ — '+(sup?sup.name:r.id),priority:'Medium',dueDate:T,assignedTo:'EMP-5',refType:'rfq',refId:r.id,reason:'Supplier RFQ awaiting response',entityLabel:sup?sup.name:r.id});
    }
    if(r.status==='draft'){
      addTask(db,{source:'system',name:'Send RFQ draft — '+r.id,priority:'Medium',dueDate:T,assignedTo:'EMP-5',refType:'rfq',refId:r.id,reason:'RFQ saved as draft, not yet sent',entityLabel:r.id});
    }
  });

  // 3. Lead follow-ups due/overdue
  db.leads.forEach(l=>{
    if(['Won','Lost'].includes(l.stage)) return;
    if(l.followUpDate && l.followUpDate<=T){
      const overdue = l.followUpDate<T;
      db.alerts.push({id:uid('ALT'),source:'system',type:'Lead',severity:overdue?'high':'med',message:'Lead follow-up '+(overdue?'overdue':'due today')+' — '+l.company,refType:'lead',refId:l.id,status:'Open',createdAt:T});
      addTask(db,{source:'system',name:'Follow up lead — '+l.company,priority:overdue?'High':'Medium',dueDate:l.followUpDate,assignedTo:l.assignedTo,refType:'lead',refId:l.id,reason:'Lead follow-up date reached',entityLabel:l.company});
    }
  });

  // 4. Warranty nearing expiry (within 30 days) or expired needing review
  db.warrantyRecords.forEach(w=>{
    const dleft = daysBetween(T,w.expiryDate);
    if(dleft<=30){
      const ser=byId(db.equipmentSerials,w.serialId); const prod=ser?byId(db.products,ser.productId):null; const cust=ser?byId(db.customers,ser.customerId):null;
      db.alerts.push({id:uid('ALT'),source:'system',type:'Warranty',severity:dleft<0?'med':'high',message:'Warranty '+(dleft<0?'expired':'expiring in '+dleft+' days')+' — '+(cust?cust.name:'')+' / '+(prod?prod.name:'')+' ('+(ser?ser.serial:'')+')',refType:'warranty',refId:w.id,status:'Open',createdAt:T});
      addTask(db,{source:'system',name:'Warranty review — '+(cust?cust.name:'')+' ('+(ser?ser.serial:'')+')',priority:'Medium',dueDate:T,assignedTo:'EMP-2',refType:'warranty',refId:w.id,reason:'Warranty nearing expiry / needs review',entityLabel:cust?cust.name:''});
    }
  });

  // 5. Service 1/Service 2 due reminders — the only two pre-scheduled visits (4mo/8mo cadence)
  db.serviceSchedules.forEach(s=>{
    ensureUpcomingVisits(s, T);
    const ser=byId(db.equipmentSerials,s.serialId); if(!ser) return;
    const cust=byId(db.customers,ser.customerId); const prod=byId(db.products,ser.productId);
    const due=(s.visits||[]).find(v=>v.status==='Pending' && v.dueDate<=T);
    if(due){
      db.alerts.push({id:uid('ALT'),source:'system',type:'Service',severity:'med',message:'Service visit '+due.seq+' due — '+(cust?cust.name:'')+' / '+ser.serial+(due.chargeable?' (chargeable)':' (free — in warranty)'),refType:'serviceSchedule',refId:s.id+':v'+due.seq,status:'Open',createdAt:T});
      addTask(db,{source:'system',name:'Service visit '+due.seq+' — '+(cust?cust.name:'')+' ('+ser.serial+')',priority:'Medium',dueDate:due.dueDate,assignedTo:'EMP-4',refType:'serviceSchedule',refId:s.id+':v'+due.seq,reason:'Recurring 4-month preventive service due',entityLabel:cust?cust.name:''});
    }
  });

  // 6. Open service jobs past promised date
  db.serviceJobs.forEach(j=>{
    if(j.status==='Open' && j.promisedDate<T){
      const cust=byId(db.customers,j.customerId);
      db.alerts.push({id:uid('ALT'),source:'system',type:'Service',severity:'high',message:'Job card '+j.jobNo+' overdue — '+(cust?cust.name:''),refType:'serviceJob',refId:j.id,status:'Open',createdAt:T});
      addTask(db,{source:'system',name:'Close overdue job card — '+j.jobNo,priority:'High',dueDate:j.promisedDate,assignedTo:j.technician,refType:'serviceJob',refId:j.id,reason:'Service job exceeded promised completion date',entityLabel:cust?cust.name:''});
    }
  });

  // 7. Repeat-sales opportunities due within 14 days
  db.repeatOpportunities.forEach(o=>{
    if(o.status==='Open' && daysBetween(T,o.expectedDate)<=14){
      const cust=byId(db.customers,o.customerId); const mat=byId(db.materials,o.materialId);
      addTask(db,{source:'system',name:'Consumable reorder opportunity — '+(cust?cust.name:'')+' / '+(mat?mat.name:''),priority:'Low',dueDate:o.expectedDate,assignedTo:'EMP-2',refType:'repeatOpp',refId:o.id,reason:'Predicted consumable requirement due',entityLabel:cust?cust.name:''});
    }
  });

  // 8. Pending purchases (not yet received)
  db.purchases.forEach(p=>{
    if(p.status==='Pending'){
      const sup=byId(db.suppliers,p.supplierId);
      db.alerts.push({id:uid('ALT'),source:'system',type:'Purchase',severity:'med',message:'Purchase '+p.invoiceNo+' from '+(sup?sup.name:'')+' pending receipt',refType:'purchase',refId:p.id,status:'Open',createdAt:T});
      addTask(db,{source:'system',name:'Follow up delivery — '+p.invoiceNo,priority:'Medium',dueDate:T,assignedTo:'EMP-5',refType:'purchase',refId:p.id,reason:'Supplier delivery pending',entityLabel:sup?sup.name:''});
    }
  });

  // 9. Calibration certificates due/expired — this can be a hard tender requirement (government/railway/defense),
  // so it's flagged with 45 days' lead time rather than at the last minute like a routine service visit.
  db.calibrationRecords.forEach(r=>{
    const dleft=daysBetween(T,r.validUntil);
    if(dleft<=45){
      const ser=byId(db.equipmentSerials,r.serialId); const cust=ser?byId(db.customers,ser.customerId):null; const prod=ser?byId(db.products,ser.productId):null;
      db.alerts.push({id:uid('ALT'),source:'system',type:'Calibration',severity:dleft<0?'high':'med',message:'Calibration '+(dleft<0?'expired':'due in '+dleft+' days')+' — '+(cust?cust.name:'')+' / '+(prod?prod.name:'')+' ('+(ser?ser.serial:'')+')',refType:'calibration',refId:r.id,status:'Open',createdAt:T});
      addTask(db,{source:'system',name:'Calibration renewal — '+(cust?cust.name:'')+' ('+(ser?ser.serial:'')+')',priority:dleft<0?'High':'Medium',dueDate:T,assignedTo:'EMP-4',refType:'calibration',refId:r.id,reason:'Calibration certificate due/expired',entityLabel:cust?cust.name:''});
    }
  });

  // 10. Overdue invoices — the money already earned but not collected. Only the
  // genuinely late ones raise a task; an invoice inside its credit period is not
  // a problem and should not add noise to anybody's day.
  db.salesInvoices.forEach(i=>{
    const late = invDaysOverdue(i);
    if(late <= 0) return;
    const c = byId(db.customers, i.customerId);
    db.alerts.push({id:uid('ALT'),source:'system',type:'Receivable',severity: late>60?'high':'med',
      message:'Invoice '+i.invoiceNo+' — '+fmtMoney(invBalance(i))+' overdue by '+late+' days ('+(c?c.name:'')+')',
      refType:'invoice',refId:i.id,status:'Open',createdAt:T});
    addTask(db,{source:'system',name:'Collect payment — '+i.invoiceNo+' ('+fmtMoney(invBalance(i))+')',
      priority: late>60?'High':(late>30?'Medium':'Low'), dueDate:T, assignedTo:'EMP-1',
      refType:'invoice',refId:i.id, reason:'Overdue by '+late+' days', entityLabel:c?c.name:''});
  });

  // 13. A product being sold with no costing sheet. Every one of these is a
  // hole in the profit figure, so it is worth chasing rather than tolerating.
  db.products.forEach(p=>{
    if((Array.isArray(p.bom) && p.bom.length) || p.buyCost) return;
    const soldRecently = db.salesInvoices.some(i=>i.date >= addDays(T,-180) &&
      (i.lines||[]).some(l=>l.productId === p.id));
    if(!soldRecently) return;
    addTask(db,{source:'system',name:'Add a costing sheet — '+p.name,
      priority:'Medium', dueDate:T, assignedTo:'EMP-6', refType:'product', refId:p.id,
      reason:'Sold in the last 6 months with no bill of materials, so its profit is unknown',
      entityLabel:p.name});
  });

  // 12. Consignments above Rs 50,000 with no e-way bill prepared. This is a
  // legal requirement rather than good practice, so it is raised as High.
  db.salesInvoices.forEach(i=>{
    if(!needsEwayBill(i)) return;
    if((db.ewayBills||[]).some(e=>e.invoiceId===i.id)) return;
    const c = byId(db.customers, i.customerId);
    db.alerts.push({id:uid('ALT'),source:'system',type:'E-way bill',severity:'high',
      message:'No e-way bill for '+i.invoiceNo+' — '+fmtMoney(i.total)+' consignment to '+(c?c.name:''),
      refType:'eway',refId:i.id,status:'Open',createdAt:T});
    addTask(db,{source:'system',name:'Prepare e-way bill — '+i.invoiceNo+' ('+fmtMoney(i.total)+')',
      priority:'High', dueDate:T, assignedTo:'EMP-5', refType:'eway', refId:i.id,
      reason:'Consignment above Rs 50,000 cannot legally move without one', entityLabel:c?c.name:''});
  });

  // 11. Quotations going cold. A quote nobody chases before it expires is the
  // cheapest sale in the business to lose.
  (db.quotations||[]).forEach(q=>{
    if(quoteStatus(q) !== 'Sent') return;
    const left = daysBetween(T, q.validUntil);
    if(left > 5) return;
    db.alerts.push({id:uid('ALT'),source:'system',type:'Quotation',severity: left<0?'high':'med',
      message:'Quotation '+q.quoteNo+' ('+fmtMoney(q.total)+') '+(left<0?'has expired':'expires in '+left+' days')+' — '+quoteCustomerName(q),
      refType:'quotation',refId:q.id,status:'Open',createdAt:T});
    addTask(db,{source:'system',name:'Follow up quotation — '+q.quoteNo+' ('+fmtMoney(q.total)+')',
      priority: left<0?'Medium':'High', dueDate:T, assignedTo:q.createdBy||'EMP-2',
      refType:'quotation',refId:q.id, reason: left<0?'Quotation expired without a decision':'Validity ends in '+left+' days',
      entityLabel: quoteCustomerName(q)});
  });
}

/* ============================================================
   === SECTION: PLATFORM CORE (v1.1) ===
   Added in v1.1 on top of the v1.0 prototype:
     1. SETTINGS + real clock (demo date is now a setting, not a hardcode)
     2. AUDIT TRAIL      — who changed what, when, old -> new
     3. EVENT DELEGATION — one document listener instead of inline onclick
     4. SOFT RE-RENDER   — keeps scroll position and focus across updates
     5. GST ENGINE       — CGST/SGST vs IGST from place of supply
     6. PAYMENTS ENGINE  — part payments, balance, ageing buckets
     7. EXPORT / IMPORT  — CSV, Excel, JSON backup + restore
   Everything below is additive; v1.0 behaviour is unchanged unless noted.
   ============================================================ */

/* ---------- 1. SETTINGS & CLOCK ---------------------------------------
   todayISO() used to be hardcoded to 2026-08-07 so the demo never drifted.
   That's still available, but it is now a *setting* the owner can see and
   switch off, so nobody mistakes a frozen clock for a live system. */

    stateCode: '36',              // Telangana — decides CGST+SGST vs IGST
    phone: '+91 00000 00000',
    email: 'sales@sims.example',
    bank: 'HDFC Bank, Balanagar — A/C 50200012345678, IFSC HDFC0001234',
    upiId: '',                    // e.g. sims@hdfcbank — enables UPI collection links
  },
  // Collection: a UPI id turns a payment reminder into a payment.
  upiId: '',
  // The public website this Business OS is paired with. Enquiries submitted
  // there become leads here. Blank until the owner fills it in on Settings.
  web: { apiBase: '', apiToken: '' },
  // What an hour on the bench costs, all-in. Used for direct labour in every
  // cost card — the one number that has to be right for costing to mean anything.
  costing: { labourRatePerHour: 190, productionHeadcount: 2, hoursPerMonthPerHead: 200 },
  // How this business pays people. Most small units pay on a 26-day month.
  payroll: { fixedPayableDays: 26, hoursPerDay: 8, otMultiplier: 1.5,
             nightShiftAllowance: 250, payDay: 7 },
  // Everything is on until the owner says otherwise.
  modules: {},
  defaultGstRate: 18,             // NDT equipment & consumables both fall at 18%
  creditDays: 30,                 // default payment terms on a new invoice
  quoteValidityDays: 15,
};
function settings(db){
  const d = db || DB;
  if(!d) return DEFAULT_SETTINGS;              // called during the very first seed, before DB exists
  if(!d.settings) d.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  // forward-compatible: fill in any key added after this DB was saved
  Object.keys(DEFAULT_SETTINGS).forEach(k=>{ if(d.settings[k]===undefined) d.settings[k]=DEFAULT_SETTINGS[k]; });
  return d.settings;
}
function realTodayISO(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
// Overridden version of the v1.0 helper. Same signature, same return shape —
// but the frozen date now comes from settings instead of being compiled in.
function todayISO(){
  if(!DB || !DB.settings) return '2026-08-07';
  return DB.settings.demoMode ? (DB.settings.demoDate || '2026-08-07') : realTodayISO();
}

/* ---------- 2. AUDIT TRAIL --------------------------------------------
   Every write goes through audit(). We store a compact diff (only the fields
   that actually changed) rather than a full row copy, so the log stays small
   enough to live in localStorage alongside the data. */
function auditActor(){
  const e = byId(DB.employees, CURRENT_EMP);
  return { id: CURRENT_EMP, name: e ? e.name : 'Unknown', role: CURRENT_ROLE };
}
function diffOf(before, after){
  const d = {};
  if(!before) return null;
  Object.keys(after||{}).forEach(k=>{
    if(k==='id') return;
    const a = JSON.stringify(before[k]), b = JSON.stringify(after[k]);
    if(a !== b) d[k] = { from: before[k], to: after[k] };
  });
  return Object.keys(d).length ? d : null;
}
function audit(action, entity, entityId, label, before, after){
  if(!DB.auditLog) DB.auditLog = [];
  const who = auditActor();
  DB.auditLog.push({
    id: uid('AUD'),
    at: new Date().toISOString(),
    onDate: todayISO(),
    action: action,              // Created | Updated | Deleted | Payment | Status | Import | Reset | Export
    entity: entity,              // Invoice | Quotation | Lead | Customer | ...
    entityId: entityId || '',
    label: label || '',          // human-readable: "INV-1023 — ABC Fabricators"
    byId: who.id, byName: who.name, byRole: who.role,
    shared: SYNC.enabled ? 1 : 0,        // was this change visible to the team when it happened

    changes: (before && after) ? diffOf(before, after) : null,
  });
  if(DB.auditLog.length > 3000) DB.auditLog.splice(0, DB.auditLog.length - 3000);
}
// snapshot(obj) before you mutate it, then audit('Updated', ..., snap, obj)
function snapshot(o){ return o ? JSON.parse(JSON.stringify(o)) : null; }

/* ---------- 3. EVENT DELEGATION ---------------------------------------
   v1.0 built 255 inline onclick="fn('ID')" strings. Two problems: any quote
   or apostrophe inside an argument broke the generated JS, and every render
   re-parsed hundreds of small scripts. Now handlers are declared as data and
   dispatched from a single listener — arguments travel as JSON, so an
   apostrophe in a customer name is just a character. */
function act(fn){
  const args = Array.prototype.slice.call(arguments, 1);
  return 'data-act="' + esc(fn) + '"' + (args.length ? ' data-args="' + esc(JSON.stringify(args)) + '"' : '');
}
function bindDelegation(){
  document.addEventListener('click', function(ev){
    const el = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if(!el) return;
    const fn = el.getAttribute('data-act');
    if(typeof window[fn] !== 'function'){ console.warn('No handler:', fn); return; }
    let args = [];
    const raw = el.getAttribute('data-args');
    if(raw){ try{ args = JSON.parse(raw); }catch(e){ console.warn('Bad data-args on', fn, raw); } }
    ev.stopPropagation();
    try{ window[fn].apply(el, args); }
    catch(e){ console.error(fn, e); toast('Something went wrong: ' + e.message); }
  });
  // Ctrl/Cmd+K global search, Esc closes modal — small things that make it
  // feel like software rather than a web page.
  document.addEventListener('keydown', function(ev){
    if((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==='k'){ ev.preventDefault(); openGlobalSearch(); }
    if(ev.key==='Escape') closeModal();
  });
}

/* ---------- 4. SOFT RE-RENDER -----------------------------------------
   v1.0 did content.innerHTML = renderPage() on every action, which threw away
   scroll position and whatever the user was typing. rerender() restores both,
   so completing a task 30 rows down no longer bounces you to the top. */
function rerender(){
  const content = document.getElementById('content');
  if(!content){ route(); return; }
  const scrollY = window.scrollY, scrollC = content.scrollTop;
  const activeEl = document.activeElement;
  const focusId = activeEl && activeEl.id ? activeEl.id : null;
  const selStart = activeEl && activeEl.selectionStart !== undefined ? activeEl.selectionStart : null;
  route();
  window.scrollTo(0, scrollY);
  content.scrollTop = scrollC;
  if(focusId){
    const back = document.getElementById(focusId);
    if(back && back.focus){
      back.focus();
      if(selStart !== null && back.setSelectionRange){ try{ back.setSelectionRange(selStart, selStart); }catch(e){} }
    }
  }
}

/* ---------- 5. GST ENGINE ---------------------------------------------
   Place of supply decides the split: same state as SIMS (Telangana, code 36)
   means CGST + SGST at half the rate each; anywhere else is a single IGST
   line. The state code is the first two digits of the customer's GSTIN, which
   we already capture on every customer record. */
const GST_STATES = {
  '27':'Maharashtra','29':'Karnataka','32':'Kerala','33':'Tamil Nadu','36':'Telangana','37':'Andhra Pradesh',
  '07':'Delhi','24':'Gujarat','06':'Haryana','19':'West Bengal','09':'Uttar Pradesh','08':'Rajasthan',
  '23':'Madhya Pradesh','21':'Odisha','22':'Chhattisgarh','20':'Jharkhand','10':'Bihar','03':'Punjab',
};
function stateCodeOf(gstin){ return (gstin||'').trim().slice(0,2); }
function stateNameOf(code){ return GST_STATES[code] || ('State ' + (code||'—')); }
function isIntraState(customerGstin, db){
  const home = settings(db).company.stateCode;
  const cs = stateCodeOf(customerGstin);
  return !cs || cs === home;   // no GSTIN on file = treat as local (B2C, unregistered)
}
function gstRateFor(line, db){
  const d = db || DB, s = settings(d);
  if(line.type==='equipment'){ const p = byId(d.products, line.productId); return (p && p.gstRate) || s.defaultGstRate; }
  if(line.type==='consumable'){ const m = byId(d.materials, line.materialId); return (m && m.gstRate) || s.defaultGstRate; }
  return s.defaultGstRate;     // service charges: same slab
}
function hsnFor(line, db){
  const d = db || DB;
  if(line.type==='equipment'){ const p = byId(d.products, line.productId); return (p && p.hsn) || '9031'; }   // measuring/checking instruments
  if(line.type==='consumable'){ const m = byId(d.materials, line.materialId); return (m && m.hsn) || '3824'; } // chemical preparations
  return '9987';               // maintenance & repair services
}
// Takes raw lines [{type,qty,rate,...}] and a customer, returns the priced
// document: every line carries its own taxable value and tax, and the header
// carries the rolled-up CGST/SGST/IGST. One function used by both invoices
// and quotations, so a quote can never total differently from its invoice.
function priceDocument(lines, customer, db){
  const gstin = customer ? customer.gst : '';
  const intra = isIntraState(gstin, db);
  let subTotal = 0, cgst = 0, sgst = 0, igst = 0;
  const priced = (lines||[]).map(l=>{
    const rate = gstRateFor(l, db);
    const taxable = Math.round((Number(l.qty)||0) * (Number(l.rate)||0) * 100) / 100;
    const tax = Math.round(taxable * rate) / 100;
    subTotal += taxable;
    if(intra){ cgst += tax/2; sgst += tax/2; } else { igst += tax; }
    return Object.assign({}, l, {
      hsn: hsnFor(l, db), gstRate: rate, taxable: taxable, tax: Math.round(tax*100)/100,
      total: Math.round((taxable + tax) * 100) / 100,
    });
  });
  const r = n => Math.round(n * 100) / 100;
  const taxTotal = r(cgst + sgst + igst);
  return {
    lines: priced, subTotal: r(subTotal),
    cgst: r(cgst), sgst: r(sgst), igst: r(igst), taxTotal: taxTotal,
    total: Math.round(r(subTotal) + taxTotal),   // rounded to the rupee, as on a printed bill
    intraState: intra,
    placeOfSupply: stateNameOf(stateCodeOf(gstin) || settings(db).company.stateCode),
  };
}
// Tax summary grouped by rate — the block that goes at the foot of a GST invoice.
function gstSummaryRows(doc){
  const by = {};
  (doc.lines||[]).forEach(l=>{
    const k = l.gstRate;
    if(!by[k]) by[k] = { rate:k, taxable:0, tax:0 };
    by[k].taxable += l.taxable; by[k].tax += l.tax;
  });
  return Object.values(by).sort((a,b)=>a.rate-b.rate);
}
function gstTotalsHtml(doc){
  const rows = gstSummaryRows(doc);
  let h = '<table class="gst-summary"><thead><tr><th class="nosort">HSN slab</th><th class="nosort">Taxable value</th>' +
    (doc.intraState ? '<th class="nosort">CGST</th><th class="nosort">SGST</th>' : '<th class="nosort">IGST</th>') +
    '<th class="nosort">Total tax</th></tr></thead><tbody>';
  rows.forEach(r=>{
    h += '<tr><td>' + r.rate + '%</td><td>' + fmtMoney(r.taxable) + '</td>' +
      (doc.intraState
        ? '<td>' + fmtMoney(r.tax/2) + ' <span class="muted small">@' + (r.rate/2) + '%</span></td><td>' + fmtMoney(r.tax/2) + ' <span class="muted small">@' + (r.rate/2) + '%</span></td>'
        : '<td>' + fmtMoney(r.tax) + ' <span class="muted small">@' + r.rate + '%</span></td>') +
      '<td><b>' + fmtMoney(r.tax) + '</b></td></tr>';
  });
  h += '</tbody></table>';
  return h;
}
function docTotalsBlock(doc){
  return '<div class="totalsbox">' +
    '<div class="trow"><span>Taxable value</span><b>' + fmtMoney(doc.subTotal) + '</b></div>' +
    (doc.intraState
      ? '<div class="trow"><span>CGST</span><b>' + fmtMoney(doc.cgst) + '</b></div><div class="trow"><span>SGST</span><b>' + fmtMoney(doc.sgst) + '</b></div>'
      : '<div class="trow"><span>IGST</span><b>' + fmtMoney(doc.igst) + '</b></div>') +
    '<div class="trow"><span>Round off</span><b>' + fmtMoney(doc.total - doc.subTotal - doc.taxTotal) + '</b></div>' +
    '<div class="trow grand"><span>Grand total</span><b>' + fmtMoney(doc.total) + '</b></div>' +
    '<div class="small muted" style="margin-top:6px;">Place of supply: ' + esc(doc.placeOfSupply) + ' &middot; ' + (doc.intraState ? 'Intra-state (CGST+SGST)' : 'Inter-state (IGST)') + '</div>' +
    '</div>';
}
function amountInWords(n){
  n = Math.round(Number(n)||0);
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function two(x){ return x < 20 ? ones[x] : tens[Math.floor(x/10)] + (x%10 ? ' ' + ones[x%10] : ''); }
  function three(x){ return (x >= 100 ? ones[Math.floor(x/100)] + ' Hundred' + (x%100 ? ' ' : '') : '') + (x%100 ? two(x%100) : ''); }
  if(n === 0) return 'Zero Rupees Only';
  const crore = Math.floor(n/10000000), lakh = Math.floor((n%10000000)/100000), thou = Math.floor((n%100000)/1000), rest = n%1000;
  let out = '';
  if(crore) out += three(crore) + ' Crore ';
  if(lakh)  out += three(lakh) + ' Lakh ';
  if(thou)  out += three(thou) + ' Thousand ';
  if(rest)  out += three(rest);
  return out.trim() + ' Rupees Only';
}

// Called from makeSaleInvoice(). Re-prices the invoice with GST and opens its
// payment ledger. Applied to seeded history too, so the ageing report has real
// data from the first minute instead of an empty screen.
function applyGstToInvoice(db, inv, opts){
  const cust = byId(db.customers, inv.customerId);
  const doc = priceDocument(inv.lines, cust, db);
  inv.lines = doc.lines;
  inv.subTotal = doc.subTotal; inv.cgst = doc.cgst; inv.sgst = doc.sgst; inv.igst = doc.igst;
  inv.taxTotal = doc.taxTotal; inv.total = doc.total;
  inv.intraState = doc.intraState; inv.placeOfSupply = doc.placeOfSupply;
  inv.creditDays = opts.creditDays == null ? settings(db).creditDays : opts.creditDays;
  if(opts.quotationId) inv.quotationId = opts.quotationId;
  inv.payments = [];
  // v1.0 recorded only a Paid/Unpaid flag. Turn a "Paid" flag into an actual
  // receipt so the collections screen has a real ledger to work from.
  if((opts.paymentStatus || 'Paid') === 'Paid'){
    inv.payments.push({ id: uid('PAY'), date: addDays(inv.date, 12), amount: inv.total,
      mode: 'NEFT / RTGS', ref: '', note: 'Opening balance entry', byId: 'EMP-1', byName: 'Vijay (Owner)' });
  } else if(opts.paymentStatus === 'Part Paid'){
    inv.payments.push({ id: uid('PAY'), date: addDays(inv.date, 10), amount: Math.round(inv.total * 0.5),
      mode: 'NEFT / RTGS', ref: '', note: 'Advance against order', byId: 'EMP-1', byName: 'Vijay (Owner)' });
  }
  inv.paymentStatus = invStatus(inv);
}

/* ---------- 6. PAYMENTS ENGINE ----------------------------------------
   v1.0 had a single paymentStatus flag, which cannot answer the only question
   an owner actually asks: how much is owed, by whom, and for how long. An
   invoice now holds a list of receipts; status and ageing are derived. */
const PAYMENT_MODES = ['NEFT / RTGS','UPI','Cheque','Cash','Bank Transfer','Adjustment'];
function invPayments(inv){ return inv.payments || (inv.payments = []); }
function invPaid(inv){ return invPayments(inv).reduce((s,p)=>s + (Number(p.amount)||0), 0); }
// A credit note reduces what the customer owes just as a receipt does, so
// collections must net it off — otherwise we chase money already credited.
function invBalance(inv){ return Math.max(0, (Number(inv.total)||0) - invPaid(inv) - invCredited(inv)); }
function invDueDate(inv){ return addDays(inv.date, inv.creditDays == null ? settings().creditDays : inv.creditDays); }
function invStatus(inv){
  const bal = invBalance(inv), paid = invPaid(inv);
  if(bal <= 0.5) return 'Paid';
  if(paid > 0) return 'Part Paid';
  return daysBetween(invDueDate(inv), todayISO()) > 0 ? 'Overdue' : 'Unpaid';
}
function invStatusPill(inv){
  const s = invStatus(inv);
  return pill(s, s==='Paid' ? 'green' : s==='Part Paid' ? 'amber' : s==='Overdue' ? 'red' : 'gray');
}
function invDaysOverdue(inv){
  if(invBalance(inv) <= 0.5) return 0;
  return Math.max(0, daysBetween(invDueDate(inv), todayISO()));
}
const AGEING_BUCKETS = [

function savePayment(invId){
  const inv = byId(DB.salesInvoices, invId); if(!inv) return;
  const amt = num('pay_amt');

function deletePayment(invId, payId){
  const inv = byId(DB.salesInvoices, invId); if(!inv) return;
  const p = invPayments(inv).find(x=>x.id===payId); if(!p) return;
  if(!confirm('Remove the receipt of ' + fmtMoney(p.amount) + ' dated ' + fmtDate(p.date) + '?')) return;
  const before = snapshot(inv);
  inv.payments = invPayments(inv).filter(x=>x.id!==payId);
  inv.paymentStatus = invStatus(inv);
  audit('Payment reversed', 'Invoice', inv.id, inv.invoiceNo + ' — receipt ' + fmtMoney(p.amount) + ' removed', before, inv);
  save(); toast('Receipt removed');
  openPaymentForm(invId);
}

/* ---------- 7. EXPORT / IMPORT ----------------------------------------
   The single biggest risk in v1.0 was that everything lived in one browser's
   localStorage: clear the cache and the business is gone. Three ways out now:
   per-table CSV, per-table Excel, and a full JSON backup that restores. */
function csvCell(v){
  if(v==null) return '';
  const s = String(v).replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#39;/g,"'").replace(/&quot;/g,'"').trim();
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function toCSV(headers, rows){
  return [headers.map(csvCell).join(',')].concat(rows.map(r=>r.map(csvCell).join(','))).join('\r\n');
}
function downloadFile(filename, mime, content){
  const blob = new Blob([content], { type: mime + ';charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
}
function stamp(){ return todayISO().replace(/-/g,''); }
// Excel gets an HTML table rather than raw CSV: it opens natively, keeps the
// column headers bold, and stops Excel from mangling long numbers into
// scientific notation — which is exactly what it does to GSTINs in a CSV.
function toExcelHTML(title, headers, rows){
  return '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"/>' +
    '<style>table{border-collapse:collapse;font-family:Calibri,Arial;font-size:11pt;}th{background:#0f2340;color:#fff;font-weight:700;border:1px solid #999;padding:5px 8px;text-align:left;}td{border:1px solid #ccc;padding:4px 8px;mso-number-format:"\\@";}</style></head><body>' +
    '<h3>' + esc(title) + '</h3><table><thead><tr>' + headers.map(h=>'<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r=>'<tr>' + r.map(c=>'<td>' + esc(String(c==null?'':c).replace(/<[^>]*>/g,'')) + '</td>').join('') + '</tr>').join('') +
    '</tbody></table></body></html>';
}

/* Any table drawn through renderTable() registers its columns and rows here,
   so Export works on every screen without touching 40 render functions. */
window._tableReg = {};
function exportRegisteredTable(tableId, fmt){
  const t = window._tableReg[tableId];
  if(!t){ toast('Nothing to export on this table'); return; }
  // Columns holding buttons carry exportVal:false and are dropped — a spreadsheet
  // column full of empty cells labelled "Action" helps nobody.
  const cols = t.cols.filter(c=>c.exportVal !== false);
  const headers = cols.map(c=>String(c.label).replace(/<[^>]*>/g,''));
  const rows = t.rows.map(r=>cols.map(c=>{
    if(c.exportVal) return c.exportVal(r);
    const raw = c.render ? c.render(r) : r[c.key];
    return String(raw==null?'':raw).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
  }));
  const name = (t.title || tableId);
  const file = 'SIMS_' + name.replace(/[^A-Za-z0-9]+/g,'_') + '_' + stamp();
  if(fmt==='xls') downloadFile(file + '.xls', 'application/vnd.ms-excel', toExcelHTML(name, headers, rows));
  else downloadFile(file + '.csv', 'text/csv', '\ufeff' + toCSV(headers, rows));
  audit('Export', 'Table', tableId, name + ' (' + rows.length + ' rows, ' + fmt.toUpperCase() + ')');
  save();
  toast(rows.length + ' rows exported');
}
// Topbar Export button — lists whatever tables the current page has drawn.
function openExportMenu(){
  const ids = Object.keys(window._tableReg);
  if(!ids.length){ toast('No table on this page to export'); return; }
  let h = '<div class="small muted" style="margin-bottom:10px;">Tables on this page. Excel keeps GSTINs and long numbers as text; CSV is best for re-importing into another system.</div>';
  h += '<table><thead><tr><th class="nosort">Table</th><th class="nosort">Rows</th><th class="nosort">Download</th></tr></thead><tbody>';
  ids.forEach(id=>{
    const t = window._tableReg[id];
    h += '<tr><td><b>' + esc(t.title || id) + '</b></td><td>' + t.rows.length + '</td>' +
      '<td><button class="btn sm" ' + act('exportRegisteredTable', id, 'csv') + '>CSV</button> ' +
      '<button class="btn sm primary" ' + act('exportRegisteredTable', id, 'xls') + '>Excel</button></td></tr>';
  });
  h += '</tbody></table>';
  h += '<div class="hr"></div><div class="small muted">Need everything at once? <b>Data &amp; Audit → Full backup</b> exports every table plus a restorable JSON file.</div>';
  openModal('Export from this page', h, '<button class="btn" ' + act('closeModal') + '>Close</button>');
}

/* Full backup: one JSON file that restores the entire system. This is the
   answer to "what happens if this laptop dies". */
function exportFullBackup(){
  const payload = { _format: 'SIMS_BUSINESS_OS_BACKUP', _version: 2, _exportedAt: new Date().toISOString(),
                    _exportedBy: auditActor().name, _businessDate: todayISO(), data: DB };
  downloadFile('SIMS_FullBackup_' + stamp() + '.json', 'application/json', JSON.stringify(payload, null, 2));
  audit('Export', 'System', '', 'Full JSON backup');

const EXPORTABLE_TABLES = [
  {key:'customers',        title:'Customers'},
  {key:'leads',            title:'Leads'},
  {key:'quotations',       title:'Quotations'},
  {key:'creditNotes',      title:'Credit Notes (sales returns)'},

];
// Flattens nested objects/arrays into columns so a raw table export is still
// readable in Excel instead of showing "[object Object]".
function flattenRow(o){
  const out = {};
  Object.keys(o||{}).forEach(k=>{
    const v = o[k];
    if(v==null) out[k]='';
    else if(Array.isArray(v)) out[k] = v.length + ' item(s)';
    else if(typeof v==='object') Object.keys(v).forEach(k2=>{ out[k+'.'+k2] = typeof v[k2]==='object' ? JSON.stringify(v[k2]) : v[k2]; });
    else out[k]=v;
  });
  return out;
}
function exportRawTable(key, fmt){
  const rows = (DB[key]||[]).map(flattenRow);
  if(!rows.length){ toast('That table is empty'); return; }
  const headers = Object.keys(rows.reduce((a,r)=>{ Object.keys(r).forEach(k=>a[k]=1); return a; }, {}));
  const body = rows.map(r=>headers.map(h=>r[h]==null?'':r[h]));
  const meta = EXPORTABLE_TABLES.find(t=>t.key===key);
  const title = meta ? meta.title : key;
  const file = 'SIMS_' + title.replace(/[^A-Za-z0-9]+/g,'_') + '_' + stamp();
  if(fmt==='xls') downloadFile(file + '.xls', 'application/vnd.ms-excel', toExcelHTML(title, headers, body));
  else downloadFile(file + '.csv', 'text/csv', '\ufeff' + toCSV(headers, body));
  audit('Export', 'Table', key, title + ' (' + rows.length + ' rows)');
  save(); toast(title + ' — ' + rows.length + ' rows exported');
}
// Restore. Deliberately loud: it replaces everything, so it asks twice and
// takes a safety backup of the current state first.
function triggerImport(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = function(){
    const f = inp.files && inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = function(){ handleImportedBackup(f.name, String(rd.result)); };
    rd.readAsText(f);
  };
  inp.click();
}
function handleImportedBackup(filename, text){
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(e){ toast('That file is not valid JSON'); return; }
  const data = parsed && parsed.data ? parsed.data : parsed;
  const required = ['customers','salesInvoices','materials','products'];
  const missing = required.filter(k=>!Array.isArray(data[k]));
  if(missing.length){ toast('Not a SIMS backup — missing: ' + missing.join(', ')); return; }
  const counts = EXPORTABLE_TABLES.map(t=>({ title:t.title, n:(data[t.key]||[]).length }));
  openModal('Restore from backup',
    '<div class="warnbox">This replaces <b>everything</b> currently in the system. Your present data will be downloaded as a safety backup first, automatically.</div>' +
    '<div class="detailgrid" style="margin-top:12px;">' +
      '<div><div class="dl">File</div><div class="dv">' + esc(filename) + '</div></div>' +
      '<div><div class="dl">Taken on</div><div class="dv">' + esc((parsed._exportedAt||'').slice(0,10) || 'unknown') + '</div></div>' +
      '<div><div class="dl">Taken by</div><div class="dv">' + esc(parsed._exportedBy || 'unknown') + '</div></div>' +
      '<div><div class="dl">Format</div><div class="dv">' + esc(parsed._format || 'raw') + '</div></div>' +
    '</div><div class="hr"></div><b class="small">What this file contains</b>' +
    '<table style="margin-top:6px;"><thead><tr><th class="nosort">Table</th><th class="nosort">Records</th></tr></thead><tbody>' +
      counts.map(c=>'<tr><td>' + esc(c.title) + '</td><td>' + c.n + '</td></tr>').join('') + '</tbody></table>',
    '<button class="btn" ' + act('closeModal') + '>Cancel</button><button class="btn danger" ' + act('confirmImport') + '>Replace everything &amp; restore</button>', true);
  window._pendingImport = data;
}
function confirmImport(){
  const data = window._pendingImport; if(!data) return;
  if(!confirm('Last check — replace all current data with the backup?')) return;
  exportFullBackup();                                  // safety net before we overwrite
  const beforeCount = (DB.salesInvoices||[]).length;
  DB = data;
  if(!DB.auditLog) DB.auditLog = [];
  if(!DB.quotations) DB.quotations = [];
  if(!DB.settings) DB.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  audit('Import', 'System', '', 'Restored from backup — invoices ' + beforeCount + ' → ' + (DB.salesInvoices||[]).length);
  recomputeAlertsAndTasks(DB);
  save(); closeModal(); window._pendingImport = null;
  toast('Restore complete');
  navTo('dashboard'); rerender();
}

/* ---------- GLOBAL SEARCH (Ctrl+K) ------------------------------------
   v1.0 had four page-level search boxes that each searched one thing. This
   searches everything the business is made of — including serial numbers,
   which is the lookup a service engineer actually needs on a call. */
function globalSearchResults(q){
  q = (q||'').trim().toLowerCase();
  if(q.length < 2) return [];
  const hit = s => String(s||'').toLowerCase().indexOf(q) >= 0;
  const out = [];
  DB.customers.forEach(c=>{ if(hit(c.name)||hit(c.mobile)||hit(c.contactPerson)||hit(c.gst)||hit(c.location))
    out.push({kind:'Customer', title:c.name, sub:(c.contactPerson||'') + ' · ' + (c.mobile||'') + ' · ' + (c.location||''), fn:'navTo', args:['__customer:'+c.id]}); });
  DB.leads.forEach(l=>{ if(hit(l.company)||hit(l.contact)||hit(l.mobile)||hit(l.product))
    out.push({kind:'Lead', title:l.company, sub:l.stage + ' · ' + (l.product||'') + ' · ' + fmtMoney(l.expectedValue), fn:'openLeadFromSearch', args:[l.id]}); });
  DB.salesInvoices.forEach(i=>{ const c=byId(DB.customers,i.customerId); if(hit(i.invoiceNo)||hit(c&&c.name))
    out.push({kind:'Invoice', title:i.invoiceNo, sub:(c?c.name:'') + ' · ' + fmtMoney(i.total) + ' · ' + invStatus(i), fn:'openInvoiceDetail', args:[i.id]}); });
  (DB.quotations||[]).forEach(q2=>{ const c=byId(DB.customers,q2.customerId); if(hit(q2.quoteNo)||hit(c&&c.name)||hit(q2.leadCompany))
    out.push({kind:'Quotation', title:q2.quoteNo, sub:(c?c.name:q2.leadCompany||'') + ' · ' + fmtMoney(q2.total) + ' · ' + q2.status, fn:'openQuoteDetail', args:[q2.id]}); });
  DB.equipmentSerials.forEach(s=>{ if(hit(s.serial)){ const c=byId(DB.customers,s.customerId), p=byId(DB.products,s.productId);
    out.push({kind:'Serial', title:s.serial, sub:(p?p.name:'') + ' · ' + (c?c.name:'') + ' · sold ' + fmtDate(s.saleDate), fn:'openSerialCard', args:[s.id]}); } });
  DB.materials.forEach(m=>{ if(hit(m.name)||hit(m.code))
    out.push({kind:'Material', title:m.name, sub:m.code + ' · stock ' + m.qty + ' ' + m.unit, fn:'gotoStoresPurchases', args:['stores']}); });
  DB.suppliers.forEach(s=>{ if(hit(s.name)||hit(s.contactPerson)||hit(s.mobile))
    out.push({kind:'Supplier', title:s.name, sub:(s.contactPerson||'') + ' · ' + (s.mobile||''), fn:'navTo', args:['suppliers']}); });
  DB.products.forEach(p=>{ if(hit(p.name)||hit(p.code))
    out.push({kind:'Product', title:p.name, sub:p.code + ' · ' + fmtMoney(p.price), fn:'navTo', args:['products']}); });
  return out.slice(0, 40);
}
function openGlobalSearch(){
  openModal('Search everything',

/* ============================================================
   === SECTION: PLATFORM CORE (v1.2) ===
   Closes the gaps the August 2026 audit found:
     1. PURCHASE GST + INPUT TAX CREDIT — the missing half of the tax picture
     2. CREDIT NOTES  — sales returns, the lawful way to reverse an invoice
     3. DEBIT NOTES   — purchase returns back to the supplier
     4. GST POSITION  — output tax minus input tax = what you actually owe
     5. E-WAY BILL    — mandatory above Rs 50,000 consignment value
     6. SCORING       — explainable lead and collection risk, no black box
   ============================================================ */

/* ---------- 1. PURCHASE GST & INPUT TAX CREDIT ------------------------
   v1.1 priced sales correctly and left purchases holding only a total, so
   the system knew what GST was collected and nothing about what was paid.
   Same engine, other direction: the supplier's GSTIN state decides whether
   we were charged CGST+SGST or IGST, and that tax is money we can claim
   back — provided the purchase is recorded properly. */
function purchaseGstRateFor(line, db){
  const d = db || DB;
  const m = byId(d.materials, line.materialId);
  return (m && m.gstRate) || settings(d).defaultGstRate;
}
function purchaseHsnFor(line, db){
  const d = db || DB;
  const m = byId(d.materials, line.materialId);
  return (m && m.hsn) || '8505';   // electromagnets & magnetic assemblies
}
// Mirrors priceDocument() on the sales side. Kept as a separate function
// rather than a flag because the two read differently in the ledger: one
// creates a liability, the other creates a claim.
function priceePurchase(lines, supplier, db){
  const d = db || DB;
  const gstin = supplier ? supplier.gst : '';
  const intra = isIntraState(gstin, d);
  let subTotal = 0, cgst = 0, sgst = 0, igst = 0;
  const priced = (lines || []).map(l=>{
    const rate = purchaseGstRateFor(l, d);
    const taxable = Math.round((Number(l.qty)||0) * (Number(l.rate)||0) * 100) / 100;
    const tax = Math.round(taxable * rate) / 100;
    subTotal += taxable;
    if(intra){ cgst += tax/2; sgst += tax/2; } else { igst += tax; }
    return Object.assign({}, l, {
      hsn: purchaseHsnFor(l, d), gstRate: rate, taxable: taxable,
      tax: Math.round(tax*100)/100, total: Math.round((taxable + tax) * 100) / 100,
    });
  });
  const r = n => Math.round(n * 100) / 100;
  const taxTotal = r(cgst + sgst + igst);
  return { lines: priced, subTotal: r(subTotal), cgst: r(cgst), sgst: r(sgst), igst: r(igst),
           taxTotal: taxTotal, total: Math.round(r(subTotal) + taxTotal), intraState: intra,
           placeOfSupply: stateNameOf(stateCodeOf(gstin) || settings(d).company.stateCode) };
}
function applyGstToPurchase(db, pur){
  const sup = byId(db.suppliers, pur.supplierId);
  const doc = priceePurchase(pur.lines, sup, db);
  pur.lines = doc.lines;
  pur.subTotal = doc.subTotal; pur.cgst = doc.cgst; pur.sgst = doc.sgst; pur.igst = doc.igst;
  pur.taxTotal = doc.taxTotal; pur.total = doc.total;
  pur.intraState = doc.intraState; pur.placeOfSupply = doc.placeOfSupply;
  // Input tax credit is only claimable against a registered supplier. Buying
  // from an unregistered dealer means the tax is a cost, not a claim — getting
  // this wrong is how businesses over-claim and lose the credit at assessment.
  pur.itcEligible = !!(sup && sup.gst);
  pur.itcAmount = pur.itcEligible ? doc.taxTotal : 0;
  return pur;
}

/* ---------- 2 & 3. CREDIT AND DEBIT NOTES -----------------------------
   Under GST you cannot delete or quietly edit an invoice once it is issued.
   A sales return is a credit note against the original; a purchase return is
   a debit note against the supplier's bill. Both carry their own number, both
   are reported, and both must reference the document they adjust. */
function nextNoteNo(kind){
  const yr = todayISO().slice(2,4);
  const list = kind === 'credit' ? (DB.creditNotes || []) : (DB.debitNotes || []);
  return 'SIMS/' + (kind === 'credit' ? 'CN' : 'DN') + '/' + yr + '-' + String(list.length + 1).padStart(4,'0');
}
const RETURN_REASONS = [
  'Goods returned — not as specified',
  'Goods returned — damaged in transit',
  'Goods returned — defective on arrival',
  'Rate difference / price correction',
  'Post-sale discount agreed',
  'Quantity short-supplied',
  'Order cancelled after invoicing',
  'Other',
];

/* --- sales return: credit note against a sales invoice --- */
function openCreditNoteForm(invId){

    '<div><label>Note</label><input id="cn_note" placeholder="optional detail for the customer"/></div>' +

function invLineLabel(l){
  if(l.type === 'equipment'){ const p = byId(DB.products, l.productId); return p ? p.name : 'Equipment'; }
  if(l.type === 'consumable'){ const m = byId(DB.materials, l.materialId); return m ? m.name : 'Consumable'; }
  return l.description || 'Service charge';
}
// A line can be returned more than once (two of five units now, one later),
// so the form must never let the running total exceed what was sold.
function returnedQtyFor(invoiceId, lineIdx){
  return (DB.creditNotes || [])
    .filter(n=>n.invoiceId === invoiceId)
    .reduce((s,n)=> s + (n.lines.find(l=>l.idx === lineIdx) ? n.lines.find(l=>l.idx === lineIdx).qty : 0), 0);
}
function purchaseReturnedQtyFor(purchaseId, lineIdx){
  return (DB.debitNotes || [])
    .filter(n=>n.purchaseId === purchaseId)
    .reduce((s,n)=> s + (n.lines.find(l=>l.idx === lineIdx) ? n.lines.find(l=>l.idx === lineIdx).qty : 0), 0);
}
let _returnLines = [];
function setReturnQty(kind, docId, idx, v){
  const row = _returnLines.find(r=>r.idx === idx); if(!row) return;
  const max = row.soldQty - row.alreadyReturned;
  let q = Number(v) || 0;
  if(q < 0) q = 0;
  if(q > max){ q = max; toast('Only ' + max + ' left to return on that line'); }
  row.qty = q;
  renderReturnLines(kind, docId);
}
function returnAll(kind, docId){
  _returnLines.forEach(r=>{ r.qty = r.soldQty - r.alreadyReturned; });
  renderReturnLines(kind, docId);
}
function renderReturnLines(kind, docId){
  const prefix = kind === 'cn' ? 'cn' : 'dn';
  let h = '<table><thead><tr><th class="nosort">Item</th><th class="nosort">Billed</th><th class="nosort">Already returned</th><th class="nosort">Returning now</th><th class="nosort">Rate</th><th class="nosort">Taxable</th></tr></thead><tbody>';
  _returnLines.forEach(r=>{
    const avail = r.soldQty - r.alreadyReturned;
    h += '<tr><td>' + esc(r.label) + ' <span class="tag">' + r.type + '</span></td>' +
      '<td>' + r.soldQty + '</td>' +
      '<td>' + (r.alreadyReturned ? r.alreadyReturned : '<span class="muted">—</span>') + '</td>' +
      '<td><input type="number" style="width:78px;padding:4px 7px;" min="0" max="' + avail + '" value="' + r.qty + '" ' +
        'oninput="setReturnQty(\'' + prefix + '\',\'' + docId + '\',' + r.idx + ',this.value)"' + (avail <= 0 ? ' disabled' : '') + '/></td>' +
      '<td>' + fmtMoney(r.rate) + '</td><td>' + fmtMoney(r.qty * r.rate) + '</td></tr>';
  });
  h += '</tbody></table><button class="btn sm" style="margin-top:8px;" ' + act('returnAll', prefix, docId) + '>Return everything</button>';
  const area = document.getElementById(prefix + '_linesArea'); if(area) area.innerHTML = h;

  const active = _returnLines.filter(r=>r.qty > 0);
  const totalsEl = document.getElementById(prefix + '_totals');
  if(totalsEl){
    if(!active.length){ totalsEl.innerHTML = '<div class="empty" style="padding:14px;">Enter a quantity against at least one line.</div>'; }
    else {
      const party = kind === 'cn'
        ? byId(DB.customers, (byId(DB.salesInvoices, docId)||{}).customerId)
        : byId(DB.suppliers, (byId(DB.purchases, docId)||{}).supplierId);
      const doc = kind === 'cn' ? priceDocument(active, party) : priceePurchase(active, party);
      totalsEl.innerHTML = docTotalsBlock(doc);
    }
  }
}
function saveCreditNote(invId){
  const inv = byId(DB.salesInvoices, invId); if(!inv) return;
  const active = _returnLines.filter(r=>r.qty > 0);
  if(!active.length){ toast('Enter a quantity against at least one line'); return; }
  const c = byId(DB.customers, inv.customerId);
  const doc = priceDocument(active, c);
  const note = {
    id: uid('CRN'), noteNo: nextNoteNo('credit'), invoiceId: inv.id, invoiceNo: inv.invoiceNo,
    customerId: inv.customerId, date: val('cn_date') || todayISO(),
    reason: val('cn_reason'), note: val('cn_note'),
    lines: doc.lines.map((l,i)=>Object.assign({}, l, { idx: active[i].idx })),
    subTotal: doc.subTotal, cgst: doc.cgst, sgst: doc.sgst, igst: doc.igst,
    taxTotal: doc.taxTotal, total: doc.total, intraState: doc.intraState,
    placeOfSupply: doc.placeOfSupply, createdBy: CURRENT_EMP,
  };
  if(!DB.creditNotes) DB.creditNotes = [];
  DB.creditNotes.push(note);

  // Put the goods back where they came from.
  active.forEach(r=>{
    if(r.type === 'consumable'){
      const m = byId(DB.materials, r.materialId);
      if(m) m.qty = (m.qty || 0) + r.qty;
    } else if(r.type === 'equipment'){
      const ps = prodStockRow(r.productId);
      if(ps) ps.finishedQty = (ps.finishedQty || 0) + r.qty;
      // Returned machines stop being live installations: the serial, its
      // warranty and its scheduled visits are cancelled, not left to raise
      // service reminders for equipment sitting back on our own shelf.
      const serials = DB.equipmentSerials
        .filter(s=>s.invoiceId === inv.id && s.productId === r.productId && s.status !== 'Returned')
        .slice(0, r.qty);
      serials.forEach(s=>{
        s.status = 'Returned'; s.returnedOn = note.date; s.creditNoteId = note.id;
        const w = DB.warrantyRecords.find(w=>w.serialId === s.id);
        if(w) w.status = 'Cancelled — returned';
        const sch = DB.serviceSchedules.find(x=>x.serialId === s.id);
        if(sch) (sch.visits || []).forEach(v=>{ if(v.status !== 'Done') v.status = 'Cancelled'; });
      });
    }
  });
  inv.paymentStatus = invStatus(inv);
  DB.communications.push({ id: uid('COM'), entityType:'customer', entityId: inv.customerId, type:'Credit note',
    date: note.date, channel:'System', summary: note.noteNo + ' — ' + fmtMoney(note.total) + ' against ' + inv.invoiceNo + ' (' + note.reason + ')' });
  audit('Created', 'Credit Note', note.id, note.noteNo + ' — ' + (c ? c.name : '') + ' — ' + fmtMoney(note.total) + ' against ' + inv.invoiceNo);
  recomputeAlertsAndTasks(DB); save(); closeModal();
  toast('Credit note ' + note.noteNo + ' issued — ' + fmtMoney(note.total) + ' credited, stock restored');
  rerender();
}
// The credit reduces what the customer owes, so the receivable has to know
// about it — otherwise collections chases money that was already credited.
function invCredited(inv){
  return (DB.creditNotes || []).filter(n=>n.invoiceId === inv.id).reduce((s,n)=>s + n.total, 0);
}
// Crediting an invoice the customer has already paid does not produce a zero
// balance — it produces a debt running the other way. invBalance() floors at
// zero, so without this the refund owed would silently disappear.
function invRefundDue(inv){
  const over = invPaid(inv) + invCredited(inv) - (Number(inv.total) || 0);
  return over > 0.5 ? Math.round(over * 100) / 100 : 0;
}
function totalRefundsDue(){
  return DB.salesInvoices.reduce((s,i)=>s + invRefundDue(i), 0);
}

    '<div class="detailgrid" style="margin-top:12px;">' +

    '</div>' +

    '<div><label>Note</label><input id="dn_note" placeholder="optional detail for the supplier"/></div>' +
    '<div class="hr"></div><b class="small">How much is going back?</b>' +
    '<div id="dn_linesArea" style="margin-top:8px;"></div>' +
    '<div class="hr"></div><div id="dn_totals"></div>',
    '<button class="btn" ' + act('closeModal') + '>Cancel</button>' +
