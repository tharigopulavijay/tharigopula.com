    svgHBarChart(sources.map(s=>({label:s,value:revBySrc[s]||0})),{fmt:v=>fmtMoney(v)})+
    '<table style="margin-top:14px;"><thead><tr><th class="nosort">Source</th><th class="nosort">Leads</th><th class="nosort">Won</th><th class="nosort">Conv.</th><th class="nosort">Revenue</th></tr></thead><tbody>'+

  h+='</div>';

  // Row 3: monthly trend + salesperson leaderboard
  const monthKeys=[]; for(let i=5;i>=0;i--) monthKeys.push(monthKey(T,-i));
  const createdByMonth = monthKeys.map(k=>({label:monthLabel(k), value:allLeads.filter(l=>(l.createdAt||'').slice(0,7)===k).length}));
  const wonByMonth = monthKeys.map(k=>({label:monthLabel(k), value:won.filter(l=>(l.closedAt||'').slice(0,7)===k).length}));

    '<table><thead><tr><th class="nosort">Salesperson</th><th class="nosort">Assigned</th><th class="nosort">Won</th><th class="nosort">Conv.</th><th class="nosort">Revenue Closed</th></tr></thead><tbody>'+
    salesEmps.map(e=>{
      const mine=allLeads.filter(l=>l.assignedTo===e.id);
      const mineWon=mine.filter(l=>l.stage==='Won').length;
      return '<tr><td><b>'+esc(e.name)+'</b></td><td>'+mine.length+'</td><td>'+mineWon+'</td><td>'+(mine.length?Math.round(mineWon/mine.length*100):0)+'%</td><td><b>'+fmtMoney(revBySales[e.id]||0)+'</b></td></tr>';

  h+='</div>';

  // Row 4: industry breakdown, full width
  const openLeadsList = allLeads.filter(l=>!['Won','Lost'].includes(l.stage));
  const byIndustry={};
  openLeadsList.forEach(l=>{ const k=l.industry||'Unspecified'; byIndustry[k]=(byIndustry[k]||0)+(l.expectedValue||0); });
  const industries=Object.keys(byIndustry).sort((a,b)=>byIndustry[b]-byIndustry[a]);

  return h;

function saveLead(id){
  const company=val('ld_company'); if(!company){ toast('Company name required'); return; }
  const prodSel = byId(DB.products,val('ld_product'));
  const onHoldEl = document.getElementById('ld_onhold');
  const data = {company, contact:val('ld_contact'), mobile:val('ld_mobile'), email:val('ld_email'), location:val('ld_location'),
    industry:val('ld_industry'), source:val('ld_source'), product:prodSel?prodSel.name:'', expectedValue:num('ld_value'),
    assignedTo:val('ld_assignee'), stage:val('ld_stage'), followUpDate:val('ld_followup'), onHold: onHoldEl? onHoldEl.checked : false, notes:val('ld_notes')};
  if(id){
    const l=byId(DB.leads,id); Object.assign(l,data);
    l.activities.push({date:todayISO(),note:'Lead details updated, stage: '+data.stage});
    if(data.stage!=='Won' && data.stage!=='Lost') completeTasksByRef(DB,'lead',id,'Lead updated');
  } else {
    const l = Object.assign({id:uid('LD'),activities:[{date:todayISO(),note:'Lead created'}],lostReason:'',lostCategory:'',closedAt:'',lastActiveStage:'',createdAt:todayISO()}, data);
    DB.leads.push(l);
  }
  recomputeAlertsAndTasks(DB); save(); closeModal(); toast('Lead saved');
  document.getElementById('content').innerHTML=renderLeads();
}

  let h='<div class="detailgrid">'+fields.map(x=>{const [k,v]=x.split(/:(.+)/); return '<div><div class="dl">'+k+'</div><div class="dv">'+esc(v)+'</div></div>';}).join('')+'</div>';
  if(l.notes) h+='<div class="small muted" style="margin-bottom:10px;">Notes: '+esc(l.notes)+'</div>';

  } else if(l.stage==='Won' && l.wonCustomerId){
    foot+='<button class="btn primary" onclick="closeModal();navTo(\'customers\');setTimeout(()=>openCustomerDetail(\''+l.wonCustomerId+'\'),50)">View Customer</button>';
  }
  openModal('Lead — '+l.company, h, foot, true);

function addLeadActivity(id){
  const note=val('ld_actnote'); if(!note){ toast('Enter a note'); return; }

// A proper reason-category modal instead of a native prompt() — gives Analytics something structured to tally
// ("Why Leads Are Lost") instead of unparseable free text, while still capturing the human detail underneath.
function markLeadLost(id){
  const l=byId(DB.leads,id); if(!l) return;
  const catOpts = LOST_REASON_CATS.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');
  openModal('Mark Lead Lost — '+l.company, ''+
    '<div class="formrow full"><div><label>Reason category</label><select id="lost_cat">'+catOpts+'</select></div></div>'+
    '<div class="formrow full"><div><label>Details (optional)</label><textarea id="lost_detail" placeholder="e.g. competitor quoted 15% lower, or delivery in 3 days vs our 3 weeks"></textarea></div></div>',
    '<button class="btn" onclick="openLeadDetail(\''+id+'\')">Cancel</button><button class="btn warn" onclick="confirmMarkLeadLost(\''+id+'\')">Confirm Lost</button>');
}
function confirmMarkLeadLost(id){
  const l=byId(DB.leads,id); if(!l) return;
  const cat=val('lost_cat')||'Other', detail=val('lost_detail');
  l.lastActiveStage=l.stage; l.stage='Lost'; l.lostCategory=cat; l.lostReason=detail?cat+' — '+detail:cat; l.followUpDate=''; l.closedAt=todayISO();
  l.activities.push({date:todayISO(),note:'Marked Lost — '+l.lostReason});
  completeTasksByRef(DB,'lead',id,'Lead marked lost'); recomputeAlertsAndTasks(DB); save();
  closeModal(); toast('Lead marked lost'); document.getElementById('content').innerHTML=renderLeads();
}
function markLeadWon(id){
  const l=byId(DB.leads,id); if(!l) return;
  // duplicate detection by mobile/company
  let cust = DB.customers.find(c=>c.mobile===l.mobile || c.name.toLowerCase()===l.company.toLowerCase());
  if(!cust){
    cust = {id:uid('CUS'), name:l.company, contactPerson:l.contact, mobile:l.mobile, email:l.email, location:l.location,
      industry:l.industry, type:'Direct', gst:'', notes:'Converted from lead '+l.id, createdAt:todayISO(), leadId:l.id, source:l.source};
    DB.customers.push(cust);
  } else if(!cust.leadId){
    // existing customer record matched by mobile/name — still worth attributing to this lead's source
    // since it's the first time we can trace how they actually reached us
    cust.leadId=l.id; cust.source=l.source;
  }
  l.stage='Won'; l.wonCustomerId=cust.id; l.followUpDate=''; l.closedAt=todayISO();
  l.activities.push({date:todayISO(),note:'Marked Won — linked to customer '+cust.name});
  completeTasksByRef(DB,'lead',id,'Lead won'); recomputeAlertsAndTasks(DB); save();
  closeModal(); toast('Lead won — customer ready. Create the sales invoice from Sales > Invoices.');
  document.getElementById('content').innerHTML=renderLeads();
}

let _custSearch='';
function renderCustomers(){
  let h = '<div class="flexbar"><input class="searchbox" placeholder="Search by name, mobile, invoice#, serial#, model..." value="'+esc(_custSearch)+'" oninput="setCustSearch(this.value)"/>'+
    '<button class="btn primary" onclick="openCustomerForm()">'+icon('plus',14)+' New customer</button></div>';
  const q=_custSearch.toLowerCase();
  let rows = DB.customers.filter(c=>{
    if(!q) return true;
    if(c.name.toLowerCase().includes(q) || (c.mobile||'').includes(q)) return true;
    const invMatch = DB.salesInvoices.some(i=>i.customerId===c.id && i.invoiceNo.toLowerCase().includes(q));
    const serMatch = DB.equipmentSerials.some(s=>s.customerId===c.id && s.serial.toLowerCase().includes(q));
    const modelMatch = DB.equipmentSerials.some(s=>{ if(s.customerId!==c.id) return false; const p=byId(DB.products,s.productId); return p&&p.name.toLowerCase().includes(q); });
    return invMatch||serMatch||modelMatch;
  });
  h += '<div class="tablewrap">'+renderTable('custtbl',[
    {key:'name',label:'Customer',render:c=>'<a class="link" onclick="openCustomerDetail(\''+c.id+'\')">'+esc(c.name)+'</a><div class="small muted">'+esc(c.location)+'</div>'},
    {key:'contactPerson',label:'Contact',render:c=>esc(c.contactPerson)+'<div class="small muted">'+esc(c.mobile)+'</div>'},
    {key:'industry',label:'Industry'},
    {key:'type',label:'Type',render:c=>pill(c.type,'blue')},
    {key:'invoices',label:'Invoices',kind:'num',sort:false,render:c=>DB.salesInvoices.filter(i=>i.customerId===c.id).length},
    {key:'open',label:'Open Service',kind:'num',sort:false,render:c=>DB.serviceJobs.filter(j=>j.customerId===c.id&&j.status==='Open').length},
    {key:'last',label:'Last Purchase',sort:false,render:c=>{ const inv=DB.salesInvoices.filter(i=>i.customerId===c.id).sort((a,b)=>a.date<b.date?1:-1)[0]; return inv?fmtDate(inv.date):'—'; }},
  ], rows, {})+'</div>';
  window._lastTableRenderFn['custtbl']=()=>{ document.getElementById('content').innerHTML=renderCustomers(); };
  return h;
}

function addInvLine(){

let _repeatSearch='';
let _repeatFilter='All';
let _repeatViewMode='customer'; // 'customer' (who to call) or 'product' (which item, who needs it)
// Where the prediction date comes from: the customer's actual last purchase of this material if we have one on
// record. If they've never bought it before (only predicted because they bought equipment that consumes it),
// this is null — shown as a blank dash, not a made-up label.
function lastPurchaseDateFor(customerId, materialId){
  let last=null;
  DB.salesInvoices.forEach(inv=>{
    if(inv.customerId!==customerId) return;
    inv.lines.forEach(l=>{ if(l.type==='consumable' && l.materialId===materialId){ if(!last || inv.date>last) last=inv.date; } });
  });
  return last;
}
function repeatOppUrgency(o){
  const d=daysBetween(todayISO(), o.expectedDate);
  if(d<0) return 'Overdue';
  if(d<=7) return 'Due This Week';
  if(d<=30) return 'Due This Month';
  return 'Upcoming';
}
// The "why": which of this customer's owned equipment actually consumes this material, per the product's own
// compatibleConsumables list. This is the real link between "he bought a Yoke" and "he needs Black Bath Powder
// every ~75 days" — derived live from data that already exists, nothing new to maintain.
function equipmentDrivingConsumable(customerId, materialId){
  return DB.equipmentSerials.filter(s=>s.customerId===customerId).map(s=>{
    const p=byId(DB.products,s.productId);
    return (p && (p.compatibleConsumables||[]).includes(materialId)) ? {serial:s, product:p} : null;
  }).filter(Boolean);
}
function openRepeatWhy(oppId){
  const o=byId(DB.repeatOpportunities,oppId); if(!o) return;
  const m=byId(DB.materials,o.materialId); const c=byId(DB.customers,o.customerId);
  const driving=equipmentDrivingConsumable(o.customerId,o.materialId);
  const lastP=lastPurchaseDateFor(o.customerId,o.materialId);
  const prof=CONSUMPTION_PROFILE[o.materialId];
  let h='<div class="small muted" style="margin-bottom:10px;">'+esc(c?c.name:'')+' — '+esc(m?m.name:'')+'</div>';
  if(driving.length){
    h+='<div class="small" style="margin-bottom:8px;">Needed because this customer owns equipment that consumes it:</div>';
    h+='<table><thead><tr><th class="nosort">Equipment</th><th class="nosort">Serial</th><th class="nosort">Purchased</th></tr></thead><tbody>'+
      driving.map(d=>'<tr><td>'+esc(d.product.name)+'</td><td>'+d.serial.serial+'</td><td>'+fmtDate(d.serial.saleDate)+'</td></tr>').join('')+
      '</tbody></table>';
  } else {
    h+='<div class="small">No matching equipment on record for this customer — this prediction is based on their own past purchases of this consumable.</div>';
  }
  h+='<div class="hr"></div><div class="detailgrid">'+
    ['Last purchase of this item:'+(lastP?fmtDate(lastP):'Never purchased yet'),'Typical reorder interval:'+(prof?prof.intervalDays+' days':'—'),
     'Expected next order:'+fmtDate(o.expectedDate),'Confidence:'+o.confidence].map(x=>{const[k,v]=x.split(/:(.+)/);return '<div><div class="dl">'+k+'</div><div class="dv">'+esc(v)+'</div></div>';}).join('')+'</div>';
  openModal('Why this prediction?', h, '<button class="btn" onclick="closeModal()">Close</button>');
}
function renderRepeatSales(){
  const openOpps=DB.repeatOpportunities.filter(o=>o.status==='Open');
  let h='<div class="section-title">Repeat Sales Opportunities <span class="hint">Auto-predicted from each customer\'s own purchase history and consumption rate — no manual setup, created automatically on every sale</span></div>';
  if(!openOpps.length){ h+='<div class="card"><div class="empty">No open repeat-sales opportunities right now.</div></div>'; return h; }

  const overdueCount=openOpps.filter(o=>repeatOppUrgency(o)==='Overdue').length;
  const dueWeekCount=openOpps.filter(o=>repeatOppUrgency(o)==='Due This Week').length;
  const totalValue=openOpps.reduce((s,o)=>{ const m=byId(DB.materials,o.materialId); return s+(m?m.lastRate*o.expectedQty:0); },0);
  const kpis=[
    {label:'Open Opportunities', val:openOpps.length, sub:fmtMoney(totalValue)+' predicted value', ic:'refresh', color:'var(--primary-600)', bg:'var(--primary-100)'},
    {label:'Overdue', val:overdueCount, sub:'past the expected reorder date', ic:'alerttri', color:overdueCount>0?'var(--red)':'var(--green)', bg:overdueCount>0?'var(--red-100)':'var(--green-100)'},
    {label:'Due This Week', val:dueWeekCount, sub:'call these first', ic:'clock', color:'var(--amber)', bg:'var(--amber-100)'},
    {label:'Customers Involved', val:new Set(openOpps.map(o=>o.customerId)).size, sub:'act before they order elsewhere', ic:'users', color:'var(--primary-600)', bg:'var(--primary-100)'},
  ];
  h+='<div class="grid g4">'+kpis.map(k=>
    '<div class="kpi"><div class="kpitop">'+iconChip(k.ic,k.color,k.bg)+'</div>'+
    '<div class="label" style="margin-top:10px;">'+esc(k.label)+'</div><div class="val">'+k.val+'</div><div class="sub">'+esc(k.sub)+'</div></div>'
  ).join('')+'</div>';

/* ---- 12.3 WARRANTY ---- */
/* ---- 12.3 WARRANTY & SERVICE COVERAGE ----
   Redesigned to be a real coverage register, not just an "expiring soon" worklist: every piece of equipment ever
   sold shows up, grouped by customer, with warranty status AND service compliance side by side — because both
   things vary independently (a unit can be well inside warranty but overdue for its Service 1 check, or out of
   warranty but the customer still comes in reliably for service). Status/search let you narrow down when you only
   care about what's expiring, expired, or falling behind on service. ---- */
let _warrCustSearch='';
let _warrStatusFilter='All';
// Deliberately binary by design (per feedback): a warranty is either Active or Expired, full stop — no "Expiring
// Soon" middle tier or day-count framing cluttering the table. serviceOverdue/overdueVisit are kept on the
// object because Service Follow-ups (a separate, action-oriented page) still needs to know what to chase; they
// are just no longer surfaced as "overdue" language on Warranty/Service Track, which are coverage/reference views.
function warrantyItems(){
  const T=todayISO();
  return DB.warrantyRecords.map(w=>{
    const s=byId(DB.equipmentSerials,w.serialId); const p=s?byId(DB.products,s.productId):null; const c=s?byId(DB.customers,s.customerId):null;
    const sched=DB.serviceSchedules.find(sc=>sc.serialId===w.serialId);
    const daysLeft=daysBetween(T,w.expiryDate);
    const status = daysLeft<0 ? 'Expired' : 'Active';
    const overdueVisit = sched ? (sched.visits||[]).find(v=>v.status==='Pending' && v.dueDate<=T) : null;
    return {w,s,p,c,sched,daysLeft,status,serviceOverdue:!!overdueVisit,overdueVisit};
  }).filter(x=>x.s && x.p && x.c);
}
function renderWarranty(){
  const items=warrantyItems();
  const totalEquip=items.length;
  const activeCount=items.filter(x=>x.status==='Active').length;
  const expiredCount=items.filter(x=>x.status==='Expired').length;
  const pendingServiceCount=items.filter(x=>x.serviceOverdue).length;
  const T=todayISO();
  const totalVisitsDue=items.reduce((s,x)=>s+(x.sched?(x.sched.visits||[]).filter(v=>v.dueDate<=T).length:0),0);
  const doneVisits=items.reduce((s,x)=>s+(x.sched?(x.sched.visits||[]).filter(v=>v.status==='Done').length:0),0);
  const complianceRate=totalVisitsDue?Math.round(doneVisits/totalVisitsDue*100):100;
  const custCount=new Set(items.map(x=>x.c.id)).size;
  const rstats=serviceRepairStats();

  const kpis=[
    {label:'Equipment Tracked', val:totalEquip, sub:'across '+custCount+' customers', ic:'shieldcheck', color:'var(--primary-600)', bg:'var(--primary-100)'},
    {label:'Active', val:activeCount, sub:'coverage in force', ic:'checkcircle', color:'var(--green)', bg:'var(--green-100)'},
    {label:'Expired', val:expiredCount, sub:'no active coverage', ic:'alerttri', color:expiredCount>0?'var(--red)':'var(--green)', bg:expiredCount>0?'var(--red-100)':'var(--green-100)'},
    {label:'Service Compliance', val:complianceRate+'%', sub:doneVisits+' of '+totalVisitsDue+' due visits completed', ic:'wrench', color:complianceRate>=60?'var(--green)':'var(--amber)', bg:complianceRate>=60?'var(--green-100)':'var(--amber-100)'},
  ];
  let h='<div class="section-title">Warranty &amp; Service Coverage <span class="hint">Every unit sold, grouped by customer — coverage status for reference; to act on a due visit, see Service Follow-ups</span></div>';
  h+='<div class="grid g4">'+kpis.map(k=>
    '<div class="kpi"><div class="kpitop">'+iconChip(k.ic,k.color,k.bg)+'</div>'+
    '<div class="label" style="margin-top:10px;">'+esc(k.label)+'</div><div class="val">'+k.val+'</div><div class="sub">'+esc(k.sub)+'</div></div>'
  ).join('')+'</div>';

  const rkpis=[
    {label:'Repairs — In Warranty', val:rstats.repairWithin, sub:'free repairs', ic:'shieldcheck', color:'var(--green)', bg:'var(--green-100)'},
    {label:'Repairs — After Warranty', val:rstats.repairAfter, sub:'chargeable repairs', ic:'alerttri', color:'var(--amber)', bg:'var(--amber-100)'},
    {label:'Paid Services/Visits', val:rstats.paidVisits, sub:fmtMoney(rstats.paidRevenue)+' collected', ic:'bag', color:'var(--primary-600)', bg:'var(--primary-100)'},
    {label:'Free Services/Visits', val:rstats.freeVisits, sub:'no charge to customer', ic:'wrench', color:'var(--green)', bg:'var(--green-100)'},
  ];
  h+='<div class="grid g4" style="margin-top:10px;">'+rkpis.map(k=>
    '<div class="kpi"><div class="kpitop">'+iconChip(k.ic,k.color,k.bg)+'</div>'+
    '<div class="label" style="margin-top:10px;">'+esc(k.label)+'</div><div class="val">'+k.val+'</div><div class="sub">'+esc(k.sub)+'</div></div>'
  ).join('')+'</div>';

  h+='<div class="toolbar" style="margin-top:20px;"><input class="searchbox" placeholder="Search by customer, product, or serial..." value="'+esc(_warrCustSearch)+'" oninput="setWarrSearch(this.value)"/><button class="btn" onclick="gotoServiceFollowups()">Service Follow-ups &amp; Reminders</button></div>';
  const statusTabs=['All','Active','Expired','Pending Service'];
  h+='<div class="filterbar">'+statusTabs.map(s=>{ const cnt = s==='All'?totalEquip:(s==='Pending Service'?pendingServiceCount:items.filter(x=>x.status===s).length);
    return '<div class="subtab'+(s===_warrStatusFilter?' active':'')+'" onclick="setWarrFilter(\''+s+'\')">'+esc(s)+' ('+cnt+')</div>'; }).join('')+'</div>';

  h+='<div id="warrGroupsArea">'+renderWarrantyGroups(items)+'</div>';
  h+=renderCalibrationSection();
  return h;
}

    return {r,s,p,c,status:calibrationStatus(r),daysLeft:daysBetween(T,r.validUntil)};
  }).filter(x=>x.s && x.p && x.c);

function renderWarrantyGroups(items){
  const q=_warrCustSearch.toLowerCase();
  let filtered=items.filter(x=>{
    if(_warrStatusFilter==='Pending Service'){ if(!x.serviceOverdue) return false; }
    else if(_warrStatusFilter!=='All' && x.status!==_warrStatusFilter) return false;
    if(q && !(x.c.name.toLowerCase().includes(q) || x.p.name.toLowerCase().includes(q) || x.s.serial.toLowerCase().includes(q))) return false;
    return true;
  });
  if(!filtered.length) return '<div class="empty" style="margin-top:16px;">No equipment matches this filter</div>';
  const byCust={};
  filtered.forEach(x=>{ byCust[x.c.id]=byCust[x.c.id]||{c:x.c,rows:[]}; byCust[x.c.id].rows.push(x); });
  const groups=Object.values(byCust).sort((a,b)=>a.c.name.localeCompare(b.c.name));
  let h='';
  groups.forEach(g=>{
    // Same customer + same product + same invoice = one purchase event, shown as one row with a Qty rather than
    // repeating identical Product/Warranty/Purchased data once per serial (the "Krishna Boiler bought 4, don't
    // show 4 rows" fix).
    const batches=groupIntoBatches(g.rows).sort((a,b)=>a.rows[0].daysLeft-b.rows[0].daysLeft);
    h+='<div class="card" style="margin-top:14px;">';

    h+='<table><thead><tr><th class="nosort">Product</th><th class="nosort">Qty / Serials</th><th class="nosort">Purchased</th><th class="nosort">Warranty</th><th class="nosort">Expiry</th><th class="nosort">Service 1</th><th class="nosort">Service 2</th><th class="nosort">Calibration</th><th class="nosort">Action</th></tr></thead><tbody>';
    batches.forEach(b=>{
      const rep=b.rows[0]; const qty=b.rows.length; const scheds=b.rows.map(r=>r.sched);
      const statusPill = rep.status==='Expired'?pill('Expired','red'):pill('Active','green');
      const serialsCell = qty>1 ? ('<b>'+qty+'</b> units<div class="small muted">'+b.rows.map(r=>r.s.serial).join(', ')+'</div>') : rep.s.serial;
      let calCell='<span class="small muted">—</span>';
      if(qty===1){
        const calRec = DB.calibrationRecords.find(r=>r.serialId===rep.s.id);
        if(calRec){ const cs=calibrationStatus(calRec); const cp=cs==='Expired'?pill('Expired','red'):(cs==='Due Soon'?pill('Due Soon','amber'):pill('Valid','green')); calCell='<a class="link" onclick="openCalibrationCert(\''+calRec.id+'\')">'+cp+'</a>'; }
      } else {
        const calRecs=b.rows.map(r=>DB.calibrationRecords.find(cr=>cr.serialId===r.s.id)).filter(Boolean);
        if(calRecs.length){ const validCount=calRecs.filter(r=>calibrationStatus(r)==='Valid').length; calCell='<span class="small">'+validCount+'/'+calRecs.length+' valid</span>'; }
      }
      const actionBtns = qty===1
        ? '<button class="btn sm" onclick="openWarrantyReview(\''+rep.w.id+'\')">Review</button>'+(rep.sched?' <button class="btn sm" onclick="openVisitHistory(\''+rep.sched.id+'\')">Details</button>':'')
        : '<button class="btn sm" onclick="openBatchServiceHistory(\''+rep.c.id+'\',\''+rep.p.id+'\',\''+(rep.s.invoiceId||'')+'\')">Details</button>';
      h+='<tr><td>'+esc(rep.p.name)+'</td><td>'+serialsCell+'</td><td>'+fmtDate(rep.s.saleDate)+'</td><td>'+statusPill+'</td><td>'+fmtDate(rep.w.expiryDate)+'</td>'+
        '<td>'+batchVisitCell(scheds,1)+'</td><td>'+batchVisitCell(scheds,2)+'</td><td>'+calCell+'</td>'+
        '<td>'+actionBtns+'</td></tr>';
    });
    h+='</tbody></table></div>';
  });
  return h;
}

/* ---- SERVICE FOLLOW-UPS (moved here from Sales — chasing the two scheduled visits is service-ops work, not
   a selling motion) ----
   Two separate questions, tracked separately: did we message them (reminderSent — an action we took), and what
   did they actually say back (contactStatus — the thing the office needs to know to plan its week). Our job is
   to intimate the customer that a visit is due; whether they act on it is on them, so "Not Contacted" is the
   only state that's really our fault to fix. Structurally isolated from repairs: this page only ever reads
   DB.serviceSchedules (Service 1/2), never DB.serviceJobs directly, so a breakdown call has no way to land here
   — those live on Job Cards. */
const VISIT_CONTACT_STATUSES=['Not Contacted','Message Sent','Confirmed','Declined','No Response'];
function visitContactStatus(v){ return (v && v.contactStatus) || 'Not Contacted'; }
function contactStatusPill(status){
  const map={'Not Contacted':'red','Message Sent':'amber','Confirmed':'green','Declined':'gray','No Response':'red'};
  return pill(status, map[status]||'gray');
}
// Chargeable is a plain in-warranty/out-of-warranty fact worth showing; the actual amount isn't — it depends on
// what the visit turns up, so a fixed number here would just be wrong. Keep it to the fact, not a figure.
function chargeCell(chargeable){ return chargeable ? pill('Chargeable','amber') : pill('Free','green'); }
// Buckets the office actually plans around — the exact due day rarely matters on a 4-month cadence; the month
// does. "Overdue" = its month has already passed with the visit still not done; "This Month" = the active
// worklist; "Upcoming" = too early to chase yet.
function fuBucket(dueDate){
  const cur=todayISO().slice(0,7), vm=dueDate.slice(0,7);
  if(vm<cur) return 'Overdue';
  if(vm===cur) return 'This Month';
  return 'Upcoming';
}
let _fuBucket='Overdue';
function setFuBucket(b){ _fuBucket=b; document.getElementById('content').innerHTML=renderServiceFollowups(); }
// Second, simpler cut through the same list — every business needs this base split regardless of which month
// bucket it's looking at: have we reached this person at all, or not.
let _fuContactFilter='All'; // 'All' | one of VISIT_CONTACT_STATUSES — differentiated so Declined and No Response
// (which both need a very different next action than a plain Confirmed) don't get lumped together as "Contacted"
function setFuContactFilter(v){ _fuContactFilter=v; document.getElementById('content').innerHTML=renderServiceFollowups(); }
function setVisitContactStatus(schId, seq, status, notes){
  const sc=byId(DB.serviceSchedules,schId); if(!sc) return;
  const v=(sc.visits||[]).find(vv=>vv.seq===seq); if(!v) return;
  const s=byId(DB.equipmentSerials,sc.serialId); const c=s?byId(DB.customers,s.customerId):null; const p=s?byId(DB.products,s.productId):null;
  v.contactStatus=status;
  if(notes!==undefined) v.contactNotes=notes;
  if(status!=='Not Contacted' && !v.reminderSent) v.reminderSent=todayISO();
  if(c) DB.communications.push({id:uid('COM'),entityType:'customer',entityId:c.id,type:'Service Follow-up',date:todayISO(),
    summary:'Follow-up status set to "'+status+'"'+(v.contactNotes?' — '+v.contactNotes:'')+' — '+(p?p.name+' ':'')+'('+(s?s.serial:'')+'), Service '+seq});
  save(); toast('Status updated'); document.getElementById('content').innerHTML=renderServiceFollowups();
}
// A status dropdown alone loses the actual conversation — "hey, what happened when you called them" needs an
// answer, not just a label. This captures that answer alongside the status.
function openLogContact(schId, seq){
  const sc=byId(DB.serviceSchedules,schId); if(!sc) return;
  const v=(sc.visits||[]).find(vv=>vv.seq===seq); if(!v) return;

  openModal('Log Contact — '+c.name+' / '+s.serial, ''+

    '<div class="formrow full"><div><label>Contact status</label><select id="lc_status">'+VISIT_CONTACT_STATUSES.map(st=>'<option'+(st===visitContactStatus(v)?' selected':'')+'>'+st+'</option>').join('')+'</select></div></div>'+
    '<div class="formrow full"><div><label>What did they say?</label><textarea id="lc_notes" placeholder="e.g. will get it serviced by their in-house team, asked us to call back next week...">'+esc(v.contactNotes||'')+'</textarea></div></div>',
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveContactLog(\''+schId+'\','+seq+')">Save</button>');
}
function saveContactLog(schId, seq){
  setVisitContactStatus(schId, seq, val('lc_status'), val('lc_notes').trim());
  closeModal();
}
// One message, sent over both channels at once — that's how outreach to a single client actually goes out
// (WhatsApp + email/SMS together, not picking one). Built from the specific product/customer/serial so it
// reads like a real message, not a generic log line, and stored on the visit so "what did we actually send
// them" is answerable later, not just "did we send something."
const REMINDER_CHANNELS=['WhatsApp','Email'];
// Deliberately does NOT mention chargeable/free — the amount depends on what the visit turns up, and committing
// to "free" in writing is a promise we may not be able to keep. Also does not suggest the customer go get it
// serviced elsewhere, and does not ask the customer to call us — we own the follow-through, not them. Uses
// "calibration" (the term the customer actually uses for this), not "service".
function buildServiceReminderMessage(customer, product, serial, visit){
  return 'Dear '+customer.name+', this is Business OS. You purchased a '+product.name+' (Serial: '+serial.serial+') on '+fmtDate(serial.saleDate)+'. Calibration '+visit.seq+' is now due — sending it in for calibration keeps it performing at its best. We will call you shortly to arrange a convenient time.';
}
function openViewMessage(schId, seq){
  const sc=byId(DB.serviceSchedules,schId); if(!sc) return;
  const v=(sc.visits||[]).find(vv=>vv.seq===seq); if(!v || !v.lastMessage){ toast('No message on record for this visit'); return; }
  const s=byId(DB.equipmentSerials,sc.serialId); const c=byId(DB.customers,s.customerId);
  openModal('Message Sent — '+c.name+' / '+s.serial, ''+
    '<div class="small muted" style="margin-bottom:8px;">Sent '+fmtDate(v.lastMessage.date)+' via '+esc(v.lastMessage.channels.join(' + '))+'</div>'+
    '<div class="card" style="white-space:pre-wrap;">'+esc(v.lastMessage.text)+'</div>',
    '<button class="btn" onclick="closeModal()">Close</button>');
}
function renderServiceFollowups(){
  let rows = DB.serviceSchedules.map(sc=>{
    const s=byId(DB.equipmentSerials,sc.serialId); const p=s?byId(DB.products,s.productId):null; const c=s?byId(DB.customers,s.customerId):null;
    return {sc,s,p,c,next:nextDueVisit(sc)};
  }).filter(x=>x.s && x.next);
  rows.forEach(x=>x.bucket=fuBucket(x.next.dueDate));
  rows.sort((a,b)=>a.next.dueDate<b.next.dueDate?-1:1);

  const BUCKETS=[['Overdue','Needs attention — already past its month'],['This Month','This month\'s active worklist'],['Upcoming','More time — nothing to chase yet']];
  const bucketRows = rows.filter(x=>x.bucket===_fuBucket);
  const statusOf=x=>visitContactStatus(x.next);
  const notContacted=bucketRows.filter(x=>statusOf(x)==='Not Contacted').length;
  const awaiting=bucketRows.filter(x=>['Message Sent','No Response'].includes(statusOf(x))).length;
  const confirmed=bucketRows.filter(x=>statusOf(x)==='Confirmed').length;
  const chargeableDue=bucketRows.filter(x=>x.next.chargeable).length;
  const displayRows = _fuContactFilter==='All' ? bucketRows : bucketRows.filter(x=>statusOf(x)===_fuContactFilter);

  let h='<div class="section-title">Service Follow-ups</div>';

  h+='<div class="period-pills" style="margin-bottom:10px;">'+BUCKETS.map(([b,desc])=>{
    const cnt=rows.filter(x=>x.bucket===b).length;
    return '<div class="period-pill'+(b===_fuBucket?' active':'')+'" onclick="setFuBucket(\''+b+'\')" title="'+esc(desc)+'">'+esc(b)+' ('+cnt+')</div>';
  }).join('')+'</div>';

  h+='<div class="filterbar" style="margin-bottom:14px;">'+['All'].concat(VISIT_CONTACT_STATUSES).map(f=>{
    const cnt = f==='All'?bucketRows.length:bucketRows.filter(x=>statusOf(x)===f).length;
    return '<div class="subtab'+(f===_fuContactFilter?' active':'')+'" onclick="setFuContactFilter(\''+f+'\')">'+esc(f)+' ('+cnt+')</div>';
  }).join('')+'</div>';

  h+='<div class="grid g4">'+[
    {label:'Not Contacted', val:notContacted, ic:'bell', color:notContacted>0?'var(--red)':'var(--green)', bg:notContacted>0?'var(--red-100)':'var(--green-100)'},
    {label:'Awaiting Response', val:awaiting, ic:'clock', color:'var(--amber)', bg:'var(--amber-100)'},
    {label:'Confirmed', val:confirmed, ic:'checkcircle', color:'var(--green)', bg:'var(--green-100)'},
    {label:'Chargeable Visits Due', val:chargeableDue, ic:'bag', color:'var(--primary-600)', bg:'var(--primary-100)'},
  ].map(k=>'<div class="kpi"><div class="kpitop">'+iconChip(k.ic,k.color,k.bg)+'</div><div class="label" style="margin-top:10px;">'+esc(k.label)+'</div><div class="val">'+k.val+'</div></div>').join('')+'</div>';

  h+='<div class="toolbar" style="margin-top:16px;"><button class="btn" onclick="bulkSendReminders()">Message everyone not yet contacted — this month</button></div>';

  h+='<div class="tablewrap" style="margin-top:10px;"><table><thead><tr><th class="nosort">Customer</th><th class="nosort">Equipment</th><th class="nosort">Serial</th><th class="nosort">Visit</th><th class="nosort">Due</th><th class="nosort">Charge</th><th class="nosort">Contact Status</th><th class="nosort">Action</th></tr></thead><tbody>';
  if(!displayRows.length) h+='<tr><td colspan="8"><div class="empty">Nothing matches this filter</div></td></tr>';
  displayRows.forEach(x=>{
    const status = statusOf(x);
    h+='<tr><td><a class="link" onclick="navTo(\'__customer:'+x.c.id+'\')">'+esc(x.c.name)+'</a></td><td>'+esc(x.p.name)+'</td><td>'+x.s.serial+'</td>'+
      '<td>Service '+x.next.seq+'</td><td>'+fmtMonthYear(x.next.dueDate)+'</td>'+
      '<td>'+chargeCell(x.next.chargeable)+'</td>'+
      '<td><a class="link" onclick="openLogContact(\''+x.sc.id+'\','+x.next.seq+')">'+contactStatusPill(status)+'</a>'+
        (x.next.contactNotes?'<div class="small muted" style="margin-top:2px;max-width:180px;">'+esc(x.next.contactNotes)+'</div>':'')+
        (x.next.lastMessage?'<div><a class="link small" onclick="openViewMessage(\''+x.sc.id+'\','+x.next.seq+')">View Message</a></div>':'')+'</td>'+
      '<td>'+ (x.next.status==='Job Created'? '<button class="btn sm" onclick="openServiceJobDetail(\''+x.next.jobId+'\')">Open Job</button>' :
        '<button class="btn sm primary" onclick="createFollowupJob(\''+x.sc.id+'\','+x.next.seq+')">Create Job</button>') +
      ' <button class="btn sm" onclick="openVisitHistory(\''+x.sc.id+'\')">History</button></td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}
function createFollowupJob(schId, seq){
  const sc=byId(DB.serviceSchedules,schId); const s=byId(DB.equipmentSerials,sc.serialId);
  const visit=(sc.visits||[]).find(v=>v.seq===seq);
  const job = createServiceJob(DB,{customerId:s.customerId, serialId:s.id,
    serviceType:'Preventive Service — Visit '+seq+(visit&&visit.chargeable?' (chargeable, out of warranty)':' (free, in warranty)'),
    complaint:'Scheduled preventive service — visit '+seq, visitSeq:seq, taskRefType:'serviceSchedule', taskRefId:schId+':v'+seq});
  recomputeAlertsAndTasks(DB); save(); toast('Job card '+job.jobNo+' created'); document.getElementById('content').innerHTML=renderServiceFollowups();
}
function sendServiceReminderSilent(schId, seq){
  const sc=byId(DB.serviceSchedules,schId); if(!sc) return;
  const s=byId(DB.equipmentSerials,sc.serialId); const c=byId(DB.customers,s.customerId); const p=byId(DB.products,s.productId);
  const visit=(sc.visits||[]).find(v=>v.seq===seq); if(!visit) return;
  visit.reminderSent=todayISO();
  // Sending a message is a first-contact action — it only advances status if nobody's touched it yet, so it
  // never overwrites a status the office has already set by hand (e.g. Confirmed/Declined from a phone call).
  if(!visit.contactStatus || visit.contactStatus==='Not Contacted') visit.contactStatus='Message Sent';
  const msgText = buildServiceReminderMessage(c,p,s,visit);
  visit.lastMessage={text:msgText, channels:REMINDER_CHANNELS.slice(), date:todayISO()};
  DB.communications.push({id:uid('COM'),entityType:'customer',entityId:c.id,type:'Service Reminder',date:todayISO(),channel:REMINDER_CHANNELS.join(' + '),summary:msgText});
}
// Scoped to This Month only, on purpose: Upcoming is too early to bother anyone, and Overdue should already
// have been messaged back when it WAS this month — a bare "message everyone not yet contacted" across the whole
// pipeline was pinging people 3+ months before their visit, which isn't how outreach should work.
function bulkSendReminders(){
  let cnt=0;
  DB.serviceSchedules.forEach(sc=>{
    const next=nextDueVisit(sc); if(!next) return;
    if(fuBucket(next.dueDate)==='This Month' && visitContactStatus(next)==='Not Contacted'){ sendServiceReminderSilent(sc.id,next.seq); cnt++; }
  });
  save(); toast(cnt+' customer(s) messaged'); document.getElementById('content').innerHTML=renderServiceFollowups();
}
function openVisitHistory(schId){
  const sc=byId(DB.serviceSchedules,schId); if(!sc){ toast('No service schedule on record'); return; }
  const s=byId(DB.equipmentSerials,sc.serialId); const c=byId(DB.customers,s.customerId); const p=byId(DB.products,s.productId);

  let h='<div class="small muted" style="margin-bottom:10px;">'+esc(p.name)+' — '+s.serial+' — '+esc(c.name)+' — warranty expiry '+fmtDate(sc.warrantyExpiry)+'</div>';
  h+='<div class="grid g4" style="margin-bottom:14px;">'+
    '<div class="kpi"><div class="label">Repairs — In Warranty</div><div class="val" style="font-size:18px;">'+rstats.repairWithin+'</div></div>'+
    '<div class="kpi"><div class="label">Repairs — After Warranty</div><div class="val" style="font-size:18px;">'+rstats.repairAfter+'</div></div>'+
    '<div class="kpi"><div class="label">Paid Visits</div><div class="val" style="font-size:18px;">'+rstats.paidVisits+'</div><div class="sub">'+fmtMoney(rstats.paidRevenue)+'</div></div>'+

  // Only Service 1 and Service 2 — the two visits actually pre-scheduled with the machine. Each Done row links
  // straight to the job card that closed it (a service is only "Done" because a job card exists for it), and
  // Reminder Sent is shown per feedback so it's obvious whether the customer was ever nudged.
  h+='<table style="margin-top:6px;"><thead><tr><th class="nosort">Visit</th><th class="nosort">Date</th><th class="nosort">Done?</th><th class="nosort">Chargeable</th><th class="nosort">Reminder Sent</th><th class="nosort">Contact Status</th></tr></thead><tbody>';

      ? (v.jobId ? '<a class="link" onclick="openServiceJobDetail(\''+v.jobId+'\')">'+pill('Done','green')+'</a>' : pill('Done','green'))
      : pill('Not Done','gray');
    const statusCell = v.status==='Done' ? '<span class="small muted">—</span>' :
      (contactStatusPill(visitContactStatus(v))+(v.contactNotes?'<div class="small muted" style="margin-top:2px;">'+esc(v.contactNotes)+'</div>':''));
    h+='<tr><td>Service '+seq+'</td><td>'+dateShown+'</td><td>'+doneCell+'</td><td>'+chargeCell(v.chargeable)+'</td><td>'+(v.reminderSent?fmtDate(v.reminderSent)+' sent':'Not sent')+'</td><td>'+statusCell+'</td></tr>';
  });
  h+='</tbody></table>';
  // Anything beyond Service 1/2 is occurrence-based, not scheduled — so instead of a phantom "Visit 3" row that
  // sits at 0 forever, this lists the real job cards (if any) that happened on top of the two included visits.
  const extra=extraServiceJobs(s.id);
  h+='<div class="small muted" style="margin-top:14px;margin-bottom:6px;"><b>Additional Services</b> — beyond the two scheduled visits, on occurrence (breakdown calls, extra preventive visits, etc.)</div>';
  if(extra.length){
    h+='<table><thead><tr><th class="nosort">Job #</th><th class="nosort">Type</th><th class="nosort">Date</th><th class="nosort">Action</th></tr></thead><tbody>'+
      extra.map(j=>'<tr><td>'+j.jobNo+'</td><td>'+esc(j.serviceType)+'</td><td>'+fmtDate(j.completionDate)+'</td><td><button class="btn sm" onclick="openServiceJobDetail(\''+j.id+'\')">Open</button></td></tr>').join('')+
      '</tbody></table>';
  } else {
    h+='<div class="small muted">None yet.</div>';
  }
  openModal('Service History — '+c.name+' / '+s.serial, h, '<button class="btn ghost" onclick="gotoJobCardsForSerial(\''+s.id+'\')">'+icon('filetext',14)+' View Job Cards for this Unit</button><button class="btn" onclick="closeModal()">Close</button>', true);
}
// Batch counterpart to openVisitHistory — used when a Warranty/Service Track row has been consolidated into one
// line for a multi-unit purchase. Shows every serial's own status side by side (so "different service history"
// per unit is still visible, per feedback) plus a way to jump to Job Cards for the whole batch at once.
function openBatchServiceHistory(customerId, productId, invoiceId){

  if(!items.length){ toast('No matching units found'); return; }
  const serialIds=items.map(x=>x.s.id);
  const rstats=serviceRepairStats(j=>serialIds.includes(j.serialId));
  let h='<div class="small muted" style="margin-bottom:10px;">'+esc(p.name)+' — '+esc(c.name)+' — '+items.length+' unit'+(items.length>1?'s':'')+' from this purchase</div>';

    '<div class="kpi"><div class="label">Repairs — In Warranty</div><div class="val" style="font-size:18px;">'+rstats.repairWithin+'</div></div>'+

// Section 4 — Common Inspection Checklist (applies to all equipment).

function productChecklistGroup(product){

}
const ROOT_CAUSE_CATEGORIES=['Electrical','Mechanical','Connection','Consumable Contamination','Calibration Drift','Operator Handling','Wear & Tear','Environmental','Unknown'];
const ACTION_TAKEN_OPTIONS=['Adjusted','Tightened','Cleaned','Repaired','Replaced','Calibrated','Demonstrated to Customer','Sent for Workshop Repair','Replacement Recommended','Other'];
const SERVICE_OUTCOMES=['Resolved','Partially Resolved','Pending Spares','Workshop Return','Replacement Suggested'];
const DOWNTIME_LEVELS=['Low','Medium','High'];
// Generic checklist table builder/collector, reused for the Common checklist and every category-specific group —
// Yes/No/N.A. is mandatory per row, Observation is required only when the answer is No, Action Taken is optional.
// Checklist grid rendered as a Yes/No/N.A. checkbox table — mirrors the physical Master Service Job
// Card's inspection tables exactly (radio triplet per row, not a dropdown). mode:'edit'|'read'.
function checklistTableHtml(items, idPrefix, mode, rowsData){
  const rd = mode==='read';
  return '<table class="jc-yntable"><thead><tr><th class="jc-num">#</th><th>Checkpoint</th><th style="width:145px;">Status</th><th>Observation</th><th>Action Taken</th></tr></thead><tbody>'+
    items.map((item,i)=>{
      const rrow = rd ? (rowsData||[]).find(r=>r.item===item) : null;
      const statusCell = jcYnCell(idPrefix+'_st_'+i, rd, rrow?rrow.status:'');
      const obsCell = rd ? esc(rrow&&rrow.observation?rrow.observation:'—') : '<input type="text" id="'+idPrefix+'_ob_'+i+'" placeholder="Required if No"/>';
      const actCell = rd ? esc(rrow&&rrow.actionTaken?rrow.actionTaken:'—') : '<input type="text" id="'+idPrefix+'_ac_'+i+'" placeholder="Optional"/>';
      return '<tr><td class="jc-num">'+(i+1)+'</td><td>'+esc(item)+'</td><td>'+statusCell+'</td><td>'+obsCell+'</td><td>'+actCell+'</td></tr>';
    }).join('')+
    '</tbody></table>';
}
// Shared Y/N/N.A. cell — editable (radio triplet) or read-only (highlighted pill), used by both the
// common checklist table and the category-specific matrix boxes.
function jcYnCell(name, readOnly, status){
  if(readOnly){
    return '<div class="jc-yngroup">'+['Yes','No','N.A.'].map(v=>{
      const lab=v==='Yes'?'Y':(v==='No'?'N':'NA'); const on=status===v;
      return '<span style="padding:1px 7px;border-radius:4px;font-weight:800;border:1.5px solid '+(on?'var(--primary)':'var(--ink-300)')+';background:'+(on?'var(--primary)':'#fff')+';color:'+(on?'#fff':'var(--ink-700)')+';">'+lab+'</span>';
    }).join('')+'</div>';
  }
  return '<div class="jc-yngroup">'+
    '<label><input type="radio" name="'+name+'" value="Yes"/> Y</label>'+
    '<label><input type="radio" name="'+name+'" value="No"/> N</label>'+
    '<label><input type="radio" name="'+name+'" value="N.A."/> NA</label>'+
  '</div>';
}
// requireObs: the common checklist (Section 4) has an Observation column so a "No" must explain itself;
// the category matrix (Section 5) is checkbox-only on the physical card, so that requirement doesn't apply there.
function collectChecklist(items, idPrefix, requireObs){
  if(requireObs===undefined) requireObs=true;
  const rows=[]; const unmarked=[]; const obsMissing=[];
  items.forEach((item,i)=>{
    const radios=document.getElementsByName(idPrefix+'_st_'+i);
    if(!radios || !radios.length) return; // section not rendered (e.g. group not applicable)
    let status=''; for(let k=0;k<radios.length;k++){ if(radios[k].checked){ status=radios[k].value; break; } }
    const obs=val(idPrefix+'_ob_'+i).trim();
    const action=val(idPrefix+'_ac_'+i).trim();
    if(!status){ unmarked.push(item); return; }
    if(requireObs && status==='No' && !obs){ obsMissing.push(item); }
    rows.push({item,status,observation:obs,actionTaken:action});
  });
  return {rows,unmarked,obsMissing};
}
// Dynamic category matrix: the physical card prints all four boxes (A/B/C/D) side by side so one form
// covers every product line, but a digital job card already knows which equipment it's for — so instead
// of wasting space on three greyed-out boxes nobody will ever tick, only the box(es) that actually apply
// to this job (plus D if accessories were received) render, full-width, at the same readable size as the
// common checklist table — including an Observation column, so a "No" here is never left unexplained.
function jcCategoryMatrixHtml(grp, accessoryApplies, mode, catRows, accRows){
  const rd = mode==='read';
  let h='';
  if(grp){
    const def=CATEGORY_CHECKLISTS[grp];
    h+='<div class="jc-matrix-block"><div class="jc-matrix-title">'+grp+'. '+esc(def.label)+'<span class="jc-catbadge">Applies to this equipment</span></div>'+
      jcMatrixTableHtml(def.items,'cat',mode,catRows)+'</div>';
  }
  if(accessoryApplies){
    const defD=CATEGORY_CHECKLISTS.D;
    h+='<div class="jc-matrix-block"><div class="jc-matrix-title">D. '+esc(defD.label)+'<span class="jc-catbadge">Accessory received</span></div>'+
      jcMatrixTableHtml(defD.items,'acc',mode,accRows)+'</div>';
  }
  if(!grp && !accessoryApplies){
    h+='<div class="small muted">No category-specific or accessory checklist applies to this job.</div>';
  }
  return h;
}
// Same shape as the common checklist table (status + Observation), minus Action Taken — the corrective
// action for a category-specific fault belongs in Section 6's structured Root Cause / Action Taken
// fields, not repeated per checkpoint here. But a "No" still has to say what's wrong: an unexplained
// fail on a job card is a data gap, not a completed inspection — so Observation is required on No,
// same rule as Section 4, even though the printed card doesn't carry this column.
function jcMatrixTableHtml(items, idPrefix, mode, rowsData){
  const rd = mode==='read';
  return '<table class="jc-yntable"><thead><tr><th class="jc-num">#</th><th>Checkpoint</th><th style="width:150px;">Status</th><th>Observation</th></tr></thead><tbody>'+
    items.map((item,i)=>{
      const rrow = rd ? (rowsData||[]).find(r=>r.item===item) : null;
      const statusCell = jcYnCell(idPrefix+'_st_'+i, rd, rrow?rrow.status:'');
      const obsCell = rd ? esc(rrow&&rrow.observation?rrow.observation:'—') : '<input type="text" id="'+idPrefix+'_ob_'+i+'" placeholder="Required if No"/>';
      return '<tr><td class="jc-num">'+(i+1)+'</td><td>'+esc(item)+'</td><td>'+statusCell+'</td><td>'+obsCell+'</td></tr>';
    }).join('')+
    '</tbody></table>';
}
// Bordered, numbered section — the visual building block every part of the card is made of.
function jcSection(num, title, bodyHtml){
  return '<div class="jc-section"><div class="jc-section-head">'+(num?num+'. ':'')+title+'</div><div class="jc-section-body">'+bodyHtml+'</div></div>';
}
function jcIdGrid(pairs){
  return '<div class="jc-idgrid">'+pairs.map(x=>{const[k,v]=x.split(/:(.+)/);return '<div class="jc-f"><label>'+k+'</label><div class="v">'+(v||'—')+'</div></div>';}).join('')+'</div>';
}
// Reusable multi-select checkbox group (Service Type, Symptom Tags, Action Taken, Service Outcome, etc.)
function checkboxGroupHtml(options, idPrefix, selected){
  selected=selected||[];
  return '<div style="display:flex;flex-wrap:wrap;gap:8px 18px;margin:6px 0 10px;">'+options.map((o,i)=>
    '<label class="small" style="display:flex;align-items:center;gap:5px;"><input type="checkbox" id="'+idPrefix+'_'+i+'"'+(selected.includes(o)?' checked':'')+'/> '+esc(o)+'</label>').join('')+'</div>';
}
function collectCheckboxGroup(options, idPrefix){
  const out=[];
  options.forEach((o,i)=>{ const el=document.getElementById(idPrefix+'_'+i); if(el && el.checked) out.push(o); });
  return out;

// Cross-references closed job cards against each unit's warranty window to produce the repair/charge breakdown
// the Warranty tab surfaces. isRepair is inferred from service type + classification since jobs aren't tagged
// with a single "repair vs service" flag today — good enough for a management-level count, not audit-grade.
// filterFn optional — lets a caller scope the stats to one serial/customer/etc. No argument = same global
// rollup this always computed (used by Warranty's Repairs In/After Warranty KPI cards).
function serviceRepairStats(filterFn){
  const stats={repairWithin:0, repairAfter:0, paidVisits:0, freeVisits:0, paidRevenue:0, totalClosed:0};
  DB.serviceJobs.filter(j=>j.status==='Closed' && (!filterFn || filterFn(j))).forEach(j=>{
    const s=byId(DB.equipmentSerials,j.serialId); if(!s) return;
    const warr=DB.warrantyRecords.find(w=>w.serialId===s.id);
    const withinWarranty = warr ? j.completionDate<=warr.expiryDate : false;
    const isRepair = /breakdown|repair/i.test(j.serviceType) || /Replacement/i.test(j.classification||'');
    if(isRepair){ if(withinWarranty) stats.repairWithin++; else stats.repairAfter++; }
    if(j.chargeable && j.amount>0){ stats.paidVisits++; stats.paidRevenue+=j.amount; } else { stats.freeVisits++; }
    stats.totalClosed++;
  });
  return stats;
}
// Any Closed job against a serial that isn't tied to the seq-1/seq-2 scheduled visit — i.e. an ad-hoc/occurrence
// service call (breakdown, extra preventive visit, AMC call, etc.). This is the "how many times, on occurrence"
// count instead of a pre-generated schedule row that sits at 0 until something happens.
function extraServiceJobs(serialId){
  return DB.serviceJobs.filter(j=>j.serialId===serialId && j.status==='Closed' && (!j.visitSeq || j.visitSeq>2))
    .sort((a,b)=>a.completionDate<b.completionDate?1:-1);
}
// Shared by Service Track and Warranty so "Service 1" / "Service 2" mean exactly the same thing everywhere in
// the app: visit seq 1 and seq 2 on that unit's schedule — the only two pre-set visits there are.
// Deliberately simple by design (per feedback): just the date and Done / Not Done — no "overdue" framing here.
// Which visits actually need chasing today is a Service Follow-ups question, not a Service Track question.
// Done is a live link straight to the job card that closed it — a service is only ever "Done" because a job
// card exists for it, so that link should always be one click away.
function serviceVisitCell(sched, seq){
  const v = sched ? (sched.visits||[]).find(vv=>vv.seq===seq) : null;
  if(!v) return '<span class="small muted">—</span>';
  if(v.status==='Done') return v.jobId ? '<a class="link" onclick="openServiceJobDetail(\''+v.jobId+'\')">'+pill(fmtDate(v.doneDate)+' · Done','green')+'</a>' : pill(fmtDate(v.doneDate)+' · Done','green');
  return pill(fmtDate(v.dueDate)+' · Not Done','gray');
}
// Batch-aware version — aggregates the same visit seq across every serial in a consolidated row (e.g. 4 units
// bought on one invoice). Shows a plain fraction when the batch is partially done instead of pretending one
// date applies to all of them.
function batchVisitCell(scheds, seq){
  const visits = scheds.map(sc=>sc&&(sc.visits||[]).find(vv=>vv.seq===seq)).filter(Boolean);
  if(!visits.length) return '<span class="small muted">—</span>';
  const done = visits.filter(v=>v.status==='Done').length;
  const total = visits.length;
  if(done===total){
    if(total>1) return pill('Done ('+total+'/'+total+')','green');
    return visits[0].jobId ? '<a class="link" onclick="openServiceJobDetail(\''+visits[0].jobId+'\')">'+pill(fmtDate(visits[0].doneDate)+' · Done','green')+'</a>' : pill(fmtDate(visits[0].doneDate)+' · Done','green');
  }
  if(done===0) return pill((total>1?fmtDate(visits[0].dueDate)+' · ':'')+ (total>1?'Not Done (0/'+total+')':'Not Done'),'gray');
  return pill(done+'/'+total+' Done','amber');
}
// "Extra Services" — occurrence-based count of ad-hoc jobs beyond the two scheduled visits, not a schedule
// fraction (there's nothing to divide by; it happens if and when it happens). Clicking jumps straight to those
// job cards, since every count here corresponds to a real closed job.
function furtherVisitsCell(sched){
  if(!sched) return '<span class="small muted">—</span>';
  const extra=extraServiceJobs(sched.serialId);
  if(!extra.length) return '<span class="small muted">—</span>';
  return '<a class="link small" onclick="gotoJobCardsForSerial(\''+sched.serialId+'\')">'+extra.length+' extra service'+(extra.length===1?'':'s')+'</a>';
}
function batchFurtherVisitsCell(scheds){
  const serialIds = scheds.filter(Boolean).map(sc=>sc.serialId);
  const total = serialIds.reduce((s,id)=>s+extraServiceJobs(id).length,0);
  if(!total) return '<span class="small muted">—</span>';
  return '<span class="small">'+total+' extra service'+(total===1?'':'s')+'</span>';
}
// Groups warrantyItems() rows into one row per real-world purchase event: same customer, same product, same
// invoice. This is what makes "Krishna Boiler bought 4 MPI Testing Kits on one invoice" show up as ONE row with
// Qty 4, instead of 4 identical-looking rows — the invoice is the natural unit of a batch purchase, not the
// individual serial.
function groupIntoBatches(items){
  const byKey={};
  items.forEach(x=>{
    const key=(x.s.invoiceId||'noinv')+'|'+x.p.id;
    if(!byKey[key]) byKey[key]={c:x.c, p:x.p, invoiceId:x.s.invoiceId, saleDate:x.s.saleDate, rows:[]};
    byKey[key].rows.push(x);
  });
  return Object.values(byKey);
}

// ---- SERVICE: three focused pages instead of one page mixing everything — "Service Track" (product-wise
// coverage: who bought what, when, warranty + Service 1/2 status — the compliance question), "Follow-ups"
// (the outreach pipeline: have we contacted them, what did they say — a service-ops task, not a selling

let _serviceView='track'; // 'track' (product-wise coverage, default) | 'followups' (outreach pipeline) | 'jobcards' (flat ticket worklist)

function renderService(){

function renderServiceTrackPage(){
  const items=warrantyItems(); // {w,s,p,c,sched,daysLeft,status,serviceOverdue,overdueVisit}
  const byProduct={};
  items.forEach(x=>{ byProduct[x.p.id]=byProduct[x.p.id]||{p:x.p, rows:[]}; byProduct[x.p.id].rows.push(x); });
  const groups=Object.values(byProduct).sort((a,b)=>b.rows.length-a.rows.length);

  let h='<div class="section-title">Service Track <span class="hint">Every unit sold, grouped by product — who bought it, warranty, and Service 1/2 status at a glance</span></div>';
  h+='<div class="toolbar"><div class="small muted" style="font-weight:600;">'+items.length+' unit'+(items.length===1?'':'s')+' across '+groups.length+' product'+(groups.length===1?'':'s')+'</div>'+
     '<button class="btn" onclick="setServiceViewFromTab(\'jobcards\')">'+icon('filetext',14)+' View All Job Cards</button></div>';

  if(!groups.length){ h+='<div class="empty" style="margin-top:16px;">No equipment sold yet</div>'; return h; }

  groups.forEach(g=>{
    const total=g.rows.length;
    const svc1NotDone=g.rows.filter(x=>{ const v=x.sched&&(x.sched.visits||[]).find(vv=>vv.seq===1); return v&&v.status!=='Done'; }).length;
    const svc2NotDone=g.rows.filter(x=>{ const v=x.sched&&(x.sched.visits||[]).find(vv=>vv.seq===2); return v&&v.status!=='Done'; }).length;
    const totalDue=g.rows.reduce((s,x)=>{const T=todayISO(); return s+(x.sched?(x.sched.visits||[]).filter(v=>v.dueDate<=T).length:0);},0);
    const totalDone=g.rows.reduce((s,x)=>s+(x.sched?(x.sched.visits||[]).filter(v=>v.status==='Done').length:0),0);
    const compliance=totalDue?Math.round(totalDone/totalDue*100):100;
    const jobCount=DB.serviceJobs.filter(j=>{ const s=byId(DB.equipmentSerials,j.serialId); return s&&s.productId===g.p.id; }).length;
    const batches=groupIntoBatches(g.rows).sort((a,b)=>a.c.name.localeCompare(b.c.name));

    h+='<div class="card" style="margin-top:14px;">';
    h+='<div class="flexbar" style="margin-bottom:12px;"><b style="font-size:14.5px;">'+esc(g.p.name)+'</b>'+
      '<span class="small muted">'+esc(g.p.category)+' &middot; '+total+' unit'+(total>1?'s':'')+' in the field &middot; '+
      '<a class="link" onclick="gotoJobCardsForProduct(\''+g.p.id+'\')">'+jobCount+' Job Card'+(jobCount===1?'':'s')+'</a></span></div>';
    h+='<div class="grid g4" style="margin-bottom:14px;">'+
      '<div class="kpi"><div class="label">Units in Field</div><div class="val">'+total+'</div></div>'+
      '<div class="kpi"><div class="label">Service 1 Not Done</div><div class="val" style="color:'+(svc1NotDone?'var(--amber)':'var(--green)')+'">'+svc1NotDone+'</div></div>'+
      '<div class="kpi"><div class="label">Service 2 Not Done</div><div class="val" style="color:'+(svc2NotDone?'var(--amber)':'var(--green)')+'">'+svc2NotDone+'</div></div>'+

function confirmCreateJob(customerId){

// Last CLOSED job on this serial before/other-than the one being viewed — feeds the auto-filled
// "Previous Service Date" field on the job card (Section 2 of the physical Master Service Job Card).
function previousServiceDateFor(serialId, excludeJobId){
  const prior=DB.serviceJobs.filter(j=>j.serialId===serialId && j.id!==excludeJobId && j.status==='Closed' && j.completionDate)
    .sort((a,b)=>a.completionDate<b.completionDate?1:-1)[0];
  return prior ? prior.completionDate : null;
}
// Working assumption: a "repeat complaint" is any closed job on the same serial within the last 90 days.
// No industry-standard window exists for this — flagged here so it's editable once real data is available.
function isRepeatComplaint(serialId, excludeJobId){
  const T=todayISO();
  return DB.serviceJobs.some(j=>j.id!==excludeJobId && j.serialId===serialId && j.status==='Closed' && j.completionDate && daysBetween(j.completionDate,T)<=90);
}
// Parts/consumables-used builder for the job card close form — same row-builder pattern as the
// Sales Invoice line items (_invLines/addInvLine), except each row can optionally point at a real
// DB.materials record so closing the job actually debits Stores stock.
let _jobPartsRows=[];
function addJobPart(){
  const matId=val('jp_mat'); const mat=matId?byId(DB.materials,matId):null;
  const label=mat?mat.name:val('jp_label').trim();
  if(!label){ toast('Enter a part/item description or pick a material from Stores'); return; }
  const qty=Math.max(1,num('jp_qty')||1);
  if(mat && qty>mat.qty){ if(!confirm('Quantity ('+qty+') exceeds current stock ('+mat.qty+' '+mat.unit+'). Add anyway?')) return; }
  _jobPartsRows.push({materialId:matId||null, label, partCode:val('jp_code'), qty, oldSerial:val('jp_old'), newSerial:val('jp_new'), remarks:val('jp_remarks')});
  ['jp_label','jp_code','jp_old','jp_new','jp_remarks'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  const q=document.getElementById('jp_qty'); if(q) q.value=1;
  const m=document.getElementById('jp_mat'); if(m) m.value='';
  renderJobPartsArea();
}

// the physical Master Service Job Card — reuses the already-rendered read-only modal body verbatim.
function printJobCard(id){
  const j=byId(DB.serviceJobs,id);
  if(!j || j.status!=='Closed'){ toast('Only a closed job card can be printed'); return; }
  const modalBody=document.querySelector('.modal-body');

function finalizeJob(jobId){
  const job=byId(DB.serviceJobs,jobId); if(!job) return;
  const s=byId(DB.equipmentSerials,job.serialId); const p=s?byId(DB.products,s.productId):null;
  const findings=val('jc_findings'), work=val('jc_work');
  if(!findings || !work){ toast('Problem identified and engineer comments/summary are required to close a job card'); return; }

  // Every applicable checklist section is mandatory: every item explicitly marked, and any "No" must
  // carry an observation explaining the problem — this is the real job-sheet discipline the card requires.
  const common=collectChecklist(COMMON_CHECKLIST_ITEMS,'cm');
  if(common.unmarked.length){ toast('Common checklist incomplete — mark every item: '+common.unmarked[0]+(common.unmarked.length>1?' (+'+(common.unmarked.length-1)+' more)':'')); return; }
  if(common.obsMissing.length){ toast('Add an observation for: '+common.obsMissing[0]+(common.obsMissing.length>1?' (+'+(common.obsMissing.length-1)+' more)':'')); return; }

  // Category matrix and accessory box carry the same rule as the common checklist: every applicable
  // item must be marked, and a "No" must say what's wrong — an unexplained fail isn't a finished
  // inspection, it's a gap someone will have to chase down later.
  const grp=productChecklistGroup(p);
  let categoryChecklist=[];
  if(grp){
    const cat=collectChecklist(CATEGORY_CHECKLISTS[grp].items,'cat');
    if(cat.unmarked.length){ toast('Category checklist incomplete — mark every item: '+cat.unmarked[0]+(cat.unmarked.length>1?' (+'+(cat.unmarked.length-1)+' more)':'')); return; }
    if(cat.obsMissing.length){ toast('Add an observation for: '+cat.obsMissing[0]+(cat.obsMissing.length>1?' (+'+(cat.obsMissing.length-1)+' more)':'')); return; }
    categoryChecklist=cat.rows;
  }
  let accessoryChecklist=[];
  if(job.accessoryReceived==='Yes'){
    const acc=collectChecklist(CATEGORY_CHECKLISTS.D.items,'acc');
    if(acc.unmarked.length){ toast('Accessory checklist incomplete — mark every item: '+acc.unmarked[0]+(acc.unmarked.length>1?' (+'+(acc.unmarked.length-1)+' more)':'')); return; }
    if(acc.obsMissing.length){ toast('Add an observation for: '+acc.obsMissing[0]+(acc.obsMissing.length>1?' (+'+(acc.obsMissing.length-1)+' more)':'')); return; }
    accessoryChecklist=acc.rows;
  }

  const amt=num('jc_amount');
  const actionsTaken=collectCheckboxGroup(ACTION_TAKEN_OPTIONS,'jc_action');
  const outcomes=collectCheckboxGroup(SERVICE_OUTCOMES,'jc_outcome');
  const nextDate=val('jc_nextdate');

  // Deduct real Stores stock for any part/consumable pulled from Stores — same consumption-log pattern
  // used by Production builds, so this job's material usage shows up in the same stock ledger.
  const partsReplacedNames=[];
  _jobPartsRows.forEach(r=>{
    partsReplacedNames.push(r.label+(r.qty>1?' x'+r.qty:''));
    if(r.materialId){
      const mat=byId(DB.materials,r.materialId); if(!mat) return;
      const before=mat.qty;
      mat.qty=Math.max(0, mat.qty-r.qty);
      DB.consumptionLogs.push({id:uid('CLOG'),date:todayISO(),materialId:mat.id,received:0,used:r.qty,damaged:0,openingQty:before,closingQty:mat.qty});
    }
  });

  const repeatComplaint=isRepeatComplaint(job.serialId, job.id);

  // Two-way link: if the engineer changes the auto-suggested Next Recommended Service Date, that new
  // date is written back into the actual schedule so Repeat Sales / Service Follow-ups pick it up.
  const sch=DB.serviceSchedules.find(sc=>sc.serialId===job.serialId);
  if(sch && nextDate){
    const visit0 = job.visitSeq ? (sch.visits||[]).find(v=>v.seq===job.visitSeq) : null;
    const upcomingV = (sch.visits||[]).filter(v=>v.status==='Pending' && (!visit0 || v.seq!==visit0.seq)).sort((a,b)=>a.dueDate<b.dueDate?-1:1)[0];
    if(upcomingV && upcomingV.dueDate!==nextDate) upcomingV.dueDate=nextDate;
  }

  closeServiceJob(DB, jobId, {
    findings, workPerformed:work, partsReplaced:partsReplacedNames.join(', '), partsUsed:_jobPartsRows.slice(),
    classification:val('jc_class'), chargeable:amt>0, amount:amt, customerApproval:val('jc_ack'),
    checklist:common.rows, categoryChecklist, accessoryChecklist,
    rootCause:val('jc_rootcause'), failedComponent:val('jc_failedcomp'), actionsTaken,
    trainingGiven:val('jc_training'), misuseObserved:val('jc_misuse'), envIssue:val('jc_envissue'),
    healthRating:val('jc_health'), outcomes, downtimeCategory:val('jc_downtime'),
    nextServiceDate:nextDate, nextActionOwner:val('jc_nextowner'), recommendation:val('jc_recommend'),
    managerReviewed: !!(document.getElementById('jc_mgr_reviewed')&&document.getElementById('jc_mgr_reviewed').checked),
    managerName: val('jc_mgr_name'), repeatComplaint
  });
  _jobPartsRows=[];
  recomputeAlertsAndTasks(DB); save(); closeModal(); toast('Job card closed'); document.getElementById('content').innerHTML=renderService();
}

/* ---- SHARED: material purchase history (used by Stores, Purchases, Suppliers) ---- */
function materialHistoryStats(mat, fromDate, toDate){
  let hist = (mat.priceHistory||[]).slice();
  if(fromDate) hist=hist.filter(h=>h.date>=fromDate);
  if(toDate) hist=hist.filter(h=>h.date<=toDate);
  hist.sort((a,b)=>a.date<b.date?1:-1);
  const rates=hist.map(h=>h.rate);
  const totalQty=hist.reduce((s,h)=>s+h.qty,0);
  const totalVal=hist.reduce((s,h)=>s+h.total,0);
  const wavg = totalQty? Math.round(totalVal/totalQty) : mat.lastRate;
  return {hist, low: rates.length?Math.min(...rates):null, high: rates.length?Math.max(...rates):null, wavg, count:hist.length};
}
// Cost trend: is this material getting more or less expensive to buy over time?
function costTrendStats(mat){
  const hist=(mat.priceHistory||[]).slice().sort((a,b)=>a.date<b.date?-1:1); // ascending, oldest first
  if(hist.length<2) return null;
  const prev=hist[hist.length-2].rate, latest=hist[hist.length-1].rate; // previous purchase vs the latest one
  const pct = prev? Math.round(((latest-prev)/prev)*1000)/10 : 0;
  return {prev, latest, pct, hist};
}
function renderMaterialHistoryPanel(matId, fromDate, toDate){
  const mat=byId(DB.materials,matId); if(!mat) return '<div class="empty">Material not found</div>';
  const stats=materialHistoryStats(mat, fromDate, toDate);
  const lastSup = mat.priceHistory&&mat.priceHistory.length ? byId(DB.suppliers, mat.priceHistory[mat.priceHistory.length-1].supplierId) : byId(DB.suppliers,mat.preferredSupplierId);
  let h='<div class="detailgrid">'+
    ['Current stock:'+mat.qty+' '+mat.unit,'Latest confirmed rate:'+fmtMoney(mat.lastRate),'Latest supplier:'+(lastSup?lastSup.name:'—'),
     'Weighted avg rate:'+fmtMoney(stats.wavg),'Lowest rate:'+(stats.low!=null?fmtMoney(stats.low):'—'),'Highest rate:'+(stats.high!=null?fmtMoney(stats.high):'—'),
     'Purchases:'+stats.count].map(x=>{const[k,v]=x.split(/:(.+)/);return '<div><div class="dl">'+k+'</div><div class="dv">'+esc(v)+'</div></div>';}).join('')+'</div>';
  h+='<div class="formrow" style="max-width:420px;"><div><label>From</label><input type="date" id="mh_from" value="'+(fromDate||'')+'" onchange="refreshMatHistory(\''+matId+'\')"/></div><div><label>To</label><input type="date" id="mh_to" value="'+(toDate||'')+'" onchange="refreshMatHistory(\''+matId+'\')"/></div></div>';
  const trend=costTrendStats(mat);
  if(trend){
    const up=trend.pct>0;
    h+='<div class="hr"></div><div class="flexbar" style="margin-bottom:8px;"><b class="small">Cost Trend</b>'+
      pill((up?'+':'')+trend.pct+'% vs previous purchase', up?'red':(trend.pct<0?'green':'gray'))+'</div>';
    h+='<div class="small muted" style="margin-bottom:8px;">Previously bought at '+fmtMoney(trend.prev)+', now at '+fmtMoney(trend.latest)+
      (up?' — cost of buying this has gone up.':(trend.pct<0?' — cost of buying this has come down.':' — no change.'))+'</div>';
    h+=svgLineChart(trend.hist.map(hh=>({label:fmtDate(hh.date),value:hh.rate})), {fmt:v=>fmtMoney(v)});
  }
  h+='<div class="hr"></div><b class="small">Purchase History</b>';
  h+='<table><thead><tr><th class="nosort">Date</th><th class="nosort">Invoice</th><th class="nosort">Supplier</th><th class="nosort">Qty</th><th class="nosort">Unit Rate</th><th class="nosort">Total</th></tr></thead><tbody>';
  if(!stats.hist.length) h+='<tr><td colspan="6"><div class="empty">No purchase history</div></td></tr>';
  stats.hist.forEach(hh=>{ const sup=byId(DB.suppliers,hh.supplierId); h+='<tr><td>'+fmtDate(hh.date)+'</td><td>'+esc(hh.invoiceNo||'')+'</td><td>'+esc(sup?sup.name:'')+'</td><td>'+hh.qty+' '+mat.unit+'</td><td>'+fmtMoney(hh.rate)+'</td><td>'+fmtMoney(hh.total)+'</td></tr>'; });
  h+='</tbody></table>';
  return h;
}

function submitBulkRfq(){
  const checked=[...document.querySelectorAll('.store-chk:checked')];
  if(!checked.length){ toast('Select at least one material first'); return; }
  const groups={}, missingQty=[], noSupplier=[];
  checked.forEach(cb=>{
    const matId=cb.dataset.mat; const m=byId(DB.materials,matId);
    const qtyEl=document.querySelector('.store-qty[data-mat="'+matId+'"]');
    const qty=Number(qtyEl.value)||0;
    if(qty<=0){ missingQty.push(m.name); return; }
    if(!m.preferredSupplierId){ noSupplier.push(m.name); return; }
    groups[m.preferredSupplierId]=groups[m.preferredSupplierId]||[];
    groups[m.preferredSupplierId].push({materialId:matId, qty, unit:m.unit, estRate:m.lastRate});
  });
  if(noSupplier.length){ toast('No preferred supplier set for: '+noSupplier.join(', ')+'. Set one on the material before requesting a quote.'); return; }
  if(missingQty.length){ toast('Enter a buy quantity for: '+missingQty.join(', ')); return; }
  const list = Object.keys(groups).map(supId=>({supplierId:supId, lines:groups[supId]}));
  _pendingRfqReturnTo=null;
  openRfqPreview(list);
}

function padRight(s,len){ s=String(s); return s.length>=len? s : s+' '.repeat(len-s.length); }
function rfqPlainTable(lines){
  const rows=lines.map(l=>{ const m=byId(DB.materials,l.materialId); return [m.name, String(l.qty), m.unit]; });
  const headers=['Material','Qty','Unit'];
  const all=[headers,...rows];
  const widths=[0,1,2].map(i=>Math.min(34, Math.max(...all.map(r=>String(r[i]).length))));
  return all.map(r=>r.map((c,i)=>padRight(c,widths[i]+2)).join('')).join('\n');
}

function copyPlainText(text){
  const done=()=>toast('Copied — paste it into your email or WhatsApp');
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>legacyCopy(text)); return; }
  }catch(e){}
  legacyCopy(text);
}
function legacyCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); toast('Copied — paste it into your email or WhatsApp'); } catch(e){ toast('Could not copy automatically — select the text and press Ctrl+C'); }
  document.body.removeChild(ta);
}

  const dmg=Number(document.querySelector('.eod-dmg[data-mat="'+matId+'"]').value)||0;

function saveEODBulk(){
  const touched=new Set();
  document.querySelectorAll('.eod-recv,.eod-used,.eod-dmg').forEach(inp=>{ if(Number(inp.value)>0) touched.add(inp.dataset.mat); });
  if(touched.size===0){ toast('Enter at least one Buy / Consumed / Damaged value first'); return; }
  let count=0;
  touched.forEach(matId=>{
    const m=byId(DB.materials,matId); if(!m) return;
    const recv=Number(document.querySelector('.eod-recv[data-mat="'+matId+'"]').value)||0;
    const used=Number(document.querySelector('.eod-used[data-mat="'+matId+'"]').value)||0;
    const dmg=Number(document.querySelector('.eod-dmg[data-mat="'+matId+'"]').value)||0;
    const before=m.qty;
    m.qty=Math.max(0, m.qty+recv-used-dmg);
    DB.consumptionLogs.push({id:uid('CLOG'),date:todayISO(),materialId:matId,received:recv,used:used,damaged:dmg,openingQty:before,closingQty:m.qty});
    count++;
  });
  recomputeAlertsAndTasks(DB); save(); closeModal();
  toast(count+' material'+(count>1?'s':'')+' updated for today');

}

/* ---- Cost Trend Analytics: which materials are actually getting more (or less) expensive to buy, across all past purchases ---- */
let _costTrendCatFilter='All';
function costTrendItems(){
  return DB.materials.map(m=>({m, t:costTrendStats(m)})).filter(x=>x.t);
}
function openCostTrendReport(){
  _costTrendCatFilter='All';
  openModal('Cost Trend — Purchase Price Movement', renderCostTrendBody(), '<button class="btn" onclick="closeModal()">Close</button>', 'xl');
}
function renderCostTrendBody(){
  const items = costTrendItems();
  let h='<div class="small muted" style="margin-bottom:14px;">Comparing each material\'s latest purchase rate to the one before it — this is what tells you whether your buying cost just moved, not how it drifted since day one.</div>';
  if(!items.length){
    h+='<div class="empty">Not enough purchase history yet — a material needs at least 2 recorded purchases to show a trend.</div>';
    return h;
  }
  const risers=items.filter(x=>x.t.pct>0).length, fallers=items.filter(x=>x.t.pct<0).length;
  const biggestSwing = Math.max(...items.map(x=>Math.abs(x.t.pct)));
  h+='<div class="grid g4" style="margin-bottom:16px;">'+
    '<div class="kpi"><div class="label">Tracked Materials</div><div class="val">'+items.length+'</div></div>'+
    '<div class="kpi"><div class="label">Rising</div><div class="val" style="color:var(--red)">'+risers+'</div></div>'+
    '<div class="kpi"><div class="label">Falling</div><div class="val" style="color:var(--green)">'+fallers+'</div></div>'+
    '<div class="kpi"><div class="label">Biggest Swing</div><div class="val" style="color:var(--amber)">'+biggestSwing+'%</div></div></div>';

  const topMovers = items.slice().sort((a,b)=>Math.abs(b.t.pct)-Math.abs(a.t.pct)).slice(0,5);
  h+='<b class="small">Top Movers — biggest fluctuation, up or down</b>';
  h+='<div style="margin:8px 0 16px;display:flex;flex-direction:column;gap:6px;">'+topMovers.map(x=>{
    const up=x.t.pct>0;
    return '<div class="flexbar" style="padding:8px 12px;background:var(--ink-50);border-radius:8px;">'+
      '<a class="link" onclick="closeModal();openMaterialHistoryModal(\''+x.m.id+'\')">'+esc(x.m.name)+'</a>'+
      '<span class="small muted">'+esc(x.m.category)+'</span>'+
      pill((up?'+':'')+x.t.pct+'%', up?'red':(x.t.pct<0?'green':'gray'))+
      '</div>';
  }).join('')+'</div>';

  const cats=['All',...new Set(items.map(x=>x.m.category))];
  h+='<div class="filterbar" id="costTrendFilterbar" style="margin-bottom:10px;">'+cats.map(c=>'<div class="subtab'+(c===_costTrendCatFilter?' active':'')+'" onclick="setCostTrendCat(\''+c+'\')">'+esc(c)+'</div>').join('')+'</div>';
  h+='<div id="costTrendTableWrap">'+renderCostTrendTable()+'</div>';
  return h;
}
function renderCostTrendTable(){
  let items = costTrendItems().filter(x=>_costTrendCatFilter==='All'||x.m.category===_costTrendCatFilter);
  items.sort((a,b)=>Math.abs(b.t.pct)-Math.abs(a.t.pct)); // biggest fluctuation first, regardless of direction
  let h='<div class="tablewrap"><table><thead><tr><th class="nosort">Material</th><th class="nosort">Category</th><th class="nosort">Previous Rate</th><th class="nosort">Latest Rate</th><th class="nosort">Change</th><th class="nosort">Weighted Avg</th><th class="nosort"></th></tr></thead><tbody>';
  if(!items.length) h+='<tr><td colspan="7"><div class="empty">No tracked materials in this category</div></td></tr>';
  items.forEach(x=>{
    const m=x.m, t=x.t;
    const wavg = materialHistoryStats(m).wavg;
    const up = t.pct>0;
    h+='<tr><td><a class="link" onclick="closeModal();openMaterialHistoryModal(\''+m.id+'\')">'+esc(m.name)+'</a></td>'+
      '<td class="small muted">'+esc(m.category)+'</td>'+
      '<td>'+fmtMoney(t.prev)+'</td><td>'+fmtMoney(t.latest)+'</td>'+
      '<td>'+pill((up?'+':'')+t.pct+'%', up?'red':(t.pct<0?'green':'gray'))+'</td>'+
      '<td class="small muted">'+fmtMoney(wavg)+'</td>'+
      '<td><button class="btn sm ghost" onclick="closeModal();openMaterialHistoryModal(\''+m.id+'\')">View trend</button></td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}
function setCostTrendCat(c){

function saveInlineConvert(){
  const checkedMats=[...document.querySelectorAll('.mat-chk:checked')];
  if(!checkedMats.length){ toast('Tick at least one material first'); return; }
  const byRfq={};
  checkedMats.forEach(cb=>{ const rfqId=cb.dataset.rfq; (byRfq[rfqId]=byRfq[rfqId]||[]).push(Number(cb.dataset.idx)); });
  const created=[];
  Object.keys(byRfq).forEach(rfqId=>{
    const rfq=byId(DB.rfqs,rfqId); if(!rfq) return;
    const idxs=byRfq[rfqId].slice().sort((a,b)=>a-b);
    const received=document.querySelector('.pc-status[data-rfq="'+rfqId+'"]').value==='Received';
    const lines=idxs.map(li=>{
      const l=rfq.lines[li];
      return {
        materialId:l.materialId,
        qty:Number(document.querySelector('.pc-qty[data-rfq="'+rfqId+'"][data-idx="'+li+'"]').value)||0,
        rate:Number(document.querySelector('.pc-rate[data-rfq="'+rfqId+'"][data-idx="'+li+'"]').value)||0
      };
    });
    const attachments=idxs.map(li=>{
      const att=_matAttach[rfqId+'__'+li]; if(!att) return null;
      const m=byId(DB.materials,rfq.lines[li].materialId);
      return {name:(m?m.name+' — ':'')+att.name};
    }).filter(Boolean);
    const pur=makePurchase(DB,{supplierId:rfq.supplierId, date:todayISO(), invoiceNo:'PO-'+rfq.id, lines, received, attachments, rfqId:rfq.id});
    created.push(pur);
    // remove only the converted materials from the request — anything left unticked stays on the list to convert later
    idxs.forEach(li=>delete _matAttach[rfqId+'__'+li]);
    idxs.slice().sort((a,b)=>b-a).forEach(li=>rfq.lines.splice(li,1));
    if(rfq.lines.length===0){ rfq.status='converted'; rfq.purchaseId=pur.id; completeTasksByRef(DB,'rfq',rfq.id,'Converted to purchase'); }
  });
  recomputeAlertsAndTasks(DB); save(); closeModal();
  toast(created.length+' purchase invoice'+(created.length>1?'s':'')+' created — rates entered are saved to each material\'s price history. Open the invoice from Purchases to add the bill # and attachment.');
  document.getElementById('content').innerHTML=renderStoresPurchases();
}
