// ---- Start Production: consumes real BOM materials from Stores, moves them into Semi-Finished + QC Pending.
// This is what makes the numbers on this page trustworthy instead of a manually-typed guess.
function openBuildProduction(productId){
  const p=byId(DB.products,productId); if(!p) return;
  const bom=BOM_TEMPLATES[productId];
  if(!bom){ toast(p.name+' is a distributed/resale item — no BOM to build from. Use Adjust to correct stock manually.'); return; }
  openModal('Start Production — '+p.name,''+
    '<div class="small muted" style="margin-bottom:12px;">Builds new units from raw materials in Stores. Material required is calculated live from the BOM (incl. waste %) and checked against current stock before you can confirm.</div>'+
    '<div class="formrow"><div><label>Units to build</label><input id="bp_qty" type="number" min="1" value="1" oninput="refreshBuildPreview(\''+productId+'\')"/></div></div>'+
    '<div id="bp_preview" style="margin-top:10px;"></div>',
    '<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" id="bp_confirm" data-act="confirmBuildProduction" data-args="'+esc(JSON.stringify([(productId)]))+'">Start Production</button>');
  refreshBuildPreview(productId);
}
function buildRequirements(productId, qty){
  const bom=BOM_TEMPLATES[productId];
  return bom.map(b=>{
    const m=byId(DB.materials,b.materialId);
    const wastePct=parseFloat(b.waste)||0;
    const required=Math.ceil(b.qty*qty*(1+wastePct/100)*1000)/1000;
    return {b, m, required};
  });
}
function refreshBuildPreview(productId){
  const qty=Math.max(1, num('bp_qty')||1);
  const lines=buildRequirements(productId, qty);
  let short=false;
  let h='<table><thead><tr><th class="nosort">Material</th><th class="nosort">Required</th><th class="nosort">In Stock</th><th class="nosort">Status</th></tr></thead><tbody>';
  lines.forEach(l=>{
    const ok = l.m && l.m.qty>=l.required;
    if(!ok) short=true;
    h+='<tr><td>'+esc(l.m?l.m.name:l.b.materialId)+'</td><td>'+l.required+' '+(l.m?l.m.unit:'')+'</td><td>'+(l.m?l.m.qty:'—')+' '+(l.m?l.m.unit:'')+'</td><td>'+(ok?pill('OK','green'):pill('Short','red'))+'</td></tr>';
  });
  h+='</tbody></table>';
  if(short) h+='<div class="small" style="color:var(--red);margin-top:8px;">Not enough stock for one or more materials — reduce the build quantity or top up Stores first.</div>';
  const pv=document.getElementById('bp_preview'); if(pv) pv.innerHTML=h;
  const btn=document.getElementById('bp_confirm'); if(btn) btn.disabled=short;
}
function confirmBuildProduction(productId){
  const qty=Math.max(1, num('bp_qty')||1);
  const lines=buildRequirements(productId, qty);
  if(lines.some(l=>!l.m || l.m.qty<l.required)){ toast('Not enough material stock to build this quantity'); return; }
  lines.forEach(l=>{
    const before=l.m.qty;
    l.m.qty=Math.max(0, l.m.qty-l.required);
    DB.consumptionLogs.push({id:uid('CLOG'),date:todayISO(),materialId:l.m.id,received:0,used:l.required,damaged:0,openingQty:before,closingQty:l.m.qty});
  });
  let row=DB.productionStock.find(r=>r.productId===productId);
  if(!row){ row={id:'PS-'+productId,productId,semiQty:0,qcPending:0,finishedQty:0,reservedQty:0,reservedNote:''}; DB.productionStock.push(row); }
  row.semiQty=(row.semiQty||0)+qty;
  row.qcPending=(row.qcPending||0)+qty;
  recomputeAlertsAndTasks(DB); save(); closeModal();
  toast(qty+' unit(s) started — materials consumed from Stores, now awaiting QC');
  rerender();
}
// ---- QC Check: the only way units move from Semi-Finished/QC-Pending into sellable Finished stock.
function openQCCheck(productId){
  const p=byId(DB.products,productId); if(!p) return;
  const s=prodStockRow(productId);
  if((s.qcPending||0)<=0){ toast('No units awaiting QC for '+p.name); return; }
  openModal('QC Check — '+p.name,''+
    '<div class="small muted" style="margin-bottom:12px;">'+s.qcPending+' unit(s) awaiting QC. Units that pass move to Finished stock (sellable). Rejected units leave the production pipeline — scrap or manual rework tracked outside this system.</div>'+
    '<div class="formrow"><div><label>Pass QC (moves to Finished)</label><input id="qc_pass" type="number" min="0" max="'+s.qcPending+'" value="0"/></div>'+
    '<div><label>Reject (rework/scrap)</label><input id="qc_reject" type="number" min="0" max="'+s.qcPending+'" value="0"/></div></div>',
    '<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="confirmQCCheck" data-args="'+esc(JSON.stringify([(productId)]))+'">Save QC Result</button>');
}
function confirmQCCheck(productId){
  const s=DB.productionStock.find(r=>r.productId===productId); if(!s){ toast('No production record for this product'); return; }
  const pass=Math.max(0,num('qc_pass')), reject=Math.max(0,num('qc_reject'));
  if(pass+reject===0){ toast('Enter at least one Pass or Reject quantity'); return; }
  if(pass+reject>s.qcPending){ toast('Pass + Reject can\'t exceed units awaiting QC ('+s.qcPending+')'); return; }
  s.qcPending -= (pass+reject);
  s.semiQty = Math.max(0, (s.semiQty||0)-(pass+reject));
  s.finishedQty = (s.finishedQty||0)+pass;
  recomputeAlertsAndTasks(DB); save(); closeModal();
  toast(pass+' unit(s) passed QC → Finished'+(reject?', '+reject+' rejected':''));
  rerender();
}
function openEditProductionStock(productId){
  const p=byId(DB.products,productId); if(!p) return;
  const s=prodStockRow(productId);
  openModal('Manual Adjustment — '+p.name,''+
    '<div class="small muted" style="margin-bottom:12px;">For corrections only — normal stock changes should go through Build Production and QC Check (and Finished stock is debited automatically on a sale), so those stay traceable. Use this only to fix a mistake or reconcile against a physical count.</div>'+
    '<div class="formrow"><div><label>Semi-Finished Qty</label><input id="ps_semi" type="number" min="0" value="'+(s.semiQty||0)+'"/></div>'+
    '<div><label>Finished Qty</label><input id="ps_finished" type="number" min="0" value="'+(s.finishedQty||0)+'"/></div></div>'+
    '<div class="formrow"><div><label>QC Pending (of Semi-Finished)</label><input id="ps_qcpending" type="number" min="0" value="'+(s.qcPending||0)+'"/></div>'+
    '<div><label>Reserved Qty (of Finished)</label><input id="ps_reserved" type="number" min="0" value="'+(s.reservedQty||0)+'"/></div></div>'+
    '<div class="formrow full"><div><label>Reserved for / notes (optional)</label><textarea id="ps_note" placeholder="e.g. CUS-6 (pending different order), or QC/rework reason">'+esc(s.reservedNote||'')+'</textarea></div></div>',
    '<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveProductionStock" data-args="'+esc(JSON.stringify([(productId)]))+'">Save</button>');
}
function saveProductionStock(productId){
  const semiQty=Math.max(0,num('ps_semi')), finishedQty=Math.max(0,num('ps_finished'));
  const qcPending=Math.max(0,num('ps_qcpending'));
  let reservedQty=Math.max(0,num('ps_reserved'));
  if(qcPending>semiQty){ toast('QC Pending can\'t exceed Semi-Finished Qty ('+semiQty+')'); return; }
  if(reservedQty>finishedQty){ toast('Reserved can\'t exceed Finished Qty'); return; }
  const note=val('ps_note');
  let row=DB.productionStock.find(r=>r.productId===productId);
  if(row){ Object.assign(row,{semiQty,qcPending,finishedQty,reservedQty,reservedNote:note}); }
  else { DB.productionStock.push({id:'PS-'+productId,productId,semiQty,qcPending,finishedQty,reservedQty,reservedNote:note}); }
  save(); closeModal(); toast('Production stock updated');
  rerender();
}

/* ---- Manufacturing cost & margin: turns the BOM from a parts list into what it actually costs to build one unit,
   live off current material rates — and, using each material's own price history, what it WOULD have cost at any
   point in the past, so cost drift and margin can be tracked over time the same way Cost Trend does for materials. ---- */
function productBomCost(productId){
  const bom=BOM_TEMPLATES[productId];
  if(!bom) return null;
  let total=0;
  const lines=bom.map(b=>{
    const m=byId(DB.materials,b.materialId);
    const cost=m? b.qty*m.lastRate : 0;
    total+=cost;
    return {material:m, qty:b.qty, waste:b.waste, rate:m?m.lastRate:0, cost};
  });
  lines.sort((a,b)=>b.cost-a.cost); // biggest cost contributors first — where the money actually goes
  return {total, lines};
}
function materialRateAsOf(mat, dateISO){
  const hist=(mat.priceHistory||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(!hist.length) return mat.lastRate||0;
  let rate=hist[0].rate; // before any known purchase, treat cost as level with the earliest known price
  for(const h of hist){ if(h.date<=dateISO) rate=h.rate; else break; }
  return rate;
}
function productCostMarginHistory(productId){
  const bom=BOM_TEMPLATES[productId];
  const p=byId(DB.products,productId);
  const T=todayISO();
  const monthKeys=[]; for(let i=5;i>=0;i--) monthKeys.push(monthKey(T,-i));
  const costSeries = bom ? monthKeys.map(k=>{
    const asOf=k+'-28';
    const total=bom.reduce((s,b)=>{ const m=byId(DB.materials,b.materialId); return s+(m? b.qty*materialRateAsOf(m,asOf) : 0); },0);
    return {label:monthLabel(k), value:Math.round(total)};
  }) : null;
  let lastKnown=null;
  const priceSeries=monthKeys.map(k=>{
    const ratesThisMonth=[];
    DB.salesInvoices.forEach(inv=>{ if(inv.date.slice(0,7)===k){ inv.lines.forEach(l=>{ if(l.type==='equipment'&&l.productId===productId) ratesThisMonth.push(l.rate); }); } });
    let val;
    if(ratesThisMonth.length){ val=Math.round(ratesThisMonth.reduce((a,b)=>a+b,0)/ratesThisMonth.length); lastKnown=val; }
    else if(lastKnown!=null){ val=lastKnown; }
    else { val=p.price; }
    return {label:monthLabel(k), value:val};
  });
  return {costSeries, priceSeries};
}
function renderProducts(){
  let h='<div class="section-title">Product Master <span class="hint">Specs marked Pending Technical Verification per SIMS confirmation rules</span></div>';
  h+='<div class="tablewrap">'+renderTable('prodtbl',[
    {key:'name',label:'Product',render:p=>'<a class="link" data-act="openProductDetail" data-args="'+esc(JSON.stringify([(p.id)]))+'">'+esc(p.name)+'</a><div class="small muted">'+p.code+'</div>'},
    {key:'category',label:'Category'},
    {key:'type',label:'Origin',render:p=>pill(p.type,{manufactured:'blue',assembled:'amber',customized:'gray',distributed:'green'}[p.type]||'gray')},
    {key:'price',label:'Price',kind:'num',render:p=>fmtMoney(p.price)},
    {key:'margin',label:'Est. Margin',kind:'num',sortVal:p=>{ const c=productBomCost(p.id); return c? Math.round(((p.price-c.total)/p.price)*1000)/10 : -999; },
      render:p=>{ const c=productBomCost(p.id); if(!c) return '<span class="small muted">—</span>'; const pct=Math.round(((p.price-c.total)/p.price)*1000)/10; return pill(pct+'%', pct>=35?'green':(pct>=15?'amber':'red')); }},
    {key:'warrantyMonths',label:'Warranty',kind:'num',render:p=>p.warrantyMonths+' mo'},
    {key:'verified',label:'Spec Status',sort:false,render:p=>p.verified? pill('Verified','green') : pill('Pending Verification','amber')},
  ], DB.products, {})+'</div>';
  window._lastTableRenderFn['prodtbl']=()=>{ rerender(); };
  return h;
}
function openProductDetail(id){
  const p=byId(DB.products,id);
  let h='<div class="detailgrid">'+
    ['Category:'+p.category,'Origin:'+p.type,'Price:'+fmtMoney(p.price),'Warranty:'+p.warrantyMonths+' months',
     'Service cadence:'+'Every 4 months (recurring)','Inspection method:'+(p.inspectionMethod||'—')].map(x=>{const[k,v]=x.split(/:(.+)/);return '<div><div class="dl">'+k+'</div><div class="dv">'+esc(v)+'</div></div>';}).join('')+'</div>';
  h+='<b class="small">Technical Specifications</b>'+verifyTag(p.verified)+'<table style="margin-top:6px;"><tbody>';
  Object.keys(p.specs||{}).forEach(k=>{ h+='<tr><td class="small muted" style="width:40%;">'+esc(k)+'</td><td class="small">'+esc(p.specs[k])+'</td></tr>'; });
  h+='</tbody></table>';
  h+='<div class="hr"></div><b class="small">Compatible Consumables</b><div style="margin:6px 0;">'+(p.compatibleConsumables||[]).map(mid=>{const m=byId(DB.materials,mid);return m?('<span class="tag">'+esc(m.name)+'</span>'):'';}).join(' ')+'</div>';
  const bom=BOM_TEMPLATES[p.id];
  if(bom){
    const costInfo=productBomCost(p.id);
    const margin=p.price-costInfo.total;
    const marginPct=p.price? Math.round((margin/p.price)*1000)/10 : 0;
    h+='<div class="hr"></div><div class="grid g4" style="margin-bottom:16px;">'+
      '<div class="kpi"><div class="label">Est. Manufacturing Cost</div><div class="val">'+fmtMoney(costInfo.total)+'</div><div class="sub">at current material rates</div></div>'+
      '<div class="kpi"><div class="label">List Price</div><div class="val">'+fmtMoney(p.price)+'</div><div class="sub">current selling price</div></div>'+
      '<div class="kpi"><div class="label">Est. Margin</div><div class="val" style="color:'+(margin>=0?'var(--green)':'var(--red)')+'">'+fmtMoney(margin)+'</div><div class="sub">price minus material cost</div></div>'+
      '<div class="kpi"><div class="label">Margin %</div><div class="val" style="color:'+(marginPct>=0?'var(--green)':'var(--red)')+'">'+marginPct+'%</div><div class="sub">of list price</div></div></div>';

    const hist=productCostMarginHistory(p.id);
    h+='<div class="section-title" style="margin-top:0;"><span class="lft">'+icon('trendup',15)+' Manufacturing Cost vs Selling Price — Last 6 Months</span></div>';
    h+=svgMultiLineChart([
      {name:'Manufacturing Cost', color:'var(--red)', data:hist.costSeries},
      {name:'Selling Price', color:'var(--green)', data:hist.priceSeries},
    ], {fmt:v=>fmtMoney(v)});
    h+='<div class="small muted" style="margin-top:8px;">Manufacturing cost is rebuilt from each material\'s own price history at the time — so this tracks how input costs actually moved, not just today\'s snapshot.</div>';

    h+='<div class="hr"></div><b class="small">Bill of Materials</b><span class="hint" style="font-size:11.5px;color:var(--ink-500);margin-left:8px;">sorted by cost contribution — biggest drivers first</span>';
    h+='<table><thead><tr><th class="nosort">Material</th><th class="nosort">Qty Required</th><th class="nosort">Wastage</th><th class="nosort">Unit Rate</th><th class="nosort">Line Cost</th><th class="nosort">Available Stock</th><th class="nosort">Shortage</th></tr></thead><tbody>';
    costInfo.lines.forEach(b=>{ const m=b.material; if(!m) return; const shortage=Math.max(0,b.qty-m.qty);
      h+='<tr><td>'+esc(m.name)+'</td><td>'+b.qty+' '+m.unit+'</td><td>'+b.waste+'</td><td>'+fmtMoney(b.rate)+'</td><td><b>'+fmtMoney(b.cost)+'</b></td><td>'+m.qty+' '+m.unit+'</td><td>'+(shortage>0?pill(shortage+' '+m.unit,'red'):pill('OK','green'))+'</td></tr>'; });
    h+='</tbody></table>';
  } else {
    h+='<div class="hr"></div><div class="small muted">No BOM configured — this product is distributed / resold rather than manufactured in-house.</div>';
  }
  openModal('Product — '+p.name, h, '<button class="btn" data-act="closeModal">Close</button>', true);
}

function defaultFestivalMessage(name){

let _festivalDraftMsg={};
function festivalSentCount(festId, entityType){
  return DB.communications.filter(cm=>cm.type==='Festival Greeting' && cm.festivalId===festId && cm.entityType===entityType).length;
}
function openEditFestivalMessage(festId){
  const f=FESTIVALS.find(x=>x.id===festId); if(!f) return;

function saveFestivalMessage(festId){
  _festivalDraftMsg[festId]=val('fg_msg');

}
function sendFestivalGreeting(festId, audienceLabel){
  const f=FESTIVALS.find(x=>x.id===festId); if(!f) return;
  const entityType = audienceLabel==='Supplier'?'supplier':'customer';
  if(festivalSentCount(festId,entityType)>0){ toast('Already sent to '+entityType+'s for this festival'); return; }
  const list = entityType==='supplier'?DB.suppliers:DB.customers;
  if(!list.length){ toast('No '+entityType+'s on file'); return; }
  const text=_festivalDraftMsg[festId]!==undefined?_festivalDraftMsg[festId]:defaultFestivalMessage(f.name);
  list.forEach(entity=>{
    DB.communications.push({id:uid('COM'), entityType, entityId:entity.id, type:'Festival Greeting', festivalId:festId, date:todayISO(), channel:REMINDER_CHANNELS.join(' + '), summary:text});

  const f=FESTIVALS.find(x=>x.id===festId); if(!f) return;

function renderFestivalGreetings(){

    h+='<tr><td><b>'+esc(f.name)+'</b>'+(f.provisional?' '+pill('Provisional','amber'):'')+'</td>'+
      '<td>'+fmtDate(f.date)+'</td>'+
      '<td><a class="link small" data-act="openEditFestivalMessage" data-args="'+esc(JSON.stringify([(f.id)]))+'">'+(_festivalDraftMsg[f.id]!==undefined?'Edit message':'Preview / edit message')+'</a></td>'+
      '<td>'+(custSent>0?'<a class="link" data-act="openFestivalDetail" data-args="'+esc(JSON.stringify([(f.id),"customer"]))+'">'+pill('Sent · '+custSent,'green')+'</a>':'<button class="btn sm primary" data-act="sendFestivalGreeting" data-args="'+esc(JSON.stringify([(f.id),"Customer"]))+'">Send to Customers</button>')+'</td>'+

// After-Sale Messages — replaces name-by-name manual planning with real triggers: a closed job, a fresh
// install, an approaching warranty expiry, or a predicted consumable reorder (reusing the same repeat-sales
// prediction Sales already runs — not a second guess at the same thing). Calibration Reminder is NOT rebuilt
// here; it already has a full tracked pipeline under Service > Follow-ups, so this tab just links to it.
const ASALE_TYPES=[
  {key:'Feedback', label:'Feedback Message', commType:'Feedback Request'},
  {key:'Installation', label:'Installation Follow-up', commType:'Installation Follow-up'},
  {key:'Warranty', label:'Warranty Reminder', commType:'Warranty Reminder'},
  {key:'Consumables', label:'Consumables Reorder', commType:'Consumables Reorder'},
  {key:'Calibration', label:'Calibration Reminder', commType:null},
];
let _asaleCat='Feedback';
function setAsaleCat(k){ _asaleCat=k; rerender(); }
function asaleTypeMeta(k){ return ASALE_TYPES.find(t=>t.key===k); }
function afterSaleAlreadySent(commType, refId){ return DB.communications.some(cm=>cm.type===commType && cm.refId===refId); }
function feedbackMessage(customer, job, product){
  return 'Dear '+customer.name+', thank you for having your '+(product?product.name:'equipment')+' serviced with us (Job '+job.jobNo+'). We would value a quick word on how it went — anything we should improve?';
}
function installationFollowupMessage(customer, product, serial){
  return 'Dear '+customer.name+', checking in on your new '+(product?product.name:'equipment')+(serial?' (Serial: '+serial.serial+')':'')+'. All installed and running fine? Let us know if you need anything explained or adjusted.';
}
function warrantyReminderMessage(customer, product, serial, warr){
  return 'Dear '+customer.name+', your '+(product?product.name:'equipment')+(serial?' (Serial: '+serial.serial+')':'')+' warranty ends on '+fmtDate(warr.expiryDate)+'. Repairs and calibration visits become chargeable after that date. Let us know if you would like a check-up done before it lapses.';
}
function consumablesReorderMessage(customer, material){
  return 'Dear '+customer.name+', based on your usage pattern, your '+(material?material.name:'consumable stock')+' is likely running low. Would you like us to arrange the next batch?';
}
function dueFeedbackList(){
  return DB.serviceJobs.filter(j=>j.status==='Closed' && j.completionDate && daysBetween(j.completionDate,todayISO())>=0 && daysBetween(j.completionDate,todayISO())<=30 && !afterSaleAlreadySent('Feedback Request', j.id))
    .map(j=>{ const s=byId(DB.equipmentSerials,j.serialId); const c=byId(DB.customers,j.customerId); const p=s?byId(DB.products,s.productId):null;
      return {refId:j.id, customer:c, detail:(p?p.name:'Equipment')+' — Job '+j.jobNo, when:'Closed '+daysBetween(j.completionDate,todayISO())+'d ago', build:()=>feedbackMessage(c,j,p)}; })
    .filter(x=>x.customer);
}
function dueInstallationList(){
  return DB.equipmentSerials.filter(s=>daysBetween(s.saleDate,todayISO())>=0 && daysBetween(s.saleDate,todayISO())<=14 && !afterSaleAlreadySent('Installation Follow-up', s.id))
    .map(s=>{ const c=byId(DB.customers,s.customerId); const p=byId(DB.products,s.productId);
      return {refId:s.id, customer:c, detail:(p?p.name:'Equipment')+' ('+s.serial+')', when:'Sold '+daysBetween(s.saleDate,todayISO())+'d ago', build:()=>installationFollowupMessage(c,p,s)}; })
    .filter(x=>x.customer);
}
function dueWarrantyList(){
  return DB.warrantyRecords.filter(w=>w.status==='Active' && daysBetween(todayISO(),w.expiryDate)>=0 && daysBetween(todayISO(),w.expiryDate)<=30 && !afterSaleAlreadySent('Warranty Reminder', w.serialId))
    .map(w=>{ const s=byId(DB.equipmentSerials,w.serialId); const c=s?byId(DB.customers,s.customerId):null; const p=s?byId(DB.products,s.productId):null;
      return {refId:w.serialId, customer:c, detail:(p?p.name:'Equipment')+(s?' ('+s.serial+')':''), when:'Expires in '+daysBetween(todayISO(),w.expiryDate)+'d', build:()=>warrantyReminderMessage(c,p,s,w)}; })
    .filter(x=>x.customer);
}
function dueConsumablesList(){
  return DB.repeatOpportunities.filter(o=>o.status==='Open' && ['Overdue','Due This Week','Due This Month'].includes(repeatOppUrgency(o)) && !afterSaleAlreadySent('Consumables Reorder', o.id))
    .map(o=>{ const c=byId(DB.customers,o.customerId); const m=byId(DB.materials,o.materialId);
      return {refId:o.id, customer:c, detail:(m?m.name:'Consumable'), when:repeatOppUrgency(o), build:()=>consumablesReorderMessage(c,m)}; })
    .filter(x=>x.customer);
}
function asaleDueList(k){
  if(k==='Feedback') return dueFeedbackList();
  if(k==='Installation') return dueInstallationList();
  if(k==='Warranty') return dueWarrantyList();
  if(k==='Consumables') return dueConsumablesList();
  return [];
}
function sendAfterSale(k, refId){
  const meta=asaleTypeMeta(k); const item=asaleDueList(k).find(x=>x.refId===refId); if(!item) return;
  DB.communications.push({id:uid('COM'), entityType:'customer', entityId:item.customer.id, type:meta.commType, refId, date:todayISO(), channel:REMINDER_CHANNELS.join(' + '), summary:item.build()});
  save(); toast('Sent to '+item.customer.name); rerender();
}
function bulkSendAfterSale(k){
  const meta=asaleTypeMeta(k); const items=asaleDueList(k);
  items.forEach(item=>DB.communications.push({id:uid('COM'), entityType:'customer', entityId:item.customer.id, type:meta.commType, refId:item.refId, date:todayISO(), channel:REMINDER_CHANNELS.join(' + '), summary:item.build()}));
  save(); toast('Sent to '+items.length+' customer'+(items.length===1?'':'s')); rerender();
}
function openAfterSaleSentMessage(k, refId){
  const meta=asaleTypeMeta(k);
  const cm=DB.communications.find(c=>c.type===meta.commType && c.refId===refId);
  if(!cm){ toast('No message on record'); return; }
  const c=byId(DB.customers,cm.entityId);
  openModal('Message Sent — '+(c?c.name:''), ''+
    '<div class="small muted" style="margin-bottom:8px;">Sent '+fmtDate(cm.date)+' via '+esc(cm.channel)+'</div>'+
    '<div class="card" style="white-space:pre-wrap;">'+esc(cm.summary)+'</div>',
    '<button class="btn" data-act="closeModal">Close</button>');
}
// Preview before send, on every After-Sale row — shows exactly what will go out (already customer/product-

  const item=asaleDueList(k).find(x=>x.refId===refId); if(!item) return;

function renderAfterSaleMessages(){
  let h='<div class="section-title">After-Sale Messages <span class="hint">Auto-detected from real activity — closed jobs, new installs, warranty windows, predicted consumable reorders. Nothing here is planned by hand.</span></div>';
  h+='<div class="filterbar" style="margin-top:10px;">'+ASALE_TYPES.map(t=>{
    const cnt = t.key==='Calibration' ? '' : ' ('+asaleDueList(t.key).length+')';
    return '<div class="subtab'+(t.key===_asaleCat?' active':'')+'" data-act="setAsaleCat" data-args="'+esc(JSON.stringify([(t.key)]))+'">'+esc(t.label)+cnt+'</div>';
  }).join('')+'</div>';

  if(_asaleCat==='Calibration'){
    h+='<div class="card" style="margin-top:14px;"><div style="font-weight:600;margin-bottom:6px;">Calibration reminders live in Service</div>'+
      '<div class="small muted" style="margin-bottom:12px;">Service 1 / Service 2 due dates, contact status, and outreach are already tracked there in full — not duplicated here.</div>'+
      '<button class="btn primary" data-act="gotoServiceFollowups">Open Service Follow-ups</button></div>';
    return h;
  }

  const items=asaleDueList(_asaleCat);

  h+='<div class="toolbar" style="margin-top:14px;"><div class="small muted" style="font-weight:600;">'+items.length+' pending</div>'+
    '<div class="toolbar-actions"><button class="btn primary" data-act="bulkSendAfterSale" data-args="'+esc(JSON.stringify([(_asaleCat)]))+'"'+(items.length?'':' disabled')+'>Message all pending</button></div></div>';
  h+='<div class="tablewrap" style="margin-top:10px;"><table><thead><tr><th class="nosort">Customer</th><th class="nosort">Detail</th><th class="nosort">Trigger</th><th class="nosort">Action</th></tr></thead><tbody>';
  if(!items.length) h+='<tr><td colspan="4"><div class="empty">Nothing pending in this category right now</div></td></tr>';
  items.forEach(x=>{
    h+='<tr><td><a class="link" data-act="navTo" data-args="'+esc(JSON.stringify(["__customer:"+(x.customer.id)]))+'">'+esc(x.customer.name)+'</a></td><td>'+esc(x.detail)+'</td><td>'+esc(x.when)+'</td>'+
      '<td><a class="link small" style="margin-right:10px;" data-act="openAfterSalePreview" data-args="'+esc(JSON.stringify([(_asaleCat),(x.refId)]))+'">Preview</a><button class="btn sm primary" data-act="sendAfterSale" data-args="'+esc(JSON.stringify([(_asaleCat),(x.refId)]))+'">Send</button></td></tr>';
  });
  h+='</tbody></table></div>';

  const sentComms=DB.communications.filter(cm=>cm.type===meta.commType).sort((a,b)=>a.date<b.date?1:-1).slice(0,20);
  if(sentComms.length){
    h+='<div class="section-title" style="margin-top:20px;font-size:14px;">Recently Sent</div><div class="tablewrap"><table><thead><tr><th class="nosort">Customer</th><th class="nosort">Sent</th><th class="nosort">Message</th></tr></thead><tbody>';
    sentComms.forEach(cm=>{ const c=byId(DB.customers,cm.entityId);
      h+='<tr><td>'+esc(c?c.name:'')+'</td><td>'+fmtDate(cm.date)+'</td><td><a class="link small" data-act="openAfterSaleSentMessage" data-args="'+esc(JSON.stringify([(_asaleCat),(cm.refId)]))+'">View Message</a></td></tr>'; });
    h+='</tbody></table></div>';
  }
  return h;
}

// New Product Updates — always a broadcast to the FULL customer list, never a specific-customer pick, and
// always WhatsApp + Email together. There's no audience or channel choice to make (that was the bug — treating
// a company-wide announcement like a one-to-one message). One update = one message = the entire customer list,
// once, tracked and locked the same way Festival Greetings is.
function defaultProductUpdateMessage(title){
  return 'Hi, quick update from SIMS — '+title+'. Reach out if you would like more details.';
}
function productUpdateSentCount(id){ return DB.communications.filter(cm=>cm.type==='New Product Update' && cm.updateId===id).length; }
function openNewProductUpdateForm(){
  openModal('New Product Update', ''+
    '<div class="formrow full"><div><label>Title</label><input id="pu_title" placeholder="e.g. New Fluorescent Magnetic Particles batch in stock"/></div></div>'+
    '<div class="formrow full"><div><label>Message</label><textarea id="pu_msg" placeholder="What should customers know?"></textarea></div></div>'+
    '<div class="small muted">Goes to every customer, via WhatsApp + Email, as soon as you send it — no audience or channel to pick.</div>',
    '<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveNewProductUpdate">Save</button>');
}
function saveNewProductUpdate(){
  const title=val('pu_title').trim(); if(!title){ toast('Title required'); return; }
  let msg=val('pu_msg').trim(); if(!msg) msg=defaultProductUpdateMessage(title);
  DB.productUpdates.push({id:uid('PUP'), title, message:msg, createdDate:todayISO()});
  save(); closeModal(); toast('Product update saved'); rerender();
}
function openEditProductUpdateMessage(id){
  const u=byId(DB.productUpdates,id); if(!u) return;
  const locked=productUpdateSentCount(id)>0;
  openModal((locked?'Message — ':'Edit Message — ')+u.title, ''+
    (locked
      ? '<div class="small muted" style="margin-bottom:8px;">Already sent — locked so the record matches what actually went out.</div><div class="card" style="white-space:pre-wrap;">'+esc(u.message)+'</div>'
      : '<div class="formrow full"><div><label>Message</label><textarea id="pu_edit_msg">'+esc(u.message)+'</textarea></div></div>'),
    locked ? '<button class="btn" data-act="closeModal">Close</button>' : '<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveEditedProductUpdateMessage" data-args="'+esc(JSON.stringify([(id)]))+'">Save</button>');
}
function saveEditedProductUpdateMessage(id){
  const u=byId(DB.productUpdates,id); if(!u) return;
  u.message=val('pu_edit_msg'); save(); closeModal(); toast('Message updated'); rerender();
}
function sendProductUpdate(id){
  const u=byId(DB.productUpdates,id); if(!u) return;
  if(productUpdateSentCount(id)>0){ toast('Already sent'); return; }
  if(!DB.customers.length){ toast('No customers on file'); return; }
  DB.customers.forEach(c=>{
    DB.communications.push({id:uid('COM'), entityType:'customer', entityId:c.id, type:'New Product Update', updateId:id, date:todayISO(), channel:REMINDER_CHANNELS.join(' + '), summary:u.message});
  });
  save(); toast('Sent to '+DB.customers.length+' customers'); rerender();
}
function openProductUpdateDetail(id){
  const u=byId(DB.productUpdates,id); if(!u) return;
  const comms=DB.communications.filter(cm=>cm.type==='New Product Update' && cm.updateId===id).sort((a,b)=>a.date<b.date?-1:1);
  let h='<div class="small muted" style="margin-bottom:8px;">'+comms.length+' customer(s) messaged via '+esc(REMINDER_CHANNELS.join(' + '))+'</div>';
  h+='<div class="tablewrap"><table><thead><tr><th class="nosort">Customer</th><th class="nosort">Sent</th></tr></thead><tbody>';
  if(!comms.length) h+='<tr><td colspan="2"><div class="empty">Nothing sent yet</div></td></tr>';
  comms.forEach(cm=>{ const c=byId(DB.customers,cm.entityId); h+='<tr><td>'+esc(c?c.name:cm.entityId)+'</td><td>'+fmtDate(cm.date)+'</td></tr>'; });
  h+='</tbody></table></div>';
  openModal(u.title+' — sent to customers', h, '<button class="btn" data-act="closeModal">Close</button>', true);
}
function renderNewProductUpdates(){
  let h='<div class="section-title">New Product Updates <span class="hint">Broadcast to your full customer list — WhatsApp + Email together, every time. No per-customer targeting; if it is worth announcing, everyone gets it.</span></div>';
  h+='<div class="toolbar" style="margin-top:10px;"><div class="small muted" style="font-weight:600;">'+DB.productUpdates.length+' update(s)</div>'+
    '<div class="toolbar-actions"><button class="btn primary" data-act="openNewProductUpdateForm">'+icon('plus',14)+' New Update</button></div></div>';
  h+='<div class="tablewrap" style="margin-top:10px;"><table><thead><tr><th class="nosort">Update</th><th class="nosort">Created</th><th class="nosort">Message</th><th class="nosort">Customers</th></tr></thead><tbody>';
  const list=[...DB.productUpdates].sort((a,b)=>a.createdDate<b.createdDate?1:-1);
  if(!list.length) h+='<tr><td colspan="4"><div class="empty">No product updates yet</div></td></tr>';

    h+='<tr><td><b>'+esc(u.title)+'</b></td><td>'+fmtDate(u.createdDate)+'</td>'+
      '<td><a class="link small" data-act="openEditProductUpdateMessage" data-args="'+esc(JSON.stringify([(u.id)]))+'">'+(sentCount>0?'View message':'Preview / edit message')+'</a></td>'+
      '<td>'+(sentCount>0?'<a class="link" data-act="openProductUpdateDetail" data-args="'+esc(JSON.stringify([(u.id)]))+'">'+pill('Sent · '+sentCount,'green')+'</a>':'<button class="btn sm primary" data-act="sendProductUpdate" data-args="'+esc(JSON.stringify([(u.id)]))+'">Send to All Customers</button>')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

function saveEngMessage(){
  const purpose=val('eg_purpose'); if(!purpose){ toast('Purpose required'); return; }
  const channels=[]; if(document.getElementById('eg_ch_wa').checked) channels.push('WhatsApp'); if(document.getElementById('eg_ch_email').checked) channels.push('Email');
  if(!channels.length){ toast('Pick at least one channel'); return; }
  const audienceIsSupplier = _engCat==='After-Purchase Supplier Messages';
  const dup = DB.engagementMessages.find(m=>m.category===_engCat && m.audienceId===val('eg_aud') && m.purpose===purpose && m.plannedDate===val('eg_date'));
  if(dup){ toast('Duplicate message for this audience/date already planned — edit or send the existing one instead of creating a second (that\'s what causes customers to get the same message twice).'); return; }
  DB.engagementMessages.push({id:uid('ENG'),category:_engCat,audienceType:audienceIsSupplier?'Supplier':'Customer',audienceId:val('eg_aud'),purpose,plannedDate:val('eg_date'),channel:channels.join(' + '),subject:'',message:val('eg_msg'),status:'Planned'});
  save(); closeModal(); toast('Message planned'); rerender();
}
function sendEngMessage(id){
  const m=byId(DB.engagementMessages,id); m.status='Sent';
  const entityType = m.audienceType==='Supplier'?'supplier':'customer';
  // One communications entry covering every channel the message went out on — this IS the fix for "customer
  // gets it on WhatsApp and email both": one compose, one send action, one logged record either way.
  DB.communications.push({id:uid('COM'),entityType,entityId:m.audienceId,type:'Engagement — '+m.category,date:todayISO(),summary:m.purpose+' via '+m.channel});
  completeTasksByRef(DB,'engagement',id,'Message sent');
  recomputeAlertsAndTasks(DB); save(); toast('Message logged as sent'); rerender();
}

/* ============================================================
   === SECTION: RENDER - QUOTATIONS ===
   The hole in v1.0: "Quotation Sent" existed only as a lead stage, so the
   single document that actually wins the order was never produced by the
   system. Quotations now sit where they belong — between a lead and an
   invoice — and an accepted quote converts straight into an invoice, so the
   numbers on the bill are the numbers the customer agreed to.

   Lifecycle:  Draft → Sent → Accepted → (converted to Invoice)
                            ↘ Rejected / Expired
   ============================================================ */
const QUOTE_STATUSES = ['Draft','Sent','Accepted','Rejected','Expired'];
const QUOTE_STATUS_COLOR = { Draft:'gray', Sent:'blue', Accepted:'green', Rejected:'red', Expired:'amber' };
const DEFAULT_QUOTE_TERMS = [
  'Prices are Ex-works Hyderabad unless stated otherwise.',
  'Payment: 50% advance along with the purchase order, balance before dispatch.',
  'Delivery: 2–3 weeks from receipt of a confirmed order.',
  'Warranty: 12 months from date of invoice against manufacturing defects.',
  'Two preventive service visits included free within the warranty period.',
  'Calibration certificate traceable to NABL standards supplied with the equipment.',
].join('\n');

function nextQuoteNo(){
  const yr = todayISO().slice(2,4);
  const n = (DB.quotations||[]).length + 1;
  return 'SIMS/Q/' + yr + '-' + String(n).padStart(4,'0');
}
// A quote past its validity date is Expired whether or not anyone updated it.
// Computed rather than stored, so it can never be stale.
function quoteStatus(q){
  if(q.status==='Sent' && q.validUntil && daysBetween(q.validUntil, todayISO()) > 0) return 'Expired';
  return q.status;
}
function quoteStatusPill(q){ const s = quoteStatus(q); return pill(s, QUOTE_STATUS_COLOR[s] || 'gray'); }
function quoteCustomerName(q){
  const c = byId(DB.customers, q.customerId);
  return c ? c.name : (q.leadCompany || '—');
}
function quoteDaysLeft(q){ return q.validUntil ? daysBetween(todayISO(), q.validUntil) : null; }

/* ---- list ---- */
let _quoteFilter = 'All';
function setQuoteFilter(f){ _quoteFilter = f; rerender(); }
function renderQuotations(){
  if(!(DB.quotations||[]).length) return emptyState('filetext','No quotations yet',
    'A quotation is where a sale starts. Raise one against a customer or a lead, and when it is accepted it becomes an invoice in a single click — with the same numbers.',
    'Create your first quotation','openQuoteForm');
  const all = (DB.quotations||[]).slice();
  const counts = { All: all.length };
  QUOTE_STATUSES.forEach(s=>{ counts[s] = all.filter(q=>quoteStatus(q)===s).length; });
  const rows = _quoteFilter==='All' ? all : all.filter(q=>quoteStatus(q)===_quoteFilter);

  const openValue = all.filter(q=>['Sent','Draft'].includes(quoteStatus(q))).reduce((s,q)=>s+q.total,0);
  const acceptedValue = all.filter(q=>quoteStatus(q)==='Accepted').reduce((s,q)=>s+q.total,0);
  const decided = all.filter(q=>['Accepted','Rejected'].includes(quoteStatus(q)));
  const winRate = decided.length ? Math.round(all.filter(q=>quoteStatus(q)==='Accepted').length / decided.length * 100) : 0;
  const expiringSoon = all.filter(q=>quoteStatus(q)==='Sent' && quoteDaysLeft(q) !== null && quoteDaysLeft(q) <= 5);

  let h = '<div class="grid g4">' + [
    {label:'Quotations out',   val:fmtMoney(openValue),     sub:counts.Sent + ' sent, ' + counts.Draft + ' draft', ic:'filetext', color:'var(--primary-600)', bg:'var(--primary-100)'},
    {label:'Accepted, awaiting invoice', val:fmtMoney(acceptedValue), sub:counts.Accepted + ' quotations', ic:'checkcircle', color:'var(--green)', bg:'var(--green-100)'},
    {label:'Win rate',         val:winRate + '%',           sub:decided.length + ' decided quotations', ic:'target', color:'var(--teal)', bg:'var(--teal-100)'},
    {label:'Expiring in 5 days', val:expiringSoon.length,   sub:'chase these first', ic:'clock', color: expiringSoon.length ? 'var(--red)' : 'var(--green)', bg: expiringSoon.length ? 'var(--red-100)' : 'var(--green-100)'},
  ].map(k=>'<div class="kpi"><div class="kpitop">' + iconChip(k.ic,k.color,k.bg) + '</div><div class="label" style="margin-top:10px;">' + esc(k.label) + '</div><div class="val">' + k.val + '</div><div class="sub">' + esc(k.sub) + '</div></div>').join('') + '</div>';

  h += '<div class="toolbar" style="margin-top:20px;">' +
    '<div class="chips">' + ['All'].concat(QUOTE_STATUSES).map(s=>
      '<div class="chip' + (_quoteFilter===s?' active':'') + '" ' + act('setQuoteFilter', s) + '>' + s + ' <span class="cnt">' + (counts[s]||0) + '</span></div>').join('') + '</div>' +
    '<button class="btn primary" ' + act('openQuoteForm') + '>' + icon('plus',14) + ' New quotation</button></div>';

  h += '<div class="tablewrap">' + renderTable('quotetbl', [
    {key:'quoteNo', label:'Quotation #', render:q=>'<a class="link" ' + act('openQuoteDetail', q.id) + '>' + esc(q.quoteNo) + '</a>'},
    {key:'date', label:'Date', render:q=>fmtDate(q.date)},
    {key:'customer', label:'Customer / Prospect', sort:false, exportVal:q=>quoteCustomerName(q), render:q=>{
      const c = byId(DB.customers, q.customerId);
      return c ? '<a class="link" ' + act('navTo','__customer:'+q.customerId) + '>' + esc(c.name) + '</a>'
               : esc(q.leadCompany||'—') + ' <span class="tag">prospect</span>'; }},
    {key:'lines', label:'Items', kind:'num', sort:false, render:q=>q.lines.length},
    {key:'total', label:'Value', kind:'num', render:q=>fmtMoney(q.total)},
    {key:'validUntil', label:'Valid until', render:q=>{
      const d = quoteDaysLeft(q);
      if(quoteStatus(q)!=='Sent') return fmtDate(q.validUntil);
      return fmtDate(q.validUntil) + ' ' + (d < 0 ? pill('expired','red') : d <= 5 ? pill(d + 'd left','amber') : ''); }},
    {key:'status', label:'Status', sortVal:q=>quoteStatus(q), render:q=>quoteStatusPill(q)},
    {key:'act', label:'Action', sort:false, exportVal:false, render:q=>quoteRowActions(q)},
  ], rows, {defaultSort:'date', defaultDir:-1, title:'Quotations'}) + '</div>';
  window._lastTableRenderFn['quotetbl'] = rerender;
  return h;
}
function quoteRowActions(q){
  const st = quoteStatus(q);
  let b = '';
  if(st==='Draft')    b += '<button class="btn sm primary" ' + act('markQuoteSent', q.id) + '>Mark sent</button> ';
  if(st==='Sent')     b += '<button class="btn sm primary" ' + act('acceptQuote', q.id) + '>Accepted</button> <button class="btn sm" ' + act('rejectQuote', q.id) + '>Lost</button> ';
  if(st==='Expired')  b += '<button class="btn sm" ' + act('reviseQuote', q.id) + '>Revise</button> ';
  if(st==='Accepted' && !q.convertedInvoiceId) b += '<button class="btn sm primary" ' + act('convertQuoteToInvoice', q.id) + '>Make invoice</button> ';
  if(q.convertedInvoiceId) b += '<button class="btn sm" ' + act('openInvoiceDetail', q.convertedInvoiceId) + '>View invoice</button> ';
  return b + '<button class="btn sm" ' + act('printQuote', q.id) + '>Print</button>';
}

function saveQuote(status){

  const cid = val('q_customer');
  const leadCompany = val('q_leadcompany');
  if(!cid && !leadCompany){ toast('Pick a customer, or type a prospect name'); return; }
  const cust = quoteFormCustomer();
  const doc = priceDocument(_quoteLines, cust);
  const q = {
    id: uid('QTN'), quoteNo: nextQuoteNo(),
    customerId: cid || '', leadId: val('q_lead') || '',
    leadCompany: cid ? '' : leadCompany, leadGst: cid ? '' : val('q_leadgst'),
    date: val('q_date') || todayISO(),
    validUntil: val('q_validuntil') || addDays(todayISO(), settings().quoteValidityDays),
    lines: doc.lines, subTotal: doc.subTotal, cgst: doc.cgst, sgst: doc.sgst, igst: doc.igst,
    taxTotal: doc.taxTotal, total: doc.total, intraState: doc.intraState, placeOfSupply: doc.placeOfSupply,
    terms: val('q_terms'), notes: val('q_notes'),
    status: status, revision: 1, sentOn: status==='Sent' ? (val('q_date') || todayISO()) : '',
    convertedInvoiceId: '', createdBy: CURRENT_EMP, createdAt: todayISO(),
  };
  if(!DB.quotations) DB.quotations = [];
  DB.quotations.push(q);
  audit('Created', 'Quotation', q.id, q.quoteNo + ' — ' + quoteCustomerName(q) + ' — ' + fmtMoney(q.total));
  // A quotation is the event that moves a lead forward; do it here rather than
  // asking the salesperson to remember to update the board separately.
  if(q.leadId){
    const l = byId(DB.leads, q.leadId);
    if(l && status==='Sent' && !['Won','Lost'].includes(l.stage)){
      const before = snapshot(l);
      l.stage = 'Quotation Sent';
      l.activities = l.activities || [];
      l.activities.push({ date: q.date, note: 'Quotation ' + q.quoteNo + ' sent — ' + fmtMoney(q.total) });
      l.followUpDate = addDays(q.date, 5);
      audit('Updated', 'Lead', l.id, l.company + ' — moved to Quotation Sent', before, l);
    }
  }
  if(q.customerId){
    DB.communications.push({ id: uid('COM'), entityType:'customer', entityId:q.customerId, type:'Quotation',
      date: q.date, channel:'Email', summary:'Quotation ' + q.quoteNo + ' — ' + fmtMoney(q.total) + ' (valid to ' + fmtDate(q.validUntil) + ')' });
  }
  recomputeAlertsAndTasks(DB); save(); closeModal();
  toast('Quotation ' + q.quoteNo + ' saved' + (status==='Sent' ? ' and marked sent' : ' as draft'));
  rerender();
}

/* ---- status transitions ---- */
function markQuoteSent(id){
  const q = byId(DB.quotations, id); if(!q) return;
  const before = snapshot(q);
  q.status = 'Sent'; q.sentOn = todayISO();
  audit('Status', 'Quotation', q.id, q.quoteNo + ' marked sent', before, q);
  save(); toast(q.quoteNo + ' marked as sent'); rerender();
}
function acceptQuote(id){
  const q = byId(DB.quotations, id); if(!q) return;
  const before = snapshot(q);
  q.status = 'Accepted'; q.decidedOn = todayISO();
  audit('Status', 'Quotation', q.id, q.quoteNo + ' accepted — ' + fmtMoney(q.total), before, q);
  if(q.leadId){
    const l = byId(DB.leads, q.leadId);
    if(l && !['Won','Lost'].includes(l.stage)){
      const lb = snapshot(l);
      l.stage = 'Negotiation';
      l.activities = (l.activities||[]).concat([{ date: todayISO(), note: 'Quotation ' + q.quoteNo + ' accepted — awaiting purchase order' }]);
      audit('Updated', 'Lead', l.id, l.company, lb, l);
    }
  }
  save(); toast(q.quoteNo + ' accepted — convert it to an invoice when the order lands'); rerender();
}
function rejectQuote(id){
  const q = byId(DB.quotations, id); if(!q) return;
  const reason = prompt('Why was this quotation lost? (price, delivery, competitor, no response...)', '');
  if(reason === null) return;
  const before = snapshot(q);
  q.status = 'Rejected'; q.decidedOn = todayISO(); q.lostReason = reason;
  audit('Status', 'Quotation', q.id, q.quoteNo + ' lost — ' + (reason || 'no reason given'), before, q);
  save(); toast(q.quoteNo + ' marked lost'); rerender();
}
// A revision is a new document, not an edit — the original stays on record so
// you can still see what the customer was originally quoted and why it moved.
function reviseQuote(id){
  const old = byId(DB.quotations, id); if(!old) return;
  const q = JSON.parse(JSON.stringify(old));
  q.id = uid('QTN'); q.quoteNo = old.quoteNo.replace(/-R\d+$/,'') + '-R' + ((old.revision||1) + 1);
  q.revision = (old.revision||1) + 1; q.status = 'Draft'; q.date = todayISO();
  q.validUntil = addDays(todayISO(), settings().quoteValidityDays);
  q.supersedes = old.id; q.convertedInvoiceId = ''; q.sentOn = ''; q.decidedOn = '';
  DB.quotations.push(q);
  const ob = snapshot(old); old.supersededBy = q.id;
  audit('Created', 'Quotation', q.id, q.quoteNo + ' — revision of ' + old.quoteNo, ob, old);
  save(); toast('Revision ' + q.quoteNo + ' created as a draft'); rerender();
}
// The conversion. Reuses makeSaleInvoice so an invoice raised from a quote
// behaves exactly like any other: serials, warranty records and the two
// scheduled service visits are all generated the same way.
function convertQuoteToInvoice(id){
  const q = byId(DB.quotations, id); if(!q) return;
  if(!q.customerId){
    toast('This quotation is for a prospect — convert the lead to a customer first');
    return;
  }
  if(!confirm('Raise a sales invoice for ' + fmtMoney(q.total) + ' from ' + q.quoteNo + '?\n\nSerial numbers, warranty records and service schedules will be generated automatically.')) return;
  const inv = makeSaleInvoice(DB, {
    customerId: q.customerId, date: todayISO(),
    lines: q.lines.map(l=>({ type:l.type, productId:l.productId, materialId:l.materialId, description:l.description, qty:l.qty, rate:l.rate })),
    paymentStatus: 'Unpaid', quotationId: q.id,
  });
  const before = snapshot(q);
  q.convertedInvoiceId = inv.id; q.convertedOn = todayISO();
  audit('Converted', 'Quotation', q.id, q.quoteNo + ' → invoice ' + inv.invoiceNo, before, q);
  audit('Created', 'Invoice', inv.id, inv.invoiceNo + ' from quotation ' + q.quoteNo + ' — ' + fmtMoney(inv.total));
  if(q.leadId){
    const l = byId(DB.leads, q.leadId);
    if(l && !['Won','Lost'].includes(l.stage)){
      const lb = snapshot(l);
      l.stage = 'Won'; l.closedAt = todayISO(); l.wonCustomerId = q.customerId;
      l.activities = (l.activities||[]).concat([{ date: todayISO(), note: 'Order confirmed — invoice ' + inv.invoiceNo }]);
      audit('Updated', 'Lead', l.id, l.company + ' — Won', lb, l);
    }
  }
  recomputeAlertsAndTasks(DB); save();
  toast('Invoice ' + inv.invoiceNo + ' raised from ' + q.quoteNo);
  rerender();
}

/* ============================================================
   === SECTION: RENDER - RECEIVABLES ===
   Owners don't buy business software to log leads; they buy it to get paid
   faster. This is the collections screen: who owes, how long it's been, and
   a one-click reminder that opens on WhatsApp with the message pre-written.
   ============================================================ */
let _recBucket = 'all';
function setRecBucket(b){ _recBucket = b; rerender(); }
function renderReceivables(){
  const T = todayISO();
  const open = openInvoices();
  const byBucket = {};
  AGEING_BUCKETS.forEach(b=>{ byBucket[b.key] = open.filter(i=>invAgeingBucket(i)===b.key); });
  const bucketTotal = k => (byBucket[k]||[]).reduce((s,i)=>s+invBalance(i), 0);

  const collectedMonth = DB.salesInvoices.reduce((s,i)=>
    s + invPayments(i).filter(p=>String(p.date).slice(0,7)===T.slice(0,7)).reduce((x,p)=>x+p.amount, 0), 0);
  // Weighted average days outstanding — one number for "how slowly are we
  // actually being paid", which a count of overdue invoices never tells you.
  const totalBal = totalReceivables();
  const avgDays = totalBal ? Math.round(open.reduce((s,i)=>s + invBalance(i) * Math.max(0, daysBetween(i.date, T)), 0) / totalBal) : 0;

  let h = '<div class="grid g4">' + [
    {label:'Total outstanding', val:fmtMoney(totalBal), sub:open.length + ' open invoices', ic:'clock', color:'var(--amber)', bg:'var(--amber-100)'},
    {label:'Overdue', val:fmtMoney(totalOverdue()), sub:open.filter(i=>invDaysOverdue(i)>0).length + ' past due date', ic:'alerttri', color:'var(--red)', bg:'var(--red-100)'},
    {label:'Collected this month', val:fmtMoney(collectedMonth), sub:'receipts recorded', ic:'checkcircle', color:'var(--green)', bg:'var(--green-100)'},
    {label:'Refunds owed out', val:fmtMoney(totalRefundsDue()), sub:'credited after payment', ic:'refresh', color: totalRefundsDue()>0?'var(--amber)':'var(--ink-700)', bg: totalRefundsDue()>0?'var(--amber-100)':'var(--ink-100)'},
    {label:'Average collection period', val:avgDays + ' days', sub:'weighted by amount', ic:'trendup', color:'var(--primary-600)', bg:'var(--primary-100)'},
  ].map(k=>'<div class="kpi"><div class="kpitop">' + iconChip(k.ic,k.color,k.bg) + '</div><div class="label" style="margin-top:10px;">' + esc(k.label) + '</div><div class="val">' + k.val + '</div><div class="sub">' + esc(k.sub) + '</div></div>').join('') + '</div>';

  h += '<div class="section-title"><span class="lft">' + icon('barchart',16) + ' Ageing</span><span class="hint">Click a bucket to filter the list</span></div>';
  h += '<div class="grid g6" style="grid-template-columns:repeat(6,1fr);">';

    const hot = b.key==='b90p' || b.key==='b90';
    h += '<div class="agecard' + (_recBucket===b.key?' active':'') + (hot && v ? ' hot' : '') + '" ' + act('setRecBucket', b.key) + '>' +
      '<div class="agelbl">' + b.label + '</div><div class="ageval">' + fmtMoney(v) + '</div><div class="agesub">' + n + ' invoice' + (n===1?'':'s') + '</div></div>';
  });
  h += '</div>';

  const rows = _recBucket==='all' ? open : (byBucket[_recBucket]||[]);
  h += '<div class="section-title"><span class="lft">' + icon('filetext',16) + ' Outstanding invoices</span><span class="hint">' + rows.length + ' shown</span></div>';
  h += '<div class="tablewrap">' + renderTable('rectbl', [
    {key:'invoiceNo', label:'Invoice #', render:i=>'<a class="link" ' + act('openInvoiceDetail', i.id) + '>' + esc(i.invoiceNo) + '</a>'},
    {key:'customer', label:'Customer', sort:false, exportVal:i=>{const c=byId(DB.customers,i.customerId);return c?c.name:'';}, render:i=>{
      const c = byId(DB.customers, i.customerId);
      return c ? '<a class="link" ' + act('navTo','__customer:'+i.customerId) + '>' + esc(c.name) + '</a>' : '—'; }},
    {key:'date', label:'Invoice date', render:i=>fmtDate(i.date)},
    {key:'due', label:'Due date', sortVal:i=>invDueDate(i), render:i=>fmtDate(invDueDate(i))},
    {key:'total', label:'Invoice value', kind:'num', render:i=>fmtMoney(i.total)},
    {key:'paid', label:'Received', kind:'num', sortVal:i=>invPaid(i), render:i=>fmtMoney(invPaid(i))},
    {key:'bal', label:'Balance due', kind:'num', sortVal:i=>invBalance(i), render:i=>'<b>' + fmtMoney(invBalance(i)) + '</b>'},
    {key:'age', label:'Overdue by', kind:'num', sortVal:i=>invDaysOverdue(i), render:i=>{

  window._lastTableRenderFn['rectbl'] = rerender;
  return h;

// Opens WhatsApp with the reminder already written. No backend, no API key —
// and it is the channel an Indian SME customer actually reads.
function sendPaymentReminder(invId){
  const inv = byId(DB.salesInvoices, invId); if(!inv) return;
  const c = byId(DB.customers, inv.customerId);
  const d = invDaysOverdue(inv);
  const s = settings();
  const msg =
    'Dear ' + ((c && c.contactPerson) || 'Sir/Madam') + ',\n\n' +
    'Gentle reminder regarding invoice ' + inv.invoiceNo + ' dated ' + fmtDate(inv.date) + '.\n' +
    'Invoice value: ' + fmtMoney(inv.total) + '\n' +
    (invPaid(inv) > 0 ? 'Received so far: ' + fmtMoney(invPaid(inv)) + '\n' : '') +
    'Balance outstanding: ' + fmtMoney(invBalance(inv)) + '\n' +
    'Due date: ' + fmtDate(invDueDate(inv)) + (d > 0 ? ' (' + d + ' days overdue)' : '') + '\n\n' +
    'Kindly arrange payment at your convenience.\n' + s.company.bank + '\n' +
    (s.company.upiId ? 'UPI: ' + s.company.upiId + '\n' : '') + '\n' +

function renderAuditLog(){
  const log = (DB.auditLog||[]).slice().reverse();
  const entities = ['All'].concat(Array.from(new Set(log.map(l=>l.entity))).sort());
  const actions  = ['All'].concat(Array.from(new Set(log.map(l=>l.action))).sort());
  const people   = ['All'].concat(Array.from(new Set(log.map(l=>l.byName))).sort());
  const q = _auditFilter.q.toLowerCase();
  const rows = log.filter(l=>
    (_auditFilter.entity==='All' || l.entity===_auditFilter.entity) &&
    (_auditFilter.action==='All' || l.action===_auditFilter.action) &&
    (_auditFilter.who==='All'    || l.byName===_auditFilter.who) &&
    (!q || (l.label + ' ' + l.entity + ' ' + l.action + ' ' + l.byName).toLowerCase().indexOf(q) >= 0));
  // The log grows without limit; painting every row would make the page crawl.
  // Newest 300 on screen — the export still carries the whole thing.
  const CAP = 300, shown = rows.slice(0, CAP);

  let h = '<div class="infobox">' + icon('shieldcheck',16) + '<div><b>Audit trail.</b> Every create, edit, payment, status change, export and restore is recorded here with the person, the role and the exact fields that changed. It cannot be edited from inside the system — only exported.</div></div>';
  h += '<div class="toolbar" style="margin-top:14px;">' +
    '<input id="auditQ" class="searchbox" placeholder="Search the log..." value="' + esc(_auditFilter.q) + '" oninput="setAuditQuery(this.value)"/>' +
    '<select onchange="setAuditFilter(\'entity\', this.value)">' + entities.map(e=>'<option' + (e===_auditFilter.entity?' selected':'') + '>' + esc(e) + '</option>').join('') + '</select>' +
    '<select onchange="setAuditFilter(\'action\', this.value)">' + actions.map(e=>'<option' + (e===_auditFilter.action?' selected':'') + '>' + esc(e) + '</option>').join('') + '</select>' +
    '<select onchange="setAuditFilter(\'who\', this.value)">' + people.map(e=>'<option' + (e===_auditFilter.who?' selected':'') + '>' + esc(e) + '</option>').join('') + '</select>' +
    '<div style="flex:1;"></div><div class="small muted">' + (rows.length > CAP ? 'showing the latest ' + CAP + ' of ' + rows.length : rows.length + ' of ' + log.length + ' entries') + '</div>' +
    '<button class="btn sm" ' + act('exportRawTable','auditLog','xls') + '>Export log</button></div>';

  h += '<div class="tablewrap">' + renderTable('audittbl', [
    {key:'at', label:'When', render:l=>'<span title="' + esc(l.at) + '">' + fmtDate(l.onDate || String(l.at).slice(0,10)) + '<div class="small muted">' + String(l.at).slice(11,16) + '</div></span>'},
    {key:'byName', label:'Who', render:l=>esc(l.byName) + '<div class="small muted">' + esc(l.byRole) + '</div>'},
    {key:'action', label:'Action', render:l=>pill(l.action, l.action==='Deleted'||l.action==='Payment reversed' ? 'red' : l.action==='Created' ? 'green' : l.action==='Import'||l.action==='Reset' ? 'amber' : 'blue')},
    {key:'entity', label:'Record type'},
    {key:'label', label:'Record', sort:false, render:l=>esc(l.label||'—')},
    {key:'changes', label:'What changed', sort:false, exportVal:l=>l.changes?Object.keys(l.changes).join('; '):'', render:l=>{
      if(!l.changes) return '<span class="muted small">—</span>';
      const keys = Object.keys(l.changes);
      const shown = keys.slice(0,3).map(k=>{
        const c = l.changes[k];
        const fmt = v => v==null||v==='' ? '(empty)' : typeof v==='object' ? (Array.isArray(v) ? v.length + ' item(s)' : 'object') : String(v);
        return '<div class="chg"><b>' + esc(k) + '</b>: <span class="was">' + esc(fmt(c.from)) + '</span> → <span class="now">' + esc(fmt(c.to)) + '</span></div>';
      }).join('');
      return shown + (keys.length > 3 ? '<div class="small muted">+' + (keys.length-3) + ' more field(s)</div>' : ''); }},
  ], shown, {defaultSort:null, title:'Audit Log', pageSize:30}) + '</div>';
  window._lastTableRenderFn['audittbl'] = rerender;
  return h;
}

function saveSettings(){
  const s = settings();
  const before = snapshot(s);
  s.demoMode = val('set_demomode')==='1';
  s.demoDate = val('set_demodate') || s.demoDate;
  s.creditDays = num('set_credit') || 30;
  s.quoteValidityDays = num('set_qval') || 15;
  s.defaultGstRate = num('set_gst') || 18;
  s.company.name = val('set_coname'); s.company.address = val('set_coaddr');
  s.company.gstin = val('set_cogst'); s.company.stateCode = val('set_costate');
  s.company.phone = val('set_cophone'); s.company.email = val('set_coemail');
  s.company.bank = val('set_cobank');
  s.company.upiId = val('set_coupi');
  s.web = s.web || { apiBase:'', apiToken:'' };
  if(!PUBLIC_DEMO && WORKSPACE_MODE==='sample'){
    s.web.apiBase = val('set_weburl').trim().replace(/\/$/,'');
    s.web.apiToken = val('set_webtoken').trim();
  }
  audit('Updated', 'Settings', '', 'Company / date settings changed', before, s);

}

   One place that answers "what do I owe the government this month", and
   holds the three documents that make that number defensible: credit notes,
   debit notes and e-way bills.
   ============================================================ */
let _gstView = 'position';   // position | credit | debit | eway
let _gstMonth = null;        // null = current business month
function setGstView(v){ _gstView = v; rerender(); }
function setGstMonth(m){ _gstMonth = m; rerender(); }
function renderCompliance(){
  if(_gstView === 'credit') return renderCreditNotes();
  if(_gstView === 'debit')  return renderDebitNotes();
  if(_gstView === 'eway')   return renderEwayBills();
  return renderGstPosition();
}
function availableGstMonths(){
  const set = {};
  DB.salesInvoices.forEach(i=>set[String(i.date).slice(0,7)] = 1);
  DB.purchases.forEach(p=>set[String(p.date).slice(0,7)] = 1);
  return Object.keys(set).sort().reverse().slice(0, 18);
}
// Opens on the last month that actually has sales, not necessarily the
// calendar month. Returns are filed for completed months, and on the 7th of
// August a screen showing zero output tax reads as broken rather than early.
function defaultGstMonth(){
  const cur = todayISO().slice(0,7);
  if(DB.salesInvoices.some(i=>String(i.date).slice(0,7) === cur)) return cur;
  const months = DB.salesInvoices.map(i=>String(i.date).slice(0,7)).sort();
  return months.length ? months[months.length - 1] : cur;
}
function renderGstPosition(){
  const month = _gstMonth || defaultGstMonth();
  const g = gstPositionFor(month);
  const months = availableGstMonths();
  const label = new Date(month + '-01T00:00:00').toLocaleDateString('en-IN', { month:'long', year:'numeric' });
  const payable = g.net > 0;

  let h = '<div class="infobox">' + icon('shieldcheck',16) + '<div><b>Your GST position for ' + esc(label) + '.</b> Output tax is what you charged customers and now hold for the government. Input tax credit is the GST you already paid suppliers and can set off against it. The difference is what actually leaves the bank.</div></div>';

  h += '<div class="toolbar" style="margin-top:14px;"><label class="small muted" style="margin:0 8px 0 0;">Month</label>' +
    '<select onchange="setGstMonth(this.value)">' + months.map(m=>{
      const ml = new Date(m + '-01T00:00:00').toLocaleDateString('en-IN',{month:'short',year:'numeric'});
      return '<option value="' + m + '"' + (m===month?' selected':'') + '>' + ml + '</option>';
    }).join('') + '</select><div style="flex:1;"></div>' +
    '<button class="btn sm" ' + act('exportGstPosition', month) + '>Export for the accountant</button></div>';

  h += '<div class="grid g3" style="grid-template-columns:1fr 1fr 1fr;margin-top:16px;">';
  h += '<div class="card"><div class="section-title" style="margin-top:0;"><span class="lft">' + icon('arrowup',15) + ' Output tax — on sales</span></div>' +
    '<div class="totalsbox" style="max-width:none;margin:0;">' +
      '<div class="trow"><span>Taxable sales</span><b>' + fmtMoney(g.taxableSales) + '</b></div>' +
      '<div class="trow"><span>CGST</span><b>' + fmtMoney(g.outputCgst) + '</b></div>' +
      '<div class="trow"><span>SGST</span><b>' + fmtMoney(g.outputSgst) + '</b></div>' +

let _webEnq = { loading:false, error:'', rows:[], loaded:false, selected:{} };
function renderWebEnquiries(){
  const s = settings();
  let h = '<div class="infobox">' + icon('megaphone',16) + '<div><b>Enquiries from the website.</b> Every RFQ submitted on the public site lands here. Importing one creates a lead with the customer\'s own reference number kept intact, then marks the enquiry taken so the same request can never become two leads.</div></div>';

  if(!s.web || !s.web.apiBase || !s.web.apiToken){
    h += '<div class="warnbox" style="margin-top:14px;">' + icon('alerttri',16) + '<div><b>Not connected yet.</b> Set the website address and access token in <b>Data &amp; Audit → Settings</b> before enquiries can be pulled in.</div></div>';
    h += '<div class="toolbar" style="margin-top:14px;"><button class="btn primary" ' + act('gotoSettings') + '>Open settings</button></div>';
    return h;
  }

  h += '<div class="toolbar" style="margin-top:14px;">' +
    '<div class="small muted" style="font-weight:600;">' + esc(s.web.apiBase) + '</div><div style="flex:1;"></div>' +

  if(_webEnq.loading) h += '<div class="card"><div class="empty">' + icon('refresh',26) + '<div style="margin-top:6px;">Contacting the website…</div></div></div>';
  else if(_webEnq.error) h += '<div class="warnbox" style="margin-top:14px;">' + icon('alerttri',16) + '<div><b>Could not reach the website.</b> ' + esc(_webEnq.error) + '</div></div>';
  else if(!_webEnq.loaded) h += '<div class="card"><div class="empty">' + icon('megaphone',26) + '<div style="margin-top:6px;">Press “Check for new enquiries” to pull anything waiting.</div></div></div>';
  else if(!_webEnq.rows.length) h += '<div class="card"><div class="empty">' + icon('checkcircle',26) + '<div style="margin-top:6px;">Nothing waiting — every website enquiry has already been imported.</div></div></div>';
  else {
    const n = Object.values(_webEnq.selected).filter(Boolean).length;
    h += '<div class="toolbar"><div class="small muted" style="font-weight:600;">' + _webEnq.rows.length + ' waiting</div><div style="flex:1;"></div>' +
      '<button class="btn sm" ' + act('toggleAllWebEnq') + '>Select all</button>' +
      '<button class="btn primary" ' + act('importWebEnquiries') + (n?'':' disabled') + '>Import ' + (n||'') + ' as lead' + (n===1?'':'s') + '</button></div>';
    h += '<div class="tablewrap"><table><thead><tr><th class="nosort"></th><th class="nosort">Reference</th><th class="nosort">Received</th><th class="nosort">Company</th><th class="nosort">Contact</th><th class="nosort">Interested in</th><th class="nosort">Requirement</th></tr></thead><tbody>';
    _webEnq.rows.forEach(r=>{
      h += '<tr><td><input type="checkbox"' + (_webEnq.selected[r.reference]?' checked':'') + ' onchange="toggleWebEnq(\'' + esc(r.reference) + '\',this.checked)"/></td>' +
        '<td class="small"><b>' + esc(r.reference) + '</b></td>' +
        '<td class="small">' + esc(String(r.createdAt||'').slice(0,10)) + '</td>' +
        '<td><b>' + esc(r.company || '—') + '</b><div class="small muted">' + esc(r.destination||'') + '</div></td>' +
        '<td class="small">' + esc(r.name||'') + '<div class="muted">' + esc(r.phone||'') + '</div></td>' +
        '<td class="small">' + esc(r.product || r.interest || '—') + '</td>' +
        '<td class="small muted">' + esc([r.application, r.objective, r.standard].filter(Boolean).join(' · ').slice(0,90) || '—') + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  return h;
}
function toggleWebEnq(ref, on){ _webEnq.selected[ref] = on; rerender(); }
function toggleAllWebEnq(){
  const allOn = _webEnq.rows.every(r=>_webEnq.selected[r.reference]);
  _webEnq.rows.forEach(r=>{ _webEnq.selected[r.reference] = !allOn; });
  rerender();
}
async function fetchWebEnquiries(){
  const s = settings();
  _webEnq.loading = true; _webEnq.error = ''; rerender();
  try{
    const res = await fetch(s.web.apiBase.replace(/\/$/,'') + '/api/enquiries?status=new', {
      headers: { 'Authorization': 'Bearer ' + s.web.apiToken },
    });
    if(!res.ok){
      const body = await res.json().catch(()=>({}));
      throw new Error('The website replied ' + res.status + (body.error ? ' — ' + body.error : ''));
    }
    const data = await res.json();
    _webEnq.rows = data.enquiries || [];
    _webEnq.selected = {};
    _webEnq.rows.forEach(r=>{ _webEnq.selected[r.reference] = true; });
    _webEnq.loaded = true;
  }catch(e){
    _webEnq.error = e.message;
  }
  _webEnq.loading = false;
  rerender();
}
// One enquiry becomes one lead. The website's reference is carried across
// verbatim, because that is the number the customer was shown.
function enquiryToLead(r){
  const technical = [
    r.application && 'Application: ' + r.application,
    r.objective && 'Objective: ' + r.objective,
    r.standard && 'Standard: ' + r.standard,
    r.material && 'Material: ' + r.material,
    r.part && 'Part: ' + r.part,
    r.throughput && 'Throughput: ' + r.throughput,
    r.documents && 'Documents needed: ' + r.documents,
  ].filter(Boolean).join('\n');
  return {
    id: uid('LD'),
    company: r.company || r.name || 'Website enquiry',
    contact: r.name || '', mobile: r.phone || '', email: r.email || '',
    location: r.destination || '', industry: '',
    source: 'Website', sourceRef: r.reference,
    product: r.product || r.interest || '',
    expectedValue: 0,
    assignedTo: 'EMP-2', stage: 'Enquiry',
    followUpDate: addDays(todayISO(), 1),
    lostReason: '',
    notes: [r.route && 'Route: ' + r.route, r.setting && 'Setting: ' + r.setting,
            r.timeline && 'Timeline: ' + r.timeline, r.preference && 'Prefers ' + r.preference].filter(Boolean).join(' · '),
    technicalNotes: technical,
    activities: [{ date: String(r.createdAt||todayISO()).slice(0,10), note: 'Enquiry received from the website (' + r.reference + ')' }],
    createdAt: String(r.createdAt || todayISO()).slice(0,10),
  };
}
async function importWebEnquiries(){
  const s = settings();
  const chosen = _webEnq.rows.filter(r=>_webEnq.selected[r.reference]);
  if(!chosen.length){ toast('Select at least one enquiry'); return; }
  // Never import the same reference twice, even if the website says it is new.
  const existing = {}; DB.leads.forEach(l=>{ if(l.sourceRef) existing[l.sourceRef] = 1; });
  const fresh = chosen.filter(r=>!existing[r.reference]);
  const dupes = chosen.length - fresh.length;

  fresh.forEach(r=>{
    const lead = enquiryToLead(r);
    DB.leads.push(lead);
    audit('Created', 'Lead', lead.id, lead.company + ' — imported from website enquiry ' + r.reference);
  });

  let marked = 0;
  try{
    const res = await fetch(s.web.apiBase.replace(/\/$/,'') + '/api/enquiries', {
      method: 'PATCH',
      headers: { 'Authorization': 'Bearer ' + s.web.apiToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ references: chosen.map(r=>r.reference), status: 'imported' }),
    });
    const data = await res.json().catch(()=>({}));
    marked = data.updated || 0;
    if(!res.ok) throw new Error(data.error || ('status ' + res.status));
  }catch(e){
    // The leads are already created locally; say so plainly rather than
    // pretending the whole operation failed.
    toast('Leads created, but the website could not be updated — they may appear again. ' + e.message);
    recomputeAlertsAndTasks(DB); save(); rerender(); return;
  }
  recomputeAlertsAndTasks(DB); save();
  toast(fresh.length + ' lead' + (fresh.length===1?'':'s') + ' created' + (dupes ? ', ' + dupes + ' already imported earlier' : '') + ' · ' + marked + ' marked on the website');
  _webEnq.rows = []; _webEnq.selected = {}; _webEnq.loaded = false;
  fetchWebEnquiries();
}

  downloadFile('SIMS_Marketplace_Leads_Template.csv','text/csv','\ufeff' + toCSV(
    ['Reference','Date','Company','Contact','Mobile','Email','City','Product','Requirement'],
    [['IM-1001',todayISO(),'Example Fabricators','Demo Contact','0000000000','demo@example.com','Hyderabad','Magnetic Yoke','Please send a quotation']]));

function parseMarketplaceDelimited(text){
  const input = String(text||'').replace(/^\ufeff/,'');
  const first = input.split(/\r?\n/,1)[0];
  const separator = first.includes('\t') ? '\t' : first.includes(';') && !first.includes(',') ? ';' : ',';
  const rows = [], row = []; let cell = '', quoted = false;
  for(let i=0;i<input.length;i++){
    const ch = input[i];
    if(ch==='"'){
      if(quoted && input[i+1]==='"'){ cell += '"'; i++; }
      else quoted = !quoted;
    }else if(ch===separator && !quoted){ row.push(cell); cell=''; }
    else if((ch==='\n'||ch==='\r') && !quoted){
      if(ch==='\r' && input[i+1]==='\n') i++;
      row.push(cell); cell='';
      if(row.some(v=>v.trim())) rows.push(row.splice(0)); else row.length=0;
    }else cell += ch;
  }
  if(quoted) throw new Error('The CSV has an unclosed quoted cell.');
  row.push(cell); if(row.some(v=>v.trim())) rows.push(row);
  return rows;
}
function mapMarketplaceRows(text, source){
  const parsed = parseMarketplaceDelimited(text);
  if(parsed.length<2) throw new Error('The file needs a header row and at least one enquiry.');
  if(parsed.length>2001) throw new Error('Import up to 2,000 enquiries at a time.');
  const headers = parsed[0].map(h=>String(h).toLowerCase().replace(/[^a-z0-9]/g,''));
  const names = {
    ref:['reference','refno','queryid','uniquequeryid','enquiryid','inquiryid','leadid','id'],
    company:['company','companyname','buyercompany','businessname','firmname'],
    contact:['contact','contactperson','contactname','buyername','sendername','name'],
    mobile:['mobile','mobilenumber','buyermobile','buyermobilenumber','phone','phonenumber','contactnumber','contactno'],
    email:['email','emailid','buyeremail','senderemail'],
    location:['city','buyercity','location','destination','state'],
    product:['product','productname','productinterested','itemname','subject'],
    note:['requirement','message','description','enquirydetails','inquirydetails','querydetails','buyerrequirement'],
    date:['date','enquirydate','inquirydate','querydate','receivedat','createdat'],
  };
  const ix = {}; Object.keys(names).forEach(k=>{ ix[k]=headers.findIndex(h=>names[k].includes(h)); });
  if(ix.company<0 && ix.contact<0) throw new Error('No company or buyer name column found. Try the sample CSV headings.');
  if(ix.mobile<0 && ix.email<0) throw new Error('No mobile or email column found. Try the sample CSV headings.');
  const existing = new Set(DB.leads.map(l=>l.sourceRef).filter(Boolean));
  const seen = new Set(); let invalid=0, duplicates=0;
  const rows = [];
  parsed.slice(1).forEach(cols=>{
    const value = k=>ix[k]<0 ? '' : String(cols[ix[k]]||'').trim().slice(0,k==='note'?1000:200);
    const company=value('company')||value('contact');
    if(!company || (!value('mobile') && !value('email'))){ invalid++; return; }
    const rawDate=value('date');
    const date=/^\d{4}-\d{2}-\d{2}/.test(rawDate) ? rawDate.slice(0,10) : todayISO();
    const ref=value('ref');
    const fingerprint=[company,value('contact'),value('mobile'),value('email'),value('product'),rawDate,value('note')].join('|').toLowerCase();
    const sourceRef=source + ':' + (ref || 'CSV-' + (recordHash(fingerprint)>>>0));
    if(existing.has(sourceRef)||seen.has(sourceRef)){ duplicates++; return; }
    seen.add(sourceRef);
    rows.push({
      id:uid('LD'), company, contact:value('contact'), mobile:value('mobile'), email:value('email'),
      location:value('location'), industry:'', source, sourceRef,
      product:value('product'), expectedValue:0, assignedTo:(DB.employees.find(e=>e.role==='sales')||{}).id||'EMP-1',
      stage:'New', followUpDate:addDays(todayISO(),1), lostReason:'', notes:value('note') +
        (rawDate && date===todayISO() && rawDate!==date ? '\nMarketplace date: ' + rawDate : ''),
      activities:[{date, note:'Imported from ' + source + ' CSV' + (ref ? ' (' + ref + ')' : '')}], createdAt:date,
    });
  });
  return { rows, invalid, duplicates, total:parsed.length-1 };
}
function chooseMarketplaceFile(){
  const source=(document.getElementById('marketSource')||{}).value||'IndiaMART';
  const input=document.createElement('input'); input.type='file'; input.accept='.csv,.tsv,.txt,text/csv,text/tab-separated-values';
  input.onchange=function(){
    const file=input.files&&input.files[0]; if(!file) return;
    if(file.size>2*1024*1024){ _marketImport={source,fileName:'',rows:[],invalid:0,duplicates:0,total:0,error:'File is too large. Use a CSV under 2 MB.'}; rerender(); return; }
    const reader=new FileReader();
    reader.onload=function(){
      try{ _marketImport={source,fileName:file.name,error:'',...mapMarketplaceRows(reader.result,source)}; }
      catch(e){ _marketImport={source,fileName:'',rows:[],invalid:0,duplicates:0,total:0,error:e.message}; }
      rerender();
    };
    reader.onerror=function(){ _marketImport={source,fileName:'',rows:[],invalid:0,duplicates:0,total:0,error:'Could not read that file.'}; rerender(); };
    reader.readAsText(file);
  };
  input.click();
}
function importMarketplaceLeads(){
